
name: Auto AI Japanese Long Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-long-video
  cancel-in-progress: false

jobs:
  generate-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
      OLLAMA_MODEL: qwen2.5:3b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow edge-tts google-api-python-client google-auth

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Generate evergreen long video
        run: |
          mkdir -p work

          cat > generate_long_video.py <<'PYTHON'
          import asyncio
          import datetime
          import json
          import os
          import re
          import subprocess
          import textwrap
          from pathlib import Path
          from collections import Counter

          import requests
          import edge_tts
          from PIL import Image, ImageDraw, ImageFont

          WORK = Path("work")
          WORK.mkdir(exist_ok=True)

          MODEL = os.environ.get("OLLAMA_MODEL", "qwen2.5:3b")

          # ニュースではなく、長く見られる雑学テーマ
          TOPICS = [
              ("血液型・星座", "血液型による性格診断はどこまで本当？楽しく知るためのポイント"),
              ("血液型・星座", "星座占いはなぜ当たっているように感じるのか"),
              ("血液型・星座", "12星座の恋愛傾向を楽しむための基礎知識"),
              ("血液型・星座", "誕生日占いと性格の関係をどう楽しめばいい？"),
              ("血液型・星座", "血液型と相性の話で知っておきたい意外な事実"),
              ("栄養・健康", "タンパク質が身体に必要な本当の理由"),
              ("栄養・健康", "ビタミンCにはどんな働きがある？"),
              ("栄養・健康", "鉄分が不足すると身体に何が起こる？"),
              ("栄養・健康", "カルシウムは骨以外にも必要なの？"),
              ("栄養・健康", "朝食を食べることにはどんな意味がある？"),
              ("栄養・健康", "食物繊維を摂ると身体にどんな変化がある？"),
              ("栄養・健康", "水分補給が身体に欠かせない理由"),
              ("心理・しぐさ", "腕を組むしぐさにはどんな心理が隠れている？"),
              ("心理・しぐさ", "人はなぜ緊張すると早口になるのか"),
              ("心理・しぐさ", "第一印象はどのように作られる？"),
              ("心理・しぐさ", "目線や表情から相手の気持ちは分かるのか"),
              ("心理・しぐさ", "人がつい嘘をついてしまう心理とは"),
              ("心理・しぐさ", "なぜ人は他人の目が気になるのか"),
              ("心理・しぐさ", "人はなぜ同じ失敗を繰り返してしまうのか"),
              ("恋愛", "好きな人との距離を自然に縮める会話のコツ"),
              ("恋愛", "好印象を持たれやすい人の会話の特徴"),
              ("恋愛", "初デートで大切にしたい5つのこと"),
              ("恋愛", "好きな人に自分を意識してもらう方法"),
              ("恋愛", "長続きするカップルに共通するコミュニケーション"),
              ("恋愛", "相手の気持ちを尊重しながら好意を伝える方法"),
              ("人間関係・雑学", "なぜ人は夢を見るのか"),
              ("人間関係・雑学", "なぜ人はあくびをすると他人にうつるのか"),
              ("人間関係・雑学", "笑うと気持ちが楽になるのはなぜ？"),
              ("人間関係・雑学", "記憶に残りやすいことと忘れやすいことの違い"),
              ("人間関係・雑学", "なぜ人は初対面で相手の印象を決めるのか"),
              ("人間関係・雑学", "集中力が続かないときに試したい工夫"),
              ("人間関係・雑学", "習慣が身につく仕組みとは？"),
              ("人間関係・雑学", "人はなぜ懐かしい思い出に心を動かされるのか"),
              ("人間関係・雑学", "褒め上手な人が自然にしていること"),
              ("人間関係・雑学", "なぜ人はついスマホを見てしまうのか")
          ]

          today = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))
          ).date()
          day_number = today.toordinal()

          def choose_topic_from_recent_shorts():
              feedback_path = Path("data/analytics_feedback.json")
              if not feedback_path.exists():
                  return None

              try:
                  feedback = json.loads(
                      feedback_path.read_text(encoding="utf-8")
                  )
                  updated_text = str(
                      feedback.get("updated_at_jst", "")
                  ).strip()

                  if not updated_text:
                      return None

                  updated_at = datetime.datetime.fromisoformat(
                      updated_text.replace("Z", "+00:00")
                  )

                  if updated_at.tzinfo is None:
                      updated_at = updated_at.replace(
                          tzinfo=datetime.timezone.utc
                      )

                  now_utc = datetime.datetime.now(
                      datetime.timezone.utc
                  )

                  data_age = (
                      now_utc - updated_at.astimezone(datetime.timezone.utc)
                  ).total_seconds()

                  if data_age < 0 or data_age > 48 * 3600:
                      print("LONG TOPIC FEEDBACK STALE:", updated_text)
                      return None

                  rules = [
                      (
                          ("ゲーム", "ドラクエ", "ゼルダ", "ポケモン", "任天堂"),
                          "ゲーム・記憶",
                          "昔のゲームを大人になっても買いたくなる心理"
                      ),
                      (
                          ("サッカー", "コベントリー", "クリスタル・パレス", "オフサイド"),
                          "スポーツ・観戦",
                          "サッカー観戦がもっと面白くなる3つの見方"
                      ),
                      (
                          ("カップル", "恋愛", "会話", "人間関係"),
                          "心理・人間関係",
                          "長続きするカップルの会話に共通する3つの習慣"
                      )
                  ]

                  ranked = {}

                  for video in feedback.get("all_videos", []):
                      try:
                          duration = int(video.get("duration_seconds"))
                          views = int(video.get("views"))
                          published_text = str(
                              video.get("published_at", "")
                          ).strip()

                          if (
                              duration <= 0
                              or duration > 59
                              or views < 100
                              or not published_text
                          ):
                              continue

                          published = datetime.datetime.fromisoformat(
                              published_text.replace("Z", "+00:00")
                          )

                          if published.tzinfo is None:
                              published = published.replace(
                                  tzinfo=datetime.timezone.utc
                              )

                          age_hours = (
                              now_utc - published.astimezone(datetime.timezone.utc)
                          ).total_seconds() / 3600

                          if age_hours < 6 or age_hours > 168:
                              continue

                      except (TypeError, ValueError):
                          continue

                      title = str(video.get("title", "")).strip()
                      lower_title = title.lower()
                      matched = None

                      for keywords, genre, topic in rules:
                          if any(
                              keyword.lower() in lower_title
                              for keyword in keywords
                          ):
                              matched = (genre, topic)
                              break

                      if not matched:
                          continue

                      vph = views / age_hours
                      current = ranked.get(matched)

                      if current is None or vph > current["vph"]:
                          ranked[matched] = {
                              "genre": matched[0],
                              "topic": matched[1],
                              "vph": vph,
                              "source_title": title
                          }

                  candidates = sorted(
                      ranked.values(),
                      key=lambda item: item["vph"],
                      reverse=True
                  )[:3]

                  if candidates:
                      chosen = candidates[day_number % len(candidates)]
                      print("LONG TOPIC SOURCE SHORT:", chosen["source_title"])
                      print(
                          "LONG TOPIC SOURCE ESTIMATED VPH:",
                          round(chosen["vph"], 2)
                      )
                      print(
                          "LONG TOPIC SOURCE METRIC: "
                          "latest 50 uploads; lifetime views / age hours"
                      )
                      return chosen["genre"], chosen["topic"]

              except Exception as error:
                  print("LONG TOPIC FEEDBACK WARNING:", str(error)[:300])

              return None

          selected_topic = choose_topic_from_recent_shorts()

          if selected_topic:
              genre, topic = selected_topic
          else:
              genre, topic = TOPICS[day_number % len(TOPICS)]
              print("LONG TOPIC SOURCE: evergreen fallback")

          print("VIDEO DATE:", today.isoformat())
          print("VIDEO GENRE:", genre)
          print("VIDEO TOPIC:", topic)

          # 台本は、具体例を中心に自然な日本語で作成
          prompt = f"""
          あなたは日本語YouTube長尺動画のプロの構成作家です。

          今回の動画テーマ：
          {topic}

          ジャンル：
          {genre}

          約4分の、視聴者が最後まで見たくなるナレーション台本を書いてください。
          本文は必ず1800〜1900文字にしてください。
          1300文字未満の短い台本は絶対に出力しないでください。

          【構成】
          1. 最初の15秒：意外な事実、疑問、興味を引く問いかけ
          2. 前半：テーマの基本を分かりやすく説明
          3. 中盤：具体例や日常での場面を紹介
          4. 後半：意外なポイントや実践できる知識
          5. 最後：要点をまとめ、自然に締める

          【絶対に守ること】
          ・日本語で1800〜1900文字
          ・文字数が不足する場合は具体例、仕組み、理由を詳しく説明する
          ・短くまとめず、必要な説明を省略しない
          ・実在しない人物、職業、研究、実験、統計を作らない
          ・架空の専門家や架空のエピソードを事実として紹介しない
          ・同じ説明や結論を何度も繰り返さない
          ・「注目されている理由の一つ」などの中身のない表現を繰り返さない
          ・具体的な説明、例、理由を必ず入れる
          ・不確かなことは断定しない
          ・難しい専門用語には簡単な説明を加える
          ・視聴者に話しかける自然な日本語にする
          ・「こんにちは、皆さま」などの長い挨拶は不要
          ・タイトル、章番号、見出し、前置きは出さない
          ・ナレーション本文だけを出力する

          【ジャンル別の注意】
          血液型・星座：
          性格や相性を科学的事実と断定しない。
          占いやエンターテインメントとして紹介する。

          栄養・健康：
          栄養素の働きを正確に説明する。
          病気が治る、必ず痩せるなどの誇張は禁止。
          医療行為の代わりになるような説明は禁止。

          心理・しぐさ：
          ひとつのしぐさだけで相手の本心を断定しない。
          状況や個人差があることを説明する。

          恋愛：
          相手を操作したり、嫌がることを強要したりしない。
          相手の意思や気持ちを尊重した方法を紹介する。

          人間関係・雑学：
          日常で役立つ具体的な知識を中心にする。
          根拠のない心理学用語や数字を作らない。
          """

          generation_prompt = prompt
          script = ""

          # 全体生成は最大2回
          for attempt in range(2):
              response = requests.post(
                  "http://localhost:11434/api/generate",
                  json={
                      "model": MODEL,
                      "prompt": generation_prompt,
                      "stream": False,
                      "options": {
                          "temperature": 0.55,
                          "num_predict": 3600
                      }
                  },
                  timeout=2400
              )
              response.raise_for_status()

              script = response.json().get(
                  "response", ""
              ).strip()

              script = re.sub(
                  r"<think>.*?</think>",
                  "",
                  script,
                  flags=re.S
              )

              script = re.sub(
                  r"```.*?```",
                  "",
                  script,
                  flags=re.S
              )

              script = re.sub(
                  r"^(台本|ナレーション|本文)\s*[:：]?",
                  "",
                  script
              ).strip()

              print(
                  "SCRIPT GENERATION ATTEMPT:",
                  attempt + 1,
                  "LENGTH:",
                  len(script)
              )

              if 1300 <= len(script) <= 1900:
                  break

              # 1回目の全体生成が規定外なら再生成
              if attempt == 0:
                  if len(script) < 1300:
                      correction = (
                          f"前回は{len(script)}文字で短すぎます。"
                          "説明を水増しせず、仕組み、具体例、理由、"
                          "視聴者が理解できる場面を追加して、"
                          "1800〜1900文字に書き直してください。"
                          "必要な説明を省略しないでください。"
                      )
                  else:
                      correction = (
                          f"前回は{len(script)}文字で長すぎます。"
                          "重複や脱線を削り、重要な説明と具体例を残して、"
                          "1800〜1900文字に整理してください。"
                      )

                  generation_prompt = (
                      prompt
                      + "\n\n【再生成指示】\n"
                      + correction
                      + "\n\n【前回の台本】\n"
                      + script
                  )

                  continue

              # 2回目でも長すぎる場合は公開しない
              if len(script) > 1900:
                  raise RuntimeError(
                      f"台本が長すぎます: {len(script)}文字。"
                      "再生成後も1900文字を超えています。"
                  )

              # ==================================
              # 2回生成しても短い場合、追加本文を生成
              # 最大4回の補足生成
              # ==================================
              expansion_success = False

              for expansion_attempt in range(4):
                  needed = 1300 - len(script)

                  max_add = (
                      1900 - len(script) - 2
                  )

                  if max_add <= 0:
                      break

                  target_add = min(
                      max_add,
                      max(350, needed + 150)
                  )

                  upper_add = min(
                      max_add,
                      target_add + 150
                  )

                  expansion_prompt = f"""
                  あなたは日本語YouTube長編動画の構成作家です。

                  テーマ：
                  {topic}

                  ジャンル：
                  {genre}

                  現在の台本：
                  {script}

                  現在の台本は{len(script)}文字です。
                  最低1300文字にするため、あと{needed}文字必要です。

                  【追加する内容】
                  既存の台本と重複しない補足ナレーションを、
                  {target_add}〜{upper_add}文字程度で追加してください。

                  ・既存の説明を繰り返さない
                  ・仕組みや理由を具体的に説明する
                  ・視聴者がイメージできる例を加える
                  ・新しい人物、研究、統計、数字を作らない
                  ・根拠のない新しい事実を追加しない
                  ・例を作る場合は、仮の場面であることを明確にする
                  ・前置きや挨拶を追加しない
                  ・追加するナレーション本文だけを出力する
                  """

                  response = requests.post(
                      "http://localhost:11434/api/generate",
                      json={
                          "model": MODEL,
                          "prompt": expansion_prompt,
                          "stream": False,
                          "options": {
                              "temperature": 0.45,
                              "num_predict": 1600
                          }
                      },
                      timeout=2400
                  )

                  response.raise_for_status()

                  expansion = response.json().get(
                      "response", ""
                  ).strip()

                  expansion = re.sub(
                      r"<think>.*?</think>",
                      "",
                      expansion,
                      flags=re.S
                  )

                  expansion = re.sub(
                      r"```.*?```",
                      "",
                      expansion,
                      flags=re.S
                  )

                  expansion = re.sub(
                      r"^(追加部分|台本|ナレーション|本文)\s*[:：]?",
                      "",
                      expansion
                  ).strip()

                  if not expansion:
                      print(
                          "SCRIPT EXPANSION EMPTY:",
                          expansion_attempt + 1
                      )
                      continue

                  # 1900文字を超えないよう追加分を制限
                  if len(expansion) > max_add:
                      expansion = expansion[:max_add]

                      sentence_end = max(
                          expansion.rfind("。"),
                          expansion.rfind("！"),
                          expansion.rfind("？")
                      )

                      if sentence_end >= 150:
                          expansion = expansion[
                              :sentence_end + 1
                          ]

                  candidate = (
                      script
                      + "\n\n"
                      + expansion
                  )

                  if 1300 <= len(candidate) <= 1900:
                      script = candidate
                      expansion_success = True

                      print(
                          "SCRIPT EXPANSION SUCCESS:",
                          len(expansion),
                          "TOTAL:",
                          len(script)
                      )

                      break

                  # まだ短い場合、追加した内容を次の補足生成に渡す
                  if len(candidate) < 1300:
                      script = candidate

                      print(
                          "SCRIPT EXPANSION SHORT:",
                          expansion_attempt + 1,
                          "TOTAL:",
                          len(script)
                      )

              if not expansion_success:
                  raise RuntimeError(
                      f"台本が短すぎます: {len(script)}文字。"
                      "全体生成2回と補足生成4回でも"
                      "1300文字に達しませんでした。"
                  )

          sentences = [
              x.strip()
              for x in re.split(r"(?<=[。！？])", script)
              if x.strip()
          ]

          if len(sentences) < 12:
              raise RuntimeError(
                  "文章の数が少なすぎます。台本を確認してください。"
              )

          # 同じ文章が何度も出ていないか確認
          normalized = [
              re.sub(r"\s+", "", s)
              for s in sentences
          ]
          duplicates = [
              s for s, count in Counter(normalized).items()
              if count >= 2 and len(s) >= 15
          ]

          if duplicates:
              raise RuntimeError(
                  "同じ文章の繰り返しを検出しました。公開を中止します。"
              )

          # 中身のない定型句の連続を検出
          filler_phrases = [
              "理由の一つです",
              "理由の一つにあります",
              "驚くべき人生",
              "深く理解することができます",
              "知識を磨きました"
          ]

          for phrase in filler_phrases:
              count = script.count(phrase)
              if count >= 3:
                  raise RuntimeError(
                      f"不自然な表現の繰り返し: {phrase}"
                  )

          # 文章の内容がほぼ同じになっていないか確認
          if script.count("彼の") > 15:
              raise RuntimeError(
                  "不自然な人物紹介の繰り返しを検出しました。"
              )

          if script.count("ナッシュ・ウォルターズ") >= 2:
              raise RuntimeError(
                  "過去の不自然な人物名が混入しています。"
              )

          (WORK / "script.txt").write_text(
              script, encoding="utf-8"
          )
          (WORK / "title.txt").write_text(
              topic, encoding="utf-8"
          )
          (WORK / "category.txt").write_text(
              genre, encoding="utf-8"
          )

          print("SCRIPT QUALITY CHECK: PASSED")
          print("SCRIPT CHARACTERS:", len(script))
          print("SCRIPT SENTENCES:", len(sentences))

          async def make_voice():
              communicate = edge_tts.Communicate(
                  script,
                  voice="ja-JP-NanamiNeural",
                  rate="+0%",
                  volume="+0%"
              )
              await communicate.save(str(WORK / "voice.mp3"))

          asyncio.run(make_voice())

          audio = WORK / "voice.mp3"
          if not audio.exists() or audio.stat().st_size < 10000:
              raise RuntimeError("音声生成に失敗しました")

          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(audio)
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(probe.stdout.strip())
          print("AUDIO DURATION:", round(duration, 1))

          if duration < 150 or duration > 360:
              raise RuntimeError(
                  f"音声の長さが想定外です: {duration:.1f}秒"
              )

          # 16:9背景画像
          width, height = 1280, 720
          bg = Image.new("RGB", (width, height))
          pixels = bg.load()

          for y in range(height):
              for x in range(width):
                  t = (x / width + y / height) / 2
                  pixels[x, y] = (
                      int(15 + 20 * t),
                      int(25 + 25 * t),
                      int(48 + 45 * t)
                  )

          draw = ImageDraw.Draw(bg)
          draw.ellipse(
              (850, -180, 1450, 420),
              fill=(35, 65, 105)
          )
          draw.ellipse(
              (-250, 470, 350, 1050),
              fill=(25, 48, 82)
          )

          font_path = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )
          title_font = ImageFont.truetype(font_path, 54)
          small_font = ImageFont.truetype(font_path, 28)

          draw.rounded_rectangle(
              (65, 55, 1215, 665),
              radius=28,
              outline=(105, 145, 195),
              width=3
          )

          draw.text(
              (100, 115),
              genre,
              font=small_font,
              fill=(255, 210, 100)
          )

          title_lines = textwrap.wrap(topic, width=19)[:3]
          y = 270 - len(title_lines) * 38

          for line in title_lines:
              draw.text(
                  (100, y),
                  line,
                  font=title_font,
                  fill=(255, 255, 255),
                  stroke_width=2,
                  stroke_fill=(10, 15, 25)
              )
              y += 88

          draw.text(
              (100, 585),
              "知ると見方が変わる、今日の話。",
              font=small_font,
              fill=(190, 210, 235)
          )

          bg.save(WORK / "background.jpg", quality=95)

          # 字幕作成
          def ass_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          chunks = []
          for sentence in sentences:
              chunks.extend(
                  textwrap.wrap(
                      sentence,
                      width=28,
                      break_long_words=True,
                      break_on_hyphens=False
                  )
              )

          total_chars = sum(len(x) for x in chunks)
          current = 0

          ass = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1280",
              "PlayResY: 720",
              "WrapStyle: 2",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Default,Noto Sans CJK JP,38,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,3,1,2,90,90,55,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          ]

          for chunk in chunks:
              start = duration * current / max(total_chars, 1)
              current += len(chunk)
              end = duration * current / max(total_chars, 1)

              safe = (
                  chunk.replace("\\", r"\\")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
              )

              ass.append(
                  f"Dialogue: 0,{ass_time(start)},"
                  f"{ass_time(end)},Default,,0,0,0,,{safe}"
              )

          (WORK / "subtitles.ass").write_text(
              "\n".join(ass),
              encoding="utf-8-sig"
          )

          # 動画生成
          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(WORK / "background.jpg"),
                  "-i", str(audio),
                  "-t", str(duration),
                  "-vf",
                  "zoompan=z='min(zoom+0.00015,1.06)':d=1:"
                  "s=1280x720:fps=30,"
                  "subtitles=work/subtitles.ass",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-pix_fmt", "yuv420p",
                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  str(WORK / "video.mp4")
              ],
              check=True,
              timeout=2400
          )

          # サムネイル
          thumb = bg.copy()
          td = ImageDraw.Draw(thumb)
          ty = 260 - len(title_lines) * 38

          for line in title_lines:
              td.text(
                  (90, ty),
                  line,
                  font=title_font,
                  fill=(255, 255, 255),
                  stroke_width=4,
                  stroke_fill=(0, 0, 0)
              )
              ty += 90

          thumb.save(
              WORK / "thumbnail.jpg",
              "JPEG",
              quality=95
          )

          video = WORK / "video.mp4"
          if not video.exists() or video.stat().st_size < 100000:
              raise RuntimeError("動画生成に失敗しました")

          check = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=width,height",
                  "-of", "csv=s=x:p=0",
                  str(video)
              ],
              capture_output=True,
              text=True,
              check=True
          ).stdout.strip()

          if check != "1280x720":
              raise RuntimeError(
                  f"動画サイズが不正です: {check}"
              )

          print("EVERGREEN VIDEO READY")
          print("VIDEO SIZE:", check)
          print("VIDEO SECONDS:", round(duration, 1))
          print("VIDEO TOPIC:", topic)
          PYTHON

          python generate_long_video.py
      - name: Validate long-video script before upload
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote

          import requests

          work = Path("work")
          script = (work / "script.txt").read_text(encoding="utf-8").strip()
          topic = (work / "title.txt").read_text(encoding="utf-8").strip()
          genre = (work / "category.txt").read_text(encoding="utf-8").strip()

          def stop(reason):
              (work / "fact_check.txt").write_text(
                  "FAIL: " + reason,
                  encoding="utf-8"
              )
              raise RuntimeError(reason)

          if not topic or not script:
              stop("テーマまたは台本がありません")

          if not 1300 <= len(script) <= 1900:
              stop(f"台本は1300〜1900文字が必要です。現在は{len(script)}文字です")

          # 冒頭挨拶があれば除去し、本文を残す
          greeting_prefix = re.compile(
              r"^(?:"
              r"皆さん[、,]?\s*こんにちは"
              r"|皆さま[、,]?\s*こんにちは"
              r"|こんにちは(?:[、,]?\s*(?:皆さん|皆さま))?"
              r"|どうも(?:[、,]?\s*(?:皆さん|皆さま))?"
              r")[、,。!！\s]*"
          )

          cleaned_script = greeting_prefix.sub(
              "",
              script,
              count=1
          ).strip()

          if cleaned_script != script:
              script = cleaned_script
              (work / "script.txt").write_text(
                  script,
                  encoding="utf-8"
              )
              print("SCRIPT GREETING REMOVED")

          # 挨拶除去後に文字数を再確認
          if not 1300 <= len(script) <= 1900:
              stop(
                  f"台本は1300〜1900文字が必要です。"
                  f"現在は{len(script)}文字です"
              )

          if re.match(
              r"^(こんにちは|どうも|皆さんこんにちは|皆さまこんにちは|皆さん、こんにちは|皆さま、こんにちは)",
              script
          ):
              stop("挨拶除去後も冒頭に挨拶があります")

          if re.search(r"【章|【第[0-9０-９一二三四五六七八九]+章", script):
              stop("読み上げ本文に章見出しが混ざっています")

          lower = topic.lower()
          queries = [topic]

          # 占い・星座
          if any(x in lower for x in ["星座", "占い"]):
              queries += [
                  "バーナム効果",
                  "確証バイアス",
                  "占星術 科学的検証"
              ]

          # 血液型
          if "血液型" in lower:
              queries += [
                  "血液型性格分類",
                  "血液型 性格 科学的研究"
              ]

          # 栄養・健康
          if any(x in lower for x in [
              "栄養", "ビタミン", "鉄", "タンパク質", "カルシウム"
          ]):
              queries += [
                  "栄養素",
                  "ビタミンC",
                  "鉄の吸収"
              ]

          # 心理・しぐさ
          if any(x in lower for x in [
              "しぐさ", "目線", "表情", "嘘"
          ]):
              queries += [
                  "非言語コミュニケーション",
                  "嘘の検出"
              ]

          # 恋愛・人間関係
          if any(x in lower for x in [
              "恋愛", "好きな人", "デート", "カップル"
          ]):
              queries += [
                  "傾聴",
                  "対人関係"
              ]

          # ゲーム・懐かしゲーム
          if any(x in lower for x in [
              "ゲーム", "ドラクエ", "ゼルダ", "ポケモン",
              "任天堂", "マリオ"
          ]):
              queries += [
                  "ゲームの歴史",
                  "ゲームデザイン",
                  "レトロゲーム",
                  "ゲーム 音楽 記憶"
              ]

          # サッカー・スポーツ
          if any(x in lower for x in [
              "サッカー", "スポーツ", "オフサイド",
              "観戦", "選手", "チーム"
          ]):
              queries += [
                  "サッカーのルール",
                  "サッカー戦術",
                  "スポーツ心理学",
                  "スポーツ観戦"
              ]

          api = "https://ja.wikipedia.org/w/api.php"
          headers = {"User-Agent": "AutoAIJapaneseLongVideo/1.0"}
          sources = {}

          for query in list(dict.fromkeys(queries))[:20]:
              for attempt in range(3):
                  response = requests.get(
                      api,
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": query,
                          "gsrnamespace": 0,
                          "gsrlimit": 3,
                          "prop": "extracts",
                          "exintro": 1,
                          "explaintext": 1,
                          "format": "json"
                      },
                      headers=headers,
                      timeout=25
                  )
                  if response.status_code == 429 and attempt < 2:
                      time.sleep(2 ** (attempt + 1))
                      continue
                  response.raise_for_status()
                  pages = response.json().get("query", {}).get("pages", {})
                  break

              for page in pages.values():
                  name = str(page.get("title", "")).strip()
                  extract = str(page.get("extract", "")).strip()
                  if name and len(extract) >= 120 and name not in sources:
                      url = "https://ja.wikipedia.org/wiki/" + quote(name.replace(" ", "_"), safe="")
                      sources[name] = {"url": url, "extract": extract[:1800]}

          if not sources:
              stop("参考情報を取得できません")

          source_context = "\n\n".join(
              f"【{name}】 {item['url']}\n{item['extract']}"
              for name, item in sources.items()
          )
          if len(source_context) < 500:
              stop("参考情報が不足しています")

          sources_text = "\n".join(
              f"{name} - {item['url']}"
              for name, item in sources.items()
          )
          (work / "sources.txt").write_text(sources_text, encoding="utf-8")

          if any(x in lower for x in ["血液型", "星座", "占い"]):
              forbidden = [
                  "A型血の健康を維持しやすく",
                  "牡羊座の行動パターンを理解しやすい",
                  "A型と牡羊座の人は"
              ]
              if any(x in script for x in forbidden):
                  stop("血液型・星座について根拠のない断定を検出しました")

          prompt = f"""
          あなたは厳格なファクトチェッカーです。
          テーマ：{topic}
          ジャンル：{genre}
          参考情報：
          {source_context[:14000]}
          台本：
          {script}

          事実主張を一つずつ参考情報と照合してください。
          参考情報にない数字、研究、人物、因果関係は不合格です。
          不確かな内容の断定も不合格です。
          血液型・星座で性格や健康が決まると科学的事実のように述べないでください。
          しぐさや目線だけで本心や嘘を断定しないでください。
          栄養情報は参考情報にある範囲だけにしてください。
          恋愛の話は相手の意思と同意を尊重してください。
          全ての重要な事実が参考情報に裏付けられる場合だけPASSにしてください。
          出力は PASS または FAIL:理由 のどちらか一つだけ。
          """

          model = os.environ.get("OLLAMA_MODEL", "qwen2.5:3b")
          check = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {"temperature": 0, "num_predict": 180}
              },
              timeout=900
          )
          check.raise_for_status()
          verdict = check.json().get("response", "").strip()

          (work / "fact_check.txt").write_text(
              "TOPIC: " + topic + "\nVERDICT: " + verdict + "\n" + sources_text,
              encoding="utf-8"
          )

          print("LONG VIDEO FACT CHECK:", verdict)
          if not verdict.upper().startswith("PASS"):
              stop("台本の事実確認に合格しませんでした: " + verdict[:300])

          print("LONG VIDEO FACT CHECK: PASSED")
          PYTHON
      - name: Upload and publish long video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_long_video.py <<'PYTHON'
          import os
          import time
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          work = Path("work")
          video_path = work / "video.mp4"
          thumbnail_path = work / "thumbnail.jpg"
          title_path = work / "title.txt"
          script_path = work / "script.txt"
          category_path = work / "category.txt"

          for path in [
              video_path,
              thumbnail_path,
              title_path,
              script_path,
              category_path
          ]:
              if not path.exists() or path.stat().st_size == 0:
                  raise RuntimeError(f"必要なファイルがありません: {path}")

          title = title_path.read_text(encoding="utf-8").strip()
          script = script_path.read_text(encoding="utf-8").strip()
          category = category_path.read_text(encoding="utf-8").strip()

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not all([client_id, client_secret, refresh_token]):
              raise RuntimeError("YouTube認証Secretsが不足しています")

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/youtube"]
          )

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          # 長尺の雑学・教育動画として登録
          sources_path = work / "sources.txt"
          sources_text = (
              sources_path.read_text(encoding="utf-8").strip()
              if sources_path.exists()
              else ""
          )

          description_parts = [script[:4200].strip()]

          if sources_text:
              description_parts.extend([
                  "",
                  "参考資料",
                  sources_text[:700]
              ])

          description_parts.extend([
              "",
              "#雑学 #豆知識 #解説"
          ])

          description = "\n".join(description_parts)

          tags = [
              "雑学",
              "豆知識",
              "心理学",
              "恋愛",
              "栄養",
              "血液型",
              "星座",
              "人間関係",
              "解説",
              category
          ]

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description[:5000],
                  "categoryId": "27",
                  "tags": list(dict.fromkeys(tags))[:10],
                  "defaultLanguage": "ja",
                  "defaultAudioLanguage": "ja"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              str(video_path),
              mimetype="video/mp4",
              resumable=True
          )

          upload_request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = upload_request.next_chunk()
              if status:
                  print(
                      "UPLOAD PROGRESS:",
                      round(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]
          print("UPLOADED PRIVATE:", video_id)

          # YouTubeの動画処理完了を待つ
          processing_succeeded = False

          for attempt in range(40):
              result = youtube.videos().list(
                  part="processingDetails,status",
                  id=video_id
              ).execute()

              items = result.get("items", [])

              if items:
                  item = items[0]
                  processing = item.get(
                      "processingDetails", {}
                  ).get("processingStatus", "")

                  print("VIDEO PROCESSING:", processing)

                  if processing == "succeeded":
                      processing_succeeded = True
                      break

                  if processing in ["failed", "terminated"]:
                      raise RuntimeError(
                          "YouTube動画処理に失敗。非公開のまま停止します。"
                      )

              time.sleep(15)

          if not processing_succeeded:
              raise RuntimeError(
                  "YouTube動画処理が完了しませんでした。非公開のまま停止します。"
              )

          # サムネイル設定
          thumbnail_media = MediaFileUpload(
              str(thumbnail_path),
              mimetype="image/jpeg",
              resumable=False
          )

          youtube.thumbnails().set(
              videoId=video_id,
              media_body=thumbnail_media
          ).execute()

          print("CUSTOM THUMBNAIL SET:", video_id)

          # すべて成功した場合だけ一般公開
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("PUBLISHED:", video_id)
          print(
              "PUBLIC URL:",
              "https://www.youtube.com/watch?v=" + video_id
          )
          PYTHON

          python upload_long_video.py

