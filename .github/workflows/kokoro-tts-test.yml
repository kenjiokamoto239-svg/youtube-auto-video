name: Kokoro Japanese TTS Test

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate Japanese WAV with Kokoro
        run: |
          mkdir -p output

          cat > /tmp/tts.html <<'HTML'
          <!doctype html>
          <html>
          <body>
          <script type="module">
          import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm";

          window.run = async () => {
            const tts = await KokoroTTS.from_pretrained(
              "onnx-community/Kokoro-82M-v1.0-ONNX",
              { dtype: "q8" }
            );

            const audio = await tts.generate(
              "これは日本語音声の自動生成テストです。GitHub ActionsからKokoro TTSを実行しています。",
              { voice: "jf_alpha" }
            );

            return audio.to_wav();
          };
          </script>
          </body>
          </html>
          HTML

          cat > /tmp/run.js <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage();

            await page.goto("file:///tmp/tts.html");

            await page.waitForFunction(
              () => typeof window.run === "function",
              null,
              { timeout: 120000 }
            );

            const b64 = await page.evaluate(async () => {
              const wav = await window.run();
              let binary = "";
              const bytes = new Uint8Array(wav);
              const chunk = 0x8000;

              for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode(
                  ...bytes.subarray(i, i + chunk)
                );
              }

              return btoa(binary);
            });

            fs.writeFileSync(
              "output/audio.wav",
              Buffer.from(b64, "base64")
            );

            await browser.close();
          })();
          JS

          node /tmp/run.js
          file output/audio.wav

      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-japanese-tts-test
          path: output/audio.wav
