name: Kokoro Japanese TTS Test

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese Kokoro TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" soundfile

      - name: Generate Japanese WAV
        run: |
          mkdir -p model output

          wget -q "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" -O model/kokoro-v1.0.int8.onnx

          wget -q "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" -O model/jf_alpha.bin

          cat > generate_tts.py <<'PY'
          from kokoro_onnx import Kokoro
          import soundfile as sf

          text = "これは日本語音声の自動生成テストです。GitHub ActionsからKokoro TTSを実行しています。"

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin",
          )

          audio, sample_rate = model.create(text)
          sf.write("output/audio.wav", audio, sample_rate)

          print(f"Generated output/audio.wav at {sample_rate} Hz")
          PY

          python generate_tts.py

          file output/audio.wav
          ls -lh output/audio.wav

      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-japanese-tts-test
          path: output/audio.wav
