name: Publish Current YouTube Video

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Change current video to public
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > publish.py <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          VIDEO_ID = "GnSw820y-gU"

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )

          youtube = build("youtube", "v3", credentials=credentials)

          response = youtube.videos().update(
              part="status",
              body={
                  "id": VIDEO_ID,
                  "status": {
                      "privacyStatus": "public"
                  }
              }
          ).execute()

          print("Video ID:", response["id"])
          print("Privacy:", response["status"]["privacyStatus"])
          PY

          python publish.py
