name: Kokoro Japanese TTS to MP4 Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese Kokoro TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" soundfile

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Japanese WAV
        run: |
          mkdir -p model input output

          wget -q "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          cat > generate_tts.py <<'PY'
          from kokoro_onnx import Kokoro
          import soundfile as sf

          text = "これは日本語音声の本番接続テストです。Kokoro TTSで音声を生成し、その音声から動画を自動作成しています。"

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin",
          )

          audio, sample_rate = model.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          print(f"Generated input/audio.wav at {sample_rate} Hz")
          PY

          python generate_tts.py

          file input/audio.wav
          ls -lh input/audio.wav

      - name: Build MP4 from input/audio.wav
        run: |
          ffmpeg -y \
            -f lavfi \
            -i color=c=black:s=1280x720:r=30 \
            -i input/audio.wav \
            -c:v libx264 \
            -preset veryfast \
            -tune stillimage \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          file output/video.mp4
          ls -lh output/video.mp4

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-japanese-final-test
          path: |
            input/audio.wav
            output/video.mp4
