name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 10 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 13 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 16 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 19 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow requests feedparser
          pip install google-api-python-client google-auth
          pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git"

      - name: Prepare folders
        run: |
          mkdir -p input output model data

      - name: Prepare analytics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/analytics_feedback.json")
          p.parent.mkdir(parents=True, exist_ok=True)

          if not p.exists():
              p.write_text(
                  json.dumps(
                      {
                          "trend": "新しいテーマを検証し、内容と反応を改善する",
                          "top_videos_by_lifetime_views": []
                      },
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise RuntimeError("分析データの形式が不正です")

          print("分析データ確認完了")
          PY

      - name: Install Ollama and model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &

          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          ollama pull qwen2.5:3b

      - name: Generate script and title
        env:
          TZ: Asia/Tokyo
        run: |
          python - <<'PY'
          import json
          import random
          import re
          import subprocess
          import unicodedata
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import feedparser
          import requests

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          def clean(value):
              value = unicodedata.normalize("NFKC", str(value or ""))
              value = re.sub(r"<[^>]*>", " ", value)
              value = re.sub(r"https?://\S+", "", value)
              return re.sub(r"\s+", " ", value).strip()

          def ask(prompt, timeout=240):
              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:3b"],
                  input=prompt,
                  capture_output=True,
                  text=True,
                  timeout=timeout,
                  check=True
              )
              return clean(result.stdout)

          feedback_path = Path("data/analytics_feedback.json")
          feedback = json.loads(
              feedback_path.read_text(encoding="utf-8")
          )

          feeds = [
              (
                  "国内ニュース",
                  "https://www.nhk.or.jp/rss/news/cat0.xml",
                  []
              ),
              (
                  "岡山の介護・地域ニュース",
                  "https://news.google.com/rss/search?q="
                  "%E5%B2%A1%E5%B1%B1+%E4%BB%8B%E8%AD%B7+OR+"
                  "%E5%B2%A1%E5%B1%B1+%E7%A6%8F%E7%A5%89&hl=ja&gl=JP&ceid=JP:ja",
                  ["岡山", "介護", "福祉", "高齢者"]
              ),
              (
                  "ランニングニュース",
                  "https://news.google.com/rss/search?q="
                  "%E3%83%A9%E3%83%B3%E3%83%8B%E3%83%B3%E3%82%B0+OR+"
                  "%E3%83%9E%E3%83%A9%E3%82%BD%E3%83%B3+OR+"
                  "%E9%A7%85%E4%BC%9D&hl=ja&gl=JP&ceid=JP:ja",
                  ["ランニング", "マラソン", "駅伝", "陸上"]
              ),
              (
                  "介護ニュース",
                  "https://news.google.com/rss/search?q="
                  "%E4%BB%8B%E8%AD%B7+OR+%E4%BB%8B%E8%AD%B7%E5%A0%B1%E9%85%AC&hl=ja&gl=JP&ceid=JP:ja",
                  ["介護", "介護報酬", "高齢者", "福祉"]
              ),
              (
                  "三重県熊野市ニュース",
                  "https://news.google.com/rss/search?q="
                  "%E7%86%8A%E9%87%8E%E5%B8%82+OR+"
                  "%E4%B8%89%E9%87%8D%E7%9C%8C%E7%86%8A%E9%87%8E%E5%B8%82"
                  "&hl=ja&gl=JP&ceid=JP:ja",
                  ["熊野市", "熊野", "三重県"]
              )
          ]

          articles = []
          headers = {"User-Agent": "Mozilla/5.0"}

          for category, url, keywords in feeds:
              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=20
                  )
                  response.raise_for_status()
                  parsed = feedparser.parse(response.content)

                  for entry in parsed.entries[:15]:
                      title = clean(entry.get("title"))
                      link = str(entry.get("link", "")).strip()
                      summary = clean(
                          entry.get("summary")
                          or entry.get("description")
                      )

                      if not title or not link:
                          continue

                      if keywords and not any(
                          word in title + summary
                          for word in keywords
                      ):
                          continue

                      articles.append({
                          "category": category,
                          "title": title,
                          "summary": summary[:1800],
                          "url": link
                      })

              except Exception as exc:
                  print(
                      "RSS取得失敗:",
                      category,
                      str(exc)[:150]
                  )

          unique = {}
          for article in articles:
              unique[article["url"]] = article

          articles = list(unique.values())

          used_path = Path("data/used_news.json")
          try:
              used = json.loads(
                  used_path.read_text(encoding="utf-8")
              )
          except Exception:
              used = []

          fresh = [
              article for article in articles
              if article["url"] not in used
          ]

          if fresh:
              articles = fresh

          random.shuffle(articles)

          topics = [
              "今日の名言を疑って考える",
              "努力だけでは成功できない理由",
              "やる気に頼る習慣をやめる",
              "時間を無駄にする人の共通点",
              "お金が貯まらない行動",
              "ランニングを継続する考え方",
              "仕事で疲れ切らない方法",
              "スマホに時間を奪われる問題",
              "失敗を成長につなげる方法",
              "人間関係で我慢しすぎる問題",
              "行動しない言い訳をやめる",
              "人生を変えるための小さな習慣"
          ]

          def make_news_script(article):
              prompt = f"""
          あなたは社会問題を具体的な事実に基づいて論評する書き手です。
          日本語のYouTube Shorts用ナレーション本文だけを書いてください。

          記事タイトル:
          {article['title']}

          記事概要:
          {article['summary']}

          条件:
          ・主張の強さはレベル4。無難な一般論で逃げない。
          ・冒頭で立場を明確にする。
          ・記事固有の出来事や制度に触れる。
          ・誰にどんな影響があるか説明する。
          ・主張の理由を具体的に示す。
          ・反対意見を一つ取り上げ、反論する。
          ・最後に改善策か問いを提示する。
          ・記事にない数字や発言を捏造しない。
          ・事実と意見を混同しない。
          ・根拠のない人格攻撃はしない。
          ・タイトル、見出し、説明文、URLを本文に入れない。
          ・本文は180〜260文字。
          ・同じ文章の繰り返しは禁止。
          """
              text = ask(prompt)

              if not 150 <= len(text) <= 320:
                  raise ValueError("台本の文字数が不適切です")

              title_terms = re.findall(
                  r"[一-龥々]{2,}|[ァ-ヴー]{3,}",
                  article["title"]
              )

              if title_terms and not any(
                  term in text
                  for term in title_terms
                  if term not in {"ニュース", "発表", "今回"}
              ):
                  raise ValueError("記事固有の情報が不足しています")

              return text

          script = ""
          topic = ""
          source = "通常テーマ"
          selected = None

          if articles and random.random() < 0.8:
              for article in articles[:8]:
                  try:
                      script = make_news_script(article)
                      selected = article
                      break
                  except Exception as exc:
                      print(
                          "ニュース台本を再生成:",
                          str(exc)[:120]
                      )

          if selected:
              topic = selected["category"]
              source = (
                  f"出典: {selected['url']}\n"
                  f"カテゴリ: {selected['category']}"
              )

              used.append(selected["url"])
              used_path.write_text(
                  json.dumps(
                      used[-300:],
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          else:
              topic = random.choice(topics)

              prompt = f"""
          日本語のYouTube Shorts用ナレーション本文を書いてください。

          テーマ: {topic}
          チャンネル傾向: {feedback.get('trend', '')}

          条件:
          ・主張の強さはレベル4。
          ・冒頭で明確な意見を述べる。
          ・具体例、理由、反対意見への反論を入れる。
          ・最後に実行可能な改善策を示す。
          ・無難な一般論や文章の繰り返しは禁止。
          ・根拠のない数字や研究結果を作らない。
          ・タイトルや説明文を本文に含めない。
          ・本文は180〜260文字。
          """
              script = ask(prompt)

              if not 150 <= len(script) <= 320:
                  raise RuntimeError("台本の文字数が不正です")

          title = ask(f"""
          次の台本の内容に合うYouTube Shorts用タイトルを1つ作成。
          40文字以内。タイトルだけ出力してください。

          台本:
          {script}
          """, timeout=90)

          title = re.sub(
              r"^(タイトル|Title)\s*[:：]\s*",
              "",
              title
          ).strip("「」『』\"' ")

          if not 5 <= len(title) <= 90:
              title = topic

          Path("input/topic.txt").write_text(
              topic,
              encoding="utf-8"
          )
          Path("input/title.txt").write_text(
              title[:100],
              encoding="utf-8"
          )
          Path("input/script.txt").write_text(
              script,
              encoding="utf-8"
          )
          Path("input/source.txt").write_text(
              source,
              encoding="utf-8"
          )

          print("テーマ:", topic)
          print("タイトル:", title)
          print("台本文字数:", len(script))
          print("台本:", script)
          PY

      - name: Download Japanese voice model
        run: |
          curl -fL --retry 3 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -o model/kokoro-v1.0.int8.onnx

          curl -fL --retry 3 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -o model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

      - name: Generate Japanese audio and subtitle timings
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro

          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          if not script:
              raise RuntimeError("台本が空です")

          phrases = []

          for sentence in re.split(r"(?<=[。！？])", script):
              sentence = sentence.strip()

              while len(sentence) > 18:
                  cut = 15

                  for mark in ["、", "。", "！", "？"]:
                      pos = sentence.rfind(mark, 0, 17)
                      if pos >= 7:
                          cut = pos + 1
                          break

                  phrases.append(sentence[:cut])
                  sentence = sentence[cut:]

              if sentence:
                  phrases.append(sentence)

          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio_parts = []
          segments = []
          rate = None
          cursor = 0.0

          for index, phrase in enumerate(phrases):
              audio, sr = kokoro.create(phrase)
              audio = np.asarray(
                  audio,
                  dtype=np.float32
              ).reshape(-1)

              if rate is None:
                  rate = int(sr)

              if int(sr) != rate:
                  raise RuntimeError(
                      "音声サンプルレートが一致しません"
                  )

              start = cursor
              audio_parts.append(audio)
              cursor += len(audio) / rate

              segments.append({
                  "text": phrase,
                  "start": start,
                  "end": cursor
              })

              if index < len(phrases) - 1:
                  silence = np.zeros(
                      int(rate * 0.08),
                      dtype=np.float32
                  )
                  audio_parts.append(silence)
                  cursor += len(silence) / rate

          sf.write(
              "input/audio.wav",
              np.concatenate(audio_parts),
              rate
          )

          Path("input/segments.json").write_text(
              json.dumps(
                  segments,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("音声時間:", round(cursor, 2), "秒")
          print("字幕数:", len(segments))
          PY

      - name: Create topic-matched background image
        run: |
          python - <<'PY'
          import json
          import random
          import re
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFilter

          W, H = 1080, 1920

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()
          title = Path("input/title.txt").read_text(
              encoding="utf-8"
          ).strip()
          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          text = topic + " " + title + " " + script[:200]

          categories = [
              (["ランニング", "マラソン", "駅伝", "陸上"],
               ["running athlete", "marathon runners"]),
              (["介護", "福祉", "高齢者", "介護報酬"],
               ["elderly care", "caregiver elderly"]),
              (["熊野", "三重県"],
               ["Kumano Mie Japan", "Mie Japan coast"]),
              (["岡山"],
               ["Okayama Japan city", "Okayama Korakuen"]),
              (["お金", "投資", "貯金", "経済"],
               ["personal finance", "business finance"]),
              (["スマホ", "時間", "習慣", "努力", "仕事", "人生"],
               ["person working desk", "person thinking"])
          ]

          queries = None

          for keywords, candidates in categories:
              if any(k in text for k in keywords):
                  queries = candidates
                  break

          if queries is None:
              words = re.findall(
                  r"[一-龥々]{2,}|[ァ-ヴー]{3,}|[A-Za-z]{4,}",
                  title
              )
              queries = words[:2] + ["Japan news"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "JapaneseShortsVideo/1.0"
          })

          selected = None
          credit = {}

          for query in queries:
              try:
                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "generator": "search",
                          "gsrsearch": query,
                          "gsrnamespace": 6,
                          "gsrlimit": 10,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "iiurlwidth": 1080
                      },
                      timeout=20
                  )
                  response.raise_for_status()

                  pages = list(
                      response.json()
                      .get("query", {})
                      .get("pages", {})
                      .values()
                  )
                  random.shuffle(pages)

                  for page in pages:
                      info = (page.get("imageinfo") or [{}])[0]
                      url = info.get("thumburl") or info.get("url")

                      if not url:
                          continue

                      image_response = session.get(
                          url,
                          timeout=25
                      )
                      image_response.raise_for_status()

                      temp = Path("input/background_source")
                      temp.write_bytes(image_response.content)

                      try:
                          candidate = Image.open(temp).convert("RGB")
                      except Exception:
                          continue

                      if candidate.width < 500 or candidate.height < 500:
                          continue

                      selected = candidate
                      meta = info.get("extmetadata", {})

                      credit = {
                          "source": "Wikimedia Commons",
                          "file_title": page.get("title", ""),
                          "page_url": (
                              "https://commons.wikimedia.org/wiki/"
                              + page.get("title", "").replace(" ", "_")
                          ),
                          "license": meta.get(
                              "LicenseShortName", {}
                          ).get("value", ""),
                          "license_url": meta.get(
                              "LicenseUrl", {}
                          ).get("value", ""),
                          "search_query": query
                      }
                      break

                  if selected:
                      break

              except Exception as exc:
                  print(
                      "画像取得失敗:",
                      str(exc)[:150]
                  )

          if selected:
              scale = max(
                  W / selected.width,
                  H / selected.height
              )

              selected = selected.resize((
                  int(selected.width * scale),
                  int(selected.height * scale)
              ))

              left = (selected.width - W) // 2
              top = (selected.height - H) // 2

              image = selected.crop((
                  left, top, left + W, top + H
              ))

              image = image.filter(
                  ImageFilter.GaussianBlur(0.5)
              )

              overlay = Image.new("RGB", (W, H), (0, 0, 0))
              image = Image.blend(image, overlay, 0.30)

              print(
                  "背景画像取得成功:",
                  credit.get("page_url")
              )

          else:
              image = Image.new("RGB", (W, H))
              draw = ImageDraw.Draw(image)

              for y in range(H):
                  t = y / H
                  draw.line(
                      (0, y, W, y),
                      fill=(
                          int(10 + 15 * t),
                          int(22 + 20 * t),
                          int(45 + 30 * t)
                      )
                  )

              for x, y, radius in [
                  (220, 420, 180),
                  (900, 850, 260),
                  (450, 1450, 340)
              ]:
                  draw.ellipse(
                      (
                          x - radius, y - radius,
                          x + radius, y + radius
                      ),
                      outline=(60, 85, 125),
                      width=5
                  )

              credit = {
                  "source": "generated fallback",
                  "topic": topic,
                  "reason": "画像を取得できませんでした"
              }

              print("代替背景を生成しました")

          image.save("input/background.png")

          Path("input/background_credit.json").write_text(
              json.dumps(
                  credit,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

      - name: Create UTF-8 two-line subtitles
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          segments = json.loads(
              Path("input/segments.json").read_text(
                  encoding="utf-8"
              )
          )

          def timestamp(seconds):
              value = max(
                  0,
                  int(round(float(seconds) * 100))
              )
              hours = value // 360000
              minutes = (value % 360000) // 6000
              secs = (value % 6000) // 100
              centiseconds = value % 100

              return (
                  f"{hours}:{minutes:02d}:"
                  f"{secs:02d}.{centiseconds:02d}"
              )

          def make_two_lines(value, limit=13):
              value = str(value).replace("{", "").replace("}", "")
              value = value.replace("\n", " ").strip()

              if len(value) <= limit:
                  return value

              cut = limit

              for mark in ["、", "。", "！", "？", "："]:
                  position = value.rfind(mark, 0, limit + 1)

                  if 5 <= position < len(value) - 1:
                      cut = position + 1
                      break

              first = value[:cut].strip()
              second = value[cut:].strip()

              return first + r"\N" + second

          header = textwrap.dedent("""\
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,Noto Sans CJK JP,68,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,5,2,5,60,60,0,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """)

          lines = [header]

          for segment in segments:
              subtitle = make_two_lines(segment["text"])

              lines.append(
                  f"Dialogue: 0,"
                  f"{timestamp(segment['start'])},"
                  f"{timestamp(segment['end'])},"
                  f"Default,,0,0,0,,"
                  f"{{\\an5\\pos(540,960)}}"
                  f"{subtitle}\n"
              )

          output = Path("input/subtitles.ass")
          output.write_text(
              "".join(lines),
              encoding="utf-8",
              newline="\n"
          )

          data = output.read_bytes()

          if not data.startswith(b"[Script Info]"):
              raise RuntimeError("字幕ヘッダーが不正です")

          if data.startswith(bytes([239, 187, 191])):
              raise RuntimeError("字幕ファイルにBOMがあります")

          print("字幕生成成功:", len(segments), "件")

          if segments:
              print(
                  "字幕例:",
                  make_two_lines(segments[0]["text"])
              )
          PY

      - name: Render vertical video
        run: |
          test -s input/background.png
          test -s input/audio.wav
          test -s input/subtitles.ass

          ffmpeg -y \
            -loop 1 -framerate 30 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -r 30 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/video.mp4

          test -s output/video.mp4

      - name: Validate video
        run: |
          python - <<'PY'
          import subprocess

          def probe(args):
              return subprocess.check_output(
                  args,
                  text=True
              ).strip()

          duration = float(probe([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "output/video.mp4"
          ]))

          video = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,width,height",
              "-of", "csv=p=0",
              "output/video.mp4"
          ]).split(",")

          audio = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "a:0",
              "-show_entries", "stream=codec_name",
              "-of", "csv=p=0",
              "output/video.mp4"
          ])

          if not 5 <= duration <= 60:
              raise SystemExit(
                  f"動画時間が不正です: {duration:.2f}秒"
              )

          if video != ["h264", "1080", "1920"]:
              raise SystemExit(
                  f"映像形式が不正です: {video}"
              )

          if audio != "aac":
              raise SystemExit(
                  f"音声形式が不正です: {audio}"
              )

          print(f"動画検証成功: {duration:.2f}秒")
          PY

      - name: Upload private then publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]

          if not all(os.environ.get(k) for k in required):
              raise RuntimeError(
                  "YouTube OAuth Secretsが未設定です"
              )

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          title = Path("input/title.txt").read_text(
              encoding="utf-8"
          ).strip()[:100]

          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          source = Path("input/source.txt").read_text(
              encoding="utf-8"
          ).strip()

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()

          description = (
              script + "\n\n"
              + source + "\n\n"
              + "ジャンル: " + topic
              + "\n\n#Shorts"
          )

          result = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description[:5000],
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload(
                  "output/video.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )
          ).execute()

          video_id = result["id"]
          print("非公開アップロード成功:", video_id)

          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print(
              "公開URL: https://www.youtube.com/shorts/"
              + video_id
          )
          PY

      - name: Save video and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-and-diagnostics
          path: |
            output/video.mp4
