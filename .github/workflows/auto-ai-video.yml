                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  str(VIDEO_FILE)
              ], timeout=900)

              print("BGM MIX: SUCCESS")

          # BGMが取得できなかった場合は、ナレーションだけで生成
          else:
              print("BGM MIX: SKIPPED - BGM NOT FOUND")

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(BG_FILE),
                  "-i", str(AUDIO_FILE),
                  "-vf", video_filter,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-tune", "stillimage",
                  "-pix_fmt", "yuv420p",
                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
