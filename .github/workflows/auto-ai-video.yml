                      extension = Path(
                          urlparse(audio_url).path
                      ).suffix.lower()

                      # 音声ファイルだけを対象にする
                      if extension not in (
                          ".ogg",
                          ".oga",
                          ".mp3",
                          ".wav",
                          ".flac",
                      ):
                          continue

                      license_name = html.unescape(
                          metadata.get(
                              "LicenseShortName", {}
                          ).get("value", "")
                      ).strip()

                      license_lower = license_name.lower()

                      # ライセンスが確認できる音源に限定
                      allowed_license = (
                          "cc0" in license_lower
                          or "public domain" in license_lower
                          or "public-domain" in license_lower
                      )

                      if not allowed_license:
                          print(
                              "BGM LICENSE SKIP:",
                              page_title,
                              license_name or "unknown",
                          )
                          continue

                      print(
                          "BGM AUDIO CANDIDATE:",
                          page_title,
                          license_name,
                      )

                      temp_bgm = WORK / (
                          "background_music" + extension
                      )

                      try:
                          audio_response = requests.get(
                              audio_url,
                              headers={
                                  "User-Agent":
                                      "AutoJapaneseVideo/1.0"
                              },
                              timeout=60,
                          )
                          audio_response.raise_for_status()

                          if len(audio_response.content) < 10000:
                              print("BGM SKIP: file too small")
                              continue

                          temp_bgm.write_bytes(
                              audio_response.content
                          )

                          # 音声ファイルとして正常か確認
                          probe = subprocess.run(
                              [
                                  "ffprobe",
                                  "-v", "error",
                                  "-show_entries",
                                  "format=duration",
                                  "-of",
                                  "default=noprint_wrappers=1:nokey=1",
                                  str(temp_bgm),
                              ],
                              capture_output=True,
                              text=True,
                              timeout=30,
                          )

                          if probe.returncode != 0:
                              print("BGM SKIP: invalid audio")
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          try:
                              bgm_duration = float(
                                  probe.stdout.strip()
                              )
                          except (ValueError, TypeError):
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          if bgm_duration < 10:
                              print(
                                  "BGM SKIP: too short",
                                  bgm_duration,
                              )
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          # 採用した音源の情報を保存
                          BGM_INFO_FILE.write_text(
                              "音源名: " + page_title + "\n"
                              + "ライセンス: " + license_name + "\n"
                              + "作者: " + html.unescape(
                                  metadata.get(
                                      "Artist", {}
                                  ).get("value", "不明")
                              ) + "\n"
                              + "音源URL: " + audio_url + "\n",
                              encoding="utf-8",
                          )

                          # 実際に取得した拡張子を保持
                          BGM_FILE = temp_bgm
                          bgm_found = True

                          print(
                              "BGM SELECTED:",
                              page_title,
                          )
                          print(
                              "BGM LICENSE:",
                              license_name,
                          )
                          print(
                              "BGM DURATION:",
                              bgm_duration,
                          )

                      except Exception as e:
                          print(
                              "BGM DOWNLOAD ERROR:",
                              str(e)[:300],
                          )
                          temp_bgm.unlink(missing_ok=True)

              except Exception as e:
                  print(
                      "BGM SEARCH ERROR:",
                      keyword,
                      str(e)[:300],
                  )

          if bgm_found:
              print("BGM STATUS: READY")
              print("BGM FILE:", BGM_FILE)
          else:
              print(
                  "BGM STATUS: NOT FOUND "
                  "- no suitable licensed audio was found"
              )

                                        # 10. 動画素材と動く背景を使って縦型動画を生成

          import os
          import re
          import requests
          from pathlib import Path

          BACKGROUND_VIDEO_FILE = WORK / "background_source.webm"
          background_video_found = False

          # Wikimedia Commonsから無料で利用できる動画を検索
          # 動画が見つからない場合は静止画に切り替える
          video_headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          video_extensions = (".webm", ".ogv", ".mp4")

          # 内容に合う動画を探す
          for keyword in keywords[:5]:
              if background_video_found:
                  break

              try:
                  print("BACKGROUND VIDEO SEARCH:", keyword)

                  response = requests.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": keyword,
                          "gsrnamespace": 6,
                          "gsrlimit": 15,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "format": "json"
                      },
                      headers=video_headers,
                      timeout=30
                  )
                  response.raise_for_status()

                  pages = (
                      response.json()
                      .get("query", {})
                      .get("pages", {})
                  )

                  for page in pages.values():
                      if background_video_found:
                          break

                      page_title = page.get("title", "")
                      title_lower = page_title.lower()

                      if not title_lower.endswith(
                          video_extensions
                      ):
                          continue

                      infos = page.get("imageinfo", [])
                      if not infos:
                          continue

                      info = infos[0]
                      video_url = info.get("url")

                      if not video_url:
                          continue

                      # 拡張子に合った保存先を使用する
                      extension = Path(
                          page_title
                      ).suffix.lower()

                      if extension not in video_extensions:
                          continue

                      temp_video = WORK / (
                          "background_source" + extension
                      )

                      print(
                          "BACKGROUND VIDEO CANDIDATE:",
                          page_title
                      )

                      download_response = requests.get(
                          video_url,
                          headers=video_headers,
                          stream=True,
                          timeout=60
                      )
                      download_response.raise_for_status()

                      content_length = int(
                          download_response.headers.get(
                              "content-length", "0"
                          )
                      )

                      # 大容量動画による失敗を防ぐ
                      if content_length > 40 * 1024 * 1024:
                          download_response.close()
                          print(
                              "BACKGROUND VIDEO SKIPPED: "
                              "FILE TOO LARGE"
                          )
                          continue

                      downloaded = 0
                      max_bytes = 40 * 1024 * 1024

                      try:
                          with open(temp_video, "wb") as f:
                              for chunk in (
                                  download_response.iter_content(
                                      chunk_size=1024 * 256
                                  )
                              ):
                                  if not chunk:
                                      continue

                                  downloaded += len(chunk)

                                  if downloaded > max_bytes:
                                      raise ValueError(
                                          "Video exceeds 40 MB"
                                      )

                                  f.write(chunk)

                      except Exception:
                          temp_video.unlink(missing_ok=True)
                          raise

                      finally:
                          download_response.close()

                      # ffprobeで動画として読み取れるか確認
                      check = subprocess.run(
                          [
                              "ffprobe",
                              "-v", "error",
                              "-select_streams", "v:0",
                              "-show_entries",
                              "stream=codec_type,width,height",
                              "-of", "json",
                              str(temp_video)
                          ],
                          capture_output=True,
                          text=True,
                          timeout=30
                      )

                      if (
                          check.returncode == 0
                          and '"codec_type": "video"'
                          in check.stdout
                      ):
                          BACKGROUND_VIDEO_FILE = temp_video
                          background_video_found = True

                          metadata = info.get(
                              "extmetadata", {}
                          )

                          license_name = (
                              metadata.get(
                                  "LicenseShortName", {}
                              ).get("value", "")
                          )

                          artist = (
                              metadata.get(
                                  "Artist", {}
                              ).get("value", "")
                          )

                          print(
                              "BACKGROUND VIDEO SUCCESS:",
                              page_title
                          )
                          print(
                              "BACKGROUND VIDEO LICENSE:",
                              license_name
                          )
                          print(
                              "BACKGROUND VIDEO ARTIST:",
                              artist
                          )
                      else:
                          temp_video.unlink(missing_ok=True)

              except Exception as e:
                  print(
                      "BACKGROUND VIDEO SEARCH ERROR:",
                      str(e)[:200]
                  )

          if background_video_found:
              print(
                  "BACKGROUND MODE: REAL VIDEO + MOTION"
              )
          else:
              print(
                  "BACKGROUND MODE: IMAGE + MOTION FALLBACK"
              )

          # 字幕ファイルのパスをFFmpeg用に調整
          ass_path = str(ASS_FILE.resolve())
          ass_path = ass_path.replace("\\", "\\\\")
          ass_path = ass_path.replace(":", "\\:")
          ass_path = ass_path.replace("'", "\\'")

          # 実際の動画にも静止画にも動きを加える
          # 動きは強めつつ、急な揺れは避ける
          video_filter = (
              "scale=2160:3840:"
              "force_original_aspect_ratio=increase,"
              "crop=2160:3840,"
              "zoompan="
              "z='1.06+0.06*sin(on/240)':"
              "x='iw/2-(iw/zoom/2)+55*sin(on/150)':"
              "y='ih/2-(ih/zoom/2)+35*sin(on/190)':"
              "d=1:"
              "s=1080x1920:"
              "fps=30,"
              "setsar=1,"
              f"ass='{ass_path}'"
          )

          # 背景入力を選択する
          if background_video_found:
              background_input = [
                  "-stream_loop", "-1",
                  "-i", str(BACKGROUND_VIDEO_FILE)
              ]
          else:
              background_input = [
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(BG_FILE)
              ]

          # FFmpegの基本設定
          ffmpeg_args = [
              "ffmpeg", "-y",
              *background_input,
              "-i", str(AUDIO_FILE)
          ]

          # BGMが取得できている場合は音声をミックス
          if bgm_found and BGM_FILE.exists():
              print("BGM MIX: START")

              audio_filter = (
                  "[2:a]volume=0.22[bgm];"
                  "[1:a][bgm]"
                  "amix=inputs=2:duration=first:"
                  "dropout_transition=2[aout]"
              )

              ffmpeg_args.extend([
                  "-stream_loop", "-1",
                  "-i", str(BGM_FILE),
                  "-filter_complex", audio_filter,
                  "-map", "0:v:0",
                  "-map", "[aout]"
              ])

          else:
              print("BGM MIX: SKIPPED - BGM NOT FOUND")

              ffmpeg_args.extend([
                  "-map", "0:v:0",
                  "-map", "1:a:0"
              ])

          print(
              "BACKGROUND MOTION:",
              "REAL VIDEO" if background_video_found
              else "ZOOMPAN IMAGE"
          )

          ffmpeg_args.extend([
              "-vf", video_filter,
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-pix_fmt", "yuv420p",
              "-r", "30",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(VIDEO_FILE)
          ])

          run(ffmpeg_args, timeout=900)

          print("BACKGROUND MOTION: SUCCESS")
          print("VIDEO GENERATION: SUCCESS")

          # 11. 生成結果を検証
          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries",
                  "format=duration:stream=codec_type,width,height",
                  "-of", "json",
                  str(VIDEO_FILE)
              ],
              check=True,
              capture_output=True,
              text=True
          )

          info = json.loads(probe.stdout)
          actual_duration = float(
              info["format"]["duration"]
          )

          video_stream = next(
              (
                  s for s in info.get("streams", [])
                  if s.get("codec_type") == "video"
              ),
              None
          )

          if video_stream is None:
              raise RuntimeError("動画ストリームがありません")

          if (
              video_stream.get("width") != 1080
              or video_stream.get("height") != 1920
          ):
              raise RuntimeError("動画サイズが正しくありません")

                    # 投稿前の最終時間チェック
          MAX_VIDEO_DURATION = 59.0

          if actual_duration < 5:
