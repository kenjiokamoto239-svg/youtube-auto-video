name: Auto AI Japanese Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Generate Japanese script
        run: |
          cat > prompt.txt <<'EOF'
          日本語のYouTubeショート動画台本を1本作ってください。
          テーマは「今日から人生を少し良くする習慣」。
          300〜450文字。
          最初の1文で興味を引く。
          具体例を2つ入れる。
          最後は短い行動提案で終える。
          タイトルや説明は不要。台本本文だけ出力してください。
          EOF

          ollama run qwen2.5:0.5b < prompt.txt > input_script.txt
          test -s input_script.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" soundfile

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare
        run: |
          mkdir -p model input output

          wget -q "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          cp input_script.txt input/script.txt

      - name: Generate Japanese voice
        run: |
          cat > generate_tts.py <<'PY'
          from kokoro_onnx import Kokoro
          import soundfile as sf

          with open("input/script.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin",
          )

          audio, sample_rate = model.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          print("Japanese audio generated.")
          PY

          python generate_tts.py

      - name: Generate MP4
        run: |
          ffmpeg -y \
            -f lavfi \
            -i color=c=black:s=1280x720:r=30 \
            -i input/audio.wav \
            -c:v libx264 \
            -preset veryfast \
            -tune stillimage \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

      - name: Publish latest MP4 to public GitHub URL
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          force_orphan: true
          keep_files: false

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            output/video.mp4
