name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. GitHubから取得
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Ollamaを準備
      # -----------------------------
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &

          sleep 5

          ollama pull qwen2.5:0.5b


      # -----------------------------
      # 3. 毎回違うテーマを作る
      # -----------------------------
      - name: Generate random topic
        run: |
          python - <<'PY'
          from pathlib import Path
          import random

          topics = [
              "習慣",
              "お金",
              "仕事",
              "人間関係",
              "時間",
              "健康",
              "自己成長",
              "読書",
              "メンタル",
              "ランニング",
              "人生",
              "節約",
              "集中力",
              "行動力",
              "睡眠",
              "スマホ",
              "40代の生き方"
          ]

          angles = [
              "今日からできること",
              "知らないと損する考え方",
              "多くの人がやっている失敗",
              "人生が少し楽になる方法",
              "忙しくても続けられる方法",
              "お金をかけない方法",
              "やめるだけで変わること",
              "1日5分でできること",
              "仕事を楽にする方法",
              "将来の自分を助ける考え方"
          ]

          topic = random.choice(topics)
          angle = random.choice(angles)
          seed = random.randint(100000, 999999)

          Path("topic.txt").write_text(
              f"テーマ：{topic}\n"
              f"切り口：{angle}\n"
              f"乱数：{seed}\n",
              encoding="utf-8"
          )

          print(Path("topic.txt").read_text(encoding="utf-8"))
          PY


      # -----------------------------
      # 4. 日本語台本を作る
      # -----------------------------
      - name: Generate Japanese script
        run: |
          cat > prompt.txt <<'EOF'
          あなたは日本語YouTubeショート動画の台本ライターです。

          topic.txtのテーマと切り口を使って、
          1本の短い動画台本を作ってください。

          必ず守ること：

          ・日本語だけで書く
          ・自然な日本語にする
          ・180〜240文字程度
          ・40〜60秒程度で話せる内容
          ・最初の一文で興味を引く
          ・具体例を1〜2個入れる
          ・一般論だけにしない
          ・最後は具体的な行動提案
          ・絵文字は禁止
          ・ハッシュタグは禁止
          ・「TITLE」「SCRIPT」などの見出しは禁止
          ・説明文は禁止
          ・台本本文だけを出力する

          topic.txt：
          EOF

          cat topic.txt >> prompt.txt

          ollama run qwen2.5:0.5b < prompt.txt > raw_output.txt

          test -s raw_output.txt


      # -----------------------------
      # 5. 台本を安全に整形
      # -----------------------------
      - name: Validate and prepare script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path("raw_output.txt").read_text(
              encoding="utf-8"
          ).strip()

          # 不要な見出しを削除
          raw = re.sub(
              r"^(TITLE|SCRIPT|台本|タイトル)\s*[:：].*$",
              "",
              raw,
              flags=re.MULTILINE
          )

          # 改行を整理
          text = re.sub(r"\s+", "", raw)

          # 英語のAIメタ出力を除去
          text = re.sub(
              r"(Here.*|Title.*|Script.*|以下.*)",
              "",
              text,
              flags=re.IGNORECASE
          )

          # 日本語文字が十分あるか確認
          japanese_count = len(
              re.findall(r"[ぁ-んァ-ヶ一-龠]", text)
          )

          if japanese_count < 80:
              raise SystemExit(
                  f"日本語台本として不十分です: {text}"
              )

          # 240文字を超えたら句点などで切る
          if len(text) > 240:
              cut = text[:240]

              positions = [
                  cut.rfind("。"),
                  cut.rfind("！"),
                  cut.rfind("？"),
                  cut.rfind("、")
              ]

              best = max(positions)

              if best >= 120:
                  text = cut[:best + 1]
              else:
                  text = cut

          # 短すぎる場合は公開しない
          if len(text) < 140:
              raise SystemExit(
                  f"台本が短すぎます: {len(text)}文字"
              )

          Path("input_script.txt").write_text(
              text,
              encoding="utf-8"
          )

          # タイトルは最初の一文から作る
          first = re.split(
              r"[。！？]",
              text
          )[0].strip()

          if len(first) < 5:
              first = "今日から人生を少し良くする方法"

          title = first[:70]

          Path("video_title.txt").write_text(
              title,
              encoding="utf-8"
          )

          print("文字数:", len(text))
          print("日本語文字数:", japanese_count)
          print()
          print("TITLE:")
          print(title)
          print()
          print("SCRIPT:")
          print(text)
          PY


      # -----------------------------
      # 6. Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # -----------------------------
      # 7. 必要パッケージ
      # -----------------------------
      - name: Install packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # -----------------------------
      # 8. FFmpegと日本語フォント
      # -----------------------------
      - name: Install FFmpeg and Japanese font
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk


      # -----------------------------
      # 9. モデル準備
      # -----------------------------
      - name: Prepare
        run: |
          mkdir -p model
          mkdir -p input
          mkdir -p output

          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          cp input_script.txt input/script.txt


      # -----------------------------
      # 10. 日本語音声を1回だけ生成
      # -----------------------------
      - name: Generate Japanese voice
        run: |
          cat > generate_tts.py <<'PY'
          from pathlib import Path
          import soundfile as sf
          from kokoro_onnx import Kokoro

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("TTS開始")
          print("文字数:", len(text))

          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio, sample_rate = kokoro.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          duration = len(audio) / sample_rate

          print(
              f"音声時間: {duration:.2f}秒"
          )

          # 異常な音声は絶対に公開しない
          if duration > 70:
              raise SystemExit(
                  f"音声が長すぎます: {duration:.2f}秒"
              )

          if duration < 15:
              raise SystemExit(
                  f"音声が短すぎます: {duration:.2f}秒"
              )

          print("TTS成功")
          PY

          python generate_tts.py

          test -s input/audio.wav


      # -----------------------------
      # 11. 音声時間をFFprobeで再確認
      # -----------------------------
      - name: Validate audio duration
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.wav)

          echo "Audio duration: $DURATION seconds"

          python - <<PY
          duration = float("$DURATION")

          if duration > 70:
              raise SystemExit(
                  f"音声が70秒を超えています: {duration}"
              )

          if duration < 15:
              raise SystemExit(
                  f"音声が短すぎます: {duration}"
              )
          PY


      # -----------------------------
      # 12. 音声時間から字幕を作る
      # -----------------------------
      - name: Generate timed subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import soundfile as sf

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          audio, sr = sf.read(
              "input/audio.wav"
          )

          duration = len(audio) / sr

          # 文単位で分割
          sentences = [
              x.strip()
              for x in re.split(
                  r"(?<=[。！？])",
                  text
              )
              if x.strip()
          ]

          if not sentences:
              raise SystemExit(
                  "字幕用の文章を作れません"
              )

          total_chars = sum(
              len(x) for x in sentences
          )

          current = 0.0
          blocks = []

          def timestamp(sec):
              ms = int(sec * 1000)

              h = ms // 3600000
              ms %= 3600000

              m = ms // 60000
              ms %= 60000

              s = ms // 1000
              ms %= 1000

              return (
                  f"{h:02d}:{m:02d}:{s:02d},"
                  f"{ms:03d}"
              )

          for i, sentence in enumerate(sentences):

              part_duration = (
                  duration
                  * len(sentence)
                  / total_chars
              )

              start = current

              if i == len(sentences) - 1:
                  end = duration
              else:
                  end = current + part_duration

              # 1〜2行に整える
              display = sentence

              if len(display) > 20:

                  middle = len(display) // 2

                  candidates = []

                  for pos in range(
                      max(8, middle - 8),
                      min(
                          len(display) - 1,
                          middle + 8
                      )
                  ):
                      if display[pos] in "、。！？":
                          candidates.append(pos)

                  if candidates:
                      cut = min(
                          candidates,
                          key=lambda x: abs(
                              x - middle
                          )
                      )

                      display = (
                          display[:cut + 1]
                          + "\n"
                          + display[cut + 1:]
                      )

              blocks.append(
                  f"{i + 1}\n"
                  f"{timestamp(start)} --> "
                  f"{timestamp(end)}\n"
                  f"{display}\n"
              )

              current = end

          Path(
              "input/subtitles.srt"
          ).write_text(
              "\n".join(blocks),
              encoding="utf-8"
          )

          print(
              Path(
                  "input/subtitles.srt"
              ).read_text(
                  encoding="utf-8"
              )
          )
          PY


      # -----------------------------
      # 13. MP4生成
      # -----------------------------
      - name: Generate MP4
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -i input/audio.wav \
            -vf "subtitles=input/subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=38,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=0,Alignment=2,MarginV=520'" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          test -s output/video.mp4


      # -----------------------------
      # 14. 完成した動画の時間を検査
      # -----------------------------
      - name: Validate final video
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/video.mp4)

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/video.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/video.mp4)

          echo "Video duration: $DURATION"
          echo "Video size: ${WIDTH}x${HEIGHT}"

          python - <<PY
          duration = float("$DURATION")
          width = int("$WIDTH")
          height = int("$HEIGHT")

          if duration > 70:
              raise SystemExit(
                  f"動画が長すぎます: {duration}秒"
              )

          if duration < 15:
              raise SystemExit(
                  f"動画が短すぎます: {duration}秒"
              )

          if width != 1080 or height != 1920:
              raise SystemExit(
                  f"動画サイズが不正です: "
                  f"{width}x{height}"
              )

          print("動画検査OK")
          PY


      # -----------------------------
      # 15. YouTube公開
      # -----------------------------
      - name: Upload to YouTube and publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          title = open(
              "video_title.txt",
              encoding="utf-8"
          ).read().strip()

          description = (
              "今日から実践できる考え方や習慣を紹介します。\n\n"
              "#習慣 #自己改善 #人生 #shorts"
          )

          body = {
              "snippet": {
                  "title": title[:90],
                  "description": description,
                  "tags": [
                      "習慣",
                      "自己改善",
                      "人生",
                      "仕事",
                      "自己成長",
                      "shorts"
                  ],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          response = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          ).execute()

          video_id = response["id"]

          print(
              "YouTube upload successful"
          )

          print(
              "Video ID:",
              video_id
          )

          publish_response = youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public"
                  }
              }
          ).execute()

          print(
              "YouTube publish successful"
          )

          print(
              "Privacy:",
              publish_response["status"]["privacyStatus"]
          )

          print(
              "URL:",
              "https://www.youtube.com/watch?v="
              + video_id
          )
          PY

          python upload_youtube.py


      # -----------------------------
      # 16. 完成ファイル保存
      # -----------------------------
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            input/subtitles.srt
            output/video.mp4
