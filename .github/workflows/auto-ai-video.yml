name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 10 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
                    python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help

            
          # トレンドから動画テーマを選定
      - name: Select video topic
        run: |
          mkdir -p work
          python - <<'PYTHON'
          import json
          import random
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          import requests
          import feedparser

          # RSSから雑学テーマを取得
          import urllib.parse
          import xml.etree.ElementTree as ET
          import random

          genre = "雑学"

          rss_queries = [
              # 既存の雑学
              "科学 不思議 仕組み",
              "宇宙 惑星 発見",
              "人体 不思議 仕組み",
              "自然現象 科学",
              "身近な科学 なぜ",
              "恐竜 古代生物",
              "食べ物 科学",
              "海 深海 生物",

              # 動物の雑学
              "動物 驚きの生態",
              "動物 意外な能力",
              "動物 なぜ 不思議",
              "動物 面白い習性",
              "生き物 驚くべき能力",

              # アニメの雑学
              "人気アニメ キャラクター 秘密",
              "アニメ 制作 裏話",
              "アニメ 設定 豆知識",
              "アニメ キャラクター 意外な事実",

              # ゲームの雑学
              "人気ゲーム 隠し要素",
              "ゲーム 裏技 豆知識",
              "ゲーム キャラクター 秘密",
              "ゲーム 制作 裏話",
              "任天堂 ゲーム 雑学",

              # マンガの雑学
              "人気漫画 キャラクター 秘密",
              "漫画 意外な設定",
              "漫画 制作 裏話",
              "漫画 キャラクター 豆知識",

              # USJの雑学
              "USJ アトラクション 秘密",
              "ユニバーサルスタジオジャパン 豆知識",
              "USJ エリア 仕掛け",
              "USJ アトラクション 裏話",
              "USJ 新アトラクション 情報",
          ]

          articles = []
          seen_titles = set()

          random.shuffle(rss_queries)

          for query in rss_queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RSS取得:", query)

                  response = requests.get(
                      rss_url,
                      timeout=20,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )
                  response.raise_for_status()

                  root = ET.fromstring(response.content)

                  for item in root.findall(".//item"):
                      title_element = item.find("title")
                      link_element = item.find("link")
                      date_element = item.find("pubDate")

                      if title_element is None:
                          continue

                      title = (title_element.text or "").strip()

                      link = (
                          link_element.text or ""
                          if link_element is not None
                          else ""
                      )

                      if not title or not link:
                          continue

                      title_key = title.lower()

                      if title_key in seen_titles:
                          continue

                      seen_titles.add(title_key)

                      articles.append({
                          "title": title,
                          "link": link,
                          "published": (
                              date_element.text or ""
                              if date_element is not None
                              else ""
                          )
                      })

              except Exception as e:
                  print(
                      "RSS取得エラー:",
                      query,
                      str(e)[:150]
                  )

          if not articles:
              raise RuntimeError(
                  "RSSからテーマを取得できませんでした。"
              )

          article = random.choice(articles)
          topic = article["title"]

          plan = {
              "genre": genre,
              "topic": topic,
              "trend_source": article["link"],
              "selection_score": 1,
              "candidate_count": len(articles)
          }

          Path("work/trend_plan.json").write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("選定ジャンル:", genre)
          print("選定テーマ:", topic)
          print("RSS記事URL:", article["link"])
          print("RSS候補数:", len(articles))
          PYTHON

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

          def strip_prompt_leakage(s):
              s = clean_text(s)
              bad_patterns = [
                  r"(?i)^\s*(?:あなたは|以下の条件に従って|読み上げ用の本文だけを出力|視聴者の常識を揺さぶる|具体例を入れてください|結論を明確にしてください|ここに台本を書く|台本の構成|最重要ルール|動画ジャンル).*$",
                  r"(?i)^\s*(?:system|assistant|user)\s*[:：].*$",
                  r"^\s*【(?:動画ジャンル|台本の構成|最重要ルール|指示|出力形式)[^】]*】\s*$",
              ]
              lines = []
              for line in s.splitlines():
                  if any(re.search(p, line) for p in bad_patterns):
                      continue
                  lines.append(line)
              return clean_text("\n".join(lines))

                             # 4. トレンドとチャンネル実績から選ばれたテーマを使用

          plan_file = WORK / "trend_plan.json"

          if not plan_file.exists():
              raise RuntimeError(
                  "トレンド選定データがありません。"
                  "trend_strategy.py の実行を確認してください。"
              )

          plan = json.loads(
              plan_file.read_text(encoding="utf-8")
          )

          category = clean_text(
              plan.get("genre", "")
          )

          topic = clean_text(
              plan.get("topic", "")
          )

          if not category or not topic:
              raise RuntimeError(
                  "選定されたジャンルまたはテーマが空です。"
              )

          (WORK / "category.txt").write_text(
              category,
              encoding="utf-8"
          )

          (WORK / "topic.txt").write_text(
              topic,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("VIDEO TOPIC:", topic)
          print("TREND SOURCE:", plan.get("trend_source", "unknown"))
          print("TREND SCORE:", plan.get("selection_score", 0))
          print("TREND CANDIDATES:", plan.get("candidate_count", 0))

                    # 5. 全ジャンルで公開情報を検索する
          # 無料の公開RSSを利用。外部の有料APIは使わない

          article = None

          research_queries = {
              "人間関係・心理": [
                  "人間関係 心理学 研究 信頼",
                  "コミュニケーション 心理学 研究",
                  "対人関係 行動科学 研究"
              ],
              "お金・仕事の現実": [
                  "日本 家計 貯蓄 物価 統計",
                  "日本 賃金 労働 統計 厚生労働省",
                  "金融庁 資産形成 家計"
              ],
              "習慣・自己啓発": [
                  "習慣形成 行動科学 研究",
                  "集中力 睡眠 行動科学 研究",
                  "時間管理 習慣 研究"
              ],
              "健康・ランニング": [
                  "ランニング 初心者 トレーニング 研究",
                  "運動 健康 ガイドライン 公的機関",
                  "ランニング 怪我 予防 研究"
              ],
              "意外な事実・雑学": [
                  "科学 研究 意外な事実 解説",
                  "日常 身近な科学 公的機関",
                  "歴史 事実 検証 解説"
              ],
              "ニュース・社会問題": [
                  "日本 国内 社会 ニュース",
                  "日本 経済 賃金 物価 ニュース",
                  "岡山 介護 福祉 AI ニュース",
                  "世界　戦争 ニュース"
              ]
          }

          queries = research_queries.get(
              category,
              ["日本 社会 ニュース"]
          )

          # 選定されたテーマに関連する情報を優先する
          if topic:
              queries = [
                  topic,
                  *queries
              ]

          # 重複する検索語を除去
          queries = list(dict.fromkeys(queries))

          random.shuffle(queries)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          articles = []

          # 検索語を順番に試し、参考情報を取得する
          for query in queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query, safe="")
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RESEARCH SEARCH:", query)

                  response = requests.get(
                      rss_url,
                      headers=headers,
                      timeout=25
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(
                      response.content
                  )

                  for item in feed.entries[:10]:
                      title_text = clean_text(
                          item.get("title", "")
                      )

                      summary_text = clean_text(
                          re.sub(
                              r"<[^>]+>",
                              " ",
                              item.get("summary", "")
                          )
                      )

                      link_text = item.get("link", "")

                      if title_text and link_text:
                          # 同じ記事の重複を避ける
                          if not any(
                              a["link"] == link_text
                              for a in articles
                          ):
                              articles.append({
                                  "title": title_text,
                                  "summary": summary_text[:900],
                                  "link": link_text
                              })

                  # 記事が見つかったら検索を終了
                  if articles:
                      break

              except Exception as e:
                  print(
                      "RESEARCH RSS ERROR:",
                      str(e)[:200]
                  )

          if articles:
              article = random.choice(articles)

              print(
                  "RESEARCH ARTICLE:",
                  article["title"]
              )

              print(
                  "RESEARCH SOURCE:",
                  article["link"]
              )

          elif category == "ニュース・時事問題":
              raise RuntimeError(
                  "ニュースを取得できませんでした。"
                  "誤った内容で動画を作らず、"
                  "処理を停止します。"
              )

          else:
              print(
                  "RESEARCH FALLBACK: "
                  "参考情報を取得できません。"
                  "確認できない事実や統計を作らず、"
                  "一般知識に限定します。"
              )

          # 6. Ollamaでジャンル別の台本を作成
          # 外部の有料生成AI APIは使用しない

          model = os.environ.get(
              "OLLAMA_MODEL",
              "qwen2.5:3b"
          )

          run([
              "bash",
              "-lc",
              "curl -fsSL https://ollama.com/install.sh | sh"
          ], timeout=300)

          subprocess.Popen(
              ["ollama", "serve"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL
          )

          for _ in range(30):
              try:
                  requests.get(
                      "http://127.0.0.1:11434/api/tags",
                      timeout=3
                  )
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError(
                  "Ollamaを起動できませんでした"
              )

          run([
              "ollama",
              "pull",
              model
          ], timeout=1200)

          if article:
              source_context = f"""
              参考記事の見出し：
              {article['title']}

              公開情報の説明：
              {article['summary']}

              参考元URL：
              {article['link']}

              この記事を丸写しせず、
              確認できる事実と自分の論評を分けてください。
              記事に書かれていない事実を作らないでください。
              """
          else:
              source_context = """
              特定のニュース記事は使用しないでください。
              指定されたジャンルに沿って、
              一般的な知識と論理的な考察を使ってください。
              確認できない統計や実在人物の発言は作らないでください。
              """

                        # ==========================================
          # 過去の分析データを次の台本に反映
          # ==========================================

          analytics_file = ROOT / "data" / "analytics_feedback.json"

          analytics_guidance = (
              "過去の分析データはまだ利用できません。"
              "今回のテーマに合った独自の台本を作成してください。"
          )

          try:
              if analytics_file.exists():
                  analytics_data = json.loads(
                      analytics_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  top_videos = analytics_data.get(
                      "top_videos_by_lifetime_views",
                      []
                  )

                  top_videos = sorted(
                      top_videos,
                      key=lambda item: int(
                          item.get("views", 0)
                      ),
                      reverse=True
                  )[:5]

                  if top_videos:
                      examples = []

                      for video in top_videos:
                          video_title = clean_text(
                              video.get("title", "")
                          )
                          views = int(
                              video.get("views", 0)
                          )

                          if video_title:
                              examples.append(
                                  f"- {video_title} "
                                  f"（累計再生数：{views}回）"
                              )

                      analytics_guidance = (
                          "以下は過去の再生数上位動画です。\n"
                          + "\n".join(examples)
                          + "\n\n"
                          "これらを参考に、具体性、意外性、"
                          "視聴者の関心を引く切り口を研究してください。"
                          "ただし、タイトルや台本をコピーしてはいけません。"
                          "今回のジャンルとテーマに合う、"
                          "新しい主張と具体例を作ってください。"
                      )

                  print(
                      "ANALYTICS FEEDBACK LOADED:",
                      len(top_videos),
                      "top videos"
                  )

              else:
                  print(
                      "ANALYTICS FEEDBACK NOT FOUND"
                  )

          except Exception as e:
              print(
                  "ANALYTICS FEEDBACK ERROR:",
                  str(e)[:300]
              )

                    # ==========================================
          # 台本生成プロンプト
          # ==========================================

                              # ==========================================
          # 第1段階：テーマを分析して台本の設計図を作る
          # ==========================================
          genre_instructions = ""

          if category == "ダジャレ":
              genre_instructions = (
                  "【ダジャレ動画の特別指示】\n"
                  "ダジャレを中心にした短い動画にしてください。\n"
                  "ダジャレを3つ程度、テンポよく紹介してください。\n"
                  "それぞれ短く、音のかけ方が伝わる自然な日本語にしてください。\n"
                  "長い前置きや説教は不要です。\n"
                  "最後は一番くだらないオチで締めてください。\n"
                  "読み上げる本文だけを出力してください。\n"
              )
          analysis_prompt = f"""
          あなたは、小学3年生の男子が夢中になる
          雑学動画を企画する編集者です。

          【テーマ】
          {topic}

          【参考情報】
          {source_context}

          次の項目を簡潔に整理してください。

          1. このテーマの正確な答え
          2. 子どもが驚きそうなポイント
          3. 答えの理由や仕組み
          4. 子どもにも分かる具体例
          5. 追加すると面白くなる関連知識
          6. 誤解しやすい点や注意点

          参考情報にない数字、研究結果、歴史的事実を
          作り出してはいけません。

          確認できない情報は、事実として断定しないでください。
          難しい専門用語を使う場合は、簡単に説明してください。

          分析結果だけを出力してください。
          """
          analysis_response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": analysis_prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.25
                  }
              },
              timeout=900
          )

          analysis_response.raise_for_status()

          reasoning_plan = clean_text(
              analysis_response.json().get("response", "")
          )

          if not reasoning_plan:
              reasoning_plan = (
                  "テーマに直接答え、確認できる根拠と具体例を示し、"
                  "断定しすぎず、明確な結論で締める。"
              )

          print("TOPIC ANALYSIS COMPLETED")

          # ==========================================
          # 第2段階：分析結果を使って台本を作る
          # ==========================================

          prompt = f"""
          あなたは、小学3年生の男子が夢中になる
          日本語の雑学YouTube Shortsを作るプロのライターです。

          【動画テーマ】
          {topic}

          【分析結果】
          {reasoning_plan}

          【参考情報】
          {source_context}

          【視聴者】
          小学3年生の男子を主な想定視聴者とします。
          ただし、幼児向けのような話し方にはせず、
          知的好奇心を刺激する自然な日本語にしてください。

          【台本の構成】

          1. 最初の一文で、意外な事実や疑問を提示する。
          2. テーマの答えを早めに伝える。
          3. なぜそうなるのか、理由や仕組みを説明する。
          4. さらに興味を引く関連知識を加える。
          5. 発見や驚きが残る自然な一言で締める。

          この順番を機械的に守る必要はありません。
          テーマに合う自然な流れにしてください。

          【冒頭の絶対ルール】
          ・「こんにちは」「こんばんは」などの挨拶から始めない。
          ・「小学3年生のみんな」「3年生の男子のみんな」
            など、視聴者への呼びかけから始めない。
          ・「今日は〇〇について紹介します」
            「今回のテーマは〇〇です」などの前置きを禁止する。
          ・最初の一文から、驚きの事実、意外な答え、
            または思わず続きを聞きたくなる疑問を提示する。
          ・視聴者の年齢や学年を台本の中で説明しない。
          ・冒頭からすぐに本題に入り、説明口調の挨拶は入れない。

          【文章のルール】

          ・難しい言葉を避け、簡単な日本語で説明する。
          ・子ども扱いするような不自然な話し方をしない。
          ・挨拶や長い前置きから始めない。
          ・一つの動画で扱う中心テーマは一つにする。
          ・説明だけでなく、具体的な事実や仕組みを伝える。
          ・同じ内容を何度も繰り返さない。
          ・関係のない知識を無理に追加しない。
          ・驚かせるために事実を誇張しない。
          ・根拠のない数字や架空の研究を作らない。
          ・分からないことを知っているように断定しない。
          ・無理に教訓や自己啓発の話を付けない。
          ・毎回「実は」から始めるなど、同じ表現を繰り返さない。
          ・「今回は〇〇について解説します」と言わない。
          ・タイトル、見出し、説明文、ハッシュタグを出力しない。
          ・読み上げる本文だけを出力する。

          【長さ】

          ・200〜300文字を目安にする。
          ・330文字を超えない。
          ・内容が薄いまま文字数だけを増やさない。
