              normalized = [
                  re.sub(r"[\s、。！？!?「」『』（）()]", "", s)
                  for s in sentences
              ]

              if (
                  len(normalized) >= 5
                  and len(set(normalized)) < len(normalized) * 0.7
              ):
                  issues.append(
                      "同じ文章の繰り返しが多すぎます。"
                      "重複を削り、新しい情報を加えてください。"
