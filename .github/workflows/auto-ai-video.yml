name: Auto AI Japanese Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Install Ollama
      # =========================================================
      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          nohup ollama serve > /tmp/ollama.log 2>&1 &

          echo "Ollama起動待ち..."

          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              echo "Ollama起動OK"
              break
            fi
            sleep 2
          done

          echo "Ollamaモデル取得開始"

          timeout 600s ollama pull qwen2.5:1.5b

          echo "Ollama準備完了"


      # =========================================================
      # 3. Prepare folders
      # =========================================================
      - name: Prepare folders
        shell: bash
        run: |
          rm -rf input output model
          mkdir -p input output model

          echo "フォルダ準備完了"


      # =========================================================
      # 4. Generate topic
      # =========================================================
      - name: Generate topic
        shell: python
        run: |
          import random
          from pathlib import Path

          topics = [
              "人生を少し楽にする習慣",
              "仕事で疲れにくくする考え方",
              "継続する人がやっていること",
              "朝の時間を有効に使う方法",
              "お金を無駄にしない考え方",
              "健康を守るための小さな習慣",
              "運動を続けるための考え方",
              "集中力を高める方法",
              "ストレスを減らす考え方",
              "時間を大切にする方法",
              "自分を変えるための小さな行動",
              "失敗したときの考え方",
              "やる気に頼らず行動する方法",
              "人間関係で疲れない考え方",
              "毎日を少し充実させる方法",
              "仕事の効率を上げる小さな工夫",
              "睡眠を大切にする理由",
              "運動習慣が人生に与える影響",
              "本を読む習慣のメリット",
              "スマホ時間を減らす方法",
              "先延ばしを減らす方法",
              "自信をつけるための考え方",
              "忙しい人のための時間管理",
              "人生で後悔を減らす考え方",
              "小さな努力を積み重ねる方法"
          ]

          topic = random.choice(topics)

          Path("input/topic.txt").write_text(
              topic,
              encoding="utf-8"
          )

          print("今回のテーマ：")
          print(topic)


      # =========================================================
      # 5. Generate title
      #    ※タイトルはYouTube表示専用
      #    ※音声・字幕には絶対に使わない
      # =========================================================
      - name: Generate title
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()

          prompt = f"""
          次のテーマのYouTubeショート用タイトルを1つだけ作ってください。

          テーマ：
          {topic}

          条件：
          ・日本語だけ
          ・短くする
          ・興味を引く
          ・数字を使わない
          ・英語を使わない
          ・記号を多用しない
          ・タイトルだけ出力する
          """

          fallback = f"{topic}を少し楽にする考え方"

          try:
              result = subprocess.run(
                  [
                      "ollama",
                      "run",
                      "qwen2.5:1.5b"
                  ],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=60
              )

              title = result.stdout.strip()

          except Exception as e:
              print("タイトル生成失敗")
              print(e)
              title = ""

          title = title.replace("\n", " ")
          title = title.replace("\r", " ")
          title = title.replace("�", "")
          title = re.sub(r"[0-9０-９]", "", title)
          title = re.sub(r"[A-Za-z]", "", title)
          title = re.sub(r"\s+", " ", title).strip()

          if not title:
              title = fallback

          if len(title) > 70:
              title = title[:70]

          Path("input/title.txt").write_text(
              title,
              encoding="utf-8"
          )

          print("YouTubeタイトル：")
          print(title)


      # =========================================================
      # 6. Generate script
      #    ※ここだけが音声・字幕になる
      # =========================================================
      - name: Generate script
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()

          prompt = f"""
          YouTubeショート動画のナレーション台本を作ってください。

          テーマ：
          {topic}

          重要：
          ・ナレーション本文だけを書く
          ・タイトルを書かない
          ・説明文を書かない
          ・見出しを書かない
          ・箇条書きにしない
          ・数字を書かない
          ・英語を書かない
          ・アルファベットを書かない
          ・乱数を書かない
          ・日付を書かない
          ・URLを書かない
          ・ハッシュタグを書かない
          ・特殊記号を使わない
          ・日本語だけで書く
          ・自然な話し言葉にする
          ・三百文字以内
          ・短い文章を中心にする
          ・最後は前向きな一文で終える

          例：
          「毎日頑張っているのに、なぜか疲れてしまう。
          そんなときは、全部を頑張ろうとしないことが大切です。
          今日やることを一つだけ決めて、それが終わったら十分だと考えてみましょう。
          小さな行動を続けるだけでも、少しずつ毎日は変わっていきます。」

          台本だけを出してください。
          """

          fallback_scripts = [
              "毎日頑張っているのに、なぜか疲れてしまう。そんなときは、全部を一気に変えようとしないことが大切です。今日できることを一つだけ決めて、それを終わらせてみましょう。小さな行動を積み重ねるだけでも、毎日は少しずつ変わっていきます。",

              "何かを続けたいなら、やる気だけに頼らないことが大切です。やる気がある日に頑張るのではなく、少しだけでも毎日続けられる形にしてみましょう。小さな努力でも積み重なれば、大きな変化につながります。",

              "人生を変えたいと思ったとき、大きな決断は必要ありません。まずは今日できる小さな行動を一つ始めてみましょう。散歩でも読書でも片付けでも構いません。小さな一歩を続けることが、未来を変えるきっかけになります。"
          ]

          script = ""

          try:
              result = subprocess.run(
                  [
                      "ollama",
                      "run",
                      "qwen2.5:1.5b"
                  ],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=120
              )

              script = result.stdout.strip()

              print("AI台本生成結果：")
              print(script)

          except subprocess.TimeoutExpired:
              print("AI台本生成が120秒でタイムアウトしました")

          except Exception as e:
              print("AI台本生成エラー")
              print(e)

          # 改行を整理
          script = script.replace("\r", " ")
          script = script.replace("\n", " ")

          # 不正文字除去
          script = script.replace("�", "")
          script = script.replace("乱数", "")
          script = script.replace("ハッシュタグ", "")

          # 数字除去
          script = re.sub(
              r"[0-9０-９]",
              "",
              script
          )

          # 英字除去
          script = re.sub(
              r"[A-Za-z]",
              "",
              script
          )

          # URL除去
          script = re.sub(
              r"https?://\S+",
              "",
              script
          )

          # シャープ記号除去
          script = script.replace("#", "")

          # 余分な空白
          script = re.sub(
              r"\s+",
              " ",
              script
          ).strip()

          # 引用符などを整理
          script = script.replace("「", "")
          script = script.replace("」", "")

          # AI出力が短すぎる場合はフォールバック
          if len(script) < 80:
              print("AI台本が短すぎるためフォールバックを使用")
              script = fallback_scripts[0]

          if len(script) > 330:
              script = script[:330]

          Path("input/script.txt").write_text(
              script,
              encoding="utf-8"
          )

          print("最終台本：")
          print(script)


      # =========================================================
      # 7. Validate script
      # =========================================================
      - name: Validate script
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("input/script.txt")

          if not path.exists():
              raise SystemExit(
                  "ERROR: input/script.txt がありません"
              )

          text = path.read_text(
              encoding="utf-8"
          ).strip()

          print("台本文字数：", len(text))
          print("台本：", text)

          if len(text) < 50:
              raise SystemExit(
                  "ERROR: 台本が短すぎます"
              )

          if len(text) > 330:
              raise SystemExit(
                  "ERROR: 台本が長すぎます"
              )

          if "�" in text:
              raise SystemExit(
                  "ERROR: 不正文字 � が含まれています"
              )

          if "乱数" in text:
              raise SystemExit(
                  "ERROR: 乱数という文字が含まれています"
              )

          if re.search(r"[0-9０-９]", text):
              raise SystemExit(
                  "ERROR: 数字が含まれています"
              )

          if re.search(r"[A-Za-z]", text):
              raise SystemExit(
                  "ERROR: 英字が含まれています"
              )

          print("台本チェックOK")


      # =========================================================
      # 8. Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================================================
      # 9. Install Python packages
      # =========================================================
      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip

          pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy \
            pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

          echo "Pythonパッケージ準備完了"


      # =========================================================
      # 10. Install FFmpeg / Japanese font
      # =========================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk

          fc-list | grep "Noto Sans CJK" | head -5 || true

          ffmpeg -version | head -1


      # =========================================================
      # 11. Download Kokoro Japanese model
      # =========================================================
      - name: Download Kokoro model
        shell: bash
        run: |
          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          ls -lh model/

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

          echo "Kokoroモデル準備完了"


      # =========================================================
      # 12. Generate Japanese TTS
      # =========================================================
      - name: Generate Japanese TTS
        shell: python
        run: |
          import soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro

          script = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          if not script:
              raise SystemExit(
                  "ERROR: 台本が空です"
              )

          print("TTS対象台本：")
          print(script)

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          print("日本語音声生成開始")

          samples, sample_rate = model.create(
              script
          )

          sf.write(
              "input/audio.wav",
              samples,
              sample_rate
          )

          print("音声生成完了")
          print("sample_rate:", sample_rate)
          print("samples:", len(samples))


      # =========================================================
      # 13. Validate audio
      # =========================================================
      - name: Validate audio
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          audio = Path("input/audio.wav")

          if not audio.exists():
              raise SystemExit(
                  "ERROR: input/audio.wav がありません"
              )

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  str(audio)
              ],
              capture_output=True,
              text=True
          )

          duration = float(
              result.stdout.strip()
          )

          print(
              f"音声時間：{duration:.2f}秒"
          )

          if duration < 12:
              raise SystemExit(
                  "ERROR: 音声が短すぎます"
              )

          if duration > 70:
              raise SystemExit(
                  "ERROR: 音声が長すぎます"
              )

          print("音声チェックOK")


      # =========================================================
      # 14. Generate background image
      # =========================================================
      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw
          import math

          width = 1080
          height = 1920

          image = Image.new(
              "RGB",
              (width, height)
          )

          pixels = image.load()

          for y in range(height):
              ratio = y / (height - 1)

              r = int(
                  20 + 25 * ratio
              )

              g = int(
                  30 + 35 * ratio
              )

              b = int(
                  55 + 55 * ratio
              )

              for x in range(width):
                  wave = int(
                      8 * math.sin(
                          x / 180
                      )
                  )

                  pixels[x, y] = (
                      max(0, min(255, r + wave)),
                      max(0, min(255, g + wave)),
                      max(0, min(255, b + wave))
                  )

          draw = ImageDraw.Draw(
              image,
              "RGBA"
          )

          draw.ellipse(
              (-250, 250, 500, 1000),
              fill=(255, 255, 255, 28)
          )

          draw.ellipse(
              (650, 850, 1350, 1550),
              fill=(255, 255, 255, 22)
          )

          draw.ellipse(
              (100, 1450, 700, 2050),
              fill=(255, 255, 255, 18)
          )

          image.save(
              "input/background.png"
          )

          print("1080x1920背景生成完了")


      # =========================================================
      # 15. Generate timed ASS subtitles
      # =========================================================
      - name: Generate subtitles
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          script = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "input/audio.wav"
              ],
              capture_output=True,
              text=True
          )

          duration = float(
              result.stdout.strip()
          )

          # 文章を句点などで分割
          sentences = re.split(
              r"(?<=[。！？])",
              script
          )

          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          # 長すぎる場合は文字数で分割
          chunks = []

          for sentence in sentences:
              while len(sentence) > 26:
                  chunks.append(
                      sentence[:26]
                  )
                  sentence = sentence[26:]

              if sentence:
                  chunks.append(sentence)

          if not chunks:
              chunks = [script]

          total_chars = sum(
              len(x)
              for x in chunks
          )

          ass_lines = []

          ass_lines.append(
              "[Script Info]"
          )
          ass_lines.append(
              "ScriptType: v4.00+"
          )
          ass_lines.append(
              "PlayResX: 1080"
          )
          ass_lines.append(
              "PlayResY: 1920"
          )
          ass_lines.append("")
          ass_lines.append(
              "[V4+ Styles]"
          )
          ass_lines.append(
              "Format: Name, Fontname, Fontsize, "
              "PrimaryColour, SecondaryColour, "
              "OutlineColour, BackColour, Bold, "
              "Italic, Underline, StrikeOut, "
              "ScaleX, ScaleY, Spacing, Angle, "
              "BorderStyle, Outline, Shadow, "
              "Alignment, MarginL, MarginR, MarginV, Encoding"
          )
          ass_lines.append(
              "Style: Default,Noto Sans CJK JP,72,"
              "&H00FFFFFF,&H00FFFFFF,&H00000000,&H99000000,"
              "1,0,0,0,100,100,0,0,1,4,2,2,70,70,260,1"
          )
          ass_lines.append("")
          ass_lines.append(
              "[Events]"
          )
          ass_lines.append(
              "Format: Layer, Start, End, Style, "
              "Name, MarginL, MarginR, MarginV, Effect, Text"
          )

          current = 0.0

          def ass_time(seconds):
              hours = int(seconds // 3600)
              minutes = int(
                  (seconds % 3600) // 60
              )
              secs = seconds % 60

              centis = int(
                  round(
                      (secs - int(secs)) * 100
                  )
              )

              whole = int(secs)

              if centis >= 100:
                  whole += 1
                  centis = 0

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{whole:02d}."
                  f"{centis:02d}"
              )

          for chunk in chunks:

              ratio = (
                  len(chunk)
                  / total_chars
              )

              segment = duration * ratio

              start = current
              end = current + segment

              safe = chunk.replace(
                  "\\",
                  "\\\\"
              )

              safe = safe.replace(
                  "{",
                  "\\{"
              )

              safe = safe.replace(
                  "}",
                  "\\}"
              )

              ass_lines.append(
                  "Dialogue: 0,"
                  f"{ass_time(start)},"
                  f"{ass_time(end)},"
                  "Default,,0,0,0,,"
                  f"{safe}"
              )

              current = end

          Path(
              "input/subtitles.ass"
          ).write_text(
              "\n".join(ass_lines),
              encoding="utf-8"
          )

          print("字幕生成完了")
          print("字幕数：", len(chunks))
          print("音声時間：", duration)


      # =========================================================
      # 16. Validate subtitles
      # =========================================================
      - name: Validate subtitles
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "input/subtitles.ass"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: subtitles.ass がありません"
              )

          text = path.read_text(
              encoding="utf-8"
          )

          if "�" in text:
              raise SystemExit(
                  "ERROR: 字幕に不正文字があります"
              )

          if not text.strip():
              raise SystemExit(
                  "ERROR: 字幕が空です"
              )

          print("字幕チェックOK")


      # =========================================================
      # 17. Generate MP4
      # =========================================================
      - name: Generate MP4
        shell: bash
        run: |
          ffmpeg \
            -y \
            -loop 1 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/video.mp4

          ls -lh output/video.mp4


      # =========================================================
      # 18. Final validation
      #    ★ 前回のh264をwidthとして読むバグを完全修正
      # =========================================================
      - name: Validate final video
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          video = Path(
              "output/video.mp4"
          )

          if not video.exists():
              raise SystemExit(
                  "ERROR: output/video.mp4 がありません"
              )

          def probe(args):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error"
                  ] + args + [
                      str(video)
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print(result.stderr)
                  raise SystemExit(
                      "ERROR: ffprobe失敗"
                  )

              return result.stdout.strip()

          # 個別に取得する
          width = int(
              probe([
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width",
                  "-of",
                  "csv=p=0"
              ])
          )

          height = int(
              probe([
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=height",
                  "-of",
                  "csv=p=0"
              ])
          )

          video_codec = probe([
              "-select_streams",
              "v:0",
              "-show_entries",
              "stream=codec_name",
              "-of",
              "csv=p=0"
          ])

          audio_codec = probe([
              "-select_streams",
              "a:0",
              "-show_entries",
              "stream=codec_name",
              "-of",
              "csv=p=0"
          ])

          duration = float(
              probe([
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1"
              ])
          )

          print("")
          print("========== 最終動画確認 ==========")
          print(
              f"映像サイズ：{width} x {height}"
          )
          print(
              f"映像コーデック：{video_codec}"
          )
          print(
              f"音声コーデック：{audio_codec}"
          )
          print(
              f"動画時間：{duration:.2f}秒"
          )
          print("==================================")
          print("")

          if width != 1080:
              raise SystemExit(
                  f"ERROR: widthが1080ではありません：{width}"
              )

          if height != 1920:
              raise SystemExit(
                  f"ERROR: heightが1920ではありません：{height}"
              )

          if video_codec != "h264":
              raise SystemExit(
                  f"ERROR: H.264ではありません：{video_codec}"
              )

          if audio_codec != "aac":
              raise SystemExit(
                  f"ERROR: AACではありません：{audio_codec}"
              )

          if duration < 12:
              raise SystemExit(
                  "ERROR: 動画が短すぎます"
              )

          if duration > 70:
              raise SystemExit(
                  "ERROR: 動画が長すぎます"
              )

          print("最終動画チェック完全OK")


      # =========================================================
      # 19. Upload to YouTube and publish
      # =========================================================
      - name: Upload to YouTube and publish
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = __import__(
              "os"
          ).environ["YOUTUBE_CLIENT_ID"]

          client_secret = __import__(
              "os"
          ).environ["YOUTUBE_CLIENT_SECRET"]

          refresh_token = __import__(
              "os"
          ).environ["YOUTUBE_REFRESH_TOKEN"]

          title = Path(
              "input/title.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # タイトルはYouTube表示専用
          # 台本・音声・字幕には一切使用していない

          description = (
              "毎日を少し良くするための短い動画です。\n"
              "\n"
              "小さな行動を積み重ねて、"
              "毎日を少しずつ変えていきましょう。"
          )

          credentials = Credentials(
              None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          print("YouTubeアップロード開始")
          print("タイトル：", title)

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              status, response = request.next_chunk()

              if status:
                  print(
                      f"アップロード進捗："
                      f"{int(status.progress() * 100)}%"
                  )

          video_id = response["id"]

          print(
              "アップロード完了：",
              video_id
          )

          # 非公開でアップロードした動画を公開
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("")
          print("================================")
          print("YouTube公開完了")
          print(
              f"https://www.youtube.com/watch?v={video_id}"
          )
          print("================================")


      # =========================================================
      # 20. Save artifact
      # =========================================================
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            output/video.mp4
            input/script.txt
            input/title.txt
            input/audio.wav
            input/subtitles.ass
            input/background.png
          retention-days: 3
