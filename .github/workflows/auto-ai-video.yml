                  }},
                  {{
                    "claim": "別の事実主張を原文どおり抜き出す",
                    "evidence_quote": "その主張を直接裏付ける連続した原文引用"
                  }}
                ],
                "reason": "判定理由"
              }}
              """

              fact_check_response = requests.post(
                  "http://127.0.0.1:11434/api/generate",
                  json={
                      "model": model,
                      "prompt": fact_check_prompt,
                      "format": "json",
                      "stream": False,
                      "options": {
                          "temperature": 0.0
                      }
                  },
                  timeout=300
              )

              fact_check_response.raise_for_status()

              fact_check_raw = clean_text(
                  fact_check_response.json().get(
                      "response", ""
                  )
              )

              try:
                  fact_check = json.loads(fact_check_raw)
              except json.JSONDecodeError:
                  match = re.search(
                      r"\{.*\}",
                      fact_check_raw,
                      re.S
                  )

                  if not match:
                      raise RuntimeError(
                          "事実確認結果を読み取れません。公開を中止します。"
                      )

                  fact_check = json.loads(match.group(0))

              if not isinstance(fact_check, dict):
                  raise RuntimeError(
                      "事実確認結果の形式が不正です。"
                  )

              verdict = str(
                  fact_check.get("verdict", "")
              ).strip().upper()

              if verdict != "PASS":
                  reason = clean_text(
                      fact_check.get("reason", "")
                  )

                  print(
                      "FACT CHECK VERDICT:",
                      verdict
                  )
                  print(
                      "FACT CHECK REASON:",
                      reason
                  )
                  print(
                      "FACT CHECK RAW:",
                      fact_check_raw[:1500]
                  )

                  raise RuntimeError(
                      "台本の出典確認に失敗しました。"
                      "公開を中止します。"
                      + reason[:300]
                  )

          
          source_normalized = normalize_evidence(source_context)
          script_normalized = normalize_evidence(script)

          def validate_claims(result):
              items = result.get("claims", [])
              if not isinstance(items, list) or len(items) < 2:
                  return ["事実主張の引用が2件未満です。"]

              errors = []
              for index, item in enumerate(items, start=1):
                  if not isinstance(item, dict):
                      errors.append(
                          f"claim {index}: JSON形式が不正です。"
                      )
                      continue

                  claim = normalize_evidence(
                      item.get("claim", "")
                  )
                  quote = normalize_evidence(
                      item.get("evidence_quote", "")
                  )

                  if len(claim) < 6 or claim not in script_normalized:
                      errors.append(
                          f"claim {index}: 台本原文と不一致"
                      )

                  if len(quote) < 10 or quote not in source_normalized:
                      errors.append(
                          f"claim {index}: 出典原文と不一致"
                      )

              return errors

          validation_errors = validate_claims(fact_check)

          if validation_errors:
              print("FACT CHECK INDEX RETRY: START")

              for issue in validation_errors:
                  print("FACT CHECK RETRY ISSUE:", issue)

              # 台本の文章をプログラム側で抽出する
              script_quote_candidates = [
                  clean_text(part)
                  for part in re.split(
                      r"(?<=[。！？!?])",
                      script
                  )
                  if 10 <= len(clean_text(part)) <= 120
              ]

              
              # 出典の文章をプログラム側で抽出する
              source_quote_candidates = [
                  clean_text(part)
                  for part in re.split(
                      r"(?<=[。！？!?])",
                      source_context
                  )
                  if 10 <= len(clean_text(part)) <= 180
              ]

              # テーマと台本に関係する出典を優先する
              topic_terms = list(dict.fromkeys(
                  re.findall(
                      r"[一-龯ぁ-んァ-ヶーA-Za-z0-9]{2,}",
                      clean_text(topic + " " + script)
                  )
              ))

              scored_source_candidates = []

              for source_index, part in enumerate(
                  source_quote_candidates
              ):
                  normalized_part = normalize_evidence(part)

                  score = sum(
                      1
                      for term in topic_terms
                      if normalize_evidence(term) in normalized_part
                  )

                  if score > 0:
                      scored_source_candidates.append(
                          (score, source_index, part)
                      )

              # 関連度の高い文章を最大24件に限定する
              if scored_source_candidates:
                  scored_source_candidates.sort(
                      key=lambda item: (-item[0], item[1])
                  )

                  source_quote_candidates = [
                      item[2]
                      for item in scored_source_candidates[:24]
                  ]
              else:
                  source_quote_candidates = source_quote_candidates[:24]


              print(
                  "SCRIPT QUOTE CANDIDATES:",
                  len(script_quote_candidates)
              )
              print(
                  "SOURCE QUOTE CANDIDATES:",
                  len(source_quote_candidates)
              )

              if len(script_quote_candidates) < 2:
                  raise RuntimeError(
                      "台本から事実確認用の文章を2件抽出できません。"
                      "公開を中止します。"
                  )

              if len(source_quote_candidates) < 2:
                  raise RuntimeError(
                      "出典から確認用の文章を2件抽出できません。"
                      "公開を中止します。"
                  )

              retry_prompt = f"""
              あなたは厳格な事実確認担当者です。

              台本の文章と出典の文章を比較してください。

              【最重要ルール】
              ・台本候補と出典候補は番号で指定する。
              ・文章そのものを書き直してはいけない。
              ・script_indexとsource_indexは0から始まる番号。
              ・台本の主張を出典が直接裏付ける組み合わせだけを選ぶ。
              ・直接裏付けられる組み合わせが2件未満ならFAIL。
              ・無関係な文章を組み合わせてはいけない。
              ・推測で補ってはいけない。

              【台本候補】
              {json.dumps(script_quote_candidates, ensure_ascii=False)}

              【出典候補】
              {json.dumps(source_quote_candidates, ensure_ascii=False)}

              JSONのみで回答してください。

              PASSの場合の形式：
              {{
                "verdict": "PASS",
                "pairs": [
                  {{
                    "script_index": 0,
                    "source_index": 0
                  }},
                  {{
                    "script_index": 1,
                    "source_index": 1
                  }}
                ],
                "reason": "判定理由"
              }}

              FAILの場合：
              {{
                "verdict": "FAIL",
                "pairs": [],
                "reason": "裏付けが不足している理由"
              }}
              """

              retry_response = requests.post(
                  "http://127.0.0.1:11434/api/generate",
                  json={
                      "model": model,
                      "prompt": retry_prompt,
                      "format": "json",
                      "stream": False,
                      "options": {
                          "temperature": 0.0,
                          "num_predict": 256
                      }

                  },
                  timeout=300
              )

              retry_response.raise_for_status()

              fact_check_raw = clean_text(
                  retry_response.json().get(
                      "response",
                      ""
                  )
              )

              try:
                  retry_result = json.loads(fact_check_raw)
              except json.JSONDecodeError:
                  match = re.search(
                      r"\{.*\}",
                      fact_check_raw,
                      re.S
                  )

                  if not match:
                      raise RuntimeError(
                          "再確認結果のJSONを読み取れません。"
                          "公開を中止します。"
                      )

                  retry_result = json.loads(match.group(0))

              if not isinstance(retry_result, dict):
                  raise RuntimeError(
                      "再確認結果の形式が不正です。公開を中止します。"
                  )

              retry_verdict = str(
                  retry_result.get("verdict", "")
              ).strip().upper()

              if retry_verdict != "PASS":
                  reason = clean_text(
                      retry_result.get("reason", "")
                  )

                  print(
                      "FACT CHECK RETRY VERDICT:",
                      retry_verdict
                  )
                  print(
                      "FACT CHECK RETRY REASON:",
                      reason[:400]
                  )

                  raise RuntimeError(
                      "出典が台本の主張を直接裏付けていません。"
                      "公開を中止します。"
                  )

              pairs = retry_result.get("pairs", [])

              if not isinstance(pairs, list) or len(pairs) < 2:
                  raise RuntimeError(
                      "事実確認の組み合わせが2件未満です。"
                      "公開を中止します。"
                  )

              resolved_claims = []
              used_script_indices = set()

              for pair in pairs:
                  if not isinstance(pair, dict):
                      continue

                  script_index = pair.get("script_index")
                  source_index = pair.get("source_index")

                  if type(script_index) is not int:
                      continue

                  if type(source_index) is not int:
                      continue

                  if not (
                      0 <= script_index < len(script_quote_candidates)
                  ):
                      continue

                  if not (
                      0 <= source_index < len(source_quote_candidates)
                  ):
                      continue

                  if script_index in used_script_indices:
                      continue

                  claim = script_quote_candidates[script_index]
                  evidence_quote = source_quote_candidates[source_index]

                  resolved_claims.append({
                      "claim": claim,
                      "evidence_quote": evidence_quote
                  })

                  used_script_indices.add(script_index)

              fact_check = {
                  "verdict": "PASS",
                  "claims": resolved_claims,
                  "reason": clean_text(
                      retry_result.get("reason", "")
                  )
              }

              # プログラムが原文から組み立てた引用を再検証
              validation_errors = validate_claims(fact_check)

              if validation_errors:
