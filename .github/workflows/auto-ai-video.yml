                      100
                  )
              except Exception:
                  font = ImageFont.load_default()

              # 大きなジャンル文字を背景の一部として配置
              draw.text(
                  (70, 300),
                  label,
                  font=font,
                  fill=(190, 205, 220)
              )

              # 細い線を配置して単調な背景を避ける
              for y in range(500, 1800, 180):
                  draw.line(
                      (70, y, 1010, y),
                      fill=(65, 82, 105),
                      width=2
                  )

              image = ImageEnhance.Contrast(
                  image
              ).enhance(1.1)

              image.save(
                  BACKGROUND_FILE,
                  "JPEG",
                  quality=92
              )

              print(
                  "BACKGROUND FALLBACK CREATED:",
                  category
              )

          # 背景ファイルの最終確認
          if (
              not BACKGROUND_FILE.exists()
              or BACKGROUND_FILE.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "背景画像ファイルを作成できませんでした"
              )

          print(
              "BACKGROUND FILE:",
              str(BACKGROUND_FILE)
          )

          # 9. 背景にタイトルを描画
          # タイトルは画面上部に表示し、読み上げない。
          image = Image.open(BG_FILE).convert("RGB")
          draw = ImageDraw.Draw(image)

          font_path = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
