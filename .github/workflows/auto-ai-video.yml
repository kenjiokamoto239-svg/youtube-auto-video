              ],
              check=True,
              capture_output=True,
              text=True
          )

          info = json.loads(probe.stdout)
          actual_duration = float(
              info["format"]["duration"]
          )

          video_stream = next(
              (
                  s for s in info.get("streams", [])
                  if s.get("codec_type") == "video"
              ),
              None
          )

          if video_stream is None:
              raise RuntimeError("動画ストリームがありません")

          if (
              video_stream.get("width") != 1080
              or video_stream.get("height") != 1920
          ):
              raise RuntimeError("動画サイズが正しくありません")

          if actual_duration < 5 or actual_duration > 180:
              raise RuntimeError(
                  f"動画時間が異常です: {actual_duration}"
              )

          if VIDEO_FILE.stat().st_size < 100000:
              raise RuntimeError("動画ファイルが小さすぎます")

          print("VIDEO READY:", VIDEO_FILE)
          print("DURATION:", actual_duration)
          print("SIZE:", VIDEO_FILE.stat().st_size)
          PYTHON

          python generate_video.py

      # 4. YouTubeへ限定公開でアップロードしてから公開
      - name: Upload and publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_video.py <<'PYTHON'
          import os
          import sys
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          work = Path("work")
          video_path = work / "video.mp4"
          title_path = work / "title.txt"
          script_path = work / "script.txt"

          if not video_path.exists():
              raise RuntimeError("動画ファイルがありません")

          title = title_path.read_text(
              encoding="utf-8"
          ).strip()

          script = script_path.read_text(
              encoding="utf-8"
          ).strip()
                    # 動画のジャンルを読み込む
          category_path = work / "category.txt"

          if not category_path.exists():
              raise RuntimeError(
                  "動画ジャンル情報がありません"
              )

          category = category_path.read_text(
              encoding="utf-8"
          ).strip()

          if not category:
              raise RuntimeError(
                  "動画ジャンル情報が空です"
              )

          print("UPLOAD VIDEO GENRE:", category)

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not all([client_id, client_secret, refresh_token]):
              raise RuntimeError(
                  "YouTube認証Secretsが不足しています。"
                  "YOUTUBE_CLIENT_ID、"
                  "YOUTUBE_CLIENT_SECRET、"
                  "YOUTUBE_REFRESH_TOKENを確認してください。"
              )

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          try:
              credentials.refresh(Request())
          except Exception as e:
              raise RuntimeError(
                  "YouTube OAuth認証に失敗しました。"
                  "invalid_scopeの場合は再認証が必要です。"
              ) from e

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

                    # 台本の内容に合わせて説明文を作成
          # タイトル生成用の指示文や、架空のニュース出典は掲載しない

                    # 動画の内容に合わせてハッシュタグを自動選択
          hashtag_rules = {
              "ニュース・時事問題": [
                  "#日本ニュース",
                  "#時事問題",
                  "#社会問題",
                  "#ニュース解説"
              ],
              "お金・投資": [
                  "#お金",
                  "#資産形成",
                  "#貯金",
                  "#投資初心者",
                  "#お金の勉強"
              ],
              "自己改善・習慣": [
                  "#習慣化",
                  "#自己成長",
                  "#考え方",
                  "#人生を変える"
              ],
              "健康・ランニング": [
                  "#ランニング",
                  "#マラソン",
                  "#健康習慣",
                  "#ランニング初心者"
              ],
              "名言・人生論": [
                  "#人生論",
                  "#名言",
                  "#生き方",
                  "#人生の教訓"
              ],
              "仕事・社会": [
                  "#働き方",
                  "#仕事論",
                  "#社会問題",
                  "#賃金"
              ]
          }

          # ジャンルに応じた基本タグを取得
          hashtags = hashtag_rules.get(
              category,
              ["#日本", "#解説"]
          )

          # 動画タイトル・台本から内容に合うタグを追加
          content = (title + " " + script).lower()

          keyword_rules = {
              "貯金": "#貯金",
              "節約": "#節約",
              "資産形成": "#資産形成",
              "株式": "#株式投資",
              "投資信託": "#投資信託",
              "新NISA": "#新NISA",
              "nisa": "#新NISA",
              "老後": "#老後資金",
              "給料": "#給料",
              "賃金": "#賃金",
              "物価": "#物価高",
              "転職": "#転職",
              "仕事": "#仕事",
              "会社": "#会社員",
              "習慣": "#習慣化",
              "努力": "#努力",
              "集中力": "#集中力",
              "睡眠": "#睡眠",
              "健康": "#健康",
              "ランニング": "#ランニング",
              "マラソン": "#マラソン",
              "介護": "#介護",
              "高齢者": "#高齢者介護",
              "岡山": "#岡山",
              "熊野市": "#熊野市",
              "人生": "#人生論",
              "名言": "#名言"
          }

          for keyword, tag in keyword_rules.items():
              if keyword.lower() in content:
                  hashtags.append(tag)

          # 重複を削除し、最大8個に制限
          hashtags = list(dict.fromkeys(hashtags))[:8]

          # YouTube説明文を作成
          description = (
              script[:4000].strip()
              + "\n\n"
              + " ".join(hashtags)
              + " #Shorts"
          )

          print("VIDEO HASHTAGS:", " ".join(hashtags))

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description[:5000],
                  "categoryId": "25",
                  "tags": [
                      "ニュース", "日本", "解説", "Shorts"
                  ],
                  "defaultLanguage": "ja",
                  "defaultAudioLanguage": "ja"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              str(video_path),
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(
                      "Upload progress:",
                      round(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]
          print("UPLOADED:", video_id)

          # アップロード後に公開へ変更
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("PUBLISHED:", video_id)
          print(
              "URL:",
              "https://www.youtube.com/shorts/" + video_id
          )
          PYTHON

          python upload_video.py

      # 5. 動画と台本を保存
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            work/video.mp4
            work/voice.mp3
            work/title.txt
            work/script.txt
            work/subtitles.ass
            work/background.jpg
          if-no-files-found: ignore
          retention-days: 7
