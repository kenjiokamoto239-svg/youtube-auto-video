          )[:3]

          y = 100
          for line in title_lines:
              bbox = draw.textbbox((0, 0), line, font=font, stroke_width=2)
              w = bbox[2] - bbox[0]
              x = max(35, (1080 - w) // 2)

              draw.text(
                  (x, y),
