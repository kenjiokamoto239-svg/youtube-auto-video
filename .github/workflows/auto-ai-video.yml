      # ==========================================
      # タイトル生成（ループ対策＋自動再試行）
      # ==========================================
      - name: Generate title
        run: |
          cat > generate_text.py <<'PY'
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          topic = Path("topic.txt").read_text(encoding="utf-8").strip()

          def ollama(prompt, max_tokens=80):
              data = json.dumps({
                  "model": "qwen2.5:1.5b",
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.7,
                      "top_p": 0.9,
                      "repeat_penalty": 1.35,
                      "num_predict": max_tokens
                  }
              }).encode("utf-8")

              req = urllib.request.Request(
                  "http://127.0.0.1:11434/api/generate",
                  data=data,
                  headers={"Content-Type": "application/json"}
              )

              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(
                      r.read().decode("utf-8")
                  ).get("response", "")

          prompt = f"""日本語YouTubeショートのタイトルを1つだけ作ってください。

          テーマ：
          {topic}

          条件：
          18〜30文字程度。
          自然な日本語。
          内容と関係する。
          続きを見たくなる。
          タイトル本文だけ出力。
          英語、数字だけの文字列、説明、記号の羅列は禁止。
          """

          title = ""

          for attempt in range(3):
              try:
                  raw = ollama(prompt, 80)

                  print(
                      "生成結果:",
                      repr(raw[:300])
                  )

                  x = (
                      raw.strip().splitlines()[0]
                      if raw.strip()
                      else ""
                  )

                  x = re.sub(
                      r"^(タイトル|TITLE)\s*[:：]\s*",
                      "",
                      x,
                      flags=re.I
                  )

                  x = (
                      x.replace('"', "")
                       .replace("'", "")
                       .strip()
                  )

                  jp = len(
                      re.findall(
                          r"[ぁ-んァ-ヶ一-龠]",
                          x
                      )
                  )

                  if (
                      8 <= len(x) <= 60
                      and jp >= 6
                  ):
                      title = x
                      break

              except Exception as e:
                  print(
                      "タイトル生成エラー:",
                      e
                  )

              time.sleep(1)

          if not title:
              title = (
                  "今日から変える、小さな習慣の作り方"
              )

          Path(
              "video_title.txt"
          ).write_text(
              title[:60],
              encoding="utf-8"
          )

          print("TITLE:", title)


      # ==========================================
      # 台本生成（25h2026lループ対策）
      # ==========================================
      - name: Generate script
        run: |
          cat > generate_script.py <<'PY'
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          topic = Path(
              "topic.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          def ollama(prompt):
              data = json.dumps({
                  "model": "qwen2.5:1.5b",
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.65,
                      "top_p": 0.9,
                      "repeat_penalty": 1.4,
                      "num_predict": 320
                  }
              }).encode("utf-8")

              req = urllib.request.Request(
                  "http://127.0.0.1:11434/api/generate",
                  data=data,
                  headers={
                      "Content-Type":
                      "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=180
              ) as r:
                  return json.loads(
                      r.read().decode("utf-8")
                  ).get("response", "")

          prompt = f"""日本語のYouTubeショート動画台本を書いてください。

          {topic}

          140〜220文字。
          最初に興味を引く一文。
          具体例を1つ入れる。
          最後は今日できる行動を1つ提案。
          自然な日本語。
          台本本文だけを出力。
          英語、ハッシュタグ、タイトル、説明は禁止。
          同じ文字や数字を繰り返さない。
          """

          def clean(raw):

              text = raw.strip()

              text = re.sub(
                  r"^(台本|SCRIPT)\s*[:：]\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"\s+",
                  "",
                  text
              )

              text = text.strip(
                  '"「」『』'
              )

              text = re.sub(
                  r"#\S+",
                  "",
                  text
              )

              # 同じ文字列が何度も繰り返される
              # 異常出力を検出
              if re.search(
                  r"(.{2,12})\1{4,}",
                  text
              ):
                  print(
                      "異常な繰り返しを検出しました"
                  )
                  return ""

              # 今回実際に出た異常文字列
              if re.search(
                  r"(25h2026l|2026h25l)",
                  text,
                  flags=re.I
              ):
                  print(
                      "25h2026lループを検出しました"
                  )
                  return ""

              jp = len(
                  re.findall(
                      r"[ぁ-んァ-ヶ一-龠]",
                      text
                  )
              )

              if jp < 80:
                  return ""

              if len(text) < 120:
                  return ""

              if len(text) > 220:

                  candidate = text[:220]

                  cuts = [
                      candidate.rfind("。"),
                      candidate.rfind("！"),
                      candidate.rfind("？")
                  ]

                  cut = max(cuts)

                  if cut >= 120:
                      text = candidate[
                          :cut + 1
                      ]
                  else:
                      text = candidate

              return text

          script = ""

          for attempt in range(4):

              try:

                  raw = ollama(prompt)

                  print(
                      "AI出力:",
                      repr(raw[:500])
                  )

                  script = clean(raw)

                  if script:
                      print(
                          "正常な台本を取得しました。"
                      )
                      break

              except Exception as e:

                  print(
                      "台本生成エラー:",
                      e
                  )

              time.sleep(2)

          # ======================================
          # AIが4回とも壊れた場合の安全装置
          # ======================================

          if not script:

              script = (
                  "知っているだけで、毎日の行動は"
                  "少し変えられます。"
                  "たとえば忙しい日は、全部を頑張ろうとせず、"
                  "まず五分だけ始める方法があります。"
                  "読書なら一ページ、運動なら五分、"
                  "片付けなら一か所で十分です。"
                  "大切なのは、完璧にやることではありません。"
                  "今日できる小さな行動を一つ決めて、"
                  "実際に始めることです。"
              )

              print(
                  "AI出力が不正だったため、"
                  "安全な予備台本を使用します。"
              )

          Path(
              "input_script.txt"
          ).write_text(
              script,
              encoding="utf-8"
          )

          print(
              "文字数:",
              len(script)
          )

          print(
              "台本:",
              script
          )
          PY

          python generate_script.py


