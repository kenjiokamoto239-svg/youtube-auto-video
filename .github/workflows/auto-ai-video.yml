                  "以下の条件に従って",
                  "具体例を入れてください",
                  "結論を明確にしてください",
                  "【必須条件】",
                  "【修正前の台本】"
              ]

              if any(p in text for p in forbidden_phrases):
                  issues.append(
                      "AIへの制作指示が混入しています。"
                      "読み上げる本文だけにしてください。"
                  )

              # 理由や根拠が説明されているか検査
              explanation_words = [
                  "理由", "原因", "仕組み", "つまり",
                  "たとえば", "例えば", "実際", "違い",
                  "結果", "なぜなら", "ためです", "からです"
              ]

              if not any(w in text for w in explanation_words):
                  issues.append(
                      "主張の根拠が読み取れません。"
                      "理由や具体例を自然に説明してください。"
                  )

              # 抽象的な精神論への偏りを検査
              vague_phrases = [
                  "努力することが大切です",
                  "諦めないことが重要です",
                  "自分を信じることが大切です",
                  "継続することが大切です",
                  "人それぞれです"
              ]

              vague_count = sum(
                  text.count(p) for p in vague_phrases
              )

              if vague_count >= 2:
                  issues.append(
                      "一般論や精神論が重複しています。"
                      "具体的な根拠や例に置き換えてください。"
                  )

              # 雑学動画としての締め方を検査
              ending = text[-100:].strip()

              weak_endings = (
                  "大切です",
                  "重要です",
                  "必要です",
                  "意識しましょう",
                  "頑張りましょう",
                  "考えてみましょう"
              )

              if ending.endswith(weak_endings):
                  issues.append(
                      "雑学に関係のない教訓で終わっています。"
                      "発見や知識に結びつく自然な締め方にしてください。"
