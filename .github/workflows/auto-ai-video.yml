              )
              y += 75

          image.save(BG_FILE, quality=92)

                              # 9.5 動画内容に合わせてBGMを自動取得
          # 検索語を増やし、分野別検索に失敗したら
          # 一般的なBGMも検索する

          import html
          from urllib.parse import urlparse

          BGM_FILE = WORK / "background_music.ogg"
          BGM_INFO_FILE = WORK / "background_music_license.txt"

          BGM_FILE.unlink(missing_ok=True)
          BGM_INFO_FILE.unlink(missing_ok=True)

          # 分野別検索語
          bgm_keywords = {
              "岡山・介護": [
