          ass_path = ass_path.replace("'", "\\'")

          video_filter = (
              "scale=1080:1920:force_original_aspect_ratio=increase,"
              "crop=1080:1920,"
              f"ass='{ass_path}'"
          )

          # BGMが取得できている場合は、ナレーションと合成する
          if bgm_found and BGM_FILE.exists():
              print("BGM MIX: START")
              print("BGM FILE:", BGM_FILE)
              print("BGM VOLUME: 8%")

              audio_filter = (
                  "[2:a]volume=0.08[bgm];"
                  "[1:a][bgm]"
                  "amix=inputs=2:duration=first:"
                  "dropout_transition=2[aout]"
              )

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(BG_FILE),
                  "-i", str(AUDIO_FILE),
                  "-stream_loop", "-1",
