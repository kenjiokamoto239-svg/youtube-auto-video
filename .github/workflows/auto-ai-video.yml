name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 10 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore topic history
        uses: actions/cache@v4
        with:
          path: work/topic_history.json
          key: topic-history-${{ github.run_id }}
          restore-keys: |
            topic-history-

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
          python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help

            
          # トレンドから動画テーマを選定
      - name: Select video topic
        run: |
          mkdir -p work
          python - <<'PYTHON'
          import json
          import random
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          import requests
          import feedparser

          # Wikipedia日本語版から情報を取得する関数
          def search_wikipedia(query):
              api_url = "https://ja.wikipedia.org/w/api.php"

              try:
                  response = requests.get(
                      api_url,
                      params={
                          "action": "query",
                          "list": "search",
                          "srsearch": query,
                          "format": "json",
                          "srlimit": 5,
                      },
                      headers={
                          "User-Agent": "AutoAIJapaneseVideo/1.0"
                      },
                      timeout=15,
                  )
                  response.raise_for_status()

                  data = response.json()

                  results = data.get(
                      "query", {}
                  ).get("search", [])

                  return [
                      {
                          "title": item.get("title", ""),
                          "snippet": item.get("snippet", ""),
                          "source": (
                              "https://ja.wikipedia.org/wiki/"
                              + quote(
                                  item.get("title", "").replace(
                                      " ", "_"
                                  ),
                                  safe=""
                              )
                          ),
                      }
                      for item in results
                  ]

              except Exception as e:
                  print("Wikipedia取得エラー:", str(e)[:150])
                  return []

          # RSSから雑学テーマを取得
          import urllib.parse
          import xml.etree.ElementTree as ET
          import random

          genre = "雑学・心理学"

          rss_queries = [
              # ① 動物・生き物の雑学
              "動物 驚きの生態",
              "動物 意外な能力",
              "動物 不思議な習性",
              "動物 驚くべき行動",
              "生き物 意外な事実",
              "珍しい動物 生態",
              "深海生物 不思議な能力",
              "鳥 意外な習性",
              "昆虫 驚きの生態",
              "動物 なぜ 不思議",
              "海の生き物 意外な生態",
              "恐竜 意外な事実",

              # ② 人気アニメ・マンガの雑学
              "ポケモン 意外な設定",
              "ポケモン 進化 不思議",
              "ポケモン キャラクター 豆知識",
              "ドラえもん ひみつ道具 不思議",
              "ドラえもん 意外な設定",
              "ドラえもん 豆知識",
              "名探偵コナン 意外な設定",
              "名探偵コナン トリック 仕組み",
              "名探偵コナン キャラクター 秘密",
              "ワンピース 意外な設定",
              "ONE PIECE キャラクター 豆知識",
              "ワンピース 悪魔の実 秘密",
              "鬼滅の刃 キャラクター 秘密",
              "鬼滅の刃 技 設定 豆知識",
              "鬼滅の刃 意外な事実",
              "NARUTO キャラクター 秘密",
              "ナルト 忍術 豆知識",
              "NARUTO 意外な設定",
              "人気アニメ キャラクター 意外な事実",
              "アニメ 制作 裏話",
              "人気漫画 意外な設定",
              "漫画 キャラクター 豆知識",

              # ③ 人気ゲームの雑学
              "マインクラフト 隠し要素",
              "マイクラ モンスター 特徴",
              "マイクラ 意外な事実",
              "スーパーマリオ 隠し要素",
              "マリオ 意外な事実",
              "マリオ キャラクター 秘密",
              "ドラゴンクエスト モンスター 秘密",
              "ドラクエ 意外な設定",
              "ドラクエ ゲーム 豆知識",
              "星のカービィ 意外な設定",
              "カービィ コピー能力 豆知識",
              "スプラトゥーン キャラクター 設定",
              "スプラトゥーン ゲーム 豆知識",
              "ゼルダの伝説 隠し要素",
              "ゼルダの伝説 意外な設定",
              "どうぶつの森 住民 豆知識",
              "どうぶつの森 意外な設定",
              "人気ゲーム 隠し要素",
              "ゲーム キャラクター 秘密",
              "ゲーム 制作 裏話",

              # ④ テーマパークの雑学
              "USJ アトラクション 仕掛け",
              "USJ エリア 秘密",
              "USJ アトラクション 豆知識",
              "ユニバーサルスタジオジャパン 裏話",
              "東京ディズニーランド アトラクション 秘密",
              "ディズニー 意外な豆知識",
              "ドラゴンクエスト ファイナルファンタジー コラボ 横浜 みなとみらい",
              "ドラゴンクエスト アイランド ドラゴンクエストモンスターズ4 コラボ",
              "ディズニー キャラクター 意外な設定",
          ]

          articles = []
          seen_titles = set()

          random.shuffle(rss_queries)

          for query in rss_queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RSS取得:", query)

                  response = requests.get(
                      rss_url,
                      timeout=20,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )
                  response.raise_for_status()

                  root = ET.fromstring(response.content)

                  for item in root.findall(".//item"):
                      title_element = item.find("title")
                      link_element = item.find("link")
                      date_element = item.find("pubDate")

                      if title_element is None:
                          continue

                      title = (title_element.text or "").strip()

                      link = (
                          link_element.text or ""
                          if link_element is not None
                          else ""
                      )

                      if not title or not link:
                          continue

                      title_key = title.lower()

                      if title_key in seen_titles:
                          continue

                      seen_titles.add(title_key)

                      articles.append({
                          "title": title,
                          "link": link,
                          "published": (
                              date_element.text or ""
                              if date_element is not None
                              else ""
                          )
                      })

              except Exception as e:
                  print(
                      "RSS取得エラー:",
                      query,
                      str(e)[:150]
                  )

          if not articles:
              raise RuntimeError(
                  "RSSからテーマを取得できませんでした。"
              )

          # 記事の新しさとタイトルの質を考慮して選定
          from email.utils import parsedate_to_datetime
          from datetime import timezone

          now = datetime.now(timezone.utc)
          scored_articles = []
          max_article_age_hours = 24 * 30

          for item in articles:
              title = (item.get("title") or "").strip()
              published = (item.get("published") or "").strip()
              link = (item.get("link") or "").strip()

              if not title or not link:
                  continue

              if len(title) < 8 or len(title) > 100:
                  continue

              if any(word in title for word in [
                  "広告", "求人情報", "スポンサー"
              ]):
                  continue

              if not published:
                  print("TOPIC REJECTED: pubDate missing:", title)
                  continue

              try:
                  published_dt = parsedate_to_datetime(published)

                  if published_dt.tzinfo is None:
                      published_dt = published_dt.replace(
                          tzinfo=timezone.utc
                      )

                  age_hours = (
                      now - published_dt.astimezone(timezone.utc)
                  ).total_seconds() / 3600

              except (TypeError, ValueError, OverflowError):
                  print("TOPIC REJECTED: invalid pubDate:", title)
                  continue

              if (
                  age_hours < -2
                  or age_hours > max_article_age_hours
              ):
                  print(
                      "TOPIC REJECTED: outside 30-day window:",
                      title,
                      round(age_hours, 1)
                  )
                  continue

              score = 0

              if 0 <= age_hours <= 24:
                  score += 5
              elif 24 < age_hours <= 72:
                  score += 3
              elif 72 < age_hours <= 168:
                  score += 1
              else:
                  score -= 1

              if any(word in title for word in [
                  "なぜ", "理由", "仕組み", "秘密",
                  "意外", "判明", "研究", "調査", "実は"
              ]):
                  score += 2

              if any(word in title for word in [
                  "最新", "新発表", "新作", "新登場",
                  "発売", "公開", "コラボ", "開催", "イベント"
              ]):
                  score += 3

              if 15 <= len(title) <= 55:
                  score += 1

              scored_articles.append({
                  "article": item,
                  "score": score
              })

          # 過去30日間のテーマとの重複を避ける
          import difflib
          from datetime import timedelta

          history_path = Path("work/topic_history.json")
          history_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          topic_history = []

          if history_path.exists():
              try:
                  topic_history = json.loads(
                      history_path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as e:
                  print("TOPIC HISTORY READ ERROR:", str(e)[:200])
                  topic_history = []

          cutoff_date = (
              datetime.now() - timedelta(days=30)
          ).date()

          recent_history = []

          for record in topic_history:
              try:
                  record_date = datetime.fromisoformat(
                      record.get("date", "")
                  ).date()

                  if record_date >= cutoff_date:
                      recent_history.append(record)
              except Exception:
                  continue

          def normalize_topic(value):
              value = str(value or "").lower()
              value = re.sub(
                  r"[\s　、。！？!?「」『』（）()・：:,.／/]",
                  "",
                  value
              )
              return value

          def is_similar_topic(candidate, previous_topics):
              candidate = normalize_topic(candidate)

              if not candidate:
                  return False

              for previous in previous_topics:
                  old_topic = normalize_topic(
                      previous.get("topic", "")
                  )

                  if not old_topic:
                      continue

                  if candidate in old_topic or old_topic in candidate:
                      return True

                  similarity = difflib.SequenceMatcher(
                      None,
                      candidate,
                      old_topic
                  ).ratio()

                  if similarity >= 0.65:
                      return True

              return False

          filtered_articles = [
              item
              for item in scored_articles
              if not is_similar_topic(
                  item["article"]["title"],
                  recent_history
              )
          ]

          print("TOPIC HISTORY COUNT:", len(recent_history))
          print(
              "TOPIC DUPLICATES REMOVED:",
              len(scored_articles) - len(filtered_articles)
          )

          if filtered_articles:
              scored_articles = filtered_articles
          elif scored_articles:
              print(
                  "TOPIC HISTORY WARNING: "
                  "重複しない候補がないため通常候補から選びます。"
              )

          if scored_articles:
              scored_articles.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              top_score = scored_articles[0]["score"]

              finalists = [
                  item for item in scored_articles
                  if item["score"] >= top_score - 2
              ]

              selected = random.choice(finalists)
              article = selected["article"]
              selection_score = selected["score"]

          else:
              raise RuntimeError(
                  "過去30日以内の有効なRSS記事がありません。"
                  "古い情報で動画を作らず、公開を中止します。"
              )

          topic = article["title"]

          topic_history.append({
              "topic": topic,
              "date": datetime.now().isoformat(
                  timespec="seconds"
              )
          })

          topic_history = topic_history[-300:]

          history_path.write_text(
              json.dumps(
                  topic_history,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("TOPIC HISTORY SAVED:", len(topic_history))
          print("SELECTED TOPIC:", topic)
          plan = {
              "genre": genre,
              "topic": topic,
              "trend_source": article["link"],
              "selection_score": selection_score,
              "candidate_count": len(articles)
          }

          Path("work/trend_plan.json").write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("選定ジャンル:", genre)
          print("選定テーマ:", topic)
          print("RSS記事URL:", article["link"])
          print("RSS候補数:", len(articles))
          PYTHON

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import sys
          import re
          import time
          from pathlib import Path

          from PIL import (
              Image,
              ImageOps,
              ImageDraw,
              ImageFont
          )
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

          def strip_prompt_leakage(s):
              s = clean_text(s)
              bad_patterns = [
                  r"(?i)^\s*(?:あなたは|以下の条件に従って|読み上げ用の本文だけを出力|視聴者の常識を揺さぶる|具体例を入れてください|結論を明確にしてください|ここに台本を書く|台本の構成|最重要ルール|動画ジャンル).*$",
                  r"(?i)^\s*(?:system|assistant|user)\s*[:：].*$",
                  r"^\s*【(?:動画ジャンル|台本の構成|最重要ルール|指示|出力形式)[^】]*】\s*$",
              ]
              lines = []
              for line in s.splitlines():
                  if any(re.search(p, line) for p in bad_patterns):
                      continue
                  lines.append(line)
              return clean_text("\n".join(lines))

                             # 4. トレンドとチャンネル実績から選ばれたテーマを使用

          plan_file = WORK / "trend_plan.json"

          if not plan_file.exists():
              raise RuntimeError(
                  "トレンド選定データがありません。"
                  "trend_strategy.py の実行を確認してください。"
              )

          plan = json.loads(
              plan_file.read_text(encoding="utf-8")
          )

          category = clean_text(
              plan.get("genre", "")
          )

          topic = clean_text(
              plan.get("topic", "")
          )

          if not category or not topic:
              raise RuntimeError(
                  "選定されたジャンルまたはテーマが空です。"
              )

          (WORK / "category.txt").write_text(
              category,
              encoding="utf-8"
          )

          (WORK / "topic.txt").write_text(
              topic,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("VIDEO TOPIC:", topic)
          print("TREND SOURCE:", plan.get("trend_source", "unknown"))
          print("TREND SCORE:", plan.get("selection_score", 0))
          print("TREND CANDIDATES:", plan.get("candidate_count", 0))

                    # 5. 全ジャンルで公開情報を検索する
          # 無料の公開RSSを利用。外部の有料APIは使わない

          article = None

          research_queries = {
              "人間関係・心理": [
                  "人間関係 心理学 研究 信頼",
                  "コミュニケーション 心理学 研究",
                  "対人関係 行動科学 研究"
              ],
              "お金・仕事の現実": [
                  "日本 家計 貯蓄 物価 統計",
                  "日本 賃金 労働 統計 厚生労働省",
                  "金融庁 資産形成 家計"
              ],
              "習慣・自己啓発": [
                  "習慣形成 行動科学 研究",
                  "集中力 睡眠 行動科学 研究",
                  "時間管理 習慣 研究"
              ],
              "健康・ランニング": [
                  "ランニング 初心者 トレーニング 研究",
                  "運動 健康 ガイドライン 公的機関",
                  "ランニング 怪我 予防 研究"
              ],
              "意外な事実・雑学": [
                  "科学 研究 意外な事実 解説",
                  "日常 身近な科学 公的機関",
                  "歴史 事実 検証 解説"
              ],
              "ニュース・社会問題": [
                  "日本 国内 社会 ニュース",
                  "日本 経済 賃金 物価 ニュース",
                  "岡山 介護 福祉 AI ニュース",
                  "世界　戦争 ニュース"
              ]
          }

          
          # 選定テーマに直接関係する検索語を複数用意する
          if topic:
              queries = [
                  topic,
                  topic + " ニュース",
                  topic + " 最新情報",
                  topic + " 公式"
              ]
          else:
              queries = []

          # 重複する検索語を除去
          queries = list(dict.fromkeys(queries))


          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          articles = []

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          articles = []

          # 検索語を順番に試し、参考情報を取得する
          for query in queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query, safe="")
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RESEARCH SEARCH:", query)

                  response = requests.get(
                      rss_url,
                      headers=headers,
                      timeout=25
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(
                      response.content
                  )

                  for item in feed.entries[:50]:
                      title_text = clean_text(
                          item.get("title", "")
                      )

                      summary_text = clean_text(
                          re.sub(
                              r"<[^>]+>",
                              " ",
                              item.get("summary", "")
                          )
                      )

                      link_text = item.get("link", "")

                      if title_text and link_text:
                          # 同じ記事の重複を避ける
                          if not any(
                              a["link"] == link_text
                              for a in articles
                          ):
                              articles.append({
                                  "title": title_text,
                                  "summary": summary_text[:900],
                                  "link": link_text
                              })


              except Exception as e:
                  print(
                      "RESEARCH RSS ERROR:",
                      str(e)[:200]
                  )

          # テーマとの関連度が最も高い記事を選ぶ
          def topic_match_score(text):
              topic_clean = re.sub(
                  r"[\W_]+", "", topic.lower()
              )
              text_clean = re.sub(
                  r"[\W_]+", "", text.lower()
              )

              if not topic_clean or not text_clean:
                  return 0.0

              if (
                  topic_clean in text_clean
                  or text_clean in topic_clean
              ):
                  return 1.0

              topic_pairs = {
                  topic_clean[i:i + 2]
                  for i in range(len(topic_clean) - 1)
              }
              text_pairs = {
                  text_clean[i:i + 2]
                  for i in range(len(text_clean) - 1)
              }

              if not topic_pairs or not text_pairs:
                  return 0.0

              return len(
                  topic_pairs & text_pairs
              ) / len(topic_pairs | text_pairs)

          if articles:
              ranked_articles = sorted(
                  articles,
                  key=lambda item: topic_match_score(
                      item["title"]
                  ),
                  reverse=True
              )

              best_article = ranked_articles[0]
              best_score = topic_match_score(
                  best_article["title"]
              )

              print(
                  "BEST RESEARCH MATCH SCORE:",
                  round(best_score, 3)
              )

              if best_score >= 0.12:
                  article = best_article

                  print(
                      "RESEARCH ARTICLE:",
                      article["title"]
                  )

                  print(
                      "RESEARCH SOURCE:",
                      article["link"]
                  )
              else:
                  article = None
                  print(
