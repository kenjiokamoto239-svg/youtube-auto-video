name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Ollama
      # ==========================================
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &

          sleep 5

          ollama pull qwen2.5:1.5b


      # ==========================================
      # 毎回違うテーマ
      # ==========================================
      - name: Generate random topic
        run: |
          python - <<'PY'
          from pathlib import Path
          import random

          topics = [
              "習慣",
              "お金",
              "仕事",
              "人間関係",
              "時間の使い方",
              "健康",
              "自己成長",
              "読書",
              "メンタル",
              "ランニング",
              "人生",
              "節約",
              "集中力",
              "行動力",
              "睡眠",
              "スマホ",
              "40代の生き方",
              "介護の仕事術"
          ]

          angles = [
              "今日からできる小さな行動",
              "知らないと損する考え方",
              "多くの人がやってしまう失敗",
              "人生が少し楽になる方法",
              "忙しい人でも続けられる方法",
              "お金をかけずにできる方法",
              "やめるだけで変わること",
              "1日5分でできること",
              "仕事の効率を上げる方法",
              "将来の自分を助ける考え方"
          ]

          topic = random.choice(topics)
          angle = random.choice(angles)
          seed = random.randint(100000, 999999)

          Path("topic.txt").write_text(
              f"テーマ：{topic}\n"
              f"切り口：{angle}\n"
              f"乱数：{seed}\n",
              encoding="utf-8"
          )

          print(Path("topic.txt").read_text(encoding="utf-8"))
          PY


      # ==========================================
      # タイトルを独立して生成
      # ==========================================
      - name: Generate title
        run: |
          cat > title_prompt.txt <<'EOF'
          あなたはYouTubeショート動画のタイトル作成者です。

          topic.txtの内容を参考にしてください。

          条件：
          ・日本語
          ・18〜30文字程度
          ・視聴者が続きを見たくなる
          ・内容と関係する
          ・煽りすぎない
          ・自然な日本語
          ・疑問形でもよい
          ・タイトルだけ出力
          ・説明や前置きは禁止
          ・「タイトル：」も禁止
          ・絵文字禁止
          ・ハッシュタグ禁止
          EOF

          cat topic.txt >> title_prompt.txt

          ollama run qwen2.5:1.5b < title_prompt.txt > raw_title.txt

          python - <<'PY'
          from pathlib import Path
          import re

          title = Path(
              "raw_title.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          title = re.sub(
              r"^(タイトル|TITLE)\s*[:：]\s*",
              "",
              title,
              flags=re.I
          )

          title = title.splitlines()[0].strip()

          title = title.replace(
              '"', ''
          ).replace(
              "'", ''
          )

          title = title[:60].strip()

          if len(title) < 8:
              raise SystemExit(
                  f"タイトルが不自然です: {title}"
              )

          Path(
              "video_title.txt"
          ).write_text(
              title,
              encoding="utf-8"
          )

          print("TITLE:")
          print(title)
          PY


      # ==========================================
      # 台本を独立して生成
      # ==========================================
      - name: Generate script
        run: |
          cat > script_prompt.txt <<'EOF'
          あなたは日本語YouTubeショート動画の台本ライターです。

          topic.txtのテーマと切り口を使って、
          1本の完成したショート動画台本を書いてください。

          絶対条件：

          ・日本語だけ
          ・140〜220文字
          ・40〜60秒程度で話せる内容
          ・最初の1文で興味を引く
          ・具体例を1つ以上入れる
          ・内容を最後まで一貫させる
          ・最後は具体的な行動提案
          ・自然な日本語
          ・短い文章を中心にする
          ・句読点を正しく使う
          ・絵文字禁止
          ・ハッシュタグ禁止
          ・英語禁止
          ・タイトル禁止
          ・説明禁止
          ・「はい」「今回は」などの余計な前置き禁止

          出力するのは台本本文だけです。
          EOF

          cat topic.txt >> script_prompt.txt

          ollama run qwen2.5:1.5b < script_prompt.txt > raw_script.txt

          python - <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "raw_script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # AIが見出しを付けた場合に除去
          text = re.sub(
              r"^(SCRIPT|台本)\s*[:：]\s*",
              "",
              text,
              flags=re.I
          )

          # 改行整理
          text = re.sub(
              r"\s+",
              "",
              text
          )

          # 余計な引用符
          text = text.strip(
              '"「」『』'
          )

          # ハッシュタグ禁止
          text = re.sub(
              r"#\S+",
              "",
              text
          )

          # 220文字を超えた場合は句点で安全に切る
          if len(text) > 220:

              candidate = text[:220]

              positions = [
                  candidate.rfind("。"),
                  candidate.rfind("！"),
                  candidate.rfind("？")
              ]

              cut = max(positions)

              if cut >= 120:
                  text = candidate[:cut + 1]
              else:
                  text = candidate

          japanese_count = len(
              re.findall(
                  r"[ぁ-んァ-ヶ一-龠]",
                  text
              )
          )

          print("文字数:", len(text))
          print("日本語文字数:", japanese_count)
          print(text)

          if japanese_count < 80:
              raise SystemExit(
                  "日本語台本として不十分です"
              )

          if len(text) < 120:
              raise SystemExit(
                  "台本が短すぎます"
              )

          Path(
              "input_script.txt"
          ).write_text(
              text,
              encoding="utf-8"
          )
          PY


      # ==========================================
      # Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # パッケージ
      # ==========================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ==========================================
      # FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk


      # ==========================================
      # モデル
      # ==========================================
      - name: Prepare
        run: |
          mkdir -p model
          mkdir -p input
          mkdir -p output

          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          cp input_script.txt input/script.txt


      # ==========================================
      # 日本語TTS
      # ==========================================
      - name: Generate Japanese voice
        run: |
          cat > generate_tts.py <<'PY'
          from pathlib import Path
          import soundfile as sf
          from kokoro_onnx import Kokoro

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("TTS:")
          print(text)

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio, sample_rate = model.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          duration = len(audio) / sample_rate

          print(
              f"音声時間: {duration:.2f}秒"
          )

          if duration > 70:
              raise SystemExit(
                  "音声が70秒を超えたため公開中止"
              )

          if duration < 12:
              raise SystemExit(
                  "音声が短すぎるため公開中止"
              )
          PY

          python generate_tts.py


      # ==========================================
      # FFprobeで再確認
      # ==========================================
      - name: Validate audio
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.wav)

          echo "Audio duration: $DURATION"

          python - <<PY
          duration = float("$DURATION")

          if duration > 70:
              raise SystemExit(
                  f"音声異常: {duration}秒"
              )

          if duration < 12:
              raise SystemExit(
                  f"音声が短すぎます: {duration}秒"
              )
          PY


      # ==========================================
      # ASS字幕を生成
      # ==========================================
      - name: Generate ASS subtitles
        run: |
          cat > generate_ass.py <<'PY'
          from pathlib import Path
          import re
          import soundfile as sf

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          audio, sr = sf.read(
              "input/audio.wav"
          )

          duration = len(audio) / sr

          # 文ごとに分割
          sentences = [
              x.strip()
              for x in re.split(
                  r"(?<=[。！？])",
                  text
              )
              if x.strip()
          ]

          if not sentences:
              raise SystemExit(
                  "字幕文章がありません"
              )

          # 長い文は20文字前後で2行化
          display_sentences = []

          for sentence in sentences:

              if len(sentence) <= 20:
                  display_sentences.append(
                      sentence
                  )
                  continue

              middle = len(sentence) // 2

              candidates = []

              for i in range(
                  max(5, middle - 8),
                  min(
                      len(sentence) - 1,
                      middle + 8
                  )
              ):
                  if sentence[i] in "、。！？":
                      candidates.append(i)

              if candidates:
                  cut = min(
                      candidates,
                      key=lambda x: abs(
                          x - middle
                      )
                  )

                  display_sentences.append(
                      sentence[:cut + 1]
                      + "\\N"
                      + sentence[cut + 1:]
                  )
              else:
                  display_sentences.append(
                      sentence
                  )

          total_chars = sum(
              len(x.replace("\\N", ""))
              for x in display_sentences
          )

          def ass_time(seconds):
              total_cs = int(
                  round(seconds * 100)
              )

              h = total_cs // 360000
              total_cs %= 360000

              m = total_cs // 6000
              total_cs %= 6000

              s = total_cs // 100
              cs = total_cs % 100

              return (
                  f"{h}:{m:02d}:"
                  f"{s:02d}.{cs:02d}"
              )

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,4,0,2,80,80,500,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          events = []

          current = 0.0

          for i, sentence in enumerate(
              display_sentences
          ):

              clean = sentence.replace(
                  "\\N",
                  ""
              )

              part = (
                  duration
                  * len(clean)
                  / total_chars
              )

              start = current

              if i == len(
                  display_sentences
              ) - 1:
                  end = duration
              else:
                  end = current + part

              # ASS特殊文字を最低限処理
              subtitle = sentence.replace(
                  "{",
                  "\\{"
              ).replace(
                  "}",
                  "\\}"
              )

              events.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + subtitle
              )

              current = end

          Path(
              "input/subtitles.ass"
          ).write_text(
              header
              + "\n".join(events)
              + "\n",
              encoding="utf-8"
          )

          print(
              Path(
                  "input/subtitles.ass"
              ).read_text(
                  encoding="utf-8"
              )
          )
          PY

          python generate_ass.py


      # ==========================================
      # ASS字幕が本当に存在するか確認
      # ==========================================
      - name: Validate subtitles
        run: |
          test -s input/subtitles.ass

          grep -q "Dialogue:" input/subtitles.ass

          echo "字幕ファイルOK"


      # ==========================================
      # MP4生成
      # ==========================================
      - name: Generate MP4
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -i input/audio.wav \
            -vf "ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          test -s output/video.mp4


      # ==========================================
      # 完成動画検査
      # ==========================================
      - name: Validate final video
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/video.mp4)

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/video.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/video.mp4)

          echo "Video duration: $DURATION"
          echo "Video size: ${WIDTH}x${HEIGHT}"

          python - <<PY
          duration = float("$DURATION")
          width = int("$WIDTH")
          height = int("$HEIGHT")

          if duration > 70:
              raise SystemExit(
                  "動画が70秒を超えています"
              )

          if duration < 12:
              raise SystemExit(
                  "動画が短すぎます"
              )

          if width != 1080:
              raise SystemExit(
                  "横幅が1080ではありません"
              )

          if height != 1920:
              raise SystemExit(
                  "縦幅が1920ではありません"
              )

          print("動画検査OK")
          PY


      # ==========================================
      # YouTube公開
      # ==========================================
      - name: Upload to YouTube and publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          title = open(
              "video_title.txt",
              encoding="utf-8"
          ).read().strip()

          description = (
              "今日から実践できる考え方や習慣を紹介します。\n\n"
              "#習慣 #自己改善 #人生 #shorts"
          )

          body = {
              "snippet": {
                  "title": title[:90],
                  "description": description,
                  "tags": [
                      "習慣",
                      "自己改善",
                      "人生",
                      "仕事",
                      "自己成長",
                      "shorts"
                  ],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          response = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          ).execute()

          video_id = response["id"]

          print(
              "YouTube upload successful"
          )

          print(
              "Video ID:",
              video_id
          )

          published = youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public"
                  }
              }
          ).execute()

          print(
              "YouTube publish successful"
          )

          print(
              "URL:",
              "https://www.youtube.com/watch?v="
              + video_id
          )
          PY

          python upload_youtube.py


      # ==========================================
      # 成果物
      # ==========================================
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            input/subtitles.ass
            output/video.mp4
