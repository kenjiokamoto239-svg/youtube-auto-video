          # 検索語の重複を除去
          search_keywords = list(dict.fromkeys(
              category_keywords + fallback_keywords
          ))

          commons_api = "https://commons.wikimedia.org/w/api.php"
          bgm_found = False
          checked_titles = set()

          for keyword in search_keywords:
              if bgm_found:
                  break

              try:
                  print("BGM SEARCH:", keyword)

                  params = {
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": keyword,
                      "gsrnamespace": 6,
                      "gsrlimit": 50,
                      "prop": "imageinfo",
                      "iiprop": "url|extmetadata",
                      "format": "json",
                  }

                  response = requests.get(
                      commons_api,
                      params=params,
                      headers={
                          "User-Agent":
                              "AutoJapaneseVideo/1.0 (BGM search)"
                      },
                      timeout=30,
                  )
                  response.raise_for_status()

                  pages = (
                      response.json()
                      .get("query", {})
                      .get("pages", {})
                  )

                  candidates = list(pages.values())
                  random.shuffle(candidates)

                  print(
                      "BGM SEARCH RESULTS:",
                      keyword,
