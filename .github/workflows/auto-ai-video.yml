name: Auto AI Japanese Video

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "YouTube Analytics Auto Improvement"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. 最新のリポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Python環境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 動画生成に必要なソフトをインストール
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pillow google-api-python-client google-auth
          pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git"

      # 4. 分析データの存在と内容を確認
      - name: Load and validate analytics feedback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/analytics_feedback.json")

          if not path.exists():
              raise SystemExit(
                  "分析データがありません。先にYouTube Analytics Auto Improvementを実行してください。"
              )

          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "trend",
              "top_videos_by_lifetime_views",
              "updated_at_jst"
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "分析データに必要な項目がありません: "
                  + ", ".join(missing)
              )

          print("分析データの読み込みに成功")
          print("更新日時:", data.get("updated_at_jst"))
          print("チャンネル傾向:", data.get("trend"))
          print(
              "上位動画数:",
              len(data.get("top_videos_by_lifetime_views", []))
          )
          PY

      # 5. Ollamaをインストール
      - name: Install Ollama and model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &

          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          ollama pull qwen2.5:1.5b

      - name: Prepare folders
        run: mkdir -p input output model

      # 6. 分析結果からテーマを選び、台本とタイトルを生成
      - name: Generate topic, script and title from analytics
        run: |
          python - <<'PY'
          import json
          import random
          import re
          import subprocess
          import unicodedata
          from pathlib import Path

          feedback = json.loads(
              Path("data/analytics_feedback.json").read_text(
                  encoding="utf-8"
              )
          )

          groups = {
              "朝の習慣を変える方法": ["朝", "早起き", "朝活"],
              "継続できる人の共通点": ["継続", "習慣", "続ける"],
              "仕事で疲れすぎない考え方": ["仕事", "職場", "介護"],
              "お金を無駄にしない習慣": ["お金", "節約", "投資", "貯金"],
              "運動を続けるための考え方": ["運動", "ランニング", "走る", "健康"],
              "時間を有効に使う方法": ["時間", "効率"],
              "やる気に頼らず行動する方法": ["行動", "やる気"],
              "失敗したときの考え方": ["失敗", "挑戦"],
              "人間関係で疲れない考え方": ["人間関係", "人付き合い"],
              "スマホ時間を減らす方法": ["スマホ"],
              "集中力を高める習慣": ["集中", "勉強"],
              "今日の名言とその意味": ["名言", "言葉"],
              "岡山の介護ニュース": ["岡山", "介護"],
              "三重県熊野市のニュース": ["熊野", "三重"],
              "人生を少し良くする習慣": ["人生", "習慣"]
          }

          scores = {name: 0.0 for name in groups}

          videos = feedback.get(
              "top_videos_by_lifetime_views", []
          )

          for video in videos:
              title = str(video.get("title", ""))
              views = float(video.get("views", 0) or 0)
              likes = float(video.get("likes", 0) or 0)
              comments = float(video.get("comments", 0) or 0)

              score = views + likes * 5 + comments * 3

              for candidate, keywords in groups.items():
                  if any(word in title for word in keywords):
                      scores[candidate] += score

          leaders = [
              name
              for name, score in sorted(
                  scores.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:3]
              if score > 0
          ]

          if leaders:
              topic = random.choice(leaders)
              print("分析から選んだテーマ候補:", leaders)
          else:
              topic = random.choice(list(groups))
              print("一致する過去動画がないため、通常選択:", topic)

          trend = feedback.get("trend", "分析データなし")

          def ask_model(prompt, timeout=150):
              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  capture_output=True,
                  text=True,
                  timeout=timeout,
                  check=True
              )
              return result.stdout.strip()

          def clean(text):
              text = unicodedata.normalize("NFKC", text)
              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(
                  r"^(タイトル|台本|本文|説明|ナレーション)\s*[:：]\s*",
                  "",
                  text,
                  flags=re.MULTILINE
              )
              text = re.sub(r"\s+", "", text)
              return text.strip("「」『』\"'")

          fallback = (
              "新しいことを始めるとき、最初から完璧を目指す必要はありません。"
              "大切なのは、今日できる小さな行動を一つ決めることです。"
              "五分だけ歩く、机の上を片付ける、寝る前に本を読む。"
              "小さな行動でも、続けることで毎日の過ごし方は変わります。"
              "まずは今日、できそうなことを一つ選んで始めてみましょう。"
          )

          # ニュースは別途記事取得・事実確認を実装するまで、
          # 実際に起きた出来事として捏造しない。
          if topic in (
              "岡山の介護ニュース",
              "三重県熊野市のニュース"
          ):
              script = (
                  "地域のニュースを確認するときは、発表日と発信元を確かめることが大切です。"
                  "見出しだけで判断せず、自治体や報道機関の本文まで確認しましょう。"
                  "情報が古くなっていないか、複数の情報と食い違いがないかも確認します。"
                  "正確な情報を選ぶことが、地域を知る第一歩です。"
              )
              title = topic + "｜情報を確認するポイント"

          else:
              try:
                  script = clean(ask_model(
                      f"日本語のYouTube Shorts用ナレーションを作成。"
                      f"テーマ:{topic}。チャンネル傾向:{trend}。"
                      "140〜220文字を目安にする。"
                      "具体例を入れ、自然な日本語にする。"
                      "ナレーション本文だけを出力する。"
                      "タイトルや説明文は含めない。"
                      "同じ文を繰り返さない。"
                      "確認できない数字や実在人物の発言を捏造しない。"
                  ))

                  if (
                      len(script) < 80
                      or len(script) > 260
                      or len(set(script)) < 12
                  ):
                      script = fallback

              except Exception as error:
                  print("台本生成エラー:", error)
                  script = fallback

              try:
                  title = clean(ask_model(
                      f"YouTube Shortsのタイトルを1つ作成。"
                      f"テーマ:{topic}。台本:{script}。"
                      "40文字以内。タイトルだけを出力する。"
                      "台本や説明文は出力しない。",
                      90
                  ))

                  if (
                      len(title) < 5
                      or len(title) > 40
                      or any(word in title for word in [
                          "タイトル", "台本", "説明文"
                      ])
                  ):
                      title = topic

              except Exception as error:
                  print("タイトル生成エラー:", error)
                  title = topic

          Path("input/topic.txt").write_text(
              topic, encoding="utf-8"
          )
          Path("input/title.txt").write_text(
              title, encoding="utf-8"
          )
          Path("input/script.txt").write_text(
              script, encoding="utf-8"
          )

          print("テーマ:", topic)
          print("タイトル:", title)
          print("台本文字数:", len(script))
          print("分析更新日時:", feedback.get("updated_at_jst"))
          PY

      # 7. 日本語音声モデルを取得
      - name: Download Japanese voice model
        run: |
          curl -fL --retry 3 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -o model/kokoro-v1.0.int8.onnx

          curl -fL --retry 3 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -o model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

      # 8. 日本語音声と字幕の時間情報を生成
      - name: Generate Japanese audio and subtitle timings
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro

          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          chunks = []

          for sentence in re.split(r"(?<=[。！？])", script):
              sentence = sentence.strip()

              while len(sentence) > 18:
                  cut = 15

                  for mark in ["、", "。", "！", "？"]:
                      pos = sentence.rfind(mark, 0, 17)
                      if pos >= 7:
                          cut = pos + 1
                          break

                  chunks.append(sentence[:cut])
                  sentence = sentence[cut:]

              if sentence:
                  chunks.append(sentence)

          if not chunks:
              raise RuntimeError("台本が空です")

          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          parts = []
          segments = []
          sample_rate = None
          cursor = 0.0

          for index, phrase in enumerate(chunks):
              audio, rate = kokoro.create(phrase)
              audio = np.asarray(audio, dtype=np.float32).reshape(-1)

              if sample_rate is None:
                  sample_rate = int(rate)

              if int(rate) != sample_rate:
                  raise RuntimeError("音声サンプルレートが変わりました")

              start = cursor
              parts.append(audio)
              cursor += len(audio) / sample_rate

              segments.append({
                  "text": phrase,
                  "start": start,
                  "end": cursor
              })

              if index < len(chunks) - 1:
                  silence = np.zeros(
                      int(sample_rate * 0.08),
                      dtype=np.float32
                  )
                  parts.append(silence)
                  cursor += len(silence) / sample_rate

          sf.write(
              "input/audio.wav",
              np.concatenate(parts),
              sample_rate
          )

          Path("input/segments.json").write_text(
              json.dumps(segments, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("音声の長さ:", round(cursor, 2), "秒")
          PY

      # 9. 背景画像を作成
      - name: Create background
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw

          width, height = 1080, 1920
          image = Image.new("RGB", (width, height))
          draw = ImageDraw.Draw(image)

          for y in range(height):
              ratio = y / height
              draw.line(
                  (0, y, width, y),
                  fill=(
                      int(8 + 18 * ratio),
                      int(16 + 25 * ratio),
                      int(38 + 48 * ratio)
                  )
              )

          for x, y, radius in [
              (180, 300, 220),
              (900, 650, 300),
              (500, 1300, 350)
          ]:
              draw.ellipse(
                  (x-radius, y-radius, x+radius, y+radius),
                  outline=(55, 85, 130),
                  width=5
              )

          image.save("input/background.png")
          PY

      # 10. 中央字幕を作成
      - name: Create centered subtitles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          segments = json.loads(
              Path("input/segments.json").read_text(
                  encoding="utf-8"
              )
          )

          def ts(seconds):
              n = max(0, int(round(float(seconds) * 100)))
              hours = n // 360000
              minutes = (n % 360000) // 6000
              secs = (n % 6000) // 100
              centis = n % 100
              return f"{hours}:{minutes:02d}:{secs:02d}.{centis:02d}"

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,Noto Sans CJK JP,82,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,5,2,5,55,55,0,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """

          lines = [header]

          for seg in segments:
              text = str(seg["text"]).replace("{", "").replace("}", "")

              if len(text) > 12:
                  middle = len(text) // 2
                  text = text[:middle] + r"\N" + text[middle:]

              lines.append(
                  f"Dialogue: 0,{ts(seg['start'])},{ts(seg['end'])},"
                  f"Default,,0,0,0,,{{\\an5\\pos(540,960)}}{text}\n"
              )

          Path("input/subtitles.ass").write_text(
              "".join(lines),
              encoding="utf-8"
          )
          PY

      # 11. 縦型動画を生成
      - name: Render vertical video
        run: |
          ffmpeg -y \
            -loop 1 -framerate 30 -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 -preset veryfast -crf 23 \
            -r 30 -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            -shortest -movflags +faststart \
            output/video.mp4

      # 12. 動画の品質を検証
      - name: Validate video
        run: |
          python - <<'PY'
          import subprocess

          def probe(args):
              return subprocess.check_output(
                  args,
                  text=True
              ).strip()

          duration = float(probe([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "output/video.mp4"
          ]))

          video = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,width,height",
              "-of", "csv=p=0",
              "output/video.mp4"
          ]).split(",")

          audio = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "a:0",
              "-show_entries", "stream=codec_name",
              "-of", "csv=p=0",
              "output/video.mp4"
          ])

          if not 5 <= duration <= 60:
              raise SystemExit(
                  f"動画の長さが範囲外です: {duration:.2f}秒"
              )

          if video != ["h264", "1080", "1920"]:
              raise SystemExit(
                  f"映像形式が不正です: {video}"
              )

          if audio != "aac":
              raise SystemExit(
                  f"音声形式が不正です: {audio}"
              )

          print(f"動画検証成功: {duration:.2f}秒")
          PY

      # 13. YouTubeへアップロードして公開
      - name: Upload private then publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]

          if not all(os.environ.get(key) for key in required):
              raise RuntimeError(
                  "YouTube OAuth Secretsが設定されていません"
              )

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          title = Path("input/title.txt").read_text(
              encoding="utf-8"
          ).strip()[:100]

          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          result = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": script + "\n\n#Shorts",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload(
                  "output/video.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )
          ).execute()

          video_id = result["id"]
          print("非公開でアップロード:", video_id)

          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print(
              "公開URL: https://www.youtube.com/shorts/"
              + video_id
          )
          PY

      # 14. 動画・分析情報・台本を保存
      - name: Save video and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-and-diagnostics
          path: |
            output/video.mp4
            data/analytics_feedback.json
            input/topic.txt
            input/title.txt
            input/script.txt
            input/audio.wav
            input/background.png
            input/subtitles.ass
            input/segments.json
          if-no-files-found: error
          retention-days: 30
