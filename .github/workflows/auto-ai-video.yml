          python upload_video.py

      # 5. 動画と台本を保存
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            work/video.mp4
            work/voice.mp3
            work/title.txt
            work/script.txt
            work/subtitles.ass
            work/background.jpg
          if-no-files-found: ignore
          retention-days: 7
