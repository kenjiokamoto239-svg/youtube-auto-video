name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: auto-ai-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pip
          python -m pip install --upgrade pip
          pip install pillow numpy soundfile

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b

      - name: Generate topic, title and script
        timeout-minutes: 5
        run: |
          mkdir -p work output

          python - <<'PY'
          import json, urllib.request, re

          topics = [
              "運動を続けるコツ",
              "人生を変える小さな習慣",
              "お金を貯める考え方",
              "健康を守る生活習慣",
              "仕事の効率を上げる方法",
              "有名人の言葉から学ぶ教訓",
              "ランニング初心者の注意点",
              "今日からできる自己改善"
          ]

          import random
          topic = random.choice(topics)

          def ask(prompt, timeout=90):
              data = json.dumps({
                  "model": "qwen2.5:1.5b",
                  "prompt": prompt,
                  "stream": False,
                  "options": {"temperature": 0.7}
              }).encode()
              req = urllib.request.Request(
                  "http://localhost:11434/api/generate",
                  data=data,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())["response"].strip()

          try:
              title = ask(
                  f"テーマ「{topic}」の日本語YouTube Shortsタイトルを"
                  "1つだけ作成。30文字以内。説明や引用符は不要。"
              )
              title = title.splitlines()[0].strip('「」" ')
              title = re.sub(r'^(タイトル|Title)\s*[:：]\s*', '', title)
              title = title[:45]
          except Exception:
              title = topic

          prompt = f"""
          日本語のショート動画用ナレーション原稿を作成してください。
          テーマ：{topic}

          条件：
          ・自然な日本語で書く
          ・冒頭で視聴者の興味を引く
          ・具体的な説明や例を入れる
          ・最後に実行できる行動を提案する
          ・最後の文まで完全に書き切る
          ・句読点「、」「。」を適切に使う
          ・タイトルや説明文、見出しは書かない
          ・箇条書きや番号は使わない
          ・日本語で約300〜450文字
          ・原稿本文だけを出力する
          """

          try:
              script = ask(prompt, 120)
          except Exception:
              script = ""

          script = re.sub(r'[\x00-\x1f]', '', script)
          script = script.replace("�", "")
          script = re.sub(r'^(タイトル|原稿|本文)\s*[:：]\s*', '', script)
          script = script.strip(' \n\t「」"')

          if len(script) < 100 or "�" in script:
              script = (
                  "新しい習慣を身につけるには、最初から完璧を目指さないことが大切です。"
                  "たとえば運動を始めるなら、毎日長い時間を頑張る必要はありません。"
                  "まずは短い時間でも、無理なく続けられる方法を選びましょう。"
                  "小さな行動を繰り返すことで、少しずつ生活の中に定着していきます。"
                  "できなかった日があっても、自分を責めずに次の日から再開すれば大丈夫です。"
                  "今日できる小さな一歩を決めて、まずは実際に行動してみましょう。"
              )

          script = re.sub(r'\s+', '', script)

          if script and script[-1] not in "。！？":
              script += "。"

          with open("work/title.txt", "w", encoding="utf-8") as f:
              f.write(title)

          with open("work/script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          with open("work/topic.txt", "w", encoding="utf-8") as f:
              f.write(topic)

          print("テーマ:", topic)
          print("タイトル:", title)
          print("原稿文字数:", len(script))
          PY

      - name: Install Japanese TTS
        run: |
          pip install kokoro-onnx soundfile numpy

      - name: Generate Japanese voice
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import os
          import soundfile as sf
          from kokoro_onnx import Kokoro

          os.makedirs("work", exist_ok=True)

          model_url = (
              "https://github.com/thewh1teagle/kokoro-onnx/"
              "releases/download/model-files/kokoro-v1.0.onnx"
          )
          voice_url = (
              "https://github.com/thewh1teagle/kokoro-onnx/"
              "releases/download/model-files/voices-v1.0.bin"
          )

          import urllib.request

          for url, path in [
              (model_url, "work/kokoro.onnx"),
              (voice_url, "work/voices.bin")
          ]:
              if not os.path.exists(path):
                  urllib.request.urlretrieve(url, path)

          with open("work/script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          kokoro = Kokoro("work/kokoro.onnx", "work/voices.bin")

          samples, sample_rate = kokoro.create(
              text,
              voice="jf_alpha",
              speed=1.0,
              lang="ja"
          )

          sf.write("work/audio.wav", samples, sample_rate)

          info = sf.info("work/audio.wav")
          print("音声時間:", info.duration)

          if info.duration < 8 or info.duration > 180:
              raise RuntimeError("音声の長さが想定範囲外です")
          PY

      - name: Create moving background
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math, random

          W, H = 1080, 1920
          img = Image.new("RGB", (W, H))
          pix = img.load()

          for y in range(H):
              t = y / H
              for x in range(W):
                  glow = max(
                      0,
                      1 - math.sqrt(
                          ((x - 780) / 900) ** 2 +
                          ((y - 500) / 1000) ** 2
                      )
                  )
                  pix[x, y] = (
                      int(7 + 12 * glow),
                      int(15 + 18 * glow),
                      int(35 + 45 * (1 - t) + 40 * glow)
                  )

          overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          random.seed(24)

          for _ in range(65):
              x = random.randint(0, W)
              y = random.randint(0, H)
              r = random.randint(3, 12)
              draw.ellipse(
                  (x-r, y-r, x+r, y+r),
                  fill=(90, 170, 255, random.randint(20, 70))
              )

          overlay = overlay.filter(ImageFilter.GaussianBlur(5))
          img = Image.alpha_composite(
              img.convert("RGBA"), overlay
          ).convert("RGB")

          img.save("work/background.png")
          PY

      - name: Create large centered subtitles
        run: |
          python - <<'PY'
          import re, soundfile as sf

          with open("work/script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          duration = sf.info("work/audio.wav").duration

          # まず「。」で文章を分ける
          sentences = re.findall(r'[^。！？]+[。！？]?', text)
          sentences = [s.strip() for s in sentences if s.strip()]

          # 長い文は読みやすい長さに分割
          units = []
          for sentence in sentences:
              while len(sentence) > 22:
                  cut = 18
                  for p in ("、", "。", "！", "？"):
                      pos = sentence.rfind(p, 8, 22)
                      if pos >= 8:
                          cut = pos + 1
                          break
                  units.append(sentence[:cut])
                  sentence = sentence[cut:]
              if sentence:
                  units.append(sentence)

          # 2行以内にする
          captions = []
          for unit in units:
              if len(unit) <= 12:
                  captions.append(unit)
              else:
                  captions.append(unit[:12] + r"\N" + unit[12:])

          # ASS字幕を生成
          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,84,&H00FFFFFF,&H000000FF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,5,1,5,90,90,90,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          import textwrap
          header = textwrap.dedent(header)

          def ts(t):
              h = int(t // 3600)
              m = int((t % 3600) // 60)
              s = t % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          # 表示時間を文字数に応じて配分
          weights = [max(1, len(c.replace(r"\N", ""))) for c in captions]
          total = sum(weights)
          current = 0.0
          events = []

          for cap, weight in zip(captions, weights):
              start = current
              current += duration * weight / total
              end = min(duration, current)

              cap = cap.replace("{", "").replace("}", "")
              events.append(
                  f"Dialogue: 0,{ts(start)},{ts(end)},Default,,0,0,0,,{cap}"
              )

          with open("work/subtitles.ass", "w", encoding="utf-8") as f:
              f.write(header + "\n".join(events) + "\n")

          print("字幕数:", len(captions))
          print("字幕フォントサイズ: 84")
          print("字幕位置: 中央")
          PY

      - name: Render vertical video with moving background
        run: |
          ffmpeg -y \
            -loop 1 -framerate 30 -i work/background.png \
            -i work/audio.wav \
            -vf "zoompan=z='min(zoom+0.00025,1.08)':d=1:s=1080x1920:fps=30,ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 21 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output/video.mp4

      - name: Validate output video
        run: |
          set -e

          ffprobe -v error \
            -show_entries stream=codec_name,width,height \
            -of json output/video.mp4 > work/probe.json

          python - <<'PY'
          import json, subprocess

          with open("work/probe.json") as f:
              data = json.load(f)

          streams = data["streams"]
          video = next(s for s in streams if s["codec_name"] == "h264")
          audio = next(s for s in streams if s["codec_name"] == "aac")

          assert video["width"] == 1080, video
          assert video["height"] == 1920, video

          result = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "output/video.mp4"
          ], text=True)

          duration = float(result.strip())
          assert duration >= 8, duration

          print("動画検証成功")
          print("解像度:", video["width"], "x", video["height"])
          print("動画時間:", duration)
          PY

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            output/video.mp4
            work/title.txt
            work/script.txt
            work/audio.wav
            work/subtitles.ass
          retention-days: 7
