name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          ollama list

      - name: Pull AI model
        run: |
          timeout 300s ollama pull qwen2.5:1.5b

      - name: Prepare folders
        run: |
          mkdir -p input output model

      - name: Generate topic
        shell: python
        run: |
          import random
          from pathlib import Path

          topics = [
              "朝の習慣を変える方法",
              "人生を少し楽にする考え方",
              "継続できる人の共通点",
              "仕事で疲れすぎない考え方",
              "お金を無駄にしない習慣",
              "運動を続けるための考え方",
              "時間を増やすシンプルな方法",
              "やる気に頼らず行動する方法",
              "失敗したときの考え方",
              "毎日を少し良くする習慣",
              "人間関係で疲れない考え方",
              "スマホ時間を減らす方法",
              "集中力を高める簡単な習慣",
              "自分を変えるためにやめること",
              "人生で大切な時間の使い方"
          ]

          topic = random.choice(topics)
          Path("input/topic.txt").write_text(topic, encoding="utf-8")
          print("テーマ:", topic)

      - name: Generate title
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()
          fallback = "今日から人生を少し良くする習慣"

          prompt = f"""
          YouTube Shortsのタイトルを1つ作ってください。
          テーマ：{topic}
          日本語のみ。短く自然に。
          タイトル本文だけを出力。
          説明、ナレーション、見出し、数字、英語は禁止。
          """

          try:
              r = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt, capture_output=True,
                  text=True, timeout=90, check=True
              )
              title = r.stdout.strip()
          except Exception as e:
              print("タイトル生成失敗:", e)
              title = fallback

          title = re.sub(r"https?://\S+", "", title)
          title = re.sub(r"^[#>*・\-\s]*", "", title)
          title = re.sub(r"^(タイトル|動画タイトル)\s*[:：]?\s*", "", title)
          title = re.sub(r"[A-Za-z0-9０-９]", "", title)
          title = re.sub(r"[�□☒☐■▯▪▫]", "", title)
          title = re.sub(r"\s+", "", title)
          title = title.strip("「」『』\"'")

          if len(title) < 5:
              title = fallback

          title = title[:30]
          Path("input/title.txt").write_text(title, encoding="utf-8")
          print("YouTubeタイトル:", title)

      - name: Generate script
        shell: python
        run: |
          import subprocess
          import re
          import unicodedata
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()
          title = Path("input/title.txt").read_text(encoding="utf-8").strip()

          fallback = (
              "毎日を変えたいなら、最初から大きなことをする必要はありません。"
              "大切なのは、今日できる小さな行動を一つ決めることです。"
              "例えば、五分だけ歩く。机の上を片付ける。"
              "そんな小さな行動でも、続ければ少しずつ変化が生まれます。"
              "最初から完璧を目指さなくて大丈夫です。"
              "今日できることを一つ選び、まずは始めてみましょう。"
          )

          prompt = f"""
          日本語のYouTube Shorts用ナレーション台本を書いてください。
          テーマ：{topic}

          重要：
          タイトルや説明文は出力しない。
          実際に読み上げる本文だけを書く。
          140文字から220文字程度。
          自然な会話調にする。
          「、」「。」を意味の区切りに適切に使う。
          冒頭でテーマを提示し、理由や具体例を説明し、
          最後に実践できることや結論で締める。
          文の途中で終わらせない。
          最後の文は必ず完結させる。
          見出し、箇条書き、数字、英語、URL、特殊文字は禁止。
          """

          try:
              r = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt, capture_output=True,
                  text=True, timeout=120, check=True
              )
              raw = r.stdout.strip()
          except Exception as e:
              print("台本生成失敗:", e)
              raw = fallback

          def clean(text):
              text = unicodedata.normalize("NFKC", text)
              text = re.sub(r"https?://\S+", "", text)
              lines = []

              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue

                  if re.match(
                      r"^(タイトル|動画タイトル|説明文|説明|"
                      r"ナレーション|台本|本文|テーマ)\s*[:：]",
                      line
                  ):
                      continue

                  line = re.sub(r"^[#>*•・\-－―]+\s*", "", line)
                  lines.append(line)

              text = "".join(lines)

              if title and len(title) >= 8:
                  text = text.replace(title, "")

              text = re.sub(r"[�□☒☐■▯▪▫]", "", text)
              text = re.sub(r"[A-Za-z0-9０-９]", "", text)

              allowed = (
                  "ぁ-んァ-ヶ一-龯々"
                  "。、「」『』！？：；，、・…〜ー"
                  "（）【】［］ "
              )

              text = "".join(
                  c for c in text
                  if re.fullmatch(f"[{allowed}]", c)
              )

              text = re.sub(r"\s+", "", text)
              text = re.sub(r"、{2,}", "、", text)
              text = re.sub(r"。{2,}", "。", text)
              return text.strip()

          script = clean(raw)

          if len(script) < 80 or not re.search(r"[。！？]$", script):
              script = clean(fallback)

          if len(script) > 230:
              sentences = re.split(r"(?<=[。！？])", script)
              result = ""
              for sentence in sentences:
                  if len(result) + len(sentence) > 220:
                      break
                  result += sentence
              script = result

          if len(script) < 50 or not re.search(r"[。！？]$", script):
              raise SystemExit("台本が短いか、完結していません")

          Path("input/script.txt").write_text(script, encoding="utf-8")
          print("最終台本:", script)
          print("文字数:", len(script))

      - name: Validate script
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path("input/script.txt").read_text(encoding="utf-8").strip()

          if len(text) < 50:
              raise SystemExit("台本が短すぎます")

          if not re.search(r"[。！？]$", text):
              raise SystemExit("台本が完結していません")

          if re.search(r"[�□☒☐■▯▪▫]", text):
              raise SystemExit("台本に文字化け候補があります")

          if re.search(r"[A-Za-z0-9０-９]", text):
              raise SystemExit("台本に英数字が残っています")

          if re.search(
              r"^(タイトル|動画タイトル|説明|説明文|ナレーション|台本|本文)\s*[:：]",
              text
          ):
              raise SystemExit("台本にラベルが残っています")

          print("台本検証OK")
          print(text)

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git"
          pip install soundfile numpy pillow google-api-python-client google-auth google-auth-oauthlib

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Download Kokoro model
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx -O model/kokoro-v1.0.int8.onnx
          wget -q https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin -O model/jf_alpha.bin
          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

      - name: Generate Japanese voice
        shell: python
        run: |
          from pathlib import Path
          import soundfile as sf
          from kokoro_onnx import Kokoro

          text = Path("input/script.txt").read_text(encoding="utf-8").strip()
          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio, sample_rate = kokoro.create(text)
          sf.write("input/audio.wav", audio, sample_rate)
          print("音声生成完了:", sample_rate)

      - name: Validate audio
        shell: python
        run: |
          import subprocess

          r = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "input/audio.wav"
          ], capture_output=True, text=True, check=True)

          duration = float(r.stdout.strip())
          print("音声時間:", duration)

          if duration < 8 or duration > 70:
              raise SystemExit("音声時間が範囲外です")

      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw

          w, h = 1080, 1920
          image = Image.new("RGB", (w, h))
          draw = ImageDraw.Draw(image)

          for y in range(h):
              ratio = y / h
              color = (
                  int(20 + 35 * ratio),
                  int(25 + 30 * ratio),
                  int(55 + 75 * ratio)
              )
              draw.line((0, y, w, y), fill=color)

          for cx, cy, radius in [
              (120, 260, 280),
              (850, 650, 380),
              (540, 1450, 500),
              (150, 1750, 250)
          ]:
              draw.ellipse(
                  (cx-radius, cy-radius, cx+radius, cy+radius),
                  outline=(100, 110, 170),
                  width=5
              )

          image.save("input/background.png")
          print("背景生成完了")

      - name: Generate subtitles
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          text = Path("input/script.txt").read_text(encoding="utf-8").strip()

          r = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "input/audio.wav"
          ], capture_output=True, text=True, check=True)

          duration = float(r.stdout.strip())

          # 文単位に分ける
          sentences = [
              s.strip() for s in re.split(r"(?<=[。！？])", text)
              if s.strip()
          ]

          # 1行12文字程度に分割し、字幕の横幅を抑える
          lines = []
          for sentence in sentences:
              while len(sentence) > 12:
                  cut = 12
                  for p in ("、", "。", "！", "？"):
                      pos = sentence.rfind(p, 0, 12)
                      if pos >= 6:
                          cut = pos + 1
                          break
                  lines.append(sentence[:cut])
                  sentence = sentence[cut:]
              if sentence:
                  lines.append(sentence)

          # 2行ずつまとめる
          captions = []
          i = 0
          while i < len(lines):
              first = lines[i]
              second = lines[i + 1] if i + 1 < len(lines) else ""
              i += 2
              captions.append(first + (r"\N" + second if second else ""))

          weights = [max(1, len(c.replace(r"\N", ""))) for c in captions]
          total = sum(weights) or 1

          def stamp(t):
              h = int(t // 3600)
              m = int((t % 3600) // 60)
              s = int(t % 60)
              cs = int((t - int(t)) * 100)
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          ass = """[Script Info]
          ScriptType: v4.00+
          WrapStyle: 2
          PlayResX: 1080
          PlayResY: 1920
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,4,2,5,100,100,0,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """

          current = 0.0
          for caption, weight in zip(captions, weights):
              span = duration * weight / total
              start = current
              end = current + span

              safe = caption.replace("{", "").replace("}", "")
              ass += (
                  f"Dialogue: 0,{stamp(start)},{stamp(end)},"
                  f"Default,,0,0,0,,{safe}\n"
              )
              current = end

          Path("input/subtitles.ass").write_text(ass, encoding="utf-8")
          print("中央字幕を生成:", len(captions), "枚")

      - name: Validate subtitles
        shell: python
        run: |
          from pathlib import Path

          text = Path("input/subtitles.ass").read_text(encoding="utf-8")

          for char in ["�", "□", "☒", "☐", "■", "▯", "▪", "▫"]:
              if char in text:
                  raise SystemExit(f"字幕に特殊文字があります: {char}")

          if "Alignment,MarginL" not in text:
              raise SystemExit("字幕スタイルを確認できません")

          print("字幕検証OK")

      - name: Generate MP4
        run: |
          ffmpeg -y \
            -loop 1 -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 -preset veryfast -crf 23 \
            -r 30 -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            -shortest -movflags +faststart \
            output/video.mp4

      - name: Validate final video
        shell: python
        run: |
          import subprocess

          def probe(args):
              return subprocess.check_output(args, text=True).strip()

          duration = float(probe([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "output/video.mp4"
          ]))

          video = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,width,height",
              "-of", "csv=p=0",
              "output/video.mp4"
          ]).split(",")

          audio = probe([
              "ffprobe", "-v", "error",
              "-select_streams", "a:0",
              "-show_entries", "stream=codec_name",
              "-of", "csv=p=0",
              "output/video.mp4"
          ])

          codec = video[0]
          width = int(video[1])
          height = int(video[2])

          print("動画時間:", duration)
          print("映像:", video)
          print("音声:", audio)

          if not 8 <= duration <= 70:
              raise SystemExit("動画時間が範囲外です")

          if (width, height) != (1080, 1920):
              raise SystemExit("動画サイズが1080x1920ではありません")

          if codec != "h264" or audio != "aac":
              raise SystemExit("映像または音声の形式が不正です")

          print("最終動画検証OK")

      - name: Upload to YouTube
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          title = Path("input/title.txt").read_text(encoding="utf-8").strip()

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"]
          )

          youtube = build("youtube", "v3", credentials=credentials)

          body = {
              "snippet": {
                  "title": title,
                  "description": "自動生成された日本語ショート動画です。",
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          response = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          ).execute()

          video_id = response["id"]
          print("アップロード完了:", video_id)

          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {"privacyStatus": "public"}
              }
          ).execute()

          print("YouTube公開完了:", video_id)

      - name: Upload video artifact
        uses: actions/upload-artifact@v6
        with:
          name: generated-video
          path: |
            output/video.mp4
            input/script.txt
            input/title.txt
            input/audio.wav
            input/subtitles.ass
