name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
                    python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help
            

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

                    # 4. 投稿時間に応じてジャンルを選択
          # 1日6本の投稿スケジュールは変更しない

          now = datetime.now()
          hour = now.hour

          genre_schedule = {
              8: {
                  "name": "ニュース・時事問題",
                  "topic": "最新ニュースを独自の視点で解説する"
              },
              12: {
                  "name": "お金・投資",
                  "topic": "お金、投資、貯蓄、消費行動の盲点を考える"
              },
              15: {
                  "name": "自己改善・習慣",
                  "topic": "努力、習慣、集中力、成功の考え方を考える"
              },
              18: {
                  "name": "健康・ランニング",
                  "topic": "運動、ランニング、健康習慣の常識を考える"
              },
              20: {
                  "name": "名言・人生論",
                  "topic": "名言や人生の教訓を現代的な視点から考える"
              },
              22: {
                  "name": "仕事・社会",
                  "topic": "働き方、賃金、会社、社会の仕組みを批判的に考える"
              }
          }

          if hour in genre_schedule:
              selected = genre_schedule[hour]
          else:
              # 手動実行など、通常の投稿時刻以外は
              # ニュース以外も含めてランダムに選ぶ
              selected = random.choice(
                  list(genre_schedule.values())
              )

          category = selected["name"]
          topic = selected["topic"]

          print("VIDEO GENRE:", category)
          print("TOPIC:", topic)
          print("JAPAN TIME:", now.isoformat())

          # 5. ニュースジャンルの場合だけニュースを取得
          # それ以外のジャンルではニュースに依存しない

          article = None

          if category == "ニュース・時事問題":

              feeds = [
                  ("国内ニュース", "日本 国内 ニュース"),
                  ("経済ニュース", "日本 経済 賃金 物価 ニュース"),
                  ("介護・社会保障", "介護 社会保障 制度 ニュース"),
                  ("岡山・介護", "岡山 介護 福祉 ニュース"),
                  ("三重県熊野市", "三重県 熊野市 ニュース")
              ]

              random.shuffle(feeds)

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(compatible; AutoJapaneseVideo/1.0)"
                  )
              }

              articles = []

              for feed_name, query in feeds:
                  rss_url = (
                      "https://news.google.com/rss/search?q="
                      + quote(query, safe="")
                      + "&hl=ja&gl=JP&ceid=JP:ja"
                  )

                  try:
                      print("RSS TRY:", feed_name)

                      response = requests.get(
                          rss_url,
                          headers=headers,
                          timeout=30
                      )

                      response.raise_for_status()

                      feed = feedparser.parse(
                          response.content
                      )

                      for item in feed.entries[:15]:
                          title_text = clean_text(
                              item.get("title", "")
                          )

                          summary_text = clean_text(
                              item.get("summary", "")
                          )

                          summary_text = re.sub(
                              r"<[^>]+>",
                              " ",
                              summary_text
                          )

                          summary_text = clean_text(
                              summary_text
                          )

                          link_text = item.get(
                              "link", ""
                          )

                          if title_text and link_text:
                              articles.append({
                                  "title": title_text,
                                  "summary": summary_text[:700],
                                  "link": link_text
                              })

                      if articles:
                          print(
                              "RSS SUCCESS:",
                              feed_name,
                              "COUNT:",
                              len(articles)
                          )
                          break

                  except Exception as e:
                      print(
                          "RSS ERROR:",
                          feed_name,
                          str(e)[:300]
                      )

              if not articles:
                  raise RuntimeError(
                      "ニュースを取得できませんでした。"
                      "誤った内容で動画を作らず、処理を停止します。"
                  )

              article = random.choice(articles)

              print("NEWS TITLE:", article["title"])
              print("NEWS SOURCE:", article["link"])

          else:
              print(
                  "NEWS SEARCH: SKIPPED - NON-NEWS GENRE"
              )

          # 6. Ollamaでジャンル別の台本を作成
          # 外部の有料生成AI APIは使用しない

          model = os.environ.get(
              "OLLAMA_MODEL",
              "qwen2.5:3b"
          )

          run([
              "bash",
              "-lc",
              "curl -fsSL https://ollama.com/install.sh | sh"
          ], timeout=300)

          subprocess.Popen(
              ["ollama", "serve"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL
          )

          for _ in range(30):
              try:
                  requests.get(
                      "http://127.0.0.1:11434/api/tags",
                      timeout=3
                  )
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError(
                  "Ollamaを起動できませんでした"
              )

          run([
              "ollama",
              "pull",
              model
          ], timeout=1200)

          if article:
              source_context = f"""
              ニュース見出し：
              {article['title']}

              配信元の説明：
              {article['summary']}

              記事URL：
              {article['link']}
              """
          else:
              source_context = """
              特定のニュース記事は使用しないでください。
              指定されたジャンルに沿って、
              一般的な知識と論理的な考察を使ってください。
              確認できない統計や実在人物の発言は作らないでください。
              """

          prompt = f"""
          あなたは、日本のYouTube Shorts向けに
          強い意見と論理的な解説を作る構成作家です。

          今回の動画ジャンル：
          {category}

          今回のテーマ：
          {topic}

          {source_context}

          【動画の目的】
          視聴者が思わず立ち止まり、
          賛成・反対の意見を持ちたくなる内容にする。

          【必ず守ること】
          ・日本語で350～500文字程度の台本を書く
          ・タイトルや説明文は台本に含めない
          ・読み上げる本文だけを出力する
          ・冒頭の一文で視聴者の常識を揺さぶる
          ・ありきたりな精神論だけで終わらせない
          ・具体例と理由を使って主張を説明する
          ・反対意見が成立する理由も考慮する
          ・無難な結論に逃げず、立場を明確にする
          ・強い表現を使ってよいが、個人攻撃はしない
          ・最後は視聴者への問いかけで締める
          ・同じ言葉や文章を繰り返さない
          ・日付や数字の意味のない羅列をしない
          ・管理用コードや英語の記号列を出力しない
          ・動画ジャンルと無関係な話題に脱線しない

          【ジャンル別の指示】
          ニュースの場合：
          記事の事実と自分の考察を区別し、
          社会への影響と問題点を説明する。

          お金・投資の場合：
          お金の使い方や投資行動について、
          ありがちな誤解や不都合な現実を論じる。
          利益を保証する表現や架空の実績は使わない。

          自己改善の場合：
          努力や習慣について、
          多くの人が見落とす問題点を具体的に論じる。

          健康・ランニングの場合：
          運動や健康習慣について、
          常識を疑う視点と実践的な考え方を示す。
          医学的な効果を根拠なく断定しない。

          名言・人生論の場合：
          名言や人生の教訓を出発点に、
          その言葉が正しいとは限らない理由も考える。
          実在人物の言葉を捏造しない。

          仕事・社会の場合：
          働き方や社会の仕組みの問題を取り上げ、
          誰にどのような負担が生じるかを論じる。

          出力は読み上げ用の本文だけにしてください。
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.85
                  }
              },
              timeout=900
          )

          response.raise_for_status()

          raw = clean_text(
              response.json().get("response", "")
          )

          raw = re.sub(
              r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
              "",
              raw
          )

          raw = re.sub(
              r"(?m)^\s*【[^】]*】\s*$",
              "",
              raw
          )

          lines = []

          for line in raw.splitlines():
              line = line.strip()

              if not line:
                  continue

              if re.fullmatch(r"[\W_]+", line):
                  continue

              lines.append(line)

          script = clean_text(
              "\n".join(lines)
          )

          if len(script) < 100:
              raise RuntimeError(
                  "台本が短すぎます。動画を公開せず停止します。"
              )

          if len(script) > 1000:
              script = script[:1000]

          # 読み上げ本文と動画タイトルを分離して保存

          SCRIPT_FILE.write_text(
              script,
              encoding="utf-8"
          )

          first_sentence = re.split(
              r"(?<=[。！？!?])",
              script
          )[0].strip()

          if not first_sentence:
              first_sentence = topic

          title = (
              category
              + "｜"
              + first_sentence[:45]
          )

          TITLE_FILE.write_text(
              title[:90],
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("VIDEO TITLE:", title[:90])
          print("SCRIPT LENGTH:", len(script))

                    # 6. 日本語音声を生成
          # Edge TTSの403エラーを避け、gTTSを使用する

          from gtts import gTTS

          sentences = re.split(
              r"(?<=[。！？!?])\s*",
              script
          )
          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          if not sentences:
              raise RuntimeError(
                  "音声用の文章がありません"
              )

          audio_dir = WORK / "audio_parts"
          audio_dir.mkdir(
              exist_ok=True
          )

          concat_file = WORK / "audio_list.txt"
          timings = []
          current_time = 0.0
          audio_files = []

          for i, sentence in enumerate(sentences):
              part = (
                  audio_dir
                  / f"part_{i:03d}.mp3"
              )

              print(
                  f"TTS: {i + 1}/{len(sentences)}"
              )

              try:
                  tts = gTTS(
                      text=sentence,
                      lang="ja",
                      slow=False
                  )

                  tts.save(str(part))

              except Exception as e:
                  raise RuntimeError(
                      "日本語音声の生成に失敗しました。"
                      f"文番号={i + 1}, エラー={e}"
                  ) from e

              if (
                  not part.exists()
                  or part.stat().st_size < 500
              ):
                  raise RuntimeError(
                      f"音声ファイルが不正です: {i}"
                  )

              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(part)
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              timings.append(
                  (
                      current_time,
                      current_time + duration,
                      sentence
                  )
              )

              current_time += duration
              audio_files.append(part)

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for part in audio_files:
                  safe = (
                      str(part.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(AUDIO_FILE)
          ])
          # 音声を15%速くする
          # 字幕のタイミングも速度に合わせて調整
          SPEED = 1.30

          sped_audio = WORK / "voice_fast.mp3"

          run([
              "ffmpeg", "-y",
              "-i", str(AUDIO_FILE),
              "-filter:a", f"atempo={SPEED}",
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(sped_audio)
          ])

          if (
              not sped_audio.exists()
              or sped_audio.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "高速化した音声を生成できませんでした"
              )

          sped_audio.replace(AUDIO_FILE)

          timings = [
              (start / SPEED, end / SPEED, sentence)
              for start, end, sentence in timings
          ]

          current_time = current_time / SPEED
          duration = current_time

          print("VOICE SPEED:", SPEED)
          print("SPEED ADJUSTED DURATION:", duration)
          if (
              not AUDIO_FILE.exists()
              or AUDIO_FILE.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "音声ファイルが生成されませんでした"
              )

          duration = current_time

          if duration < 5 or duration > 180:
              raise RuntimeError(
                  f"動画の長さが範囲外です: {duration:.1f}秒"
              )

          print(
              "AUDIO DURATION:",
              duration
          )
          # 7. 字幕ファイルを生成
          def ass_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          with ASS_FILE.open("w", encoding="utf-8-sig") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,4,1,5,70,70,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """.replace("\n          ", "\n"))

              for start, end, sentence in timings:
                  # 字幕を短い行に分割
                  chunks = textwrap.wrap(
                      sentence,
                      width=18,
                      break_long_words=True,
                      break_on_hyphens=False
                  )
                  if not chunks:
                      continue

                  # 長文は表示時間内で分割
                  total_chars = sum(len(c) for c in chunks)
                  cursor = start

                  for chunk in chunks:
                      share = (end - start) * len(chunk) / max(1, total_chars)
                      chunk_end = min(end, cursor + share)
                      text = chunk.replace("{", "").replace("}", "")
                      text = text.replace("\\", "＼")
                      f.write(
                          "Dialogue: 0,"
                          + ass_time(cursor) + ","
                          + ass_time(max(cursor + 0.15, chunk_end))
                          + ",Default,,0,0,0,,"
                          + text + "\n"
                      )
                      cursor = chunk_end

                    # ==========================================
          # 背景画像取得：ニュース内容に合わせる
          # ==========================================

          import requests
          import random
          import re
          from PIL import Image, ImageOps, ImageEnhance
          from io import BytesIO

          IMAGE_DIR = WORK / "backgrounds"
          IMAGE_DIR.mkdir(parents=True, exist_ok=True)

          BACKGROUND_FILE = WORK / "background.jpg"

                    # 分野別の検索キーワード
          # ニュース以外のジャンルにも対応

          CATEGORY_KEYWORDS = {
              "ニュース・時事問題": [
                  "日本 ニュース 社会",
                  "日本 国内 時事問題",
                  "日本 経済 社会"
              ],
              "お金・投資": [
                  "投資 株式 市場",
                  "資産形成 お金 貯蓄",
                  "金融 経済 ビジネス"
              ],
              "自己改善・習慣": [
                  "勉強 集中力 ノート",
                  "目標達成 習慣 仕事",
                  "読書 自己成長"
              ],
              "健康・ランニング": [
                  "ランニング 日本 ランナー",
                  "マラソン トレーニング",
                  "ランニングシューズ 運動"
              ],
              "名言・人生論": [
                  "夕日 山 人生 風景",
                  "本 読書 デスク",
                  "道 一本道 風景"
              ],
              "仕事・社会": [
                  "日本 オフィス 仕事",
                  "ビジネス 職場 会議",
                  "都市 ビル 社会"
              ]
          }

          # 動画タイトルは保存済みのタイトルを使う
          title = TITLE_FILE.read_text(
              encoding="utf-8"
          ).strip()

          category = category.strip()

          keywords = []

          # ニュースの場合だけ、記事タイトルを検索に使う
          if category == "ニュース・時事問題" and article:
              article_title = clean_text(
                  article.get("title", "")
              )

              if article_title:
                  keywords.append(article_title)

          # 選択されたジャンルに合った画像を検索する
          keywords.extend(
              CATEGORY_KEYWORDS.get(
                  category,
                  [topic, "日本 風景 写真"]
              )
          )

          # 検索語の重複を削除
          keywords = list(dict.fromkeys(keywords))

          print("BACKGROUND GENRE:", category)
          print("BACKGROUND KEYWORDS:", keywords)

          image_url = None
          image_errors = []

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/130.0 Safari/537.36"
              )
          }

          # Wikimedia Commonsの画像検索を利用
          for keyword in keywords:
              try:
                  print("BACKGROUND SEARCH:", keyword)

                  search_response = requests.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": keyword,
                          "gsrnamespace": 6,
                          "gsrlimit": 10,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "iiurlwidth": 1080,
                          "format": "json"
                      },
                      headers=headers,
                      timeout=25
                  )

                  search_response.raise_for_status()
                  data = search_response.json()

                  pages = (
                      data.get("query", {})
                      .get("pages", {})
                  )

                  candidates = []

                  for page in pages.values():
                      info = page.get(
                          "imageinfo", [{}]
                      )[0]

                      url = info.get("thumburl") or info.get("url")

                      if not url:
                          continue

                      # 写真として扱える画像形式に限定
                      if not re.search(
                          r"\.(jpg|jpeg|png|webp)(?:$|\?)",
                          url,
                          re.IGNORECASE
                      ):
                          continue

                      metadata = info.get(
                          "extmetadata", {}
                      )

                      license_name = (
                          metadata.get("LicenseShortName", {})
                          .get("value", "")
                      )

                      artist = (
                          metadata.get("Artist", {})
                          .get("value", "")
                      )

                      candidates.append({
                          "url": url,
                          "title": page.get("title", ""),
                          "license": license_name,
                          "artist": artist
                      })

                  if not candidates:
                      print("NO IMAGE:", keyword)
                      continue

                  random.shuffle(candidates)

                  for candidate in candidates:
                      try:
                          image_response = requests.get(
                              candidate["url"],
                              headers=headers,
                              timeout=30
                          )

                          image_response.raise_for_status()

                          image = Image.open(
                              BytesIO(image_response.content)
                          ).convert("RGB")

                          width, height = image.size

                          # 小さすぎる画像は使わない
                          if width < 500 or height < 500:
                              continue

                          # 縦型動画に合わせて中央を切り出す
                          image = ImageOps.fit(
                              image,
                              (1080, 1920),
                              method=Image.Resampling.LANCZOS,
                              centering=(0.5, 0.5)
                          )

                          # 文字を読みやすくするため少し暗くする
                          image = ImageEnhance.Brightness(
                              image
                          ).enhance(0.72)

                          image.save(
                              BACKGROUND_FILE,
                              "JPEG",
                              quality=90
                          )

                          image_url = candidate["url"]

                          print(
                              "BACKGROUND SUCCESS:",
                              candidate["title"]
                          )

                          print(
                              "BACKGROUND LICENSE:",
                              candidate["license"]
                          )

                          print(
                              "BACKGROUND ARTIST:",
                              candidate["artist"]
                          )

                          break

                      except Exception as e:
                          image_errors.append(str(e)[:200])
                          continue

                  if image_url:
                      break

              except Exception as e:
                  image_errors.append(str(e)[:200])

                  print(
                      "BACKGROUND SEARCH ERROR:",
                      keyword,
                      str(e)[:200]
                  )

          # 適切な画像を取得できない場合は処理を止める
          # 無関係なグラデーション画像には置き換えない
          if not image_url or not BACKGROUND_FILE.exists():
              raise RuntimeError(
                  "ニュースに使用する背景画像を取得できませんでした。"
                  "画像検索結果とネットワーク接続を確認してください。"
                  + " / ".join(image_errors[-3:])
              )

          print(
              "BACKGROUND FILE:",
              str(BACKGROUND_FILE)
          )

          # 9. 背景にタイトルを描画
          # タイトルは画面上部に表示し、読み上げない。
          image = Image.open(BG_FILE).convert("RGB")
          draw = ImageDraw.Draw(image)

          font_path = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          try:
              font = ImageFont.truetype(font_path, 54)
          except Exception:
              font = ImageFont.load_default()

          title_lines = textwrap.wrap(
              title, width=16, break_long_words=True
          )[:3]

          y = 100
          for line in title_lines:
              bbox = draw.textbbox((0, 0), line, font=font, stroke_width=2)
              w = bbox[2] - bbox[0]
              x = max(35, (1080 - w) // 2)

              draw.text(
                  (x, y),
                  line,
                  font=font,
                  fill="white",
                  stroke_width=3,
                  stroke_fill="#101010"
              )
              y += 75

          image.save(BG_FILE, quality=92)

                              # 9.5 動画内容に合わせてBGMを自動取得
          # 検索語を増やし、分野別検索に失敗したら
          # 一般的なBGMも検索する

          import html
          from urllib.parse import urlparse

          BGM_FILE = WORK / "background_music.ogg"
          BGM_INFO_FILE = WORK / "background_music_license.txt"

          BGM_FILE.unlink(missing_ok=True)
          BGM_INFO_FILE.unlink(missing_ok=True)

          # 分野別検索語
          bgm_keywords = {
              "岡山・介護": [
                  "calm piano music",
                  "relaxing instrumental",
                  "gentle music",
                  "soft background music",
              ],
              "介護・社会保障": [
                  "documentary music",
                  "calm instrumental",
                  "piano background music",
                  "ambient music",
              ],
              "三重県熊野市": [
                  "nature ambient music",
                  "peaceful instrumental",
                  "relaxing music",
                  "ambient background music",
              ],
              "ランニング・健康": [
                  "upbeat instrumental music",
                  "motivational music",
                  "energetic background music",
                  "electronic instrumental",
              ],
              "経済・仕事": [
                  "corporate background music",
                  "technology instrumental",
                  "modern background music",
                  "documentary instrumental",
              ],
              "国内ニュース": [
                  "cinematic instrumental",
                  "documentary background music",
                  "dramatic instrumental music",
                  "ambient instrumental",
              ],
          }

          # 分野別検索で見つからない場合に使う共通候補
          fallback_keywords = [
              "background music",
              "instrumental music",
              "music loop",
              "ambient music",
              "piano music",
              "soundtrack music",
              "music",
          ]

          category_keywords = bgm_keywords.get(
              category,
              ["instrumental music", "background music"],
          )

          # 検索語の重複を除去
          search_keywords = list(dict.fromkeys(
              category_keywords + fallback_keywords
          ))

          commons_api = "https://commons.wikimedia.org/w/api.php"
          bgm_found = False
          checked_titles = set()

          for keyword in search_keywords:
              if bgm_found:
                  break

              try:
                  print("BGM SEARCH:", keyword)

                  params = {
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": keyword,
                      "gsrnamespace": 6,
                      "gsrlimit": 50,
                      "prop": "imageinfo",
                      "iiprop": "url|extmetadata",
                      "format": "json",
                  }

                  response = requests.get(
                      commons_api,
                      params=params,
                      headers={
                          "User-Agent":
                              "AutoJapaneseVideo/1.0 (BGM search)"
                      },
                      timeout=30,
                  )
                  response.raise_for_status()

                  pages = (
                      response.json()
                      .get("query", {})
                      .get("pages", {})
                  )

                  candidates = list(pages.values())
                  random.shuffle(candidates)

                  print(
                      "BGM SEARCH RESULTS:",
                      keyword,
                      len(candidates),
                  )

                  for page in candidates:
                      if bgm_found:
                          break

                      page_title = page.get("title", "")

                      if page_title in checked_titles:
                          continue

                      checked_titles.add(page_title)

                      info_list = page.get("imageinfo", [])
                      if not info_list:
                          continue

                      info = info_list[0]
                      audio_url = info.get("url", "")
                      metadata = info.get("extmetadata", {})

                      if not audio_url:
                          continue

                      extension = Path(
                          urlparse(audio_url).path
                      ).suffix.lower()

                      # 音声ファイルだけを対象にする
                      if extension not in (
                          ".ogg",
                          ".oga",
                          ".mp3",
                          ".wav",
                          ".flac",
                      ):
                          continue

                      license_name = html.unescape(
                          metadata.get(
                              "LicenseShortName", {}
                          ).get("value", "")
                      ).strip()

                      license_lower = license_name.lower()

                      # ライセンスが確認できる音源に限定
                      allowed_license = (
                          "cc0" in license_lower
                          or "public domain" in license_lower
                          or "public-domain" in license_lower
                      )

                      if not allowed_license:
                          print(
                              "BGM LICENSE SKIP:",
                              page_title,
                              license_name or "unknown",
                          )
                          continue

                      print(
                          "BGM AUDIO CANDIDATE:",
                          page_title,
                          license_name,
                      )

                      temp_bgm = WORK / (
                          "background_music" + extension
                      )

                      try:
                          audio_response = requests.get(
                              audio_url,
                              headers={
                                  "User-Agent":
                                      "AutoJapaneseVideo/1.0"
                              },
                              timeout=60,
                          )
                          audio_response.raise_for_status()

                          if len(audio_response.content) < 10000:
                              print("BGM SKIP: file too small")
                              continue

                          temp_bgm.write_bytes(
                              audio_response.content
                          )

                          # 音声ファイルとして正常か確認
                          probe = subprocess.run(
                              [
                                  "ffprobe",
                                  "-v", "error",
                                  "-show_entries",
                                  "format=duration",
                                  "-of",
                                  "default=noprint_wrappers=1:nokey=1",
                                  str(temp_bgm),
                              ],
                              capture_output=True,
                              text=True,
                              timeout=30,
                          )

                          if probe.returncode != 0:
                              print("BGM SKIP: invalid audio")
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          try:
                              bgm_duration = float(
                                  probe.stdout.strip()
                              )
                          except (ValueError, TypeError):
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          if bgm_duration < 10:
                              print(
                                  "BGM SKIP: too short",
                                  bgm_duration,
                              )
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          # 採用した音源の情報を保存
                          BGM_INFO_FILE.write_text(
                              "音源名: " + page_title + "\n"
                              + "ライセンス: " + license_name + "\n"
                              + "作者: " + html.unescape(
                                  metadata.get(
                                      "Artist", {}
                                  ).get("value", "不明")
                              ) + "\n"
                              + "音源URL: " + audio_url + "\n",
                              encoding="utf-8",
                          )

                          # 実際に取得した拡張子を保持
                          BGM_FILE = temp_bgm
                          bgm_found = True

                          print(
                              "BGM SELECTED:",
                              page_title,
                          )
                          print(
                              "BGM LICENSE:",
                              license_name,
                          )
                          print(
                              "BGM DURATION:",
                              bgm_duration,
                          )

                      except Exception as e:
                          print(
                              "BGM DOWNLOAD ERROR:",
                              str(e)[:300],
                          )
                          temp_bgm.unlink(missing_ok=True)

              except Exception as e:
                  print(
                      "BGM SEARCH ERROR:",
                      keyword,
                      str(e)[:300],
                  )

          if bgm_found:
              print("BGM STATUS: READY")
              print("BGM FILE:", BGM_FILE)
          else:
              print(
                  "BGM STATUS: NOT FOUND "
                  "- no suitable licensed audio was found"
              )

                    # 10. 縦型動画を生成
          ass_path = str(ASS_FILE.resolve())
          ass_path = ass_path.replace("\\", "\\\\")
          ass_path = ass_path.replace(":", "\\:")
          ass_path = ass_path.replace("'", "\\'")

          video_filter = (
              "scale=1080:1920:force_original_aspect_ratio=increase,"
              "crop=1080:1920,"
              f"ass='{ass_path}'"
          )

          # BGMが取得できている場合は、ナレーションと合成する
          if bgm_found and BGM_FILE.exists():
              print("BGM MIX: START")
              print("BGM FILE:", BGM_FILE)
              print("BGM VOLUME: 8%")

              audio_filter = (
                  "[2:a]volume=0.08[bgm];"
                  "[1:a][bgm]"
                  "amix=inputs=2:duration=first:"
                  "dropout_transition=2[aout]"
              )

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(BG_FILE),
                  "-i", str(AUDIO_FILE),
                  "-stream_loop", "-1",
                  "-i", str(BGM_FILE),
                  "-filter_complex", audio_filter,
                  "-map", "0:v:0",
                  "-map", "[aout]",
                  "-vf", video_filter,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-tune", "stillimage",
                  "-pix_fmt", "yuv420p",
                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  str(VIDEO_FILE)
              ], timeout=900)

              print("BGM MIX: SUCCESS")

          # BGMが取得できなかった場合は、ナレーションだけで生成
          else:
              print("BGM MIX: SKIPPED - BGM NOT FOUND")

              run([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-framerate", "30",
                  "-i", str(BG_FILE),
                  "-i", str(AUDIO_FILE),
                  "-vf", video_filter,
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-tune", "stillimage",
                  "-pix_fmt", "yuv420p",
                  "-r", "30",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  str(VIDEO_FILE)
              ], timeout=900)

          # 11. 生成結果を検証
          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries",
                  "format=duration:stream=codec_type,width,height",
                  "-of", "json",
                  str(VIDEO_FILE)
              ],
              check=True,
              capture_output=True,
              text=True
          )

          info = json.loads(probe.stdout)
          actual_duration = float(
              info["format"]["duration"]
          )

          video_stream = next(
              (
                  s for s in info.get("streams", [])
                  if s.get("codec_type") == "video"
              ),
              None
          )

          if video_stream is None:
              raise RuntimeError("動画ストリームがありません")

          if (
              video_stream.get("width") != 1080
              or video_stream.get("height") != 1920
          ):
              raise RuntimeError("動画サイズが正しくありません")

          if actual_duration < 5 or actual_duration > 180:
              raise RuntimeError(
                  f"動画時間が異常です: {actual_duration}"
              )

          if VIDEO_FILE.stat().st_size < 100000:
              raise RuntimeError("動画ファイルが小さすぎます")

          print("VIDEO READY:", VIDEO_FILE)
          print("DURATION:", actual_duration)
          print("SIZE:", VIDEO_FILE.stat().st_size)
          PYTHON

          python generate_video.py

      # 4. YouTubeへ限定公開でアップロードしてから公開
      - name: Upload and publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_video.py <<'PYTHON'
          import os
          import sys
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          work = Path("work")
          video_path = work / "video.mp4"
          title_path = work / "title.txt"
          script_path = work / "script.txt"

          if not video_path.exists():
              raise RuntimeError("動画ファイルがありません")

          title = title_path.read_text(
              encoding="utf-8"
          ).strip()

          script = script_path.read_text(
              encoding="utf-8"
          ).strip()

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not all([client_id, client_secret, refresh_token]):
              raise RuntimeError(
                  "YouTube認証Secretsが不足しています。"
                  "YOUTUBE_CLIENT_ID、"
                  "YOUTUBE_CLIENT_SECRET、"
                  "YOUTUBE_REFRESH_TOKENを確認してください。"
              )

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          try:
              credentials.refresh(Request())
          except Exception as e:
              raise RuntimeError(
                  "YouTube OAuth認証に失敗しました。"
                  "invalid_scopeの場合は再認証が必要です。"
              ) from e

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          description = (
              script[:4000]
              + "\n\nニュース出典："
              + "記事URLはワークフローのログで確認してください。"
              + "\n\n#ニュース #日本 #Shorts"
          )

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description[:5000],
                  "categoryId": "25",
                  "tags": [
                      "ニュース", "日本", "解説", "Shorts"
                  ],
                  "defaultLanguage": "ja",
                  "defaultAudioLanguage": "ja"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              str(video_path),
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(
                      "Upload progress:",
                      round(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]
          print("UPLOADED:", video_id)

          # アップロード後に公開へ変更
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("PUBLISHED:", video_id)
          print(
              "URL:",
              "https://www.youtube.com/shorts/" + video_id
          )
          PYTHON

          python upload_video.py

      # 5. 動画と台本を保存
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            work/video.mp4
            work/voice.mp3
            work/title.txt
            work/script.txt
            work/subtitles.ass
            work/background.jpg
          if-no-files-found: ignore
          retention-days: 7
