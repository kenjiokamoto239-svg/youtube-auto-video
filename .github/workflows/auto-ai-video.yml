name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
                    python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help
            

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

          def strip_prompt_leakage(s):
              s = clean_text(s)
              bad_patterns = [
                  r"(?i)^\s*(?:あなたは|以下の条件に従って|読み上げ用の本文だけを出力|視聴者の常識を揺さぶる|具体例を入れてください|結論を明確にしてください|ここに台本を書く|台本の構成|最重要ルール|動画ジャンル).*$",
                  r"(?i)^\s*(?:system|assistant|user)\s*[:：].*$",
                  r"^\s*【(?:動画ジャンル|台本の構成|最重要ルール|指示|出力形式)[^】]*】\s*$",
              ]
              lines = []
              for line in s.splitlines():
                  if any(re.search(p, line) for p in bad_patterns):
                      continue
                  lines.append(line)
              return clean_text("\n".join(lines))

                    # 4. 投稿時間に応じてジャンルを選択
          # 1日6本の投稿スケジュールは変更しない

          now = datetime.now()
          hour = now.hour

                    # 1日6本の投稿ジャンル
          # 投稿時間と既存のスケジュールは維持する

          now = datetime.now()
          hour = now.hour

          genre_schedule = {
              8: {
                  "name": "人間関係・心理",
                  "topic": "人間関係、信頼、人間の本性、心理の盲点を具体例で解説する"
              },
              12: {
                  "name": "お金・仕事の現実",
                  "topic": "家計、貯蓄、消費、賃金、会社、働き方の不都合な現実を考える"
              },
              15: {
                  "name": "習慣・自己啓発",
                  "topic": "行動習慣、継続、時間の使い方、成長の盲点と実践策を解説する"
              },
              18: {
                  "name": "健康・ランニング",
                  "topic": "40代の健康、運動、ランニング、初心者の失敗と具体的な改善策を解説する"
              },
              20: {
                  "name": "意外な事実・雑学",
                  "topic": "日常の思い込みを覆す事実や仕組みを、確認可能な根拠とともに解説する"
              },
              22: {
                  "name": "ニュース・社会問題",
                  "topic": "最新ニュースや社会問題を事実と意見に分け、生活への影響まで解説する"
              }
          }

          if hour in genre_schedule:
              selected = genre_schedule[hour]
          else:
              # 手動実行など、通常の投稿時刻以外は
              # 6ジャンルからランダムに選択
              selected = random.choice(
                  list(genre_schedule.values())
              )

          category = selected["name"]
          topic = selected["topic"]

          (WORK / "category.txt").write_text(
              category,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("TOPIC:", topic)
          print("JAPAN TIME:", now.isoformat())

                    # 5. 全ジャンルで公開情報を検索する
          # 無料の公開RSSを利用。外部の有料APIは使わない

          article = None

          research_queries = {
              "人間関係・心理": [
                  "人間関係 心理学 研究 信頼",
                  "コミュニケーション 心理学 研究",
                  "対人関係 行動科学 研究"
              ],
              "お金・仕事の現実": [
                  "日本 家計 貯蓄 物価 統計",
                  "日本 賃金 労働 統計 厚生労働省",
                  "金融庁 資産形成 家計"
              ],
              "習慣・自己啓発": [
                  "習慣形成 行動科学 研究",
                  "集中力 睡眠 行動科学 研究",
                  "時間管理 習慣 研究"
              ],
              "健康・ランニング": [
                  "ランニング 初心者 トレーニング 研究",
                  "運動 健康 ガイドライン 公的機関",
                  "ランニング 怪我 予防 研究"
              ],
              "意外な事実・雑学": [
                  "科学 研究 意外な事実 解説",
                  "日常 身近な科学 公的機関",
                  "歴史 事実 検証 解説"
              ],
              "ニュース・社会問題": [
                  "日本 国内 社会 ニュース",
                  "日本 経済 賃金 物価 ニュース",
                  "岡山 介護 福祉 AI ニュース",
                  "世界　戦争 ニュース"
              ]
          }

          queries = research_queries.get(
              category,
              ["日本 社会 ニュース"]
          )

          random.shuffle(queries)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          articles = []

          # 検索語を順番に試し、参考情報を取得する
          for query in queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query, safe="")
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RESEARCH SEARCH:", query)

                  response = requests.get(
                      rss_url,
                      headers=headers,
                      timeout=25
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(
                      response.content
                  )

                  for item in feed.entries[:10]:
                      title_text = clean_text(
                          item.get("title", "")
                      )

                      summary_text = clean_text(
                          re.sub(
                              r"<[^>]+>",
                              " ",
                              item.get("summary", "")
                          )
                      )

                      link_text = item.get("link", "")

                      if title_text and link_text:
                          # 同じ記事の重複を避ける
                          if not any(
                              a["link"] == link_text
                              for a in articles
                          ):
                              articles.append({
                                  "title": title_text,
                                  "summary": summary_text[:900],
                                  "link": link_text
                              })

                  # 記事が見つかったら検索を終了
                  if articles:
                      break

              except Exception as e:
                  print(
                      "RESEARCH RSS ERROR:",
                      str(e)[:200]
                  )

          if articles:
              article = random.choice(articles)

              print(
                  "RESEARCH ARTICLE:",
                  article["title"]
              )

              print(
                  "RESEARCH SOURCE:",
                  article["link"]
              )

          elif category == "ニュース・時事問題":
              raise RuntimeError(
                  "ニュースを取得できませんでした。"
                  "誤った内容で動画を作らず、"
                  "処理を停止します。"
              )

          else:
              print(
                  "RESEARCH FALLBACK: "
                  "参考情報を取得できません。"
                  "確認できない事実や統計を作らず、"
                  "一般知識に限定します。"
              )

          # 6. Ollamaでジャンル別の台本を作成
          # 外部の有料生成AI APIは使用しない

          model = os.environ.get(
              "OLLAMA_MODEL",
              "qwen2.5:3b"
          )

          run([
              "bash",
              "-lc",
              "curl -fsSL https://ollama.com/install.sh | sh"
          ], timeout=300)

          subprocess.Popen(
              ["ollama", "serve"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL
          )

          for _ in range(30):
              try:
                  requests.get(
                      "http://127.0.0.1:11434/api/tags",
                      timeout=3
                  )
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError(
                  "Ollamaを起動できませんでした"
              )

          run([
              "ollama",
              "pull",
              model
          ], timeout=1200)

          if article:
              source_context = f"""
              参考記事の見出し：
              {article['title']}

              公開情報の説明：
              {article['summary']}

              参考元URL：
              {article['link']}

              この記事を丸写しせず、
              確認できる事実と自分の論評を分けてください。
              記事に書かれていない事実を作らないでください。
              """
          else:
              source_context = """
              特定のニュース記事は使用しないでください。
              指定されたジャンルに沿って、
              一般的な知識と論理的な考察を使ってください。
              確認できない統計や実在人物の発言は作らないでください。
              """

                        # ==========================================
          # 過去の分析データを次の台本に反映
          # ==========================================

          analytics_file = ROOT / "data" / "analytics_feedback.json"

          analytics_guidance = (
              "過去の分析データはまだ利用できません。"
              "今回のテーマに合った独自の台本を作成してください。"
          )

          try:
              if analytics_file.exists():
                  analytics_data = json.loads(
                      analytics_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  top_videos = analytics_data.get(
                      "top_videos_by_lifetime_views",
                      []
                  )

                  top_videos = sorted(
                      top_videos,
                      key=lambda item: int(
                          item.get("views", 0)
                      ),
                      reverse=True
                  )[:5]

                  if top_videos:
                      examples = []

                      for video in top_videos:
                          video_title = clean_text(
                              video.get("title", "")
                          )
                          views = int(
                              video.get("views", 0)
                          )

                          if video_title:
                              examples.append(
                                  f"- {video_title} "
                                  f"（累計再生数：{views}回）"
                              )

                      analytics_guidance = (
                          "以下は過去の再生数上位動画です。\n"
                          + "\n".join(examples)
                          + "\n\n"
                          "これらを参考に、具体性、意外性、"
                          "視聴者の関心を引く切り口を研究してください。"
                          "ただし、タイトルや台本をコピーしてはいけません。"
                          "今回のジャンルとテーマに合う、"
                          "新しい主張と具体例を作ってください。"
                      )

                  print(
                      "ANALYTICS FEEDBACK LOADED:",
                      len(top_videos),
                      "top videos"
                  )

              else:
                  print(
                      "ANALYTICS FEEDBACK NOT FOUND"
                  )

          except Exception as e:
              print(
                  "ANALYTICS FEEDBACK ERROR:",
                  str(e)[:300]
              )

          prompt = f"""
          あなたは、日本のYouTube Shorts向けに、
          視聴者の常識を揺さぶり、具体的な情報と
          明確な主張で最後まで見せる構成作家です。

          【動画ジャンル】
          {category}

          【テーマ】
          {topic}

          【過去の分析データ】
          {analytics_guidance}

          【参考情報】
          {source_context}

          【最重要ルール】
          この動画は、動画制作者への指示を説明する動画ではありません。
          視聴者が知りたい具体的なテーマについて解説してください。

          「視聴者の常識を揺さぶる一文から始めましょう」
          「今回は〇〇について解説します」
          「皆さんはどう思いますか」
          のような中身のない定型文から始めてはいけません。

                    【台本の作り方】

          次の要素を、話の流れに合わせて自然に入れてください。
          すべてを機械的に詰め込む必要はありません。

          ・冒頭で、具体的で反論の余地もある明確な主張を示す
          ・多くの人が見落としている問題や盲点を指摘する
          ・その主張が成立する理由を説明する
          ・具体例、比較、条件、仕組みのうち少なくとも1つを使う
          ・必要な場合は反対意見や例外にも触れる
          ・最後はテーマに対する自分の立場を明確にする
          ・視聴者が実際に使える判断基準や行動を示す

          【文章の条件】

          ・日本語で450～700文字を目安にする
          ・読み上げる本文だけを出力する
          ・冒頭から具体的なテーマに入る
          ・抽象的な精神論だけで終わらせない
          ・主張には理由や具体例を伴わせる
          ・同じ意味の文章を繰り返さない
          ・事実、推測、個人的な意見を区別する
          ・確認できない統計、研究結果、実在人物の発言を作らない
          ・タイトル、説明文、ハッシュタグを出力しない
          ・管理用コード、日付の羅列、意味不明な文字列を出力しない
          ・台本の中に制作指示を混ぜない
          ・「大切です」「重要です」などの一般論だけで終わらせない
          ・最後の一文は、テーマに合った具体的な結論にする
          ・最後を質問で終えることは必須にしない
          
          【ジャンル別の必須ルール】

          ・人間関係・心理：
          性格を決めつけたり診断したりせず、
          具体的な言動と、その理由を説明する。

          ・お金・仕事の現実：
          恐怖をあおるだけで終わらせず、
          お金や労働環境の仕組みと、
          視聴者が取れる現実的な行動を示す。

          ・習慣・自己啓発：
          精神論で終わらせず、
          今日からできる行動を少なくとも1つ示す。

          ・意外な事実・雑学：
          意外性を重視するが、事実を捏造しない。
          根拠が確認できないことを事実と断言しない。

          ・ニュース・社会問題：
          報道で確認できる事実と自分の意見を分け、
          社会への影響と具体的な問題点を説明する。

          ・すべてのジャンル：
          抽象的な一般論だけの台本は禁止。
          タイトルをそのまま読み上げる台本は禁止。
          主張には理由や具体例を伴わせる。
          最後は具体的な結論か実践方法で締める。


          【健康・ランニングの場合】
          ・初心者、中級者、経験者の違いを意識する
          ・具体的な練習方法や実践例を入れる
          ・なぜその方法が有効と考えられるのか説明する
          ・医学的な効果や健康リスクを根拠なく断定しない
          ・「絶対に走るな」など、必要以上に危険をあおらない
          ・強い主張をする場合も、条件や例外を説明する
          ・単にランニングを否定するだけで終わらせない

          【ニュースの場合】
          記事で確認できる事実と自分の意見を区別し、
          社会への影響や問題点を具体的に説明する。

          【お金・投資の場合】
          投資のリスク、判断の盲点、具体例を説明する。
          利益を保証したり、架空の実績を作ったりしない。

          【自己改善の場合】
          よくある成功論を疑い、実行できる方法を示す。

          【名言・人生論の場合】
          名言をそのまま紹介するだけで終わらず、
          現代の生活に当てはめて批判的に考える。
          実在人物の発言を捏造しない。

          【仕事・社会の場合】
          働き方や制度の問題について、
          誰が得をし、誰が負担を負うのかを具体的に論じる。

          出力は完成した読み上げ用の本文だけにしてください。
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.85
                  }
              },
              timeout=900
          )

          response.raise_for_status()

          raw = strip_prompt_leakage(
              response.json().get("response", "")
          )

          raw = re.sub(
              r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
              "",
              raw
          )

          raw = re.sub(
              r"(?m)^\s*【[^】]*】\s*$",
              "",
              raw
          )

          lines = []

          for line in raw.splitlines():
              line = line.strip()

              if not line:
                  continue

              if re.fullmatch(r"[\W_]+", line):
                  continue

              lines.append(line)

          script = clean_text(
              "\n".join(lines)
          )

                    # 短い台本も、後続の品質検査と
          # 自動修正処理に進める
          if len(script) > 1000:
              script = script[:1000]

          print("INITIAL SCRIPT LENGTH:", len(script))

                   # 台本とタイトルを分離して保存
          # タイトルは台本の冒頭を流用せず、別途生成する
                                        # 台本の品質検査・自動修正
          # 検査に合格するまで繰り返す

          def inspect_script(text):
              """台本の重大な欠陥を検出する。固定表現の有無では判定しない。"""
              issues = []
              text = clean_text(text)

              if not text:
                  return ["台本が空です。本文を作成してください。"]

              # 文字数の検査
              if len(text) < 250:
                  issues.append(
                      "台本が短すぎます。理由や具体例を補い、"
                      "テーマを十分に説明してください。"
                  )

              if len(text) > 1000:
                  issues.append(
                      "台本が長すぎます。重複や脇道を削り、"
                      "重要な説明を残して1000文字以内にしてください。"
                  )

              # 文章数の検査
              sentences = [
                  s.strip()
                  for s in re.split(r"(?<=[。！？!?])", text)
                  if s.strip()
              ]

              if len(sentences) < 4:
                  issues.append(
                      "説明が不足しています。主張、根拠、"
                      "具体例、結論が伝わるようにしてください。"
                  )

              # 同じ文章の繰り返しを検査
              normalized = [
                  re.sub(r"[\s、。！？!?「」『』（）()]", "", s)
                  for s in sentences
              ]

              if (
                  len(normalized) >= 5
                  and len(set(normalized)) < len(normalized) * 0.7
              ):
                  issues.append(
                      "同じ文章の繰り返しが多すぎます。"
                      "重複を削り、新しい情報を加えてください。"
                  )

              # 同じ文字列が不自然に連続していないか検査
              if re.search(r"(.{6,24})\1{2,}", text):
                  issues.append(
                      "同じ言葉や文章が不自然に連続しています。"
                      "自然な日本語に書き直してください。"
                  )

              # AIへの制作指示が混入していないか検査
              forbidden_phrases = [
                  "視聴者の常識を揺さぶる一文から始めましょう",
                  "読み上げ用の本文だけを出力する",
                  "あなたは、日本のYouTube Shorts向けに",
                  "【動画ジャンル】",
                  "【台本の構成】",
                  "【最重要ルール】",
                  "ここに台本を書く",
                  "以下の条件に従って",
                  "具体例を入れてください",
