name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v6

      # =========================
      # 2. Ollama
      # =========================
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama list || true

      - name: Pull AI model
        run: |
          timeout 300s ollama pull qwen2.5:1.5b

      # =========================
      # 3. Prepare
      # =========================
      - name: Prepare folders
        run: |
          mkdir -p input output model

      # =========================
      # 4. Generate topic
      # =========================
      - name: Generate topic
        shell: python
        run: |
          import random
          from pathlib import Path

          topics = [
              "朝の習慣を変える方法",
              "人生を少し楽にする考え方",
              "継続できる人の共通点",
              "仕事で疲れすぎない考え方",
              "お金を無駄にしない習慣",
              "運動を続けるための考え方",
              "時間を増やすシンプルな方法",
              "やる気に頼らず行動する方法",
              "失敗したときの考え方",
              "毎日を少し良くする習慣",
              "人間関係で疲れない考え方",
              "スマホ時間を減らす方法",
              "集中力を高める簡単な習慣",
              "自分を変えるためにやめること",
              "人生で本当に大切な時間の使い方"
          ]

          topic = random.choice(topics)
          Path("input/topic.txt").write_text(topic, encoding="utf-8")

          print("テーマ：", topic)

      # =========================
      # 5. Generate YouTube title
      # ※本文とは完全分離
      # =========================
      - name: Generate title
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()

          prompt = f"""
          次のテーマからYouTube Shorts用タイトルを1つだけ作ってください。

          テーマ：
          {topic}

          条件：
          ・日本語だけ
          ・20文字以内
          ・タイトル本文だけ出力
          ・「タイトル：」などのラベル禁止
          ・数字禁止
          ・英語禁止
          ・記号禁止
          """

          fallback = "今日から人生を少し良くする習慣"

          try:
              r = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=60
              )
              title = r.stdout.strip()
          except Exception:
              title = fallback

          title = re.sub(r"https?://\S+", "", title)
          title = re.sub(r"[A-Za-z0-9０-９]", "", title)
          title = title.replace("タイトル：", "")
          title = title.replace("タイトル:", "")
          title = title.replace("「", "").replace("」", "")
          title = title.replace('"', "").replace("'", "")
          title = re.sub(r"\s+", "", title)

          if not title:
              title = fallback

          title = title[:25]

          Path("input/title.txt").write_text(title, encoding="utf-8")

          print("YouTubeタイトル：")
          print(title)

      # =========================
      # 6. Generate script
      # =========================
      - name: Generate script
        shell: python
        run: |
          import subprocess
          import re
          import unicodedata
          from pathlib import Path

          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()

          prompt = f"""
          あなたは日本語YouTube Shortsのナレーション原稿を書く編集者です。

          テーマ：
          {topic}

          重要：
          YouTubeタイトルは作らないでください。
          説明文も作らないでください。

          出力するのは、動画で実際に読み上げる本文だけです。

          禁止：
          ・タイトル
          ・動画タイトル
          ・説明
          ・説明文
          ・ナレーション：
          ・台本：
          ・本文：
          ・テーマ：
          ・見出し
          ・箇条書き
          ・Markdown
          ・URL
          ・英語
          ・数字
          ・記号の羅列
          ・特殊文字
          ・乱数
          ・文字コードの説明

          条件：
          ・日本語だけ
          ・140文字から220文字程度
          ・自然な文章
          ・耳で聞いて理解できる文章
          ・最後まで一つの話として成立させる
          ・本文だけを出力する
          """

          fallback = (
              "毎日を変えたいなら、最初から大きなことをする必要はありません。"
              "大切なのは、今日できる小さな行動を一つ決めることです。"
              "五分だけ歩く、机の上を片付ける、スマホを見る時間を少し減らす。"
              "小さな行動でも続ければ、やがて大きな差になります。"
              "人生を変えるのは、一度の頑張りではなく、毎日の積み重ねです。"
          )

          try:
              r = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=120
              )
              raw = r.stdout.strip()
          except Exception as e:
              print("AI生成失敗。固定原稿を使用します。")
              print(e)
              raw = fallback

          def clean_text(text):
              text = unicodedata.normalize("NFKC", text)

              text = re.sub(r"https?://\S+", "", text)

              bad_words = [
                  "タイトル",
                  "動画タイトル",
                  "説明文",
                  "説明",
                  "ナレーション本文",
                  "ナレーション",
                  "台本本文",
                  "台本",
                  "本文",
                  "テーマ",
                  "乱数"
              ]

              lines = []

              for line in text.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  for word in bad_words:
                      line = re.sub(
                          rf"^{re.escape(word)}\s*[:：\-－]\s*",
                          "",
                          line
                      )

                  line = re.sub(
                      r"^[#>*•・\-－―]+",
                      "",
                      line
                  )

                  line = re.sub(
                      r"^[0-9０-９]+[.)．、:：]\s*",
                      "",
                      line
                  )

                  line = line.strip()

                  if not line:
                      continue

                  if any(x in line for x in [
                      "�", "□", "☒", "☐", "■", "▯", "�"
                  ]):
                      continue

                  lines.append(line)

              text = "".join(lines)

              # 英数字を除去
              text = re.sub(r"[A-Za-z0-9０-９]", "", text)

              # 記号を整理
              allowed = (
                  "ぁ-んァ-ヶ一-龯々"
                  "。、「」『』！？：；，、・…〜ー"
                  "（）【】［］"
                  " "
              )

              text = "".join(
                  c for c in text
                  if re.match(f"[{allowed}]", c)
              )

              text = re.sub(r"\s+", "", text)

              # 連続した句読点を整理
              text = re.sub(r"[。]{2,}", "。", text)
              text = re.sub(r"[、]{2,}", "、", text)

              return text.strip()

          cleaned = clean_text(raw)

          # 短すぎる場合は固定原稿
          if len(cleaned) < 80:
              cleaned = clean_text(fallback)

          # 長すぎる場合は文章単位で切る
          if len(cleaned) > 230:
              sentences = re.split(r"(?<=[。！？])", cleaned)
              result = ""

              for s in sentences:
                  if len(result) + len(s) > 220:
                      break
                  result += s

              cleaned = result.strip()

          Path("input/script.txt").write_text(
              cleaned,
              encoding="utf-8"
          )

          print("===== 最終ナレーション本文 =====")
          print(cleaned)
          print("文字数：", len(cleaned))
          print("================================")

      # =========================
      # 7. Validate script
      # =========================
      - name: Validate script
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path("input/script.txt")

          if not p.exists():
              raise SystemExit("script.txt がありません")

          text = p.read_text(encoding="utf-8").strip()

          if not text:
              raise SystemExit("台本が空です")

          forbidden = [
              "タイトル",
              "動画タイトル",
              "説明",
              "ナレーション",
              "台本",
              "本文",
              "テーマ",
              "乱数",
              "�",
              "□",
              "☒",
              "☐",
              "■"
          ]

          for word in forbidden:
              if word in text:
                  raise SystemExit(
                      f"禁止文字列が残っています：{word}"
                  )

          if re.search(r"[A-Za-z0-9０-９]", text):
              raise SystemExit("英数字が残っています")

          if len(text) < 50:
              raise SystemExit("台本が短すぎます")

          if len(text) > 240:
              raise SystemExit("台本が長すぎます")

          print("台本検証OK")
          print(text)

      # =========================
      # 8. Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =========================
      # 9. Install Python packages
      # =========================
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git"
          pip install soundfile numpy pillow google-api-python-client google-auth google-auth-oauthlib

      # =========================
      # 10. FFmpeg + Japanese font
      # =========================
      - name: Install FFmpeg and font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      # =========================
      # 11. Download Kokoro model
      # =========================
      - name: Download Kokoro model
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx -O model/kokoro-v1.0.int8.onnx
          wget -q https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin -O model/jf_alpha.bin

      # =========================
      # 12. TTS
      # =========================
      - name: Generate Japanese voice
        shell: python
        run: |
          from pathlib import Path
          import soundfile as sf
          from kokoro_onnx import Kokoro

          text = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          print("TTSに渡す本文：")
          print(text)

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio, sample_rate = model.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          print("音声生成完了")

      # =========================
      # 13. Validate audio
      # =========================
      - name: Validate audio
        shell: python
        run: |
          import subprocess

          r = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  "input/audio.wav"
              ],
              capture_output=True,
              text=True
          )

          duration = float(r.stdout.strip())

          print("音声時間：", duration)

          if duration < 8:
              raise SystemExit("音声が短すぎます")

          if duration > 70:
              raise SystemExit("音声が長すぎます")

      # =========================
      # 14. Background
      # =========================
      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw

          W = 1080
          H = 1920

          img = Image.new("RGB", (W, H))

          px = img.load()

          for y in range(H):
              ratio = y / H

              r = int(20 + 40 * ratio)
              g = int(25 + 30 * ratio)
              b = int(55 + 80 * ratio)

              for x in range(W):
                  px[x, y] = (r, g, b)

          draw = ImageDraw.Draw(img)

          circles = [
              (120, 260, 280),
              (850, 650, 380),
              (540, 1450, 500),
              (150, 1750, 250)
          ]

          for cx, cy, radius in circles:
              draw.ellipse(
                  (
                      cx-radius,
                      cy-radius,
                      cx+radius,
                      cy+radius
                  ),
                  outline=(100, 110, 170),
                  width=5
              )

          img.save("input/background.png")

          print("背景生成完了")

      # =========================
      # 15. Generate ASS subtitles
      # =========================
      - name: Generate subtitles
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          text = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          r = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  "input/audio.wav"
              ],
              capture_output=True,
              text=True
          )

          duration = float(r.stdout.strip())

          sentences = re.split(
              r"(?<=[。！？])",
              text
          )

          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          total_chars = sum(len(s) for s in sentences)

          def ass_time(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = int((sec - int(sec)) * 100)

              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          ass = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,Noto Sans CJK JP,62,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,4,2,2,60,60,260,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """

          current = 0.0

          for s in sentences:
              part = len(s) / max(total_chars, 1)
              length = duration * part

              start = current
              end = current + length

              safe = s.replace("\\", "￥")
              safe = safe.replace("{", "")
              safe = safe.replace("}", "")

              ass += (
                  f"Dialogue: 0,"
                  f"{ass_time(start)},"
                  f"{ass_time(end)},"
                  f"Default,,0,0,0,,"
                  f"{safe}\n"
              )

              current = end

          Path("input/subtitles.ass").write_text(
              ass,
              encoding="utf-8"
          )

          print("字幕生成完了")

      # =========================
      # 16. Final subtitle validation
      # =========================
      - name: Validate subtitles
        shell: python
        run: |
          from pathlib import Path

          text = Path("input/subtitles.ass").read_text(
              encoding="utf-8"
          )

          bad = [
              "�",
              "□",
              "☒",
              "☐",
              "■",
              "タイトル",
              "動画タイトル",
              "説明",
              "ナレーション",
              "台本"
          ]

          for x in bad:
              if x in text:
                  raise SystemExit(
                      f"字幕に禁止文字が残っています：{x}"
                  )

          print("字幕検証OK")

      # =========================
      # 17. Generate MP4
      # =========================
      - name: Generate MP4
        run: |
          ffmpeg -y \
            -loop 1 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -r 30 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/video.mp4

      # =========================
      # 18. Final video validation
      # =========================
      - name: Validate final video
        shell: python
        run: |
          import subprocess

          duration = subprocess.check_output(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  "output/video.mp4"
              ],
              text=True
          ).strip()

          video = subprocess.check_output(
              [
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=codec_name,width,height",
                  "-of", "csv=p=0",
                  "output/video.mp4"
              ],
              text=True
          ).strip()

          audio = subprocess.check_output(
              [
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "a:0",
                  "-show_entries", "stream=codec_name",
                  "-of", "csv=p=0",
                  "output/video.mp4"
              ],
              text=True
          ).strip()

          print("動画時間：", duration)
          print("映像：", video)
          print("音声：", audio)

          d = float(duration)

          if d < 8 or d > 70:
              raise SystemExit("動画時間が範囲外です")

          parts = video.split(",")

          codec = parts[0]
          width = int(parts[1])
          height = int(parts[2])

          if width != 1080:
              raise SystemExit(
                  f"横幅が1080ではありません：{width}"
              )

          if height != 1920:
              raise SystemExit(
                  f"高さが1920ではありません：{height}"
              )

          if codec != "h264":
              raise SystemExit(
                  f"映像codecがH.264ではありません：{codec}"
              )

          if audio != "aac":
              raise SystemExit(
                  f"音声codecがAACではありません：{audio}"
              )

          print("===== 最終動画検証OK =====")

      # =========================
      # 19. YouTube Upload
      # =========================
      - name: Upload to YouTube
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import os
          import json
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          title = Path("input/title.txt").read_text(
              encoding="utf-8"
          ).strip()

          description = (
              "自動生成された日本語ショート動画です。"
          )

          scopes = [
              "https://www.googleapis.com/auth/youtube"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=scopes
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          video_id = response["id"]

          print("YouTubeアップロード完了")
          print("Video ID:", video_id)

          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public"
                  }
              }
          ).execute()

          print("YouTube公開完了")

      # =========================
      # 20. Save artifact
      # =========================
      - name: Upload video artifact
        uses: actions/upload-artifact@v6
        with:
          name: generated-video
          path: |
            output/video.mp4
            input/script.txt
            input/title.txt
            input/audio.wav
            input/subtitles.ass
