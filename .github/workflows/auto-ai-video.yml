                      )

                  raise RuntimeError(
                      "原文の完全一致を確認できません。"
                      "公開を中止します。"
                  )

              print(
                  "FACT CHECK INDEX RETRY: PASSED"
              )

              for index, item in enumerate(
                  fact_check["claims"],
                  start=1
              ):
                  print(
                      f"VERIFIED CLAIM {index}:",
                      item["claim"]
                  )
                  print(
                      f"VERIFIED SOURCE {index}:",
                      item["evidence_quote"]
                  )

          claims = fact_check.get("claims", [])
          print("SOURCE FACT CHECK: PASSED", len(claims))


          claims = fact_check.get("claims", [])
          print("SOURCE FACT CHECK: PASSED", len(claims))

          # 合格した台本だけを保存
          SCRIPT_FILE.write_text(
              script,
              encoding="utf-8"
          )

          title_prompt = f"""
          あなたは、日本のYouTube Shortsで視聴者の興味を引く
          タイトルとフックを専門に作る、厳しい編集者です。

          【動画ジャンル】
          {category}

          【動画のテーマ】
          {topic}

          【動画の台本】
          {script}

          【参考情報】
          {source_context[:8000]}

          【最重要ミッション】
          この動画を見た人が、思わず続きを見たくなる
          強く具体的な日本語タイトルを1つ作ってください。

          単なる内容説明ではなく、
          視聴者の疑問、意外性、問題意識、反論したくなる主張、
          見落とされがちな盲点のいずれかを利用してください。

          【フックの作り方】
          次の手法から、今回のテーマに最も合うものを選んでください。

          1. 常識への疑問
             例：努力すれば成功する。本当にそうでしょうか？

          2. 意外な盲点
             例：貯金をしていても安心できない理由

          3. はっきりした問題提起
             例：介護職の給料が上がらない構造的な問題

          4. 視聴者への直接的な問い
             例：その節約、本当に得をしていますか？

          5. 反対意見が出るような主張
             例：頑張ることが、逆効果になる場合もある

          6. 結果と原因のギャップ
             例：毎日走っているのに速くならないのはなぜ？

          これらは手法の例です。
          毎回同じ形式や表現を使わないでください。
          今回のテーマに最も適した方法を選んでください。

          【表現の強さ】
          ・遠慮しすぎず、主張を明確にする
          ・必要なら一般的な考え方に異議を唱える
          ・無難なだけの説明タイトルにしない
          ・視聴者が自分の問題として感じる表現を選ぶ
          ・曖昧な言葉より、具体的な問題や結論を優先する
          ・タイトルを見ただけで、何が論点なのか伝わるようにする

          【絶対に守ること】
          ・台本の内容と一致させる
          ・台本にない事実や数字を作らない
          ・根拠のない断定や誇張をしない
          ・不安をあおるだけのタイトルにしない
          ・同じフックの使い回しを避ける
          ・「知らないと損」「衝撃の事実」などの
            汎用的な煽り文句だけで構成しない
          ・「今回は」「徹底解説」「知っていますか」などの
            定型的な書き出しに頼らない

          【文字数】
          ・原則15～35文字程度
          ・短くても意味が明確ならよい
          ・長い説明文にしない

          【出力形式】
          完成したタイトルを1つだけ出力してください。
          説明、理由、候補一覧、引用符、タイトルというラベルは
          一切付けないでください。
          """

          
                        # タイトルの品質検査と再生成
          bad_phrases = [
              "視聴者の常識が揺らぐ問いかけです",
              "視聴者の常識を揺さぶる",
              "常識を揺さぶる一文から始めましょう",
              "今回は",
              "タイトル：",
              "動画タイトル：",
              "この動画では",
              "クリックしたくなる",
              "台本に合う",
              "価値ある名言を新解釈",
              "新解釈してみましょう",
              "について考えてみましょう",
              "大切さを考えましょう",
              "健康・ランニング｜",
              "自己改善・習慣｜",
              "ニュース・時事問題｜",
              "お金・投資｜",
              "名言・人生論｜",
              "仕事・社会｜",
          ]

          def normalize_title(raw_title):
              value = clean_text(raw_title)
              value = re.sub(
                  r"(?im)^\s*(タイトル|動画タイトル|TITLE)\s*[:：]\s*",
                  "",
                  value
              )
              value = value.strip().strip("「」『』\"'` ")
              value = re.sub(r"\s+", " ", value)
              return value[:100].strip()

          def title_quality_issues(value):
              issues = []

              if len(value) < 8:
                  issues.append("短すぎる")

              if len(value) > 60:
                  issues.append("長すぎる")

              if any(phrase in value for phrase in bad_phrases):
                  issues.append("禁止表現が含まれる")

              if re.search(
                  r"(しましょう|してみましょう|してください|解説します|紹介します)$",
                  value
              ):
                  issues.append("説明文のようなタイトル")

              if value.startswith(("今日から", "今回は", "皆さんは")):
                  issues.append("抽象的な書き出し")

              if not re.search(
                  r"[、！？!?]|ほど|なぜ|本当|だけ|危険|損|無駄|必要|間違|やめ|変わ|知ら|違|理由|方法|円|分|時間|仕事|お金|投資|走|習慣|介護|賃金|会社|社会|人生|名言",
                  value
              ):
                  issues.append("具体的な論点が見えない")

              script_text = clean_text(script).lower()

              title_claim_rules = {
                  "卒業": ["卒業"],
                  "閉鎖": ["閉鎖", "営業終了", "最終営業"],
                  "有料": ["有料", "料金", "価格", "円", "購入"],
                  "無料": ["無料", "無償", "0円"],
                  "先着": ["先着"],
                  "抽選": ["抽選"],
                  "ゲット": ["ゲット", "もらえる", "入手", "獲得", "プレゼント"],
                  "秘密": ["秘密", "非公開", "未公開"],
                  "突然": ["突然", "急遽", "緊急"],
                  "初コラボ": ["初コラボ"],
                  "日本初": ["日本初"],
                  "史上初": ["史上初"]
              }

              for claim_word, support_words in title_claim_rules.items():
                  if claim_word in value and not any(
                      word in script_text for word in support_words
                  ):
                      issues.append(
                          "台本に裏付けがない表現: " + claim_word
                      )

              return issues

          title = ""
          title_issues = ["未生成"]

          # 最大4回までタイトルを作り直す
          for title_attempt in range(1, 5):

              retry_note = ""

              if title_attempt > 1:
                  retry_note = (
                      "\n前回の問題："
                      + "、".join(title_issues)
                      + "。前回とは異なる、具体的なタイトルを作ってください。"
                  )

              title_prompt_retry = f"""
              あなたは日本のYouTube Shorts専門のタイトル編集者です。

              ジャンル：
              {category}

              台本：
              {script}

              参考情報：
              {source_context[:8000]}

              台本の内容と一致し、視聴者が続きを見たくなる
              日本語タイトルを1つだけ作成してください。

              条件：
              ・15～35文字を目安にする
              ・最大60文字
              ・具体的な主張や意外な盲点を示す
              ・抽象的な精神論を避ける
              ・台本にない事実を追加しない
              ・「タイトル：」などのラベルを付けない
              ・説明文や候補一覧を出さない
              ・タイトルだけを1行で出力する
              ・「今日から、価値ある名言を新解釈してみましょう」
                のような内容の薄いタイトルは禁止
              {retry_note}
              """

              try:
                  title_response = requests.post(
                      "http://127.0.0.1:11434/api/generate",
                      json={
                          "model": model,
                          "prompt": title_prompt_retry,
                          "stream": False,
                          "options": {
                              "temperature": min(
                                  0.9,
                                  0.65 + title_attempt * 0.05
                              )
                          }
                      },
                      timeout=300
                  )

                  title_response.raise_for_status()

                  candidate_title = normalize_title(
                      title_response.json().get("response", "")
                  )

                  candidate_issues = title_quality_issues(
                      candidate_title
                  )

                  print(
                      "TITLE QUALITY ATTEMPT:",
                      title_attempt,
                      "TITLE:",
                      candidate_title,
                      "ISSUES:",
                      candidate_issues
                  )

                  if not candidate_issues:
                      title = candidate_title
                      title_issues = []
                      break

                  title_issues = candidate_issues

              except Exception as e:
                  title_issues = ["タイトル生成エラー"]

                  print(
                      "TITLE GENERATION ERROR:",
                      title_attempt,
                      str(e)[:250]
                  )

          # 4回失敗した場合は、台本の具体的な一文を代替候補にする
          if not title:
              sentences = re.split(
                  r"(?<=[。！？!?])",
                  script
              )

              candidates = [
                  sentence.strip().rstrip("。！？!? ")
                  for sentence in sentences
                  if len(sentence.strip()) >= 8
              ]

              for sentence in candidates:
                  fallback_title = sentence[:45].rstrip("、。 ")

                  if not title_quality_issues(fallback_title):
                      title = fallback_title
                      print("TITLE FALLBACK: VALIDATED")
                      break

          # 品質基準を満たすタイトルがなければ公開処理に進ませない
          if not title:
              raise RuntimeError(
                  "タイトル品質検査に失敗しました。"
                  "不適切なタイトルで公開しないため処理を停止します。"
              )

          print("TITLE QUALITY CHECK: PASSED")
          print("TITLE QUALITY ATTEMPTS:", title_attempt)
          print("VIDEO TITLE:", title)

          TITLE_FILE.write_text(
              title,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("VIDEO TITLE:", title)
          print("SCRIPT LENGTH:", len(script))

          print("VIDEO GENRE:", category)
          print("VIDEO TITLE:", title)
          print("SCRIPT LENGTH:", len(script))

                    # 6. 日本語音声を生成
          # Edge TTSの403エラーを避け、gTTSを使用する

          from gtts import gTTS

          sentences = re.split(
              r"(?<=[。！？!?])\s*",
              script
          )
          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          if not sentences:
              raise RuntimeError(
                  "音声用の文章がありません"
              )

          audio_dir = WORK / "audio_parts"
          audio_dir.mkdir(
              exist_ok=True
          )

          concat_file = WORK / "audio_list.txt"
          timings = []
          current_time = 0.0
          audio_files = []

          for i, sentence in enumerate(sentences):
              part = (
                  audio_dir
                  / f"part_{i:03d}.mp3"
              )

              print(
                  f"TTS: {i + 1}/{len(sentences)}"
              )

              try:
                  tts = gTTS(
                      text=sentence,
                      lang="ja",
                      slow=False
                  )

                  tts.save(str(part))

              except Exception as e:
                  raise RuntimeError(
                      "日本語音声の生成に失敗しました。"
                      f"文番号={i + 1}, エラー={e}"
                  ) from e

              if (
                  not part.exists()
                  or part.stat().st_size < 500
              ):
                  raise RuntimeError(
                      f"音声ファイルが不正です: {i}"
                  )

              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(part)
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              timings.append(
                  (
                      current_time,
                      current_time + duration,
                      sentence
                  )
              )

              current_time += duration
              audio_files.append(part)

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for part in audio_files:
                  safe = (
                      str(part.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(AUDIO_FILE)
          ])
          # 音声を15%速くする
