                      "読み上げる本文だけにしてください。"
                  )

              # 理由や根拠が説明されているか検査
              explanation_words = [
                  "理由", "原因", "仕組み", "つまり",
                  "たとえば", "例えば", "実際", "違い",
                  "結果", "なぜなら", "ため", "ためです",
                  "から", "からです", "ので", "によって",
                  "による", "ことで", "そのため", "結果として"
              ]


              if not any(w in text for w in explanation_words):
                  issues.append(
