              )

              repaired_lines = [
                  line.strip()
                  for line in repaired_raw.splitlines()
                  if line.strip()
                  and not re.fullmatch(r"[\W_]+", line.strip())
              ]

              repaired_script = clean_text(
                  "\n".join(repaired_lines)
              )

              # 空の回答なら、現在の候補を保持する
              if not repaired_script:
                  print(
