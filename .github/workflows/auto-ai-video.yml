          )

          # 検索語の重複を除去
          search_keywords = list(dict.fromkeys(
              category_keywords + fallback_keywords
          ))

          commons_api = "https://commons.wikimedia.org/w/api.php"
          bgm_found = False
          checked_titles = set()

          for keyword in search_keywords:
              if bgm_found:
                  break

              try:
                  print("BGM SEARCH:", keyword)

                  params = {
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": keyword,
                      "gsrnamespace": 6,
                      "gsrlimit": 50,
                      "prop": "imageinfo",
                      "iiprop": "url|extmetadata",
                      "format": "json",
                  }

                  response = requests.get(
                      commons_api,
                      params=params,
                      headers={
                          "User-Agent":
                              "AutoJapaneseVideo/1.0 (BGM search)"
                      },
                      timeout=30,
                  )
                  response.raise_for_status()

                  pages = (
                      response.json()
                      .get("query", {})
                      .get("pages", {})
                  )

                  candidates = list(pages.values())
                  random.shuffle(candidates)

                  print(
                      "BGM SEARCH RESULTS:",
                      keyword,
                      len(candidates),
                  )

                  for page in candidates:
                      if bgm_found:
                          break

                      page_title = page.get("title", "")

                      if page_title in checked_titles:
                          continue

                      checked_titles.add(page_title)

                      info_list = page.get("imageinfo", [])
                      if not info_list:
                          continue

                      info = info_list[0]
                      audio_url = info.get("url", "")
                      metadata = info.get("extmetadata", {})

                      if not audio_url:
                          continue

                      extension = Path(
                          urlparse(audio_url).path
                      ).suffix.lower()

                      # 音声ファイルだけを対象にする
                      if extension not in (
                          ".ogg",
                          ".oga",
                          ".mp3",
                          ".wav",
                          ".flac",
                      ):
                          continue

                      license_name = html.unescape(
                          metadata.get(
                              "LicenseShortName", {}
                          ).get("value", "")
                      ).strip()

                      license_lower = license_name.lower()

                      # ライセンスが確認できる音源に限定
                      allowed_license = (
                          "cc0" in license_lower
                          or "public domain" in license_lower
                          or "public-domain" in license_lower
                      )

                      if not allowed_license:
                          print(
                              "BGM LICENSE SKIP:",
                              page_title,
                              license_name or "unknown",
