                      "options": {
                          "temperature": 0.35
                      }
                  },
                  timeout=900
              )

              repair_response.raise_for_status()

              repaired_raw = strip_prompt_leakage(
                  repair_response.json().get(
                      "response", ""
                  )
              )

              repaired_raw = re.sub(
                  r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
