          # Googleニュースのリンクを配信元URLに変換して本文を取得する
          from html.parser import HTMLParser
          from html import unescape
          from urllib.parse import urlparse

          class ArticleTextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.current = []
                  self.in_paragraph = False
                  self.skip_depth = 0

              def handle_starttag(self, tag, attrs):
                  if tag in (
                      "script", "style", "nav",
                      "footer", "header", "aside"
                  ):
                      self.skip_depth += 1
                  elif tag == "p" and self.skip_depth == 0:
                      self.in_paragraph = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_paragraph and self.skip_depth == 0:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "p" and self.in_paragraph:
                      paragraph = clean_text(
                          " ".join(self.current)
                      )
                      if len(paragraph) >= 20:
                          self.parts.append(paragraph)

                      self.current = []
                      self.in_paragraph = False

                  elif tag in (
                      "script", "style", "nav",
                      "footer", "header", "aside"
                  ):
                      self.skip_depth = max(
                          0, self.skip_depth - 1
                      )

          def resolve_google_news_url(link):
              parsed = urlparse(link)

              if parsed.hostname not in (
                  "news.google.com",
                  "www.news.google.com"
              ):
                  return link

              article_id = parsed.path.rstrip("/").split("/")[-1]

              if not article_id:
                  raise RuntimeError(
                      "Googleニュースの記事IDを取得できません。"
                  )

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120.0.0.0 Safari/537.36"
                  ),
                  "Cookie": "CONSENT=YES+cb; SOCS=CAI"
              }

              google_page = requests.get(
                  "https://news.google.com/rss/articles/"
                  + article_id,
                  headers=headers,
                  timeout=30
              )
              google_page.raise_for_status()

              page_html = google_page.text

              signature_match = re.search(
                  r'data-n-a-sg="([^"]+)"',
                  page_html
              )
              timestamp_match = re.search(
                  r'data-n-a-ts="([^"]+)"',
                  page_html
              )

              if not signature_match or not timestamp_match:
                  raise RuntimeError(
                      "Googleニュースの署名情報を取得できません。"
                  )

              signature = unescape(
                  signature_match.group(1)
              )
              timestamp = timestamp_match.group(1)

              inner = (
                  '["garturlreq",[["X","X",["X","X"],'
                  'null,null,1,1,"US:en",null,1,'
                  'null,null,null,null,null,0,1],'
                  '"X","X",1,[1,1,1],1,1,null,0,0,null,0],'
                  f'"{article_id}",{timestamp},"{signature}"]'
              )

              request_body = json.dumps(
                  [[[
                      "Fbv4je",
                      inner,
                      None,
                      "generic"
                  ]]]
              )

              resolve_response = requests.post(
                  "https://news.google.com/"
                  "_/DotsSplashUi/data/batchexecute",
                  headers={
                      **headers,
                      "Content-Type": (
                          "application/x-www-form-urlencoded;charset=UTF-8"
                      )
                  },
                  data={
                      "f.req": request_body
                  },
                  timeout=30
              )
              resolve_response.raise_for_status()

              response_text = resolve_response.text

              if response_text.startswith(")]}'"):
                  response_text = response_text[4:]

              response_data = json.loads(response_text)

              found_urls = []

              def collect_urls(value):
                  if isinstance(value, str):
                      matches = re.findall(
                          r'https?://[^\s"\\]+',
                          value
                      )

                      for candidate in matches:
                          candidate = candidate.rstrip(
                              ".,;)]}"
                          )
                          host = urlparse(candidate).hostname or ""

                          if (
                              host
                              and "google." not in host
                              and candidate not in found_urls
                          ):
                              found_urls.append(candidate)

                      if value.startswith(("[", "{")):
                          try:
                              collect_urls(json.loads(value))
                          except Exception:
                              pass

                  elif isinstance(value, list):
                      for item in value:
                          collect_urls(item)

                  elif isinstance(value, dict):
                      for item in value.values():
                          collect_urls(item)

              collect_urls(response_data)

              if not found_urls:
                  raise RuntimeError(
                      "Googleニュースから配信元URLを"
                      "解決できませんでした。"
                  )

              return found_urls[0]

          
