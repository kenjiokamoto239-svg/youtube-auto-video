name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            espeak-ng \
            libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            soundfile \
            pillow \
            requests \
            feedparser \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            unidic-lite \
            "kokoro_onnx @ git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            "misaki-fork[ja]"

      - name: Download Japanese dictionary
        run: |
          python -m unidic download

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          ollama pull qwen2.5:3b

      - name: Create work folders
        run: |
          mkdir -p input output model
          rm -f input/title.txt
          rm -f input/script.txt
          rm -f input/source.txt
          rm -f input/topic.txt
          rm -f input/background.png
          rm -f input/background_credit.txt
          rm -f input/audio.wav
          rm -f input/subtitles.ass
          rm -f output/video.mp4

      - name: Generate news-based Japanese script
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          python - <<'PY'
          import feedparser
          import random
          import re
          import subprocess
          import time
          from pathlib import Path

          Path("input").mkdir(exist_ok=True)

          feeds = [
              ("岡山・介護", "https://news.google.com/rss/search?q=岡山+介護+福祉&hl=ja&gl=JP&ceid=JP:ja"),
              ("介護・社会保障", "https://news.google.com/rss/search?q=介護+社会保障+人手不足&hl=ja&gl=JP&ceid=JP:ja"),
              ("三重県熊野市", "https://news.google.com/rss/search?q=三重県+熊野市&hl=ja&gl=JP&ceid=JP:ja"),
              ("ランニング・健康", "https://news.google.com/rss/search?q=ランニング+健康+スポーツ&hl=ja&gl=JP&ceid=JP:ja"),
              ("国内ニュース", "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja"),
              ("経済・仕事", "https://news.google.com/rss/search?q=日本+経済+働き方&hl=ja&gl=JP&ceid=JP:ja"),
          ]

          candidates = []
          for category, url in feeds:
              try:
                  parsed = feedparser.parse(url)
                  for entry in parsed.entries[:8]:
                      title = re.sub(r"\s+", " ", entry.get("title", "")).strip()
                      link = entry.get("link", "")
                      summary = re.sub(
                          r"<[^>]+>", " ",
                          entry.get("summary", "")
                      )
                      summary = re.sub(r"\s+", " ", summary).strip()

                      if title and len(title) >= 8:
                          candidates.append({
                              "category": category,
                              "title": title,
                              "link": link,
                              "summary": summary
                          })
              except Exception as e:
                  print("RSS error:", category, str(e))

          if candidates:
              # タイトルの重複を除去
              unique = {}
              for item in candidates:
                  unique[item["title"]] = item
              candidates = list(unique.values())
              random.shuffle(candidates)
              chosen = candidates[0]
              category = chosen["category"]
              news_title = chosen["title"]
              news_summary = chosen["summary"]
              source_url = chosen["link"]
          else:
              category = "今日の名言"
              news_title = "努力を続ける人が見落としがちなこと"
              news_summary = (
                  "結果だけを追うと、日々の改善や継続の価値を"
                  "見落としやすい。"
              )
              source_url = ""

          prompt = f"""
          あなたは日本語のYouTubeショート動画の構成作家です。

          テーマ分類：{category}
          参考ニュースの見出し：{news_title}
          参考ニュースの概要：{news_summary}
          参考URL：{source_url}

          このニュースやテーマについて、内容のある日本語台本を作成してください。

          必ず守ること：
          1. 見出しを読み上げるだけの台本は禁止。
          2. 具体的に何が起きたのか、何が問題なのかを説明する。
          3. その問題が視聴者の生活や社会にどう影響するかを説明する。
          4. 自分の主張をはっきり述べる。
          5. 無難な感想だけで終わらない。
          6. 反対意見や別の立場にも触れたうえで、自分の考えを述べる。
          7. 根拠のない数字、発言、事実を作らない。
          8. 参考ニュースだけでは確認できない事実は断定しない。
          9. 強い言葉を使ってよいが、個人への侮辱や差別は禁止。
          10. 日本語として自然に読み上げられる文章にする。
          11. 英語の略語やアルファベットを多用しない。
          12. 意味のない英数字、文字化け、記号の羅列は禁止。
          13. 介護の話題なら、人手不足、賃金、制度、経営などの
              構造的な問題にも踏み込む。
          14. ランニングや健康なら、実践できる具体策を入れる。
          15. 名言のテーマなら、名言の紹介だけでなく、
              現実の行動にどうつなげるかを説明する。
          16. 最後は視聴者が考えたくなる、はっきりした結論にする。

          出力形式は厳守してください。

          TITLE:
          20文字前後の日本語タイトル

          SCRIPT:
          350〜500文字程度の日本語台本

          台本はそのまま音声合成と字幕に使用します。
          タイトルや「TITLE」「SCRIPT」というラベルを
          台本本文に混ぜないでください。
          """

          result = subprocess.run(
              ["ollama", "run", "qwen2.5:3b"],
              input=prompt,
              capture_output=True,
              text=True,
              encoding="utf-8",
              timeout=240
          )

          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit("台本生成に失敗しました")

          answer = result.stdout.strip()
          print("Generated response:")
          print(answer)

          title_match = re.search(
              r"TITLE\s*:\s*(.*)",
              answer,
              flags=re.IGNORECASE
          )
          script_match = re.search(
              r"SCRIPT\s*:\s*(.*)",
              answer,
              flags=re.IGNORECASE | re.DOTALL
          )

          title = title_match.group(1).strip() if title_match else news_title
          script = script_match.group(1).strip() if script_match else answer

          script = re.sub(r"^\s*(TITLE|SCRIPT)\s*:\s*", "", script,
                          flags=re.IGNORECASE)
          script = re.sub(r"\n{3,}", "\n\n", script)
          script = re.sub(r"[ \t]+", " ", script)
          script = script.strip()

          # 不自然な制御文字や明らかな文字化けを検出
          suspicious = [
              "\ufffd",
              "R[1D[K",
              "2026h251",
              "25h2026l2026h25l",
          ]

          if any(x in title + script for x in suspicious):
              raise SystemExit("生成された文章に文字化けの疑いがあります")

          if len(title) < 4:
              title = news_title[:40]

          if len(script) < 180:
              raise SystemExit(
                  f"台本が短すぎます: {len(script)}文字"
              )

          if len(script) > 1000:
              script = script[:1000]

          Path("input/title.txt").write_text(title, encoding="utf-8")
          Path("input/script.txt").write_text(script, encoding="utf-8")
          Path("input/source.txt").write_text(source_url, encoding="utf-8")
          Path("input/topic.txt").write_text(category, encoding="utf-8")

          print("Category:", category)
          print("Title:", title)
          print("Script length:", len(script))
          PY

      - name: Download Japanese Kokoro model
        run: |
          set -e
          curl -fL --retry 3 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -o model/kokoro-v1.0.int8.onnx

          curl -fL --retry 3 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -o model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

      - name: Generate Japanese speech and subtitles
        run: |
          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro
          from misaki import ja

          title = Path("input/title.txt").read_text(encoding="utf-8").strip()
          script = Path("input/script.txt").read_text(encoding="utf-8").strip()

          # 読み上げやすいよう、代表的な略語・固有表記を調整
          replacements = {
              "YouTube": "ユーチューブ",
              "youtube": "ユーチューブ",
              "SNS": "エスエヌエス",
              "AI": "エーアイ",
              "READYFOR": "レディーフォー",
              "Wi-Fi": "ワイファイ",
              "DX": "デジタルトランスフォーメーション",
              "NPO": "エヌピーオー",
          }

          for old, new in replacements.items():
              script = script.replace(old, new)

          # URLや不要な制御文字を除去
          script = re.sub(r"https?://\S+", "", script)
          script = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", script)
          script = re.sub(r"\s+", " ", script).strip()

          if len(script) < 100:
              raise SystemExit("音声化する台本が短すぎます")

          # 句点・疑問符・感嘆符で文章を区切る
          sentences = re.split(r"(?<=[。！？!?])", script)
          sentences = [s.strip() for s in sentences if s.strip()]

          # 長文は読み上げやすい長さに分割
          chunks = []
          for sentence in sentences:
              if len(sentence) <= 70:
                  chunks.append(sentence)
              else:
                  parts = re.split(r"(?<=[、，,])", sentence)
                  current = ""
                  for part in parts:
                      if len(current) + len(part) > 55 and current:
                          chunks.append(current)
                          current = part
                      else:
                          current += part
                  if current:
                      chunks.append(current)

          if not chunks:
              chunks = [script]

          # 日本語用のG2Pで読みを音素に変換
          g2p = ja.JAG2P()
          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin"
          )

          audio_parts = []
          subtitle_events = []
          cursor = 0.0

          for chunk in chunks:
              phonemes, _ = g2p(chunk)
              if not phonemes:
                  continue

              audio, sample_rate = kokoro.create(
                  phonemes,
                  voice="jf_alpha",
                  speed=1.0,
                  is_phonemes=True
              )

              audio = np.asarray(audio, dtype=np.float32)

              if audio.size == 0:
                  continue

              audio_parts.append(audio)

              duration = len(audio) / sample_rate
              subtitle_events.append((cursor, cursor + duration, chunk))
              cursor += duration

              # 文の間に短い無音を入れる
              pause = int(sample_rate * 0.18)
              audio_parts.append(np.zeros(pause, dtype=np.float32))
              cursor += 0.18

          if not audio_parts:
              raise SystemExit("日本語音声を生成できませんでした")

          combined = np.concatenate(audio_parts)
          sf.write("input/audio.wav", combined, sample_rate)

          def ass_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = int(seconds % 60)
              cs = int((seconds - int(seconds)) * 100)
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          def ass_escape(text):
              text = text.replace("\\", "＼")
              text = text.replace("{", "｛").replace("}", "｝")
              return text

          def split_subtitle(text, width=18):
              text = text.strip()
              if len(text) <= width:
                  return text
              # 日本語字幕はおおむね18文字で2行に分ける
              lines = textwrap.wrap(
                  text,
                  width=width,
                  break_long_words=True,
                  break_on_hyphens=False
              )
              return r"\N".join(lines[:2])

          ass = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 2",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,230,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for start, end, text in subtitle_events:
              if end <= start:
                  continue
              caption = split_subtitle(ass_escape(text))
              ass.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Default,,0,0,0,,{caption}"
              )

          Path("input/subtitles.ass").write_text(
              "\n".join(ass) + "\n",
              encoding="utf-8-sig"
          )

          print("Audio duration:", len(combined) / sample_rate)
          print("Subtitle events:", len(subtitle_events))
          PY

      - name: Create relevant background image
        run: |
          python - <<'PY'
          import io
          import random
          import re
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageEnhance, ImageFilter

          title = Path("input/title.txt").read_text(encoding="utf-8").strip()
          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()
          script = Path("input/script.txt").read_text(encoding="utf-8").strip()

          queries = {
              "岡山・介護": "elderly care nursing home",
              "介護・社会保障": "elderly care nursing home",
              "三重県熊野市": "Kumano Mie Japan coast",
              "ランニング・健康": "running athlete road",
              "経済・仕事": "office work business",
              "国内ニュース": "Japan city street",
              "今日の名言": "sunrise mountain landscape",
          }

          query = queries.get(topic, "Japan landscape")
          image = None
          credit = "Generated background"

          try:
              api = "https://commons.wikimedia.org/w/api.php"
              response = requests.get(
                  api,
                  params={
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": query,
                      "gsrnamespace": 6,
                      "gsrlimit": 8,
                      "prop": "imageinfo",
                      "iiprop": "url|extmetadata",
                      "format": "json",
                  },
                  headers={"User-Agent": "AutoJapaneseShorts/1.0"},
                  timeout=20
              )
              response.raise_for_status()
              pages = response.json().get("query", {}).get("pages", {})
              candidates = list(pages.values())
              random.shuffle(candidates)

              for page in candidates:
                  info = page.get("imageinfo", [{}])[0]
                  url = info.get("url", "")
                  if not url.lower().endswith((".jpg", ".jpeg", ".png", ".webp")):
                      continue
                  try:
                      r = requests.get(
                          url,
                          headers={"User-Agent": "AutoJapaneseShorts/1.0"},
                          timeout=20
                      )
                      r.raise_for_status()
                      image = Image.open(io.BytesIO(r.content)).convert("RGB")
                      meta = info.get("extmetadata", {})
                      artist = meta.get("Artist", {}).get("value", "")
                      license_name = meta.get("LicenseShortName", {}).get("value", "")
                      credit = f"{page.get('title','')}; {artist}; {license_name}; {url}"
                      break
                  except Exception:
                      continue
          except Exception as e:
              print("Commons search failed:", str(e))

          W, H = 1080, 1920

          if image is not None:
              iw, ih = image.size
              scale = max(W / iw, H / ih)
              image = image.resize(
                  (int(iw * scale), int(ih * scale)),
                  Image.Resampling.LANCZOS
              )
              left = (image.width - W) // 2
              top = (image.height - H) // 2
              image = image.crop((left, top, left + W, top + H))
              image = ImageEnhance.Color(image).enhance(0.85)
              image = ImageEnhance.Brightness(image).enhance(0.58)
              image = image.filter(ImageFilter.GaussianBlur(0.3))
          else:
              # ネット検索に失敗した場合も黒画面にしない
              image = Image.new("RGB", (W, H), (20, 45, 65))
              draw = ImageDraw.Draw(image)
              for y in range(H):
                  ratio = y / H
                  c = (
                      int(20 + ratio * 25),
                      int(45 + ratio * 15),
                      int(65 + ratio * 30)
                  )
                  draw.line((0, y, W, y), fill=c)

          # 下部の字幕を読みやすくするための暗いグラデーション
          overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          for y in range(700, H):
              alpha = int(100 * (y - 700) / (H - 700))
              draw.line((0, y, W, y), fill=(0, 0, 0, alpha))
          image = Image.alpha_composite(image.convert("RGBA"), overlay).convert("RGB")

          Path("input/background.png").parent.mkdir(exist_ok=True)
          image.save("input/background.png", quality=92)
          Path("input/background_credit.txt").write_text(credit, encoding="utf-8")

          print("Background created for:", topic)
          print("Credit:", credit)
          PY

      - name: Render vertical video
        run: |
          set -e

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.wav)

          echo "Audio duration: $DURATION seconds"

          python - <<'PY'
          from pathlib import Path
          import re

          title = Path("input/title.txt").read_text(encoding="utf-8").strip()
          title = re.sub(r"[\r\n]+", " ", title)
          title = re.sub(r"\s+", " ", title).strip()
          Path("input/title.txt").write_text(title, encoding="utf-8")
          PY

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 160k \
            -ar 44100 \
            -shortest \
            -movflags +faststart \
            output/video.mp4

          test -s output/video.mp4

      - name: Validate video
        run: |
          set -e

          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,width,height \
            -show_entries format=duration \
            -of json \
            output/video.mp4 | tee output/diagnostics.json

          python - <<'PY'
          import json
          import subprocess

          data = json.load(open("output/diagnostics.json", encoding="utf-8"))
          streams = data.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          duration = float(data.get("format", {}).get("duration", 0))

          if not video:
              raise SystemExit("動画ストリームがありません")
          if not audio:
              raise SystemExit("音声ストリームがありません")
          if video.get("codec_name") != "h264":
              raise SystemExit("動画形式がH.264ではありません")
          if video.get("width") != 1080 or video.get("height") != 1920:
              raise SystemExit("動画サイズが1080×1920ではありません")
          if duration < 5 or duration > 180:
              raise SystemExit(f"動画の長さが範囲外です: {duration}秒")

          print("Video validation passed:", duration, "seconds")
          PY

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ.get("YOUTUBE_CLIENT_ID", "")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET", "")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN", "")

          if not all([client_id, client_secret, refresh_token]):
              raise SystemExit(
                  "YouTube認証情報がありません。GitHub Secretsを確認してください。"
              )

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          title = Path("input/title.txt").read_text(encoding="utf-8").strip()
          script = Path("input/script.txt").read_text(encoding="utf-8").strip()
          source = Path("input/source.txt").read_text(encoding="utf-8").strip()
          topic = Path("input/topic.txt").read_text(encoding="utf-8").strip()

          title = title[:95]
          description = (
              f"{script}\n\n"
              f"テーマ：{topic}\n"
              f"参考情報：{source if source else '参考URLなし'}\n\n"
              "#Shorts #ニュース #考える"
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description[:4900],
                  "tags": ["Shorts", "日本語", topic, "ニュース"],
                  "categoryId": "25"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          video_id = response["id"]
          video_url = f"https://www.youtube.com/shorts/{video_id}"

          Path("output/youtube_url.txt").write_text(video_url, encoding="utf-8")
          print("Uploaded as private:", video_url)

          # アップロード直後に公開設定へ変更
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("Video visibility set to public:", video_url)
          PY

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video-${{ github.run_number }}
          path: |
            output/video.mp4
            output/diagnostics.json
            output/youtube_url.txt
            input/title.txt
            input/script.txt
            input/source.txt
            input/topic.txt
            input/audio.wav
            input/subtitles.ass
            input/background.png
            input/background_credit.txt
          if-no-files-found: warn
          retention-days: 7
