name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # GitHubリポジトリ取得
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Ollama
      # ==========================================
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:1.5b


      # ==========================================
      # 作業フォルダ作成
      # ==========================================
      - name: Prepare folders
        run: |
          mkdir -p input
          mkdir -p output
          mkdir -p model


      # ==========================================
      # ランダムテーマ生成
      # ==========================================
      - name: Generate random topic
        shell: python
        run: |
          from pathlib import Path
          import random

          topics = [
              "習慣",
              "お金",
              "仕事",
              "人間関係",
              "時間の使い方",
              "健康",
              "自己成長",
              "読書",
              "メンタル",
              "ランニング",
              "人生",
              "節約",
              "集中力",
              "行動力",
              "睡眠",
              "スマホ",
              "40代の生き方",
              "介護の仕事術"
          ]

          angles = [
              "今日からできる小さな行動",
              "知らないと損する考え方",
              "多くの人がやってしまう失敗",
              "人生が少し楽になる方法",
              "忙しい人でも続けられる方法",
              "お金をかけずにできる方法",
              "やめるだけで変わること",
              "1日5分でできること",
              "仕事の効率を上げる方法",
              "将来の自分を助ける考え方"
          ]

          topic = random.choice(topics)
          angle = random.choice(angles)
          seed = random.randint(100000, 999999)

          text = (
              f"テーマ：{topic}\n"
              f"切り口：{angle}\n"
              f"乱数：{seed}\n"
          )

          Path("topic.txt").write_text(
              text,
              encoding="utf-8"
          )

          print(text)


      # ==========================================
      # YouTubeタイトル生成
      #
      # ※音声・字幕には使わない
      # ==========================================
      - name: Generate title
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          topic = Path("topic.txt").read_text(
              encoding="utf-8"
          )

          prompt = f"""
          YouTubeショート動画のタイトルを1つだけ作ってください。

          テーマ：
          {topic}

          条件：
          ・日本語
          ・18〜30文字程度
          ・続きを見たくなる
          ・自然な日本語
          ・テーマと関係する
          ・煽りすぎない
          ・タイトルだけ出力
          ・説明禁止
          ・前置き禁止
          ・「タイトル：」禁止
          ・絵文字禁止
          ・ハッシュタグ禁止
          ・数字や記号を無意味に繰り返さない
          """

          title = ""

          for attempt in range(3):

              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True
              )

              candidate = result.stdout.strip()

              if not candidate:
                  continue

              candidate = candidate.splitlines()[0].strip()

              candidate = re.sub(
                  r"^(タイトル|TITLE)\s*[:：]\s*",
                  "",
                  candidate,
                  flags=re.I
              )

              candidate = candidate.replace('"', "")
              candidate = candidate.replace("'", "")
              candidate = candidate.replace("#", "")
              candidate = candidate.strip()

              japanese_count = len(
                  re.findall(
                      r"[ぁ-んァ-ヶ一-龠]",
                      candidate
                  )
              )

              bad_loop = (
                  re.search(r"(2026){2,}", candidate)
                  or re.search(r"(h2026){2,}", candidate, re.I)
                  or re.search(r"(25h){2,}", candidate, re.I)
              )

              if (
                  8 <= len(candidate) <= 60
                  and japanese_count >= 6
                  and not bad_loop
              ):
                  title = candidate
                  break

          if not title:
              title = "今日から変わる小さな習慣"

          Path("video_title.txt").write_text(
              title,
              encoding="utf-8"
          )

          print("===== YouTubeタイトル =====")
          print(title)


      # ==========================================
      # 台本生成
      #
      # ★音声と字幕に使うのはここだけ
      # ==========================================
      - name: Generate script
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re
          import random

          topic = Path("topic.txt").read_text(
              encoding="utf-8"
          )

          prompt = f"""
          あなたは日本語YouTubeショート動画の台本ライターです。

          以下のテーマについて、
          視聴者が聞く台本本文だけを書いてください。

          【テーマ】
          {topic}

          【条件】
          ・140〜220文字
          ・日本語
          ・自然な日本語
          ・最初の1文で興味を引く
          ・具体例を1つ入れる
          ・内容を最後まで一貫させる
          ・最後は具体的な行動提案
          ・短い文章を中心にする
          ・句読点を使う
          ・タイトルを書かない
          ・説明を書かない
          ・前置きを書かない
          ・ハッシュタグ禁止
          ・絵文字禁止
          ・英語禁止
          ・同じ文字を大量に繰り返さない
          ・数字や記号を無意味に繰り返さない

          出力は台本本文だけ。
          """

          def valid(text):

              text = re.sub(
                  r"\s+",
                  "",
                  text
              )

              japanese_count = len(
                  re.findall(
                      r"[ぁ-んァ-ヶ一-龠]",
                      text
                  )
              )

              if not (
                  120 <= len(text) <= 240
              ):
                  return False

              if japanese_count < 80:
                  return False

              if re.search(
                  r"(2026){2,}",
                  text
              ):
                  return False

              if re.search(
                  r"(h2026){2,}",
                  text,
                  re.I
              ):
                  return False

              if re.search(
                  r"(25h){2,}",
                  text,
                  re.I
              ):
                  return False

              if re.search(
                  r"(.)\1{8,}",
                  text
              ):
                  return False

              return True

          script = ""

          for attempt in range(3):

              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True
              )

              candidate = result.stdout.strip()

              candidate = re.sub(
                  r"^(SCRIPT|台本)\s*[:：]\s*",
                  "",
                  candidate,
                  flags=re.I
              )

              candidate = re.sub(
                  r"\s+",
                  "",
                  candidate
              )

              candidate = candidate.strip(
                  '"「」『』'
              )

              candidate = re.sub(
                  r"#\S+",
                  "",
                  candidate
              )

              if len(candidate) > 220:

                  short = candidate[:220]

                  positions = [
                      short.rfind("。"),
                      short.rfind("！"),
                      short.rfind("？")
                  ]

                  cut = max(positions)

                  if cut >= 120:
                      candidate = short[:cut + 1]
                  else:
                      candidate = short

              print("")
              print(
                  f"台本生成試行 {attempt + 1}"
              )

              print(
                  f"文字数：{len(candidate)}"
              )

              print(candidate)

              if valid(candidate):

                  script = candidate
                  break

          # ==========================================
          # AIが失敗した場合の安全な台本
          # ==========================================
          if not script:

              fallback_scripts = [

                  "人生を変えたいなら、いきなり大きなことを始める必要はありません。大切なのは、毎日続けられる小さな行動を一つ決めることです。例えば、寝る前に明日の重要な仕事を一つだけ決めておく。これだけでも朝の迷いが減ります。今日から一つだけ習慣を決めて、まず一週間続けてみましょう。",

                  "お金を貯めたいのに、なぜか増えない。そんな人は、収入を増やす前に無意識の支出を確認してみましょう。例えば、使っていないサブスクを一つ解約するだけでも毎月の固定費は下がります。小さな金額でも一年続けば大きな差になります。今日、使っていないサービスを一つ確認してみてください。",

                  "仕事が忙しい人ほど、全部を頑張ろうとしてしまいます。でも本当に大切なのは、今日やるべきことを一つ決めることです。例えば、朝一番に最重要の仕事を30分だけ進める。これだけでも一日の達成感は変わります。忙しい日は、全部終わらせることより、一番大切なことを終わらせることを意識してみましょう。",

                  "健康のために何か始めたいなら、最初から完璧を目指さないことです。例えば毎日一時間運動するより、まずは10分歩くことから始める。大切なのは運動量より、続けられる仕組みを作ることです。できた日を積み重ねれば、少しずつ行動は大きくなります。今日から10分だけ体を動かしてみましょう。",

                  "集中できないときは、気合いで頑張るより環境を変える方が簡単です。例えばスマホを別の部屋に置いて、25分だけ一つの作業に集中する。通知が目に入らなくなるだけでも、余計な中断は減ります。集中力がない自分を責める前に、集中しやすい環境を作ってみましょう。まずは25分だけ試してください。"

              ]

              script = random.choice(
                  fallback_scripts
              )

              print("")
              print(
                  "AI台本生成に失敗したため、"
                  "安全な台本を使用します。"
              )

          # ★必ずここへ保存
          output = Path(
              "input/script.txt"
          )

          output.write_text(
              script,
              encoding="utf-8"
          )

          print("")
          print("===== 完成台本 =====")
          print(script)
          print("")
          print(
              f"台本文字数：{len(script)}"
          )
          print(
              f"保存先：{output}"
          )


      # ==========================================
      # 台本ファイル確認
      # ==========================================
      - name: Validate script
        shell: bash
        run: |
          set -e

          test -s input/script.txt

          echo "===== 音声・字幕に使う本文 ====="
          cat input/script.txt

          echo ""
          echo "台本ファイル確認OK"


      # ==========================================
      # Python環境
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Pythonパッケージ
      # ==========================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy \
            pillow

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ==========================================
      # FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk


      # ==========================================
      # Kokoroモデル準備
      # ==========================================
      - name: Prepare Kokoro
        run: |
          test -s input/script.txt

          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

          echo "Kokoroモデル準備OK"


      # ==========================================
      # 日本語音声生成
      #
      # 台本だけを使用
      # ==========================================
      - name: Generate Japanese voice
        shell: python
        run: |
          from pathlib import Path
          import soundfile as sf

          from kokoro_onnx import Kokoro

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("===== TTS本文 =====")
          print(text)

          model = Kokoro(
              model_path=(
                  "model/kokoro-v1.0.int8.onnx"
              ),
              voice_path=(
                  "model/jf_alpha.bin"
              )
          )

          audio, sample_rate = model.create(
              text
          )

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          duration = (
              len(audio)
              / sample_rate
          )

          print(
              f"音声時間：{duration:.2f}秒"
          )

          if duration < 12:
              raise SystemExit(
                  "音声が12秒未満です"
              )

          if duration > 70:
              raise SystemExit(
                  "音声が70秒を超えています"
              )

          print("音声生成OK")


      # ==========================================
      # 音声チェック
      # ==========================================
      - name: Validate audio
        shell: bash
        run: |
          set -e

          test -s input/audio.wav

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.wav)

          echo "Audio duration: $DURATION"

          python - <<PY
          duration = float("$DURATION")

          if duration < 12:
              raise SystemExit("音声が短すぎます")

          if duration > 70:
              raise SystemExit("音声が長すぎます")

          print("音声検査OK")
          PY


      # ==========================================
      # 自動背景生成
      # ==========================================
      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw
          import random

          WIDTH = 1080
          HEIGHT = 1920

          random.seed()

          img = Image.new(
              "RGB",
              (WIDTH, HEIGHT)
          )

          draw = ImageDraw.Draw(img)

          top = (
              random.randint(10, 40),
              random.randint(20, 60),
              random.randint(60, 120)
          )

          bottom = (
              random.randint(40, 100),
              random.randint(20, 70),
              random.randint(80, 150)
          )

          # 高速な縦グラデーション
          for y in range(HEIGHT):

              ratio = y / (HEIGHT - 1)

              color = tuple(
                  int(
                      top[i] * (1 - ratio)
                      + bottom[i] * ratio
                  )
                  for i in range(3)
              )

              draw.line(
                  [(0, y), (WIDTH, y)],
                  fill=color
              )

          # 光の円
          for _ in range(10):

              radius = random.randint(
                  100,
                  400
              )

              x = random.randint(
                  -100,
                  WIDTH + 100
              )

              y = random.randint(
                  -100,
                  HEIGHT + 100
              )

              color = (
                  random.randint(100, 255),
                  random.randint(100, 255),
                  random.randint(100, 255),
                  random.randint(20, 60)
              )

              overlay = Image.new(
                  "RGBA",
                  img.size,
                  (0, 0, 0, 0)
              )

              overlay_draw = ImageDraw.Draw(
                  overlay
              )

              overlay_draw.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=color
              )

              img = Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")

          # 中央の読みやすい領域
          overlay = Image.new(
              "RGBA",
              img.size,
              (0, 0, 0, 0)
          )

          overlay_draw = ImageDraw.Draw(
              overlay
          )

          overlay_draw.rounded_rectangle(
              (
                  55,
                  500,
                  WIDTH - 55,
                  1420
              ),
              radius=60,
              fill=(0, 0, 0, 65)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              overlay
          ).convert("RGB")

          img.save(
              "input/background.png"
          )

          print(
              "背景画像生成OK"
          )


      # ==========================================
      # ASS字幕生成
      # ==========================================
      - name: Generate subtitles
        shell: python
        run: |
          from pathlib import Path
          import re
          import soundfile as sf

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          audio, sr = sf.read(
              "input/audio.wav"
          )

          duration = (
              len(audio) / sr
          )

          sentences = [
              x.strip()
              for x in re.split(
                  r"(?<=[。！？])",
                  text
              )
              if x.strip()
          ]

          if not sentences:
              raise SystemExit(
                  "字幕文章がありません"
              )

          display_sentences = []

          for sentence in sentences:

              if len(sentence) <= 20:

                  display_sentences.append(
                      sentence
                  )

                  continue

              middle = len(sentence) // 2

              candidates = []

              for i in range(
                  max(5, middle - 8),
                  min(
                      len(sentence) - 1,
                      middle + 8
                  )
              ):

                  if sentence[i] in "、。！？":
                      candidates.append(i)

              if candidates:

                  cut = min(
                      candidates,
                      key=lambda x:
                      abs(x - middle)
                  )

                  display_sentences.append(
                      sentence[:cut + 1]
                      + "\\N"
                      + sentence[cut + 1:]
                  )

              else:

                  display_sentences.append(
                      sentence
                  )

          total_chars = sum(
              len(
                  s.replace(
                      "\\N",
                      ""
                  )
              )
              for s in display_sentences
          )

          def ass_time(seconds):

              total_cs = int(
                  round(seconds * 100)
              )

              hours = (
                  total_cs // 360000
              )

              total_cs %= 360000

              minutes = (
                  total_cs // 6000
              )

              total_cs %= 6000

              seconds_value = (
                  total_cs // 100
              )

              centiseconds = (
                  total_cs % 100
              )

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{seconds_value:02d}."
                  f"{centiseconds:02d}"
              )

          header = "\n".join([
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 2",
              "ScaledBorderAndShadow: yes",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H90000000,1,0,0,0,100,100,0,0,1,5,1,2,80,80,500,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          ])

          events = []

          current = 0.0

          for i, sentence in enumerate(
              display_sentences
          ):

              clean = sentence.replace(
                  "\\N",
                  ""
              )

              portion = (
                  duration
                  * len(clean)
                  / total_chars
              )

              start = current

              if i == len(
                  display_sentences
              ) - 1:

                  end = duration

              else:

                  end = (
                      current
                      + portion
                  )

              subtitle = (
                  sentence
                  .replace(
                      "{",
                      "\\{"
                  )
                  .replace(
                      "}",
                      "\\}"
                  )
              )

              event = (
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + subtitle
              )

              events.append(event)

              current = end

          Path(
              "input/subtitles.ass"
          ).write_text(
              header
              + "\n"
              + "\n".join(events)
              + "\n",
              encoding="utf-8"
          )

          print(
              "字幕生成OK"
          )


      # ==========================================
      # 字幕チェック
      # ==========================================
      - name: Validate subtitles
        run: |
          set -e

          test -s input/subtitles.ass

          grep -q "Dialogue:" \
            input/subtitles.ass

          echo "字幕検査OK"


      # ==========================================
      # MP4生成
      # ==========================================
      - name: Generate MP4
        run: |
          set -e

          ffmpeg -y \
            -loop 1 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          test -s output/video.mp4

          echo "MP4生成OK"


      # ==========================================
      # 完成動画チェック
      # ==========================================
      - name: Validate final video
        shell: bash
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/video.mp4)

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/video.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/video.mp4)

          echo "Video duration: $DURATION"
          echo "Video size: ${WIDTH}x${HEIGHT}"

          python - <<PY
          duration = float("$DURATION")
          width = int("$WIDTH")
          height = int("$HEIGHT")

          if duration < 12:
              raise SystemExit("動画が短すぎます")

          if duration > 70:
              raise SystemExit("動画が長すぎます")

          if width != 1080:
              raise SystemExit("横幅が1080ではありません")

          if height != 1920:
              raise SystemExit("縦幅が1920ではありません")

          print("完成動画検査OK")
          PY


      # ==========================================
      # YouTubeアップロード＆公開
      #
      # タイトルは表示だけ。
      # 台本は音声・字幕だけ。
      # ==========================================
      - name: Upload to YouTube and publish
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import os

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          credentials = Credentials(

              token=None,

              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],

              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],

              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # YouTubeタイトル
          with open(
              "video_title.txt",
              encoding="utf-8"
          ) as f:

              title = f.read().strip()


          # YouTube説明欄
          description = (
              "今日から実践できる考え方や習慣を紹介します。\n\n"
              "#習慣 #自己改善 #人生 #shorts"
          )


          body = {

              "snippet": {

                  "title": title[:90],

                  "description": description,

                  "tags": [
                      "習慣",
                      "自己改善",
                      "人生",
                      "仕事",
                      "自己成長",
                      "shorts"
                  ],

                  "categoryId": "22"
              },

              "status": {

                  "privacyStatus": "private",

                  "selfDeclaredMadeForKids": False
              }
          }


          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )


          response = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media

          ).execute()


          video_id = response["id"]

          print(
              "YouTubeアップロード成功"
          )

          print(
              "Video ID:",
              video_id
          )


          # 公開
          youtube.videos().update(

              part="status",

              body={

                  "id": video_id,

                  "status": {

                      "privacyStatus": "public"

                  }

              }

          ).execute()


          print(
              "YouTube公開成功"
          )

          print(
              "https://www.youtube.com/watch?v="
              + video_id
          )


      # ==========================================
      # 完成ファイル保存
      # ==========================================
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            input/background.png
            input/subtitles.ass
            output/video.mp4
            video_title.txt
