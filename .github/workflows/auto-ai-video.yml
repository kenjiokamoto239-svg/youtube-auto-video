              ・文字数を削るために重要な情報や根拠を省略しない
              ・長い説明や重複表現を削り、短く自然な文章にする
              ・結論ではテーマに対する立場を明確に言い切る
              ・行動提案は、テーマに直接関係し、参考情報に根拠がある場合だけ入れる
              ・雑学、ニュース、作品紹介では、無理な行動課題や教訓を追加しない
              ・動画を見ること自体を、視聴者への行動提案にしない

              指摘された問題を改善しつつ、
