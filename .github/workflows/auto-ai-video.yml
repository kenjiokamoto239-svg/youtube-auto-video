name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
                    python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help
            

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

          # 4. ニュースを取得
          # 1分野で取得できなくても、別の分野を順番に試す

          feeds = [
              ("岡山・介護", "岡山 介護 福祉 ニュース"),
              ("介護・社会保障", "介護 社会保障 制度 ニュース"),
              ("三重県熊野市", "三重県 熊野市 ニュース"),
              ("ランニング・健康", "ランニング 健康 スポーツ ニュース"),
              ("経済・仕事", "日本 経済 仕事 賃金 ニュース"),
              ("国内ニュース", "日本 国内 ニュース"),
          ]

          random.shuffle(feeds)

          articles = []
          selected_category = None
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              ),
              "Accept": (
                  "application/rss+xml, "
                  "application/xml, text/xml, */*"
              ),
          }

          for category_name, query in feeds:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + quote(query, safe="")
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  print("RSS TRY:", category_name)

                  response = requests.get(
                      rss_url,
                      headers=headers,
                      timeout=30
                  )

                  print(
                      "RSS HTTP STATUS:",
                      response.status_code
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(response.content)

                  if not feed.entries:
                      print(
                          "RSS EMPTY:",
                          category_name,
                          getattr(feed, "bozo_exception", "")
                      )
                      continue

                  category_articles = []

                  for item in feed.entries[:20]:
                      title = clean_text(
                          item.get("title", "")
                      )

                      link = item.get("link", "")

                      summary = clean_text(
                          item.get("summary", "")
                      )

                      summary = re.sub(
                          r"<[^>]+>", " ", summary
                      )

                      summary = clean_text(summary)

                      if title and link:
                          category_articles.append({
                              "title": title,
                              "link": link,
                              "summary": summary[:700]
                          })

                  if category_articles:
                      articles = category_articles
                      selected_category = category_name

                      print(
                          "RSS SUCCESS:",
                          category_name,
                          "ARTICLES:",
                          len(articles)
                      )

                      break

              except Exception as e:
                  print(
                      "RSS ERROR:",
                      category_name,
                      str(e)[:500]
                  )

          if not articles:
              # 検索RSSが全て失敗した場合、
              # GoogleニュースのトップニュースRSSも試す
              try:
                  print("RSS FALLBACK: top news")

                  fallback_url = (
                      "https://news.google.com/rss"
                      "?hl=ja&gl=JP&ceid=JP:ja"
                  )

                  response = requests.get(
                      fallback_url,
                      headers=headers,
                      timeout=30
                  )

                  print(
                      "FALLBACK HTTP STATUS:",
                      response.status_code
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(response.content)

                  for item in feed.entries[:30]:
                      title = clean_text(
                          item.get("title", "")
                      )

                      link = item.get("link", "")

                      summary = clean_text(
                          item.get("summary", "")
                      )

                      summary = re.sub(
                          r"<[^>]+>", " ", summary
                      )

                      summary = clean_text(summary)

                      if title and link:
                          articles.append({
                              "title": title,
                              "link": link,
                              "summary": summary[:700]
                          })

                  if articles:
                      selected_category = "国内ニュース"

              except Exception as e:
                  print(
                      "RSS FALLBACK ERROR:",
                      str(e)[:500]
                  )

          if not articles:
              raise RuntimeError(
                  "ニュースを取得できませんでした。"
                  "ログのRSS HTTP STATUSとRSS ERRORを確認してください。"
              )

          category = selected_category
          article = random.choice(articles)

          print("CATEGORY:", category)
          print("NEWS:", article["title"])
          print("SOURCE:", article["link"])
          # 5. Ollamaを起動して台本を作成
          # 外部の生成AI APIキーは使用しない
          model = os.environ.get(
              "OLLAMA_MODEL", "qwen2.5:3b"
          )

          run([
              "bash", "-lc",
              "curl -fsSL https://ollama.com/install.sh | sh"
          ], timeout=300)

          subprocess.Popen(
              ["ollama", "serve"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL
          )

          for _ in range(30):
              try:
                  requests.get(
                      "http://127.0.0.1:11434/api/tags",
                      timeout=3
                  )
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Ollamaを起動できませんでした")

          run([
              "ollama", "pull", model
          ], timeout=1200)

          prompt = f"""
          あなたは日本語のニュース解説者です。
          次のニュースを題材に、YouTube Shorts用の
          日本語ナレーション台本を作成してください。

          分野：{category}
          ニュース見出し：{article['title']}
          配信元の説明：{article['summary']}
          記事URL：{article['link']}

          厳守事項：
          ・ニュース見出しの読み上げだけで終わらせない
          ・事実、推測、意見を混同しない
          ・確認できない数字や発言を捏造しない
          ・反対意見が出るような明確な主張を入れる
          ・強い表現は使ってよいが、個人攻撃はしない
          ・ニュースの問題点、社会への影響、反論を説明する
          ・タイトルや説明文は台本に入れない
          ・読み上げる本文だけを書く
          ・日本語で約350～500文字
          ・冒頭で視聴者の注意を引く
          ・最後は問いかけで締める
          ・日付や数字を意味なく繰り返さない
          ・英語の記号列や管理用コードを出力しない
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.75
                  }
              },
              timeout=900
          )
          response.raise_for_status()

          raw = clean_text(
              response.json().get("response", "")
          )

          # 台本から不要なラベルを除去
          raw = re.sub(
              r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
              "",
              raw
          )

          raw = re.sub(
              r"(?m)^\s*【[^】]*】\s*$",
              "",
              raw
          )

          lines = []
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              if re.fullmatch(r"[\W_]+", line):
                  continue
              lines.append(line)

          script = clean_text("\n".join(lines))

          if len(script) < 100:
              raise RuntimeError(
                  "台本が短すぎます。生成結果を確認してください。"
              )

          if len(script) > 1000:
              script = script[:1000]

          # 読み上げ用本文を保存
          SCRIPT_FILE.write_text(
              script, encoding="utf-8"
          )

          # 動画タイトルは読み上げ本文と分離
          title = clean_text(article["title"])
          title = re.sub(r"\s*-\s*[^-]+$", "", title)
          title = title[:90]

          TITLE_FILE.write_text(
              title, encoding="utf-8"
          )

          print("TITLE:", title)
          print("SCRIPT LENGTH:", len(script))

                    # 6. 日本語音声を生成
          # Edge TTSの403エラーを避け、gTTSを使用する

          from gtts import gTTS

          sentences = re.split(
              r"(?<=[。！？!?])\s*",
              script
          )
          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          if not sentences:
              raise RuntimeError(
                  "音声用の文章がありません"
              )

          audio_dir = WORK / "audio_parts"
          audio_dir.mkdir(
              exist_ok=True
          )

          concat_file = WORK / "audio_list.txt"
          timings = []
          current_time = 0.0
          audio_files = []

          for i, sentence in enumerate(sentences):
              part = (
                  audio_dir
                  / f"part_{i:03d}.mp3"
              )

              print(
                  f"TTS: {i + 1}/{len(sentences)}"
              )

              try:
                  tts = gTTS(
                      text=sentence,
                      lang="ja",
                      slow=False
                  )

                  tts.save(str(part))

              except Exception as e:
                  raise RuntimeError(
                      "日本語音声の生成に失敗しました。"
                      f"文番号={i + 1}, エラー={e}"
                  ) from e

              if (
                  not part.exists()
                  or part.stat().st_size < 500
              ):
                  raise RuntimeError(
                      f"音声ファイルが不正です: {i}"
                  )

              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(part)
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              timings.append(
                  (
                      current_time,
                      current_time + duration,
                      sentence
                  )
              )

              current_time += duration
              audio_files.append(part)

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for part in audio_files:
                  safe = (
                      str(part.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(AUDIO_FILE)
          ])
          # 音声を15%速くする
          # 字幕のタイミングも速度に合わせて調整
          SPEED = 1.15

          sped_audio = WORK / "voice_fast.mp3"

          run([
              "ffmpeg", "-y",
              "-i", str(AUDIO_FILE),
              "-filter:a", f"atempo={SPEED}",
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(sped_audio)
          ])

          if (
              not sped_audio.exists()
              or sped_audio.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "高速化した音声を生成できませんでした"
              )

          sped_audio.replace(AUDIO_FILE)

          timings = [
              (start / SPEED, end / SPEED, sentence)
              for start, end, sentence in timings
          ]

          current_time = current_time / SPEED
          duration = current_time

          print("VOICE SPEED:", SPEED)
          print("SPEED ADJUSTED DURATION:", duration)
          if (
              not AUDIO_FILE.exists()
              or AUDIO_FILE.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "音声ファイルが生成されませんでした"
              )

          duration = current_time

          if duration < 5 or duration > 180:
              raise RuntimeError(
                  f"動画の長さが範囲外です: {duration:.1f}秒"
              )

          print(
              "AUDIO DURATION:",
              duration
          )
          # 7. 字幕ファイルを生成
          def ass_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          with ASS_FILE.open("w", encoding="utf-8-sig") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,4,1,5,70,70,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """.replace("\n          ", "\n"))

              for start, end, sentence in timings:
                  # 字幕を短い行に分割
                  chunks = textwrap.wrap(
                      sentence,
                      width=18,
                      break_long_words=True,
                      break_on_hyphens=False
                  )
                  if not chunks:
                      continue

                  # 長文は表示時間内で分割
                  total_chars = sum(len(c) for c in chunks)
                  cursor = start

                  for chunk in chunks:
                      share = (end - start) * len(chunk) / max(1, total_chars)
                      chunk_end = min(end, cursor + share)
                      text = chunk.replace("{", "").replace("}", "")
                      text = text.replace("\\", "＼")
                      f.write(
                          "Dialogue: 0,"
                          + ass_time(cursor) + ","
                          + ass_time(max(cursor + 0.15, chunk_end))
                          + ",Default,,0,0,0,,"
                          + text + "\n"
                      )
                      cursor = chunk_end

          # 8. 背景画像を取得
          # Wikimedia Commonsの検索APIを利用。
          # 取得できない場合はグラデーション背景を生成。
          bg_ok = False

          try:
              commons_url = "https://commons.wikimedia.org/w/api.php"
              params = {
                  "action": "query",
                  "generator": "search",
                                    "gsrsearch": (
                      article["title"] + " " + category + " Japan"
                  ),
                  "gsrnamespace": 6,
                  "gsrlimit": 10,
                  "prop": "imageinfo",
                  "iiprop": "url",
                  "iiurlwidth": 1080,
                  "format": "json"
              }

              data = requests.get(
                  commons_url,
                  params=params,
                  headers={"User-Agent": "AutoJapaneseVideo/1.0"},
                  timeout=25
              )
              data.raise_for_status()

              pages = data.json().get(
                  "query", {}
              ).get("pages", {})

              candidates = []
              for page in pages.values():
                  info = page.get("imageinfo", [{}])[0]
                  url = info.get("thumburl") or info.get("url", "")
                  if url.lower().endswith(
                      (".jpg", ".jpeg", ".png", ".webp")
                  ):
                      candidates.append(url)

              random.shuffle(candidates)

              for url in candidates[:5]:
                  try:
                      img_resp = requests.get(
                          url, timeout=25
                      )
                      img_resp.raise_for_status()

                      temp = WORK / "downloaded_background"
                      temp.write_bytes(img_resp.content)

                      image = Image.open(temp).convert("RGB")
                      image = image.resize(
                          (1080, 1920),
                          Image.Resampling.LANCZOS
                      )
                      image.save(BG_FILE, quality=90)
                      bg_ok = True
                      break
                  except Exception as e:
                      print("Background candidate failed:", e)

          except Exception as e:
              print("Background download failed:", e)

          if not bg_ok:
              # 背景画像取得に失敗しても黒画面にしない
              image = Image.new("RGB", (1080, 1920))
              pixels = image.load()

              for y in range(1920):
                  ratio = y / 1919
                  r = int(18 + 22 * ratio)
                  g = int(28 + 25 * ratio)
                  b = int(60 + 50 * ratio)

                  for x in range(1080):
                      pixels[x, y] = (
                          min(255, r),
                          min(255, g),
                          min(255, b)
                      )

              image.save(BG_FILE, quality=90)

          # 9. 背景にタイトルを描画
          # タイトルは画面上部に表示し、読み上げない。
          image = Image.open(BG_FILE).convert("RGB")
          draw = ImageDraw.Draw(image)

          font_path = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          try:
              font = ImageFont.truetype(font_path, 54)
          except Exception:
              font = ImageFont.load_default()

          title_lines = textwrap.wrap(
              title, width=16, break_long_words=True
          )[:3]

          y = 100
          for line in title_lines:
              bbox = draw.textbbox((0, 0), line, font=font, stroke_width=2)
              w = bbox[2] - bbox[0]
              x = max(35, (1080 - w) // 2)

              draw.text(
                  (x, y),
                  line,
                  font=font,
                  fill="white",
                  stroke_width=3,
                  stroke_fill="#101010"
              )
              y += 75

          image.save(BG_FILE, quality=92)

          # 10. 縦型動画を生成
          ass_path = str(ASS_FILE.resolve())
          ass_path = ass_path.replace("\\", "\\\\")
          ass_path = ass_path.replace(":", "\\:")
          ass_path = ass_path.replace("'", "\\'")

          video_filter = (
              "scale=1080:1920:force_original_aspect_ratio=increase,"
              "crop=1080:1920,"
              f"ass='{ass_path}'"
          )

          run([
              "ffmpeg", "-y",
              "-loop", "1",
              "-framerate", "30",
              "-i", str(BG_FILE),
              "-i", str(AUDIO_FILE),
              "-vf", video_filter,
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-tune", "stillimage",
              "-pix_fmt", "yuv420p",
              "-r", "30",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(VIDEO_FILE)
          ], timeout=900)

          # 11. 生成結果を検証
          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries",
                  "format=duration:stream=codec_type,width,height",
                  "-of", "json",
                  str(VIDEO_FILE)
              ],
              check=True,
              capture_output=True,
              text=True
          )

          info = json.loads(probe.stdout)
          actual_duration = float(
              info["format"]["duration"]
          )

          video_stream = next(
              (
                  s for s in info.get("streams", [])
                  if s.get("codec_type") == "video"
              ),
              None
          )

          if video_stream is None:
              raise RuntimeError("動画ストリームがありません")

          if (
              video_stream.get("width") != 1080
              or video_stream.get("height") != 1920
          ):
              raise RuntimeError("動画サイズが正しくありません")

          if actual_duration < 5 or actual_duration > 180:
              raise RuntimeError(
                  f"動画時間が異常です: {actual_duration}"
              )

          if VIDEO_FILE.stat().st_size < 100000:
              raise RuntimeError("動画ファイルが小さすぎます")

          print("VIDEO READY:", VIDEO_FILE)
          print("DURATION:", actual_duration)
          print("SIZE:", VIDEO_FILE.stat().st_size)
          PYTHON

          python generate_video.py

      # 4. YouTubeへ限定公開でアップロードしてから公開
      - name: Upload and publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_video.py <<'PYTHON'
          import os
          import sys
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          work = Path("work")
          video_path = work / "video.mp4"
          title_path = work / "title.txt"
          script_path = work / "script.txt"

          if not video_path.exists():
              raise RuntimeError("動画ファイルがありません")

          title = title_path.read_text(
              encoding="utf-8"
          ).strip()

          script = script_path.read_text(
              encoding="utf-8"
          ).strip()

          client_id = os.environ.get("YOUTUBE_CLIENT_ID")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
          refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

          if not all([client_id, client_secret, refresh_token]):
              raise RuntimeError(
                  "YouTube認証Secretsが不足しています。"
                  "YOUTUBE_CLIENT_ID、"
                  "YOUTUBE_CLIENT_SECRET、"
                  "YOUTUBE_REFRESH_TOKENを確認してください。"
              )

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          try:
              credentials.refresh(Request())
          except Exception as e:
              raise RuntimeError(
                  "YouTube OAuth認証に失敗しました。"
                  "invalid_scopeの場合は再認証が必要です。"
              ) from e

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          description = (
              script[:4000]
              + "\n\nニュース出典："
              + "記事URLはワークフローのログで確認してください。"
              + "\n\n#ニュース #日本 #Shorts"
          )

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description[:5000],
                  "categoryId": "25",
                  "tags": [
                      "ニュース", "日本", "解説", "Shorts"
                  ],
                  "defaultLanguage": "ja",
                  "defaultAudioLanguage": "ja"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              str(video_path),
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(
                      "Upload progress:",
                      round(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]
          print("UPLOADED:", video_id)

          # アップロード後に公開へ変更
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("PUBLISHED:", video_id)
          print(
              "URL:",
              "https://www.youtube.com/shorts/" + video_id
          )
          PYTHON

          python upload_video.py

      # 5. 動画と台本を保存
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            work/video.mp4
            work/voice.mp3
            work/title.txt
            work/script.txt
            work/subtitles.ass
            work/background.jpg
          if-no-files-found: ignore
          retention-days: 7
