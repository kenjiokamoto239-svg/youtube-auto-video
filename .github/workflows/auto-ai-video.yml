name: Auto AI Japanese Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # Ollama
      # ==============================
      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          nohup ollama serve > /tmp/ollama.log 2>&1 &

          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          timeout 600s ollama pull qwen2.5:1.5b


      # ==============================
      # Folders
      # ==============================
      - name: Prepare
        shell: bash
        run: |
          rm -rf input output model
          mkdir -p input output model


      # ==============================
      # Topic
      # ==============================
      - name: Generate topic
        shell: python
        run: |
          import random
          from pathlib import Path

          topics = [
              "人生を少し楽にする習慣",
              "仕事で疲れにくくする考え方",
              "継続する人がやっていること",
              "朝の時間を有効に使う方法",
              "お金を無駄にしない考え方",
              "健康を守る小さな習慣",
              "運動を続けるための考え方",
              "集中力を高める方法",
              "ストレスを減らす考え方",
              "時間を大切にする方法",
              "自分を変える小さな行動",
              "失敗したときの考え方",
              "やる気に頼らず行動する方法",
              "人間関係で疲れない考え方",
              "毎日を少し充実させる方法",
              "仕事の効率を上げる工夫",
              "睡眠を大切にする理由",
              "本を読む習慣のメリット",
              "スマホ時間を減らす方法",
              "先延ばしを減らす方法"
          ]

          topic = random.choice(topics)

          Path("input/topic.txt").write_text(
              topic,
              encoding="utf-8"
          )

          print("テーマ：", topic)


      # ==============================
      # Title
      # ==============================
      - name: Generate title
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path(
              "input/topic.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          prompt = f"""
          YouTubeショート用のタイトルを一つ作ってください。

          テーマ：
          {topic}

          条件：
          日本語だけ。
          短くする。
          興味を引く。
          数字なし。
          英語なし。
          タイトルだけ出力。
          """

          try:
              result = subprocess.run(
                  [
                      "ollama",
                      "run",
                      "qwen2.5:1.5b"
                  ],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=60
              )

              title = result.stdout.strip()

          except Exception:
              title = ""

          title = title.replace(
              "\n",
              " "
          )

          title = re.sub(
              r"[0-9０-９A-Za-z]",
              "",
              title
          )

          title = title.replace(
              "�",
              ""
          )

          title = re.sub(
              r"\s+",
              " ",
              title
          ).strip()

          if not title:
              title = topic

          Path(
              "input/title.txt"
          ).write_text(
              title[:70],
              encoding="utf-8"
          )

          print("タイトル：", title)


      # ==============================
      # Script
      # ==============================
      - name: Generate script
        shell: python
        run: |
          import subprocess
          import re
          from pathlib import Path

          topic = Path(
              "input/topic.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          prompt = f"""
          YouTubeショートのナレーション台本を作ってください。

          テーマ：
          {topic}

          条件：
          ナレーション本文だけ。
          タイトルは禁止。
          説明文は禁止。
          見出しは禁止。
          箇条書きは禁止。
          日本語だけ。
          数字は禁止。
          英語は禁止。
          URLは禁止。
          ハッシュタグは禁止。
          乱数は禁止。
          特殊文字は禁止。
          自然な話し言葉。
          五十文字以上三百文字以内。
          最後は前向きな一文。

          台本だけ出してください。
          """

          fallback = (
              "毎日頑張っているのに、なぜか疲れてしまう。"
              "そんなときは、全部を一気に変えようとしないことが大切です。"
              "今日できることを一つだけ決めて、それを終わらせてみましょう。"
              "小さな行動を積み重ねるだけでも、毎日は少しずつ変わっていきます。"
          )

          try:
              result = subprocess.run(
                  [
                      "ollama",
                      "run",
                      "qwen2.5:1.5b"
                  ],
                  input=prompt,
                  text=True,
                  capture_output=True,
                  timeout=120
              )

              script = result.stdout.strip()

          except Exception as e:
              print("AI台本生成失敗")
              print(e)
              script = ""

          script = re.sub(
              r"https?://\S+",
              "",
              script
          )

          script = script.replace(
              "�",
              ""
          )

          script = script.replace(
              "乱数",
              ""
          )

          script = script.replace(
              "#",
              ""
          )

          script = re.sub(
              r"[0-9０-９A-Za-z]",
              "",
              script
          )

          script = re.sub(
              r"\s+",
              " ",
              script
          ).strip()

          if len(script) < 50:
              script = fallback

          script = script[:300]

          Path(
              "input/script.txt"
          ).write_text(
              script,
              encoding="utf-8"
          )

          print("台本：")
          print(script)


      # ==============================
      # Validate script
      # ==============================
      - name: Validate script
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path(
              "input/script.txt"
          )

          if not path.exists():
              raise SystemExit(
                  "台本ファイルがありません"
              )

          text = path.read_text(
              encoding="utf-8"
          ).strip()

          print("文字数：", len(text))
          print(text)

          if len(text) < 50:
              raise SystemExit(
                  "台本が短すぎます"
              )

          if len(text) > 300:
              raise SystemExit(
                  "台本が長すぎます"
              )

          if "�" in text:
              raise SystemExit(
                  "不正文字があります"
              )

          if "乱数" in text:
              raise SystemExit(
                  "乱数があります"
              )

          if re.search(
              r"[0-9０-９A-Za-z]",
              text
          ):
              raise SystemExit(
                  "数字または英字があります"
              )

          print("台本チェックOK")


      # ==============================
      # Python
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==============================
      # Packages
      # ==============================
      - name: Install packages
        shell: bash
        run: |
          python -m pip install --upgrade pip

          pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy \
            pillow \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk


      # ==============================
      # Kokoro model
      # ==============================
      - name: Download Kokoro model
        shell: bash
        run: |
          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx

          test -s model/jf_alpha.bin


      # ==============================
      # Japanese TTS
      # ==============================
      - name: Generate Japanese TTS
        shell: python
        run: |
          import soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro

          script = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          if not script:
              raise SystemExit(
                  "台本が空です"
              )

          kokoro = Kokoro(
              "model/kokoro-v1.0.int8.onnx",
              "model/jf_alpha.bin"
          )

          samples, rate = kokoro.create(
              script
          )

          sf.write(
              "input/audio.wav",
              samples,
              rate
          )

          print("日本語音声生成完了")


      # ==============================
      # Audio check
      # ==============================
      - name: Validate audio
        shell: python
        run: |
          import subprocess

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      "input/audio.wav"
                  ],
                  text=True
              ).strip()
          )

          print(
              f"音声時間：{duration:.2f}秒"
          )

          if duration < 12:
              raise SystemExit(
                  "音声が短すぎます"
              )

          if duration > 70:
              raise SystemExit(
                  "音声が長すぎます"
              )


      # ==============================
      # Background
      # ==============================
      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw

          width = 1080
          height = 1920

          image = Image.new(
              "RGB",
              (width, height)
          )

          pixels = image.load()

          for y in range(height):
              ratio = y / height

              r = int(
                  15 + 20 * ratio
              )

              g = int(
                  25 + 25 * ratio
              )

              b = int(
                  55 + 40 * ratio
              )

              for x in range(width):
                  pixels[x, y] = (
                      r,
                      g,
                      b
                  )

          draw = ImageDraw.Draw(
              image,
              "RGBA"
          )

          draw.ellipse(
              (-250, 200, 500, 950),
              fill=(255,255,255,25)
          )

          draw.ellipse(
              (650, 850, 1350, 1550),
              fill=(255,255,255,20)
          )

          image.save(
              "input/background.png"
          )

          print("1080x1920背景生成完了")


      # ==============================
      # Subtitles
      # ==============================
      - name: Generate subtitles
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          script = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      "input/audio.wav"
                  ],
                  text=True
              ).strip()
          )

          sentences = re.split(
              r"(?<=[。！？])",
              script
          )

          sentences = [
              x.strip()
              for x in sentences
              if x.strip()
          ]

          chunks = []

          for sentence in sentences:
              while len(sentence) > 26:
                  chunks.append(
                      sentence[:26]
                  )
                  sentence = sentence[26:]

              if sentence:
                  chunks.append(sentence)

          if not chunks:
              chunks = [script]

          total_chars = sum(
              len(x)
              for x in chunks
          )

          lines = []

          lines.append(
              "[Script Info]"
          )

          lines.append(
              "ScriptType: v4.00+"
          )

          lines.append(
              "PlayResX: 1080"
          )

          lines.append(
              "PlayResY: 1920"
          )

          lines.append("")

          lines.append(
              "[V4+ Styles]"
          )

          lines.append(
              "Format: Name,Fontname,Fontsize,"
              "PrimaryColour,SecondaryColour,"
              "OutlineColour,BackColour,Bold,"
              "Italic,Underline,StrikeOut,"
              "ScaleX,ScaleY,Spacing,Angle,"
              "BorderStyle,Outline,Shadow,"
              "Alignment,MarginL,MarginR,MarginV,Encoding"
          )

          lines.append(
              "Style: Default,Noto Sans CJK JP,72,"
              "&H00FFFFFF,&H00FFFFFF,"
              "&H00000000,&H99000000,"
              "1,0,0,0,100,100,0,0,"
              "1,4,2,2,70,70,260,1"
          )

          lines.append("")

          lines.append(
              "[Events]"
          )

          lines.append(
              "Format: Layer,Start,End,Style,"
              "Name,MarginL,MarginR,MarginV,"
              "Effect,Text"
          )

          def ass_time(seconds):

              total_cs = int(
                  round(seconds * 100)
              )

              hours = total_cs // 360000

              minutes = (
                  total_cs % 360000
              ) // 6000

              seconds2 = (
                  total_cs % 6000
              ) // 100

              centiseconds = (
                  total_cs % 100
              )

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{seconds2:02d}."
                  f"{centiseconds:02d}"
              )

          current = 0

          for chunk in chunks:

              segment = (
                  duration
                  * len(chunk)
                  / total_chars
              )

              start = current

              end = current + segment

              safe = chunk.replace(
                  "\\",
                  "\\\\"
              )

              safe = safe.replace(
                  "{",
                  "\\{"
              )

              safe = safe.replace(
                  "}",
                  "\\}"
              )

              lines.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + safe
              )

              current = end

          Path(
              "input/subtitles.ass"
          ).write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("字幕生成完了")


      # ==============================
      # MP4
      # ==============================
      - name: Generate MP4
        shell: bash
        run: |
          ffmpeg \
            -y \
            -loop 1 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/video.mp4

          ls -lh output/video.mp4


      # ==============================
      # Final validation
      # ==============================
      - name: Validate final video
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          video = Path(
              "output/video.mp4"
          )

          if not video.exists():
              raise SystemExit(
                  "動画ファイルがありません"
              )

          def probe(args):

              return subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error"
                  ]
                  + args
                  + [str(video)],
                  text=True
              ).strip()

          width = int(
              probe([
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width",
                  "-of",
                  "csv=p=0"
              ])
          )

          height = int(
              probe([
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=height",
                  "-of",
                  "csv=p=0"
              ])
          )

          video_codec = probe([
              "-select_streams",
              "v:0",
              "-show_entries",
              "stream=codec_name",
              "-of",
              "csv=p=0"
          ])

          audio_codec = probe([
              "-select_streams",
              "a:0",
              "-show_entries",
              "stream=codec_name",
              "-of",
              "csv=p=0"
          ])

          duration = float(
              probe([
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1"
              ])
          )

          print(
              f"映像：{video_codec},{width},{height}"
          )

          print(
              f"音声：{audio_codec}"
          )

          print(
              f"動画時間：{duration:.2f}秒"
          )

          if width != 1080:
              raise SystemExit(
                  "幅が1080ではありません"
              )

          if height != 1920:
              raise SystemExit(
                  "高さが1920ではありません"
              )

          if video_codec != "h264":
              raise SystemExit(
                  "H264ではありません"
              )

          if audio_codec != "aac":
              raise SystemExit(
                  "AACではありません"
              )

          if duration < 12:
              raise SystemExit(
                  "動画が短すぎます"
              )

          if duration > 70:
              raise SystemExit(
                  "動画が長すぎます"
              )

          print(
              "最終動画チェックOK"
          )


      # ==============================
      # YouTube
      # ==============================
      - name: Upload to YouTube and publish
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |
          import os

          from pathlib import Path

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          credentials = Credentials(
              None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          title = Path(
              "input/title.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          body = {
              "snippet": {
                  "title": title,
                  "description": (
                      "毎日を少し良くするための短い動画です。"
                  ),
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }


          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )


          response = None


          while response is None:

              status, response = (
                  request.next_chunk()
              )

              if status:

                  print(
                      "アップロード："
                      + str(
                          int(
                              status.progress()
                              * 100
                          )
                      )
                      + "%"
                  )


          video_id = response["id"]


          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()


          print(
              "YouTube公開完了"
          )

          print(
              "https://www.youtube.com/watch?v="
              + video_id
          )


      # ==============================
      # Artifact
      # ==============================
      - name: Upload artifact
        uses: actions/upload-artifact@v4

        with:
          name: generated-video

          path: |
            output/video.mp4
            input/script.txt
            input/title.txt
            input/audio.wav
            input/subtitles.ass
            input/background.png

          retention-days: 3
