name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Ollama
      # ==========================================
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:1.5b


      # ==========================================
      # フォルダ作成
      # ==========================================
      - name: Prepare folders
        run: |
          mkdir -p input
          mkdir -p output
          mkdir -p model


      # ==========================================
      # テーマ生成
      #
      # 乱数はAIに渡さない
      # ==========================================
      - name: Generate random topic
        shell: python
        run: |
          from pathlib import Path
          import random

          topics = [
              "習慣",
              "お金",
              "仕事",
              "人間関係",
              "時間の使い方",
              "健康",
              "自己成長",
              "読書",
              "メンタル",
              "ランニング",
              "人生",
              "節約",
              "集中力",
              "行動力",
              "睡眠",
              "スマホ",
              "40代の生き方",
              "介護の仕事術"
          ]

          angles = [
              "今日からできる小さな行動",
              "知らないと損する考え方",
              "多くの人がやってしまう失敗",
              "人生が少し楽になる方法",
              "忙しい人でも続けられる方法",
              "お金をかけずにできる方法",
              "やめるだけで変わること",
              "1日5分でできること",
              "仕事の効率を上げる方法",
              "将来の自分を助ける考え方"
          ]

          topic = random.choice(topics)
          angle = random.choice(angles)

          text = (
              f"テーマ：{topic}\n"
              f"切り口：{angle}\n"
          )

          Path("topic.txt").write_text(
              text,
              encoding="utf-8"
          )

          print(text)


      # ==========================================
      # YouTubeタイトル
      #
      # 音声・字幕には使用しない
      # ==========================================
      - name: Generate title
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          topic = Path(
              "topic.txt"
          ).read_text(
              encoding="utf-8"
          )

          prompt = f"""
          YouTubeショート動画のタイトルを1つだけ作ってください。

          テーマ：
          {topic}

          条件：
          ・日本語
          ・18〜30文字程度
          ・続きを見たくなる
          ・自然な日本語
          ・タイトルだけ出力
          ・説明禁止
          ・前置き禁止
          ・タイトルという文字を付けない
          ・ハッシュタグ禁止
          ・絵文字禁止
          ・数字を使わない
          ・英語を使わない
          """

          title = ""

          for _ in range(3):

              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True
              )

              candidate = result.stdout.strip()

              if not candidate:
                  continue

              candidate = candidate.splitlines()[0]

              candidate = re.sub(
                  r"^(タイトル|TITLE)\s*[:：]\s*",
                  "",
                  candidate,
                  flags=re.I
              )

              candidate = candidate.replace(
                  "�",
                  ""
              )

              candidate = re.sub(
                  r"[A-Za-z0-9]",
                  "",
                  candidate
              )

              candidate = candidate.replace(
                  "#",
                  ""
              ).strip()

              japanese_count = len(
                  re.findall(
                      r"[ぁ-んァ-ヶ一-龠]",
                      candidate
                  )
              )

              if (
                  8 <= len(candidate) <= 50
                  and japanese_count >= 6
                  and "�" not in candidate
              ):
                  title = candidate
                  break

          if not title:
              title = "今日から変わる小さな習慣"

          Path(
              "video_title.txt"
          ).write_text(
              title,
              encoding="utf-8"
          )

          print("===== YouTubeタイトル =====")
          print(title)


      # ==========================================
      # 台本生成
      #
      # ★ここだけが音声・字幕の元になる
      # ==========================================
      - name: Generate script
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re
          import random

          topic = Path(
              "topic.txt"
          ).read_text(
              encoding="utf-8"
          )

          # AIに渡す前に余計な情報を除去
          topic = re.sub(
              r"[0-9０-９]",
              "",
              topic
          )

          prompt = f"""
          あなたは日本語YouTubeショート動画の台本ライターです。

          次のテーマについて、
          視聴者が実際に聞く台本本文だけを書いてください。

          【テーマ】
          {topic}

          【絶対条件】
          ・日本語だけ
          ・140〜220文字
          ・最初の一文で興味を引く
          ・具体例を一つ入れる
          ・最後に具体的な行動を提案する
          ・自然な日本語
          ・短い文章を中心にする
          ・句読点を使う
          ・タイトルを書かない
          ・説明を書かない
          ・前置きを書かない
          ・ハッシュタグ禁止
          ・絵文字禁止
          ・英語禁止
          ・数字禁止
          ・「乱数」という言葉禁止
          ・意味のない文字列禁止
          ・同じ文字の大量繰り返し禁止
          ・意味のない記号禁止

          出力は台本本文だけです。
          """

          def clean_text(text):

              text = text.replace(
                  "\ufffd",
                  ""
              )

              text = re.sub(
                  r"[A-Za-z0-9]",
                  "",
                  text
              )

              text = re.sub(
                  r"[０-９]",
                  "",
                  text
              )

              text = text.replace(
                  "乱数",
                  ""
              )

              text = text.replace(
                  "台本：",
                  ""
              )

              text = text.replace(
                  "台本:",
                  ""
              )

              text = re.sub(
                  r"#\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"\s+",
                  "",
                  text
              )

              text = text.strip(
                  '"「」『』'
              )

              return text


          def valid(text):

              if not text:
                  return False

              if "�" in text:
                  return False

              if "乱数" in text:
                  return False

              if re.search(
                  r"[A-Za-z0-9]",
                  text
              ):
                  return False

              japanese_count = len(
                  re.findall(
                      r"[ぁ-んァ-ヶ一-龠]",
                      text
                  )
              )

              if japanese_count < 100:
                  return False

              if not (
                  120 <= len(text) <= 240
              ):
                  return False

              if re.search(
                  r"(.)\1{7,}",
                  text
              ):
                  return False

              return True


          script = ""

          for attempt in range(3):

              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  text=True,
                  capture_output=True
              )

              candidate = clean_text(
                  result.stdout
              )

              # 長すぎる場合は句点で切る
              if len(candidate) > 220:

                  short = candidate[:220]

                  positions = [
                      short.rfind("。"),
                      short.rfind("！"),
                      short.rfind("？")
                  ]

                  cut = max(positions)

                  if cut >= 120:
                      candidate = (
                          short[:cut + 1]
                      )
                  else:
                      candidate = short

              print("")
              print(
                  f"台本生成試行：{attempt + 1}"
              )

              print(
                  f"文字数：{len(candidate)}"
              )

              print(candidate)

              if valid(candidate):

                  script = candidate
                  break


          # ==========================================
          # AI失敗時の安全な固定台本
          # ==========================================
          if not script:

              fallback_scripts = [

                  "人生を変えたいなら、いきなり大きなことを始める必要はありません。大切なのは、毎日続けられる小さな行動を一つ決めることです。例えば、寝る前に明日の重要な仕事を一つだけ決めておく。これだけでも朝の迷いが減ります。今日から一つだけ習慣を決めて、まず一週間続けてみましょう。",

                  "お金を貯めたいのに、なぜか増えない。そんな人は、収入を増やす前に無意識の支出を確認してみましょう。例えば、使っていないサービスを一つ解約するだけでも毎月の固定費は下がります。小さな金額でも続けば大きな差になります。今日、使っていないサービスを一つ確認してみてください。",

                  "仕事が忙しい人ほど、全部を頑張ろうとしてしまいます。でも本当に大切なのは、今日やるべきことを一つ決めることです。例えば、朝一番に最重要の仕事を少しだけ進める。これだけでも一日の達成感は変わります。忙しい日は、全部終わらせることより、一番大切なことを終わらせることを意識してみましょう。",

                  "健康のために何か始めたいなら、最初から完璧を目指さないことです。例えば毎日長時間運動するより、まずは少し歩くことから始める。大切なのは運動量より、続けられる仕組みを作ることです。できた日を積み重ねれば、少しずつ行動は大きくなります。今日から少しだけ体を動かしてみましょう。",

                  "集中できないときは、気合いで頑張るより環境を変える方が簡単です。例えばスマホを別の部屋に置いて、一つの作業だけに集中する。通知が目に入らなくなるだけでも、余計な中断は減ります。集中できない自分を責める前に、集中しやすい環境を作ってみましょう。まずは短い時間から試してください。"

              ]

              script = random.choice(
                  fallback_scripts
              )

              print("")
              print(
                  "安全な固定台本を使用します"
              )


          # 最終安全処理
          script = clean_text(
              script
          )

          if not valid(script):

              raise SystemExit(
                  "最終台本チェック失敗"
              )


          Path(
              "input/script.txt"
          ).write_text(
              script,
              encoding="utf-8"
          )

          print("")
          print("===== 最終台本 =====")
          print(script)

          print(
              f"文字数：{len(script)}"
          )


      # ==========================================
      # 台本チェック
      # ==========================================
      - name: Validate script
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "input/script.txt"
          )

          if not path.exists():
              raise SystemExit(
                  "台本ファイルがありません"
              )

          text = path.read_text(
              encoding="utf-8"
          ).strip()

          if not text:
              raise SystemExit(
                  "台本が空です"
              )

          if "�" in text:
              raise SystemExit(
                  "壊れた文字が含まれています"
              )

          if "乱数" in text:
              raise SystemExit(
                  "乱数が台本に混入しています"
              )

          if re.search(
              r"[A-Za-z0-9]",
              text
          ):
              raise SystemExit(
                  "英数字が台本に混入しています"
              )

          if not (
              120 <= len(text) <= 240
          ):
              raise SystemExit(
                  f"文字数異常：{len(text)}"
              )

          print("===== 台本検査OK =====")
          print(text)


      # ==========================================
      # Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # パッケージ
      # ==========================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" \
            soundfile \
            numpy \
            pillow

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ==========================================
      # FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk


      # ==========================================
      # Kokoroモデル
      # ==========================================
      - name: Prepare Kokoro
        run: |
          test -s input/script.txt

          wget -q \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

          echo "Kokoroモデル準備OK"


      # ==========================================
      # 日本語音声
      #
      # 台本だけ使用
      # ==========================================
      - name: Generate Japanese voice
        shell: python
        run: |
          from pathlib import Path
          import soundfile as sf

          from kokoro_onnx import Kokoro

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("===== 音声本文 =====")
          print(text)

          model = Kokoro(
              model_path=(
                  "model/kokoro-v1.0.int8.onnx"
              ),
              voice_path=(
                  "model/jf_alpha.bin"
              )
          )

          audio, sample_rate = model.create(
              text
          )

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          duration = (
              len(audio) / sample_rate
          )

          print(
              f"音声時間：{duration:.2f}秒"
          )

          if duration < 12:
              raise SystemExit(
                  "音声が短すぎます"
              )

          if duration > 70:
              raise SystemExit(
                  "音声が長すぎます"
              )


      # ==========================================
      # 音声チェック
      # ==========================================
      - name: Validate audio
        run: |
          set -e

          test -s input/audio.wav

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.wav)

          echo "Audio duration: $DURATION"

          python -c "
          duration = float('$DURATION')
          assert 12 <= duration <= 70, '音声時間異常'
          print('音声検査OK')
          "


      # ==========================================
      # 背景生成
      # ==========================================
      - name: Generate background
        shell: python
        run: |
          from PIL import Image, ImageDraw
          import random

          WIDTH = 1080
          HEIGHT = 1920

          random.seed()

          top = (
              random.randint(10, 40),
              random.randint(20, 60),
              random.randint(60, 120)
          )

          bottom = (
              random.randint(40, 100),
              random.randint(20, 70),
              random.randint(80, 150)
          )

          img = Image.new(
              "RGB",
              (WIDTH, HEIGHT)
          )

          draw = ImageDraw.Draw(img)

          for y in range(HEIGHT):

              ratio = y / (HEIGHT - 1)

              color = tuple(
                  int(
                      top[i] * (1 - ratio)
                      + bottom[i] * ratio
                  )
                  for i in range(3)
              )

              draw.line(
                  [(0, y), (WIDTH, y)],
                  fill=color
              )

          overlay = Image.new(
              "RGBA",
              img.size,
              (0, 0, 0, 0)
          )

          overlay_draw = ImageDraw.Draw(
              overlay
          )

          for _ in range(8):

              radius = random.randint(
                  100,
                  350
              )

              x = random.randint(
                  -100,
                  WIDTH + 100
              )

              y = random.randint(
                  -100,
                  HEIGHT + 100
              )

              overlay_draw.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=(
                      255,
                      255,
                      255,
                      25
                  )
              )

          overlay_draw.rounded_rectangle(
              (
                  55,
                  500,
                  WIDTH - 55,
                  1420
              ),
              radius=60,
              fill=(
                  0,
                  0,
                  0,
                  65
              )
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              overlay
          ).convert("RGB")

          img.save(
              "input/background.png"
          )

          print(
              "背景：1080x1920"
          )


      # ==========================================
      # 字幕生成
      # ==========================================
      - name: Generate subtitles
        shell: python
        run: |
          from pathlib import Path
          import re
          import soundfile as sf

          text = Path(
              "input/script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          audio, sr = sf.read(
              "input/audio.wav"
          )

          duration = (
              len(audio) / sr
          )

          sentences = [
              x.strip()
              for x in re.split(
                  r"(?<=[。！？])",
                  text
              )
              if x.strip()
          ]

          if not sentences:
              raise SystemExit(
                  "字幕がありません"
              )

          display_sentences = []

          for sentence in sentences:

              if len(sentence) <= 20:

                  display_sentences.append(
                      sentence
                  )

              else:

                  middle = len(sentence) // 2

                  candidates = []

                  for i in range(
                      max(5, middle - 8),
                      min(
                          len(sentence) - 1,
                          middle + 8
                      )
                  ):

                      if sentence[i] in "、。！？":

                          candidates.append(i)

                  if candidates:

                      cut = min(
                          candidates,
                          key=lambda x:
                          abs(x - middle)
                      )

                      display_sentences.append(
                          sentence[:cut + 1]
                          + "\\N"
                          + sentence[cut + 1:]
                      )

                  else:

                      display_sentences.append(
                          sentence
                      )

          total_chars = sum(
              len(
                  s.replace(
                      "\\N",
                      ""
                  )
              )
              for s in display_sentences
          )

          def ass_time(seconds):

              total_cs = int(
                  round(seconds * 100)
              )

              hours = (
                  total_cs // 360000
              )

              total_cs %= 360000

              minutes = (
                  total_cs // 6000
              )

              total_cs %= 6000

              seconds_value = (
                  total_cs // 100
              )

              centiseconds = (
                  total_cs % 100
              )

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{seconds_value:02d}."
                  f"{centiseconds:02d}"
              )

          header = "\n".join([
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 2",
              "ScaledBorderAndShadow: yes",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H90000000,1,0,0,0,100,100,0,0,1,5,1,2,80,80,500,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          ])

          events = []

          current = 0.0

          for i, sentence in enumerate(
              display_sentences
          ):

              clean = sentence.replace(
                  "\\N",
                  ""
              )

              portion = (
                  duration
                  * len(clean)
                  / total_chars
              )

              start = current

              if i == len(
                  display_sentences
              ) - 1:

                  end = duration

              else:

                  end = current + portion

              subtitle = (
                  sentence
                  .replace(
                      "{",
                      "\\{"
                  )
                  .replace(
                      "}",
                      "\\}"
                  )
              )

              events.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + subtitle
              )

              current = end

          Path(
              "input/subtitles.ass"
          ).write_text(
              header
              + "\n"
              + "\n".join(events)
              + "\n",
              encoding="utf-8"
          )

          print("字幕生成OK")


      # ==========================================
      # 字幕確認
      # ==========================================
      - name: Validate subtitles
        run: |
          set -e

          test -s input/subtitles.ass

          grep -q "Dialogue:" \
            input/subtitles.ass

          echo "字幕検査OK"


      # ==========================================
      # MP4生成
      #
      # ★1080x1920を強制
      # ==========================================
      - name: Generate MP4
        run: |
          set -e

          ffmpeg -y \
            -loop 1 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          test -s output/video.mp4

          echo "MP4生成OK"


      # ==========================================
      # 完成動画を厳格チェック
      # ==========================================
      - name: Validate final video
        shell: python
        run: |
          import subprocess

          def probe(args):

              result = subprocess.run(
                  args,
                  capture_output=True,
                  text=True,
                  check=True
              )

              return result.stdout.strip()

          duration = float(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "output/video.mp4"
              ])
          )

          width = int(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width",
                  "-of",
                  "csv=p=0",
                  "output/video.mp4"
              ])
          )

          height = int(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=height",
                  "-of",
                  "csv=p=0",
                  "output/video.mp4"
              ])
          )

          print(
              f"動画時間：{duration:.2f}秒"
          )

          print(
              f"動画サイズ：{width}x{height}"
          )

          if not (
              12 <= duration <= 70
          ):
              raise SystemExit(
                  "動画時間が異常です"
              )

          if width != 1080:
              raise SystemExit(
                  f"横幅が1080ではありません：{width}"
              )

          if height != 1920:
              raise SystemExit(
                  f"縦幅が1920ではありません：{height}"
              )

          print(
              "===== 完成動画検査OK ====="
          )


      # ==========================================
      # YouTubeアップロード＆公開
      # ==========================================
      - name: Upload to YouTube and publish
        shell: python
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(

              token=None,

              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],

              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],

              scopes=[
                  "https://www.googleapis.com/auth/youtube"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open(
              "video_title.txt",
              encoding="utf-8"
          ) as f:

              title = f.read().strip()

          description = (
              "今日から実践できる考え方や習慣を紹介します。\n\n"
              "#習慣 #自己改善 #人生 #shorts"
          )

          body = {

              "snippet": {

                  "title": title[:90],

                  "description": description,

                  "tags": [
                      "習慣",
                      "自己改善",
                      "人生",
                      "仕事",
                      "自己成長",
                      "shorts"
                  ],

                  "categoryId": "22"
              },

              "status": {

                  "privacyStatus": "private",

                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          response = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media

          ).execute()

          video_id = response["id"]

          print(
              "YouTubeアップロード成功"
          )

          print(
              "Video ID:",
              video_id
          )

          youtube.videos().update(

              part="status",

              body={

                  "id": video_id,

                  "status": {

                      "privacyStatus": "public"

                  }

              }

          ).execute()

          print(
              "YouTube公開成功"
          )

          print(
              "https://www.youtube.com/watch?v="
              + video_id
          )


      # ==========================================
      # 完成ファイル保存
      # ==========================================
      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            input/background.png
            input/subtitles.ass
            output/video.mp4
            video_title.txt
