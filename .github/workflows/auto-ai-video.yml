                              candidate["title"]
                          )
                          print(
                              "BACKGROUND LICENSE:",
                              candidate["license"]
                          )
                          print(
                              "BACKGROUND ARTIST:",
                              candidate["artist"]
                          )

                          break

                      except Exception as e:
                          image_errors.append(str(e)[:200])

