                  check=True,
                  capture_output=True,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              timings.append(
                  (
                      current_time,
                      current_time + duration,
                      sentence
                  )
              )

              current_time += duration
              audio_files.append(part)

