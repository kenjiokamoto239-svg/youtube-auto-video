          【正確性】

          ・参考情報にない数字や研究結果を作らない。
          ・人物の発言や歴史的事実を捏造しない。
          ・ニュースのタイトルだけから詳細を創作しない。
          ・確認できない情報は断定しない。
          ・面白さより事実の正確性を優先する。

          【長さ】

          ・180〜240文字を目安にする。
          ・280文字を超えない。
          ・完成した音声が59秒以内に収まること。

          【出力前の確認】

          1. 最初の一文に興味を引く力があるか。
          2. 続きを見たくなる展開になっているか。
          3. 根拠のある具体的な情報が含まれているか。
          4. 視聴者が最後まで見て得る価値があるか。
          5. 根拠のない情報が含まれていないか。
          6. 無駄な文章がないか。

          読み上げる本文だけを出力してください。
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.65
                  }
              },
              timeout=900
          )

          response.raise_for_status()

          raw = strip_prompt_leakage(
              response.json().get("response", "")
          )
          # 冒頭の挨拶を削除
          raw = re.sub(
              r"(?is)^\s*(?:こんにちは|こんばんは|おはようございます|おはよう)[、,！!。 \n]*",
              "",
              raw
          )

          # 視聴者の学年・性別を使った呼びかけを削除
          raw = re.sub(
              r"(?is)^\s*(?:(?:小学|小学校)\s*3年生|小学三年生|3年生)\s*の?\s*(?:男子|男の子)\s*(?:のみんな|みんな)?[、,！!。 \n]*",
              "",
              raw
          )

          # 「みんな、今日は～」などの呼びかけも削除
          raw = re.sub(
              r"(?is)^\s*(?:みんな|みなさん|みんなたち)[、,！!。 \n]+",
              "",
              raw
          )

          raw = re.sub(
              r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
              "",
              raw
          )

          raw = re.sub(
              r"(?m)^\s*【[^】]*】\s*$",
              "",
              raw
          )

          lines = []

          for line in raw.splitlines():
              line = line.strip()

              if not line:
                  continue

              if re.fullmatch(r"[\W_]+", line):
                  continue

              lines.append(line)

          script = clean_text(
              "\n".join(lines)
          )

                    # 短い台本も、後続の品質検査と
          # 自動修正処理に進める
          if len(script) > 1000:
