name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            soundfile \
            pillow \
            requests \
            feedparser \
            google-api-python-client \
            google-auth \
            kokoro-onnx \
            misaki-fork

      - name: Download Japanese dictionary
        run: |
          python -m pip install unidic-lite
          python -m unidic download

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

          ollama pull qwen2.5:3b

      - name: Create work folders
        run: |
          mkdir -p input output model
          rm -f input/title.txt
          rm -f input/script.txt
          rm -f input/source.txt
          rm -f input/topic.txt
          rm -f input/background.png
          rm -f input/background_credit.txt
          rm -f input/audio.wav
          rm -f input/subtitles.ass
          rm -f output/video.mp4
          rm -f output/diagnostics.json
          rm -f output/youtube_url.txt

      - name: Generate Japanese news script
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          TERM: dumb
        run: |
          python - <<'PY'
          import feedparser
          import html
          import random
          import re
          import subprocess
          from pathlib import Path

          def clean(text):
              text = html.unescape(text or "")

              # ANSIエスケープシーケンスを除去
              text = re.sub(
                  r"\x1b\[[0-?]*[ -/]*[@-~]",
                  "",
                  text
              )

              # 制御文字を除去
              text = re.sub(
                  r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]",
                  "",
                  text
              )

              text = re.sub(r"\s+", " ", text)
              return text.strip()

          feeds = [
              (
                  "岡山・介護",
                  "https://news.google.com/rss/search?q=岡山+介護+福祉&hl=ja&gl=JP&ceid=JP:ja"
              ),
              (
                  "介護・社会保障",
                  "https://news.google.com/rss/search?q=介護+社会保障+人手不足&hl=ja&gl=JP&ceid=JP:ja"
              ),
              (
                  "三重県熊野市",
                  "https://news.google.com/rss/search?q=三重県+熊野市&hl=ja&gl=JP&ceid=JP:ja"
              ),
              (
                  "ランニング・健康",
                  "https://news.google.com/rss/search?q=ランニング+健康+スポーツ&hl=ja&gl=JP&ceid=JP:ja"
              ),
              (
                  "経済・仕事",
                  "https://news.google.com/rss/search?q=日本+経済+働き方&hl=ja&gl=JP&ceid=JP:ja"
              ),
              (
                  "国内ニュース",
                  "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja"
              ),
          ]

          candidates = []

          for category, url in feeds:
              try:
                  parsed = feedparser.parse(url)

                  for entry in parsed.entries[:10]:
                      title = clean(entry.get("title", ""))
                      summary = clean(entry.get("summary", ""))
                      link = clean(entry.get("link", ""))

                      if not title or len(title) < 8:
                          continue

                      candidates.append({
                          "category": category,
                          "title": title,
                          "summary": summary[:1500],
                          "link": link
                      })

              except Exception as exc:
                  print("RSS error:", category, str(exc))

          # 重複見出しを除去
          unique = {}

          for item in candidates:
              unique[item["title"]] = item

          candidates = list(unique.values())

          if not candidates:
              raise SystemExit(
                  "ニュースを取得できませんでした。"
                  "誤った内容を作らないため、今回は停止します。"
              )

          # 取得できたニュースから1件を選択
          chosen = random.choice(candidates)

          category = chosen["category"]
          news_title = chosen["title"]
          news_summary = chosen["summary"]
          source_url = chosen["link"]

          print("Category:", category)
          print("Source title:", news_title)
          print("Source URL:", source_url)

          prompt = f"""
          あなたは、日本語のYouTube Shorts向けに
          ニュース解説を作る構成作家です。

          【分類】
          {category}

          【ニュース見出し】
          {news_title}

          【取得できた概要】
          {news_summary}

          【参照URL】
          {source_url}

          目的は、見出しを読み上げるだけの動画ではなく、
          視聴者が内容を理解し、意見を持ちたくなる動画を作ることです。

          次の条件を厳守してください。

          1. 何が起きたのかを具体的に説明する。
          2. 見出しに書かれていない事実を勝手に作らない。
          3. 確認できない数字、発言、人物の行動を捏造しない。
          4. 事件の容疑者を有罪と断定しない。
          5. ニュースの事実と自分の意見を区別する。
          6. 問題の原因や制度上の課題を掘り下げる。
          7. 視聴者の生活や社会にどんな影響があるか説明する。
          8. 反対意見も紹介し、それに対する考えを述べる。
          9. 主張は明確に、強い言葉で述べてよい。
          10. ただし、過激さを演出するために事実を捏造しない。
          11. 個人への侮辱や差別表現は禁止。
          12. 介護の話題なら、賃金、人手不足、制度、
              経営の問題まで掘り下げる。
          13. ランニングや健康なら、実行できる具体策を入れる。
          14. 経済や仕事なら、現状の問題と改善案を説明する。
          15. 最後は、はっきりした結論で締める。
          16. 自分の意見を述べる場合は、
              「私はこう考える」と分かるようにする。
          17. 日本語として自然な文章にする。
          18. 意味のない英数字や記号を出力しない。
          19. 台本は350〜500文字程度にする。
          20. ニュースの情報が少ない場合は、
              分からないことを断定せず、確認できる範囲で論じる。

          出力形式：

          TITLE:
          動画タイトル

          SCRIPT:
          音声で読み上げる台本本文だけ

          タイトルやラベルは台本本文に含めないでください。
          """

          result = subprocess.run(
              ["ollama", "run", "qwen2.5:3b"],
              input=prompt,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="replace",
              timeout=240,
              env={
                  "OLLAMA_HOST": "http://127.0.0.1:11434",
                  "TERM": "dumb"
              }
          )

          if result.returncode != 0:
              print(result.stderr[-3000:])
              raise SystemExit("台本生成に失敗しました")

          answer = clean(result.stdout)

          # TITLEとSCRIPTを分離
          title_match = re.search(
              r"TITLE\s*:\s*(.*?)(?=\s*SCRIPT\s*:|$)",
              answer,
              re.IGNORECASE | re.DOTALL
          )

          script_match = re.search(
              r"SCRIPT\s*:\s*(.*)$",
              answer,
              re.IGNORECASE | re.DOTALL
          )

          if not title_match or not script_match:
              raise SystemExit(
                  "タイトルと台本を正しく分離できませんでした"
              )

          title = clean(title_match.group(1))
          script = clean(script_match.group(1))

          # 残ったラベルを除去
          script = re.sub(
              r"^(TITLE|SCRIPT)\s*:\s*",
              "",
              script,
              flags=re.IGNORECASE
          )

          # 文字化け・不自然な反復を検査
          if "\ufffd" in title + script:
              raise SystemExit("文字化けを検出しました")

          if re.search(r"\d{4}[hl]\d+", title + script, re.I):
              raise SystemExit("不自然な英数字を検出しました")

          if len(title) < 4 or len(title) > 95:
              raise SystemExit("タイトルの長さが不適切です")

          if len(script) < 180:
              raise SystemExit(
                  f"台本が短すぎます: {len(script)}文字"
              )

          if len(script) > 1000:
              raise SystemExit(
                  f"台本が長すぎます: {len(script)}文字"
              )

          # 台本にタイトルを混ぜない
          if script.startswith(title):
              script = script[len(title):].strip()

          if len(script) < 180:
              raise SystemExit("タイトル除去後の台本が短すぎます")

          Path("input/title.txt").write_text(
              title,
              encoding="utf-8"
          )

          Path("input/script.txt").write_text(
              script,
              encoding="utf-8"
          )

          Path("input/source.txt").write_text(
              source_url,
              encoding="utf-8"
          )

          Path("input/topic.txt").write_text(
              category,
              encoding="utf-8"
          )

          print("Title:", title)
          print("Script characters:", len(script))
          print("Script generated successfully")
          PY

      - name: Download Japanese Kokoro model
        run: |
          set -e

          curl -fL --retry 3 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -o model/kokoro-v1.0.int8.onnx

          curl -fL --retry 3 \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -o model/jf_alpha.bin

          test -s model/kokoro-v1.0.int8.onnx
          test -s model/jf_alpha.bin

      - name: Generate Japanese speech and subtitles
        run: |
          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro

          input_dir = Path("input")

          def clean(text):
              # ANSI制御シーケンスを先に除去する
              text = re.sub(
                  r"\x1b\[[0-?]*[ -/]*[@-~]",
                  "",
                  text
              )

              # その他の制御文字を除去
              text = re.sub(
                  r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]",
                  "",
                  text
              )

              text = re.sub(r"\s+", " ", text)
              return text.strip()

          script = clean(
              (input_dir / "script.txt").read_text(
                  encoding="utf-8"
              )
          )

          if len(script) < 100:
              raise SystemExit("音声化する台本が短すぎます")

          replacements = {
              "YouTube": "ユーチューブ",
              "youtube": "ユーチューブ",
              "SNS": "エスエヌエス",
              "AI": "エーアイ",
              "Wi-Fi": "ワイファイ",
              "DX": "デジタルトランスフォーメーション",
              "NPO": "エヌピーオー",
          }

          for old, new in replacements.items():
              script = script.replace(old, new)

          script = re.sub(r"https?://\S+", "", script)
          script = clean(script)

          # 読み上げと字幕で同じ文章を使う
          sentences = re.split(r"(?<=[。！？!?])", script)
          sentences = [s.strip() for s in sentences if s.strip()]

          chunks = []

          for sentence in sentences:
              if len(sentence) <= 55:
                  chunks.append(sentence)
                  continue

              parts = re.split(r"(?<=[、，,])", sentence)
              current = ""

              for part in parts:
                  if len(current) + len(part) > 45 and current:
                      chunks.append(current)
                      current = part
                  else:
                      current += part

              if current:
                  chunks.append(current)

          if not chunks:
              raise SystemExit("音声化する文章がありません")

          kokoro = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin",
          )

          audio_parts = []
          subtitle_events = []
          cursor = 0.0
          sample_rate = None

          for chunk in chunks:
              chunk = clean(chunk)

              if not chunk:
                  continue

              print("Generating:", chunk)

              # 以前の成功時と同じAPIを使用
              audio, current_rate = kokoro.create(chunk)

              audio = np.asarray(audio, dtype=np.float32)

              if audio.size == 0:
                  raise SystemExit(
                      "音声生成結果が空でした: " + chunk
                  )

              if sample_rate is None:
                  sample_rate = current_rate

              if sample_rate != current_rate:
                  raise SystemExit(
                      "音声のサンプルレートが一致しません"
                  )

              duration = len(audio) / sample_rate

              audio_parts.append(audio)

              subtitle_events.append(
                  (cursor, cursor + duration, chunk)
              )

              cursor += duration

              pause = 0.16
              pause_samples = int(sample_rate * pause)

              if pause_samples:
                  audio_parts.append(
                      np.zeros(pause_samples, dtype=np.float32)
                  )
                  cursor += pause

          if not audio_parts or sample_rate is None:
              raise SystemExit("音声を生成できませんでした")

          combined = np.concatenate(audio_parts)

          sf.write(
              "input/audio.wav",
              combined,
              sample_rate
          )

          def ass_time(seconds):
              total_cs = round(seconds * 100)
              hours = total_cs // 360000
              minutes = (total_cs // 6000) % 60
              seconds_int = (total_cs // 100) % 60
              centiseconds = total_cs % 100

              return (
                  f"{hours}:{minutes:02d}:"
                  f"{seconds_int:02d}.{centiseconds:02d}"
              )

          def ass_escape(text):
              text = clean(text)
              text = text.replace("\\", "＼")
              text = text.replace("{", "｛")
              text = text.replace("}", "｝")
              return text

          def split_caption(text, width=18):
              text = ass_escape(text)

              if len(text) <= width:
                  return text

              # 日本語を読みやすい2行に分ける
              lines = []

              while len(text) > width and len(lines) < 1:
                  lines.append(text[:width])
                  text = text[width:]

              if text:
                  lines.append(text[:width])

              return r"\N".join(lines)

          ass = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 2",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,230,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for start, end, text in subtitle_events:
              if end <= start:
                  continue

              caption = split_caption(text)

              ass.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + caption
              )

          Path("input/subtitles.ass").write_text(
              "\n".join(ass) + "\n",
              encoding="utf-8-sig"
          )

          duration = len(combined) / sample_rate

          print("Audio duration:", round(duration, 2))
          print("Subtitle events:", len(subtitle_events))

          if duration < 5 or duration > 180:
              raise SystemExit(
                  f"音声の長さが範囲外です: {duration:.1f}秒"
              )

          if not subtitle_events:
              raise SystemExit("字幕が生成されませんでした")

          print("Audio and subtitles generated successfully")
          PY

      - name: Create relevant background image
        run: |
          python - <<'PY'
          import io
          import random
          from pathlib import Path

          import requests
          from PIL import (
              Image,
              ImageDraw,
              ImageEnhance,
              ImageFilter
          )

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()

          queries = {
              "岡山・介護": "elderly care nursing home",
              "介護・社会保障": "elderly care nursing home",
              "三重県熊野市": "Kumano Mie Japan coast",
              "ランニング・健康": "running athlete road",
              "経済・仕事": "office work business",
              "国内ニュース": "Japan city street",
          }

          query = queries.get(topic, "Japan landscape")

          image = None
          credit = "Generated gradient background"

          try:
              response = requests.get(
                  "https://commons.wikimedia.org/w/api.php",
                  params={
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": query,
                      "gsrnamespace": 6,
                      "gsrlimit": 10,
                      "prop": "imageinfo",
                      "iiprop": "url|extmetadata",
                      "format": "json",
                  },
                  headers={
                      "User-Agent": "AutoJapaneseShorts/1.0"
                  },
                  timeout=20
              )

              response.raise_for_status()

              pages = response.json().get(
                  "query", {}
              ).get("pages", {})

              candidates = list(pages.values())
              random.shuffle(candidates)

              for page in candidates:
                  info = page.get("imageinfo", [{}])[0]
                  url = info.get("url", "")

                  if not url.lower().endswith(
                      (".jpg", ".jpeg", ".png", ".webp")
                  ):
                      continue

                  try:
                      result = requests.get(
                          url,
                          headers={
                              "User-Agent": "AutoJapaneseShorts/1.0"
                          },
                          timeout=20
                      )

                      result.raise_for_status()

                      candidate = Image.open(
                          io.BytesIO(result.content)
                      ).convert("RGB")

                      meta = info.get("extmetadata", {})
                      artist = meta.get(
                          "Artist", {}
                      ).get("value", "")

                      license_name = meta.get(
                          "LicenseShortName", {}
                      ).get("value", "")

                      credit = (
                          f"{page.get('title', '')}; "
                          f"{artist}; {license_name}; {url}"
                      )

                      image = candidate
                      break

                  except Exception as exc:
                      print("Image skipped:", str(exc))

          except Exception as exc:
              print("Image search failed:", str(exc))

          W, H = 1080, 1920

          if image is not None:
              iw, ih = image.size
              scale = max(W / iw, H / ih)

              image = image.resize(
                  (int(iw * scale), int(ih * scale)),
                  Image.Resampling.LANCZOS
              )

              left = (image.width - W) // 2
              top = (image.height - H) // 2

              image = image.crop(
                  (left, top, left + W, top + H)
              )

              image = ImageEnhance.Color(image).enhance(0.85)
              image = ImageEnhance.Brightness(image).enhance(0.62)
              image = image.filter(ImageFilter.GaussianBlur(0.4))

          else:
              # 画像取得に失敗しても黒画面にしない
              image = Image.new("RGB", (W, H))
              draw = ImageDraw.Draw(image)

              for y in range(H):
                  ratio = y / H

                  color = (
                      int(18 + ratio * 24),
                      int(38 + ratio * 22),
                      int(60 + ratio * 30)
                  )

                  draw.line((0, y, W, y), fill=color)

          # 下部を暗くして字幕を読みやすくする
          overlay = Image.new(
              "RGBA", (W, H), (0, 0, 0, 0)
          )

          draw = ImageDraw.Draw(overlay)

          for y in range(650, H):
              alpha = int(
                  110 * (y - 650) / (H - 650)
              )

              draw.line(
                  (0, y, W, y),
                  fill=(0, 0, 0, alpha)
              )

          image = Image.alpha_composite(
              image.convert("RGBA"), overlay
          ).convert("RGB")

          image.save("input/background.png")

          Path("input/background_credit.txt").write_text(
              credit,
              encoding="utf-8"
          )

          print("Background created:", topic)
          print("Credit:", credit)
          PY

      - name: Render vertical video
        run: |
          set -e

          test -s input/audio.wav
          test -s input/subtitles.ass
          test -s input/background.png

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i input/background.png \
            -i input/audio.wav \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=input/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 160k \
            -ar 44100 \
            -shortest \
            -movflags +faststart \
            output/video.mp4

          test -s output/video.mp4

      - name: Validate video
        run: |
          set -e

          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,width,height \
            -show_entries format=duration \
            -of json \
            output/video.mp4 > output/diagnostics.json

          cat output/diagnostics.json

          python - <<'PY'
          import json

          with open(
              "output/diagnostics.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          streams = data.get("streams", [])

          video = next(
              (
                  s for s in streams
                  if s.get("codec_type") == "video"
              ),
              None
          )

          audio = next(
              (
                  s for s in streams
                  if s.get("codec_type") == "audio"
              ),
              None
          )

          duration = float(
              data.get("format", {}).get("duration", 0)
          )

          if not video:
              raise SystemExit("動画ストリームがありません")

          if not audio:
              raise SystemExit("音声ストリームがありません")

          if video.get("codec_name") != "h264":
              raise SystemExit("動画形式がH.264ではありません")

          if video.get("width") != 1080:
              raise SystemExit("動画の幅が不正です")

          if video.get("height") != 1920:
              raise SystemExit("動画の高さが不正です")

          if not 5 <= duration <= 180:
              raise SystemExit(
                  f"動画の長さが範囲外です: {duration}"
              )

          print(
              "Video validation passed:",
              round(duration, 2),
              "seconds"
          )
          PY

      - name: Upload and publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ.get(
              "YOUTUBE_CLIENT_ID", ""
          )

          client_secret = os.environ.get(
              "YOUTUBE_CLIENT_SECRET", ""
          )

          refresh_token = os.environ.get(
              "YOUTUBE_REFRESH_TOKEN", ""
          )

          if not all([
              client_id,
              client_secret,
              refresh_token
          ]):
              raise SystemExit(
                  "YouTube認証情報がありません。"
                  "GitHub Secretsを確認してください。"
              )

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          title = Path("input/title.txt").read_text(
              encoding="utf-8"
          ).strip()

          script = Path("input/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          source = Path("input/source.txt").read_text(
              encoding="utf-8"
          ).strip()

          topic = Path("input/topic.txt").read_text(
              encoding="utf-8"
          ).strip()

          title = title[:95]

          description = (
              f"{script}\n\n"
              f"テーマ：{topic}\n"
              f"参考情報：{source or '参照URLなし'}\n\n"
              "#Shorts #ニュース #考える"
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description[:4900],
                  "tags": [
                      "Shorts",
                      "日本語",
                      topic,
                      "ニュース"
                  ],
                  "categoryId": "25"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              status, response = request.next_chunk()

              if status:
                  print(
                      "Upload progress:",
                      int(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]

          video_url = (
              f"https://www.youtube.com/shorts/{video_id}"
          )

          Path("output/youtube_url.txt").write_text(
              video_url,
              encoding="utf-8"
          )

          print("Upload succeeded:", video_url)

          # 公開設定へ変更
          youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
          ).execute()

          print("Public setting requested:", video_url)
          PY

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video-${{ github.run_number }}
          path: |
            output/video.mp4
            output/diagnostics.json
            output/youtube_url.txt
            input/title.txt
            input/script.txt
            input/source.txt
            input/topic.txt
            input/audio.wav
            input/subtitles.ass
            input/background.png
            input/background_credit.txt
          if-no-files-found: warn
          retention-days: 7
