name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: auto-ai-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow numpy soundfile google-api-python-client google-auth

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null
          ollama pull qwen2.5:1.5b

      - name: Prepare folders
        run: |
          mkdir -p input output model

      - name: Generate clean Japanese script
        timeout-minutes: 8
        shell: python
        run: |
          import random
          import re
          import subprocess
          from pathlib import Path

          topics = [
              "集中力を高める習慣",
              "運動を続けるコツ",
              "人生を変える小さな習慣",
              "お金を貯める考え方",
              "健康を守る生活習慣",
              "仕事の効率を上げる方法",
              "有名人の言葉から学ぶ教訓",
              "ランニング初心者の注意点",
              "時間を無駄にしない方法",
              "継続できる人の考え方",
              "失敗から学ぶ考え方",
              "今日からできる自己改善"
          ]

          topic = random.choice(topics)

          fallback_title = "今日から人生を少し良くする習慣"

          fallback_script = (
              "集中力を高めたいなら、まずは一つのことに集中する時間を作りましょう。"
              "例えば、作業を始める前にスマートフォンを手の届かない場所に置きます。"
              "そして、最初の五分だけ目の前の作業に取り組みます。"
              "小さく始めることで、行動へのハードルを下げられます。"
              "一度に全部を変える必要はありません。"
              "今日から一つだけ試してみましょう。"
          )

          def ask(prompt):
              result = subprocess.run(
                  ["ollama", "run", "qwen2.5:1.5b"],
                  input=prompt,
                  capture_output=True,
                  text=True,
                  timeout=120,
                  check=True
              )
              return result.stdout.strip()

          def clean_text(text):
              text = text.replace("\ufffd", "")
              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(r"[\x00-\x1f]", "", text)
              text = re.sub(r"^\s*```.*$", "", text, flags=re.M)
              text = re.sub(r"^\s*#{1,6}\s*", "", text, flags=re.M)
              text = re.sub(r"\s+", "", text)
              text = text.strip("「」『』\"'` ")
              return text

          def has_heading(text):
              patterns = [
                  r"冒頭\s*[:：]",
                  r"タイトル\s*[:：]",
                  r"動画タイトル\s*[:：]",
                  r"説明文?\s*[:：]",
                  r"ナレーション\s*[:：]",
                  r"台本\s*[:：]",
                  r"本文\s*[:：]",
                  r"具体例\s*[:：]",
                  r"結論\s*[:：]",
                  r"導入\s*[:：]",
                  r"オープニング",
                  r"エンディング",
                  r"第一\s*章",
                  r"第[一二三四五六七八九十0-9]+章",
                  r"^\d+[.．、:：]"
              ]
              return any(
                  re.search(p, text, flags=re.I)
                  for p in patterns
              )

          try:
              title = clean_text(ask(
                  f"テーマ「{topic}」の日本語YouTube Shorts用タイトルを"
                  "一つだけ作ってください。30文字以内。"
                  "タイトルという見出しや説明、引用符は付けないでください。"
              ))
              if has_heading(title) or not (5 <= len(title) <= 35):
                  title = fallback_title
          except Exception:
              title = fallback_title

          prompt = f"""
          日本語の短い動画のナレーション本文だけを作成してください。
          テーマ：{topic}

          必ず守ること：
          ・自然で意味の通る日本語
          ・140文字から220文字程度
          ・具体的な行動例を含める
          ・最後の文を完結させる
          ・句読点を自然に使う
          ・本文以外は出力しない
          ・タイトル、冒頭、導入、説明、具体例、結論などの見出しは禁止
          ・番号、箇条書き、括弧付きラベル、URLは禁止
          ・「こんにちは」などの不要な挨拶から始めない
          ・見出し名を本文に書かない
          """

          try:
              script = clean_text(ask(prompt))
              if has_heading(script):
                  raise ValueError("台本に不要な見出しがあります")
              if len(script) < 70 or len(script) > 260:
                  raise ValueError("台本の長さが不適切です")
              if not re.search(r"[。！？]$", script):
                  script += "。"
          except Exception:
              script = fallback_script

          # 明らかな見出しやメタ情報を含む場合は安全な台本に置き換える
          if has_heading(script) or len(script) < 50:
              script = fallback_script

          Path("input/topic.txt").write_text(topic, encoding="utf-8")
          Path("input/title.txt").write_text(title, encoding="utf-8")
          Path("input/script.txt").write_text(script, encoding="utf-8")

          print("テーマ:", topic)
          print("タイトル:", title)
          print("台本文字数:", len(script))
          print("台本:", script)

      - name: Install Japanese TTS
        run: |
          pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git"

      - name: Download Japanese voice model
        run: |
          set -e
          curl -fL --retry 3 \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int
