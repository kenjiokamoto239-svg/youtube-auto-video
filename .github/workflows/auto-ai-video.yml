                          except (ValueError, TypeError):
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          if bgm_duration < 10:
                              print(
                                  "BGM SKIP: too short",
                                  bgm_duration,
                              )
                              temp_bgm.unlink(missing_ok=True)
                              continue

                          # 採用した音源の情報を保存
                          BGM_INFO_FILE.write_text(
                              "音源名: " + page_title + "\n"
                              + "ライセンス: " + license_name + "\n"
                              + "作者: " + html.unescape(
                                  metadata.get(
                                      "Artist", {}
                                  ).get("value", "不明")
                              ) + "\n"
