                    # 10. 縦型動画を生成
          ass_path = str(ASS_FILE.resolve())
          ass_path = ass_path.replace("\\", "\\\\")
          ass_path = ass_path.replace(":", "\\:")
          ass_path = ass_path.replace("'", "\\'")

          video_filter = (
              "scale=1080:1920:force_original_aspect_ratio=increase,"
              "crop=1080:1920,"
              f"ass='{ass_path}'"
          )

