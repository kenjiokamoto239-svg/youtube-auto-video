name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 12 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 15 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 18 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 20 * * *"
      timezone: "Asia/Tokyo"
    - cron: "0 22 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: auto-ai-japanese-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 必要なソフトをインストール
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade edge-tts
                    python -m pip install \
            requests \
            feedparser \
            pillow \
            gTTS \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib
          python -m edge_tts --help
            

      # 3. 台本・音声・字幕・動画を生成
      - name: Generate video
        env:
          OLLAMA_MODEL: qwen2.5:3b
        run: |
          cat > generate_video.py <<'PYTHON'
          import os
          import re
          import sys
          import json
          import time
          import math
          import random
          import subprocess
          import textwrap
          import requests
          import feedparser

          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path.cwd()
          WORK = ROOT / "work"
          WORK.mkdir(exist_ok=True)

          TITLE_FILE = WORK / "title.txt"
          SCRIPT_FILE = WORK / "script.txt"
          AUDIO_FILE = WORK / "voice.mp3"
          VIDEO_FILE = WORK / "video.mp4"
          BG_FILE = WORK / "background.jpg"
          ASS_FILE = WORK / "subtitles.ass"

          def run(cmd, timeout=300):
              print("RUN:", " ".join(map(str, cmd)))
              subprocess.run(
                  list(map(str, cmd)),
                  check=True,
                  timeout=timeout
              )

          def clean_text(s):
              s = str(s or "")
              s = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", s)
              s = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f]", "", s)
              s = s.replace("[K", "").replace("\r", "\n")
              s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n{3,}", "\n\n", s)
              return s.strip()

                    # 4. 投稿時間に応じてジャンルを選択
          # 1日6本の投稿スケジュールは変更しない

          now = datetime.now()
          hour = now.hour

          genre_schedule = {
              8: {
                  "name": "ニュース・時事問題",
                  "topic": "最新ニュースを独自の視点で解説する"
              },
              12: {
                  "name": "お金・投資",
                  "topic": "お金、投資、貯蓄、消費行動の盲点を考える"
              },
              15: {
                  "name": "自己改善・習慣",
                  "topic": "努力、習慣、集中力、成功の考え方を考える"
              },
              18: {
                  "name": "健康・ランニング",
                  "topic": "運動、ランニング、健康習慣の常識を考える"
              },
              20: {
                  "name": "名言・人生論",
                  "topic": "名言や人生の教訓を現代的な視点から考える"
              },
              22: {
                  "name": "仕事・社会",
                  "topic": "働き方、賃金、会社、社会の仕組みを批判的に考える"
              }
          }

          if hour in genre_schedule:
              selected = genre_schedule[hour]
          else:
              # 手動実行など、通常の投稿時刻以外は
              # ニュース以外も含めてランダムに選ぶ
              selected = random.choice(
                  list(genre_schedule.values())
              )

          category = selected["name"]
          topic = selected["topic"]
                    # ジャンル情報を保存
          (WORK / "category.txt").write_text(
              category,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("TOPIC:", topic)
          print("JAPAN TIME:", now.isoformat())

          # 5. ニュースジャンルの場合だけニュースを取得
          # それ以外のジャンルではニュースに依存しない

          article = None

          if category == "ニュース・時事問題":

              feeds = [
                  ("国内ニュース", "日本 国内 ニュース"),
                  ("経済ニュース", "日本 経済 賃金 物価 ニュース"),
                  ("介護・社会保障", "介護 社会保障 制度 ニュース"),
                  ("岡山・介護", "岡山 介護 福祉 ニュース"),
                  ("三重県熊野市", "三重県 熊野市 ニュース")
              ]

              random.shuffle(feeds)

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(compatible; AutoJapaneseVideo/1.0)"
                  )
              }

              articles = []

              for feed_name, query in feeds:
                  rss_url = (
                      "https://news.google.com/rss/search?q="
                      + quote(query, safe="")
                      + "&hl=ja&gl=JP&ceid=JP:ja"
                  )

                  try:
                      print("RSS TRY:", feed_name)

                      response = requests.get(
                          rss_url,
                          headers=headers,
                          timeout=30
                      )

                      response.raise_for_status()

                      feed = feedparser.parse(
                          response.content
                      )

                      for item in feed.entries[:15]:
                          title_text = clean_text(
                              item.get("title", "")
                          )

                          summary_text = clean_text(
                              item.get("summary", "")
                          )

                          summary_text = re.sub(
                              r"<[^>]+>",
                              " ",
                              summary_text
                          )

                          summary_text = clean_text(
                              summary_text
                          )

                          link_text = item.get(
                              "link", ""
                          )

                          if title_text and link_text:
                              articles.append({
                                  "title": title_text,
                                  "summary": summary_text[:700],
                                  "link": link_text
                              })

                      if articles:
                          print(
                              "RSS SUCCESS:",
                              feed_name,
                              "COUNT:",
                              len(articles)
                          )
                          break

                  except Exception as e:
                      print(
                          "RSS ERROR:",
                          feed_name,
                          str(e)[:300]
                      )

              if not articles:
                  raise RuntimeError(
                      "ニュースを取得できませんでした。"
                      "誤った内容で動画を作らず、処理を停止します。"
                  )

              article = random.choice(articles)

              print("NEWS TITLE:", article["title"])
              print("NEWS SOURCE:", article["link"])

          else:
              print(
                  "NEWS SEARCH: SKIPPED - NON-NEWS GENRE"
              )

          # 6. Ollamaでジャンル別の台本を作成
          # 外部の有料生成AI APIは使用しない

          model = os.environ.get(
              "OLLAMA_MODEL",
              "qwen2.5:3b"
          )

          run([
              "bash",
              "-lc",
              "curl -fsSL https://ollama.com/install.sh | sh"
          ], timeout=300)

          subprocess.Popen(
              ["ollama", "serve"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL
          )

          for _ in range(30):
              try:
                  requests.get(
                      "http://127.0.0.1:11434/api/tags",
                      timeout=3
                  )
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError(
                  "Ollamaを起動できませんでした"
              )

          run([
              "ollama",
              "pull",
              model
          ], timeout=1200)

          if article:
              source_context = f"""
              ニュース見出し：
              {article['title']}

              配信元の説明：
              {article['summary']}

              記事URL：
              {article['link']}
              """
          else:
              source_context = """
              特定のニュース記事は使用しないでください。
              指定されたジャンルに沿って、
              一般的な知識と論理的な考察を使ってください。
              確認できない統計や実在人物の発言は作らないでください。
              """

                        # ==========================================
          # 過去の分析データを次の台本に反映
          # ==========================================

          analytics_file = ROOT / "data" / "analytics_feedback.json"

          analytics_guidance = (
              "過去の分析データはまだ利用できません。"
              "今回のテーマに合った独自の台本を作成してください。"
          )

          try:
              if analytics_file.exists():
                  analytics_data = json.loads(
                      analytics_file.read_text(
                          encoding="utf-8"
                      )
                  )

                  top_videos = analytics_data.get(
                      "top_videos_by_lifetime_views",
                      []
                  )

                  top_videos = sorted(
                      top_videos,
                      key=lambda item: int(
                          item.get("views", 0)
                      ),
                      reverse=True
                  )[:5]

                  if top_videos:
                      examples = []

                      for video in top_videos:
                          video_title = clean_text(
                              video.get("title", "")
                          )
                          views = int(
                              video.get("views", 0)
                          )

                          if video_title:
                              examples.append(
                                  f"- {video_title} "
                                  f"（累計再生数：{views}回）"
                              )

                      analytics_guidance = (
                          "以下は過去の再生数上位動画です。\n"
                          + "\n".join(examples)
                          + "\n\n"
                          "これらを参考に、具体性、意外性、"
                          "視聴者の関心を引く切り口を研究してください。"
                          "ただし、タイトルや台本をコピーしてはいけません。"
                          "今回のジャンルとテーマに合う、"
                          "新しい主張と具体例を作ってください。"
                      )

                  print(
                      "ANALYTICS FEEDBACK LOADED:",
                      len(top_videos),
                      "top videos"
                  )

              else:
                  print(
                      "ANALYTICS FEEDBACK NOT FOUND"
                  )

          except Exception as e:
              print(
                  "ANALYTICS FEEDBACK ERROR:",
                  str(e)[:300]
              )

                    prompt = f"""
          あなたは、日本のYouTube Shorts向けに、
          視聴者の常識を揺さぶり、具体的な情報と
          明確な主張で最後まで見せる構成作家です。

          【動画ジャンル】
          {category}

          【テーマ】
          {topic}

          【過去の分析データ】
          {analytics_guidance}

          【参考情報】
          {source_context}

          【最重要ルール】
          この動画は、動画制作者への指示を説明する動画ではありません。
          視聴者が知りたい具体的なテーマについて解説してください。

          「視聴者の常識を揺さぶる一文から始めましょう」
          「今回は〇〇について解説します」
          「皆さんはどう思いますか」
          のような中身のない定型文から始めてはいけません。

          【台本の構成】
          1. 冒頭：常識を疑う、具体的で強い主張をする
          2. 問題提起：多くの人が見落としている点を指摘する
          3. 理由：なぜその主張が成立するのか説明する
          4. 具体例：視聴者がイメージできる例を示す
          5. 反対意見：反対側の考え方にも触れる
          6. 結論：自分の立場を明確にする
          7. 締め：視聴者が意見を言いたくなる質問をする

          【文章の条件】
          ・日本語で450～600文字程度
          ・読み上げる本文だけを出力する
          ・冒頭から具体的なテーマに入る
          ・抽象的な精神論だけで終わらせない
          ・主張には理由や具体例を伴わせる
          ・同じ意味の文章を繰り返さない
          ・事実と個人的な意見を区別する
          ・架空の統計、実在人物の架空の発言を作らない
          ・タイトル、説明文、ハッシュタグを出力しない
          ・管理用コード、日付の羅列、意味不明な文字列を出力しない
          ・台本の中に制作指示を混ぜない

          【健康・ランニングの場合】
          ・初心者、中級者、経験者の違いを意識する
          ・具体的な練習方法や実践例を入れる
          ・なぜその方法が有効と考えられるのか説明する
          ・医学的な効果や健康リスクを根拠なく断定しない
          ・「絶対に走るな」など、必要以上に危険をあおらない
          ・強い主張をする場合も、条件や例外を説明する
          ・単にランニングを否定するだけで終わらせない

          【ニュースの場合】
          記事で確認できる事実と自分の意見を区別し、
          社会への影響や問題点を具体的に説明する。

          【お金・投資の場合】
          投資のリスク、判断の盲点、具体例を説明する。
          利益を保証したり、架空の実績を作ったりしない。

          【自己改善の場合】
          よくある成功論を疑い、実行できる方法を示す。

          【名言・人生論の場合】
          名言をそのまま紹介するだけで終わらず、
          現代の生活に当てはめて批判的に考える。
          実在人物の発言を捏造しない。

          【仕事・社会の場合】
          働き方や制度の問題について、
          誰が得をし、誰が負担を負うのかを具体的に論じる。

          出力は完成した読み上げ用の本文だけにしてください。
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.85
                  }
              },
              timeout=900
          )

          response.raise_for_status()

          raw = clean_text(
              response.json().get("response", "")
          )

          raw = re.sub(
              r"(?im)^\s*(台本|本文|SCRIPT|TITLE)\s*[:：]\s*",
              "",
              raw
          )

          raw = re.sub(
              r"(?m)^\s*【[^】]*】\s*$",
              "",
              raw
          )

          lines = []

          for line in raw.splitlines():
              line = line.strip()

              if not line:
                  continue

              if re.fullmatch(r"[\W_]+", line):
                  continue

              lines.append(line)

          script = clean_text(
              "\n".join(lines)
          )

          if len(script) < 100:
              raise RuntimeError(
                  "台本が短すぎます。動画を公開せず停止します。"
              )

          if len(script) > 1000:
              script = script[:1000]

                   # 台本とタイトルを分離して保存
          # タイトルは台本の冒頭を流用せず、別途生成する
                    # 台本の品質検査
          # 制作指示の混入や、短すぎる台本を検出する

          forbidden_script_phrases = [
              "視聴者の常識を揺さぶる一文から始めましょう",
              "読み上げ用の本文だけを出力する",
              "あなたは、日本のYouTube Shorts向けに",
              "【動画ジャンル】",
              "【台本の構成】",
              "【最重要ルール】",
          ]

          for phrase in forbidden_script_phrases:
              if phrase in script:
                  raise RuntimeError(
                      "台本にAIへの指示文が混入しています。"
                      "動画の生成を停止します。"
                  )

          # 文章が同じ内容の繰り返しになっていないか検査
          sentences = [
              sentence.strip()
              for sentence in re.split(
                  r"(?<=[。！？!?])",
                  script
              )
              if sentence.strip()
          ]

          if len(sentences) < 4:
              raise RuntimeError(
                  "台本の文章数が少なすぎます"
              )

          normalized_sentences = [
              re.sub(r"\s+", "", sentence)
              for sentence in sentences
          ]

          if len(set(normalized_sentences)) < len(normalized_sentences) * 0.7:
              raise RuntimeError(
                  "台本に同じ文章の繰り返しが多すぎます"
              )

          print("SCRIPT QUALITY CHECK: PASSED")

          SCRIPT_FILE.write_text(
              script,
              encoding="utf-8"
          )

          title_prompt = f"""
          あなたは日本のYouTube Shorts専門のタイトル編集者です。

          ジャンル：{category}

          台本：
          {script}

          この台本に合う、クリックしたくなる日本語タイトルを
          1つだけ作ってください。

          【タイトルの条件】
          ・具体的な主張や疑問を含める
          ・視聴者の常識に疑問を投げかける
          ・強く、はっきりした表現を使う
          ・台本の内容と一致させる
          ・およそ15～35文字にする
          ・必要なら疑問形を使う
          ・抽象的な説明ではなく、内容そのものを表現する
          ・タイトルの前にジャンル名を付けない
          ・「視聴者の常識が揺らぐ問いかけです」
            「今回は〇〇について解説します」
            のような定型文は禁止
          ・「タイトル：」などのラベルは禁止
          ・候補を複数出さず、タイトルだけを出力する
          """

          title_response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": model,
                  "prompt": title_prompt,
                  "stream": False,
                  "options": {
                      "temperature": 0.75
                  }
              },
              timeout=300
          )

          title_response.raise_for_status()

          title = clean_text(
              title_response.json().get("response", "")
          )

          # タイトルに混入するラベルや装飾を除去
          title = re.sub(
              r"(?im)^\s*(タイトル|動画タイトル|TITLE)\s*[:：]\s*",
              "",
              title
          )

          title = title.strip().strip("「」『』\"'` ")
          title = re.sub(r"\s+", " ", title)
          title = title[:100].strip()

                    # タイトルの品質検査
          # ジャンル名やAIへの指示文をタイトルにしない

          bad_phrases = [
              "視聴者の常識が揺らぐ問いかけです",
              "視聴者の常識を揺さぶる",
              "常識を揺さぶる一文から始めましょう",
              "今回は",
              "タイトル：",
              "動画タイトル：",
              "この動画では",
              "クリックしたくなる",
              "台本に合う",
              "健康・ランニング｜",
              "自己改善・習慣｜",
              "ニュース・時事問題｜",
              "お金・投資｜",
              "名言・人生論｜",
              "仕事・社会｜",
          ]

          # 余分な装飾やラベルを除去
          title = re.sub(
              r"(?im)^\s*(タイトル|動画タイトル|TITLE)\s*[:：]\s*",
              "",
              title
          )

          title = title.strip().strip("「」『』\"'` ")
          title = re.sub(r"\s+", " ", title)

          # 文字数と禁止表現を検査
          title_is_bad = (
              len(title) < 8
              or len(title) > 60
              or any(
                  phrase in title
                  for phrase in bad_phrases
              )
              or "\n" in title
          )

          # 不適切な場合は、台本の冒頭から代替タイトルを作る
          if title_is_bad:
              sentences = re.split(
                  r"(?<=[。！？!?])",
                  script
              )

              first_sentence = next(
                  (
                      sentence.strip()
                      for sentence in sentences
                      if len(sentence.strip()) >= 8
                  ),
                  ""
              )

              if not first_sentence:
                  raise RuntimeError(
                      "適切な動画タイトルを作成できませんでした"
                  )

              title = first_sentence

              # 末尾の句読点を整理
              title = title.rstrip("。！？!? ")

              # 長すぎる場合は切り詰める
              if len(title) > 45:
                  title = title[:45].rstrip("、。 ")

              # 代替タイトルも再検査
              if (
                  len(title) < 8
                  or any(
                      phrase in title
                      for phrase in bad_phrases
                  )
              ):
                  raise RuntimeError(
                      "タイトルの品質検査に失敗しました"
                  )

          TITLE_FILE.write_text(
              title,
              encoding="utf-8"
          )

          print("VIDEO GENRE:", category)
          print("VIDEO TITLE:", title)
          print("SCRIPT LENGTH:", len(script))

          print("VIDEO GENRE:", category)
          print("VIDEO TITLE:", title)
          print("SCRIPT LENGTH:", len(script))

                    # 6. 日本語音声を生成
          # Edge TTSの403エラーを避け、gTTSを使用する

          from gtts import gTTS

          sentences = re.split(
              r"(?<=[。！？!?])\s*",
              script
          )
          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          if not sentences:
              raise RuntimeError(
                  "音声用の文章がありません"
              )

          audio_dir = WORK / "audio_parts"
          audio_dir.mkdir(
              exist_ok=True
          )

          concat_file = WORK / "audio_list.txt"
          timings = []
          current_time = 0.0
          audio_files = []

          for i, sentence in enumerate(sentences):
              part = (
                  audio_dir
                  / f"part_{i:03d}.mp3"
              )

              print(
                  f"TTS: {i + 1}/{len(sentences)}"
              )

              try:
                  tts = gTTS(
                      text=sentence,
                      lang="ja",
                      slow=False
                  )

                  tts.save(str(part))

              except Exception as e:
                  raise RuntimeError(
                      "日本語音声の生成に失敗しました。"
                      f"文番号={i + 1}, エラー={e}"
                  ) from e

              if (
                  not part.exists()
                  or part.stat().st_size < 500
              ):
                  raise RuntimeError(
                      f"音声ファイルが不正です: {i}"
                  )

              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(part)
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              duration = float(
                  probe.stdout.strip()
              )

              timings.append(
                  (
                      current_time,
                      current_time + duration,
                      sentence
                  )
              )

              current_time += duration
              audio_files.append(part)

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:
              for part in audio_files:
                  safe = (
                      str(part.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(AUDIO_FILE)
          ])
          # 音声を15%速くする
          # 字幕のタイミングも速度に合わせて調整
          SPEED = 1.30

          sped_audio = WORK / "voice_fast.mp3"

          run([
              "ffmpeg", "-y",
              "-i", str(AUDIO_FILE),
              "-filter:a", f"atempo={SPEED}",
              "-c:a", "libmp3lame",
              "-q:a", "3",
              str(sped_audio)
          ])

          if (
              not sped_audio.exists()
              or sped_audio.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "高速化した音声を生成できませんでした"
              )

          sped_audio.replace(AUDIO_FILE)

          timings = [
              (start / SPEED, end / SPEED, sentence)
              for start, end, sentence in timings
          ]

          current_time = current_time / SPEED
          duration = current_time

          print("VOICE SPEED:", SPEED)
          print("SPEED ADJUSTED DURATION:", duration)
          if (
              not AUDIO_FILE.exists()
              or AUDIO_FILE.stat().st_size < 1000
          ):
              raise RuntimeError(
                  "音声ファイルが生成されませんでした"
              )

          duration = current_time

          if duration < 5 or duration > 180:
              raise RuntimeError(
                  f"動画の長さが範囲外です: {duration:.1f}秒"
              )

          print(
              "AUDIO DURATION:",
              duration
          )
          # 7. 字幕ファイルを生成
          def ass_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          with ASS_FILE.open("w", encoding="utf-8-sig") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H0000FFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,4,1,5,70,70,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """.replace("\n          ", "\n"))

              for start, end, sentence in timings:
                  # 字幕を短い行に分割
                  chunks = textwrap.wrap(
                      sentence,
                      width=18,
                      break_long_words=True,
                      break_on_hyphens=False
                  )
                  if not chunks:
                      continue

                  # 長文は表示時間内で分割
                  total_chars = sum(len(c) for c in chunks)
                  cursor = start

                  for chunk in chunks:
                      share = (end - start) * len(chunk) / max(1, total_chars)
                      chunk_end = min(end, cursor + share)
                      text = chunk.replace("{", "").replace("}", "")
                      text = text.replace("\\", "＼")
                      f.write(
                          "Dialogue: 0,"
                          + ass_time(cursor) + ","
                          + ass_time(max(cursor + 0.15, chunk_end))
                          + ",Default,,0,0,0,,"
                          + text + "\n"
                      )
                      cursor = chunk_end

                              # ==========================================
          # 背景画像取得：ジャンルと内容に合わせる
          # 画像が見つからない場合は検索語を変えて再試行
          # ==========================================

          import requests
          import random
          import re
          from io import BytesIO
          from PIL import (
              Image,
              ImageOps,
