          )

          IMAGE_DIR = WORK / "backgrounds"
          IMAGE_DIR.mkdir(parents=True, exist_ok=True)

          BACKGROUND_FILE = WORK / "background.jpg"

          title = TITLE_FILE.read_text(
              encoding="utf-8"
          ).strip()

          category = category.strip()

          # ジャンル別の検索語
          CATEGORY_KEYWORDS = {
              "ニュース・時事問題": [
                  "Japan news society",
                  "Japan economy city",
                  "Japanese parliament government"
              ],
              "お金・投資": [
                  "stock market finance",
                  "investment financial market",
                  "money savings business"
              ],
              "自己改善・習慣": [
                  "study desk notebook",
                  "reading books workspace",
                  "person working planning goals"
              ],
              "健康・ランニング": [
                  "running athlete outdoors",
                  "marathon running training",
                  "running shoes sports"
              ],
              "名言・人生論": [
                  "sunrise mountain landscape",
                  "open book reading",
                  "road mountain journey"
              ],
              "仕事・社会": [
                  "modern office workplace",
                  "business meeting office",
                  "city skyscrapers"
              ]
          }

          # タイトルからも検索語を作る
          # 日本語タイトルだけで検索が失敗する場合に備え、
          # 英語のジャンル別キーワードも併用する
          keywords = []

          if category == "ニュース・時事問題" and article:
              article_title = clean_text(
                  article.get("title", "")
              )
              if article_title:
                  keywords.append(article_title)

          keywords.extend(
              CATEGORY_KEYWORDS.get(
                  category,
                  ["nature landscape photography"]
              )
          )

          # 検索語の重複を削除
          keywords = list(dict.fromkeys(keywords))

          print("BACKGROUND GENRE:", category)
          print("BACKGROUND KEYWORDS:", keywords)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; AutoJapaneseVideo/1.0)"
              )
          }

          image_url = None
          image_errors = []

          # Wikimedia Commonsから画像を検索
          for keyword in keywords:
              if image_url:
                  break

              try:
                  print("BACKGROUND SEARCH:", keyword)

                  response = requests.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": keyword,
                          "gsrnamespace": 6,
                          "gsrlimit": 15,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "iiurlwidth": 1080,
                          "format": "json"
                      },
                      headers=headers,
                      timeout=30
                  )

                  response.raise_for_status()
                  data = response.json()

                  pages = (
                      data.get("query", {})
                      .get("pages", {})
                  )

                  candidates = []

                  for page in pages.values():
                      infos = page.get("imageinfo", [])

                      if not infos:
                          continue

                      info = infos[0]
                      url = info.get("thumburl") or info.get("url")

                      if not url:
                          continue

                      # 対応する画像形式に限定
                      if not re.search(
                          r"\.(jpg|jpeg|png|webp)(?:$|[?#])",
                          url,
                          re.IGNORECASE
                      ):
                          continue

                      metadata = info.get("extmetadata", {})

                      license_name = (
                          metadata.get("LicenseShortName", {})
                          .get("value", "")
                      )

                      artist = (
                          metadata.get("Artist", {})
                          .get("value", "")
                      )

                      candidates.append({
                          "url": url,
                          "title": page.get("title", ""),
                          "license": license_name,
                          "artist": artist
                      })

                  random.shuffle(candidates)

                  for candidate in candidates:
                      try:
                          img_response = requests.get(
                              candidate["url"],
                              headers=headers,
                              timeout=30
                          )

                          img_response.raise_for_status()

                          image = Image.open(
                              BytesIO(img_response.content)
                          ).convert("RGB")

                          width, height = image.size

                          # 小さい画像や極端な画像は避ける
                          if width < 500 or height < 500:
                              continue

                          # Shorts用の縦型サイズに調整
                          image = ImageOps.fit(
                              image,
                              (1080, 1920),
                              method=Image.Resampling.LANCZOS,
                              centering=(0.5, 0.5)
                          )

                          # 字幕を読みやすくするため少し暗くする
                          image = ImageEnhance.Brightness(
                              image
                          ).enhance(0.72)

                          image.save(
                              BACKGROUND_FILE,
                              "JPEG",
                              quality=90
                          )

                          image_url = candidate["url"]

                          print(
                              "BACKGROUND SUCCESS:",
                              candidate["title"]
                          )
                          print(
                              "BACKGROUND LICENSE:",
                              candidate["license"]
                          )
                          print(
                              "BACKGROUND ARTIST:",
                              candidate["artist"]
                          )

                          break

                      except Exception as e:
                          image_errors.append(str(e)[:200])

              except Exception as e:
                  image_errors.append(str(e)[:200])
                  print(
                      "BACKGROUND SEARCH ERROR:",
                      keyword,
                      str(e)[:200]
                  )

          # 写真を取得できなかった場合は、
          # 真っ黒な画面ではなくジャンル別の背景を生成する
          if not image_url or not BACKGROUND_FILE.exists():

              print(
                  "BACKGROUND FALLBACK: "
