name: Auto AI Japanese Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Generate Japanese script
        run: |
          cat > prompt.txt <<'EOF'
          日本語のYouTubeショート動画台本を1本作ってください。
          テーマは「今日から人生を少し良くする習慣」。
          300〜450文字。
          最初の1文で興味を引く。
          具体例を2つ入れる。
          最後は短い行動提案で終える。
          タイトルや説明は不要。台本本文だけ出力してください。
          EOF

          ollama run qwen2.5:0.5b < prompt.txt > input_script.txt
          test -s input_script.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro_onnx@git+https://github.com/moonshine-ai/kokoro-onnx-ja.git" soundfile
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Install FFmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Prepare
        run: |
          mkdir -p model input output

          wget -q "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx" \
            -O model/kokoro-v1.0.int8.onnx

          wget -q "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/jf_alpha.bin" \
            -O model/jf_alpha.bin

          cp input_script.txt input/script.txt

      - name: Generate Japanese voice
        run: |
          cat > generate_tts.py <<'PY'
          from kokoro_onnx import Kokoro
          import soundfile as sf

          with open("input/script.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          model = Kokoro(
              model_path="model/kokoro-v1.0.int8.onnx",
              voice_path="model/jf_alpha.bin",
          )

          audio, sample_rate = model.create(text)

          sf.write(
              "input/audio.wav",
              audio,
              sample_rate
          )

          print("Japanese audio generated.")
          PY

          python generate_tts.py

      - name: Generate subtitle text
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("input/script.txt").read_text(encoding="utf-8").strip()

          lines = []
          current = ""

          for char in text:
              current += char
              if len(current) >= 18 and char in "。！？、":
                  lines.append(current.strip())
                  current = ""

          if current.strip():
              lines.append(current.strip())

          Path("input/subtitle.txt").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Subtitle created.")
          print(Path("input/subtitle.txt").read_text(encoding="utf-8"))
          PY

      - name: Generate MP4 with subtitles
        run: |
          FONT="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -i input/audio.wav \
            -vf "drawtext=fontfile='${FONT}':textfile='input/subtitle.txt':fontcolor=white:fontsize=58:borderw=4:bordercolor=black:x=(w-text_w)/2:y=h*0.68:line_spacing=12:box=1:boxcolor=black@0.55:boxborderw=25" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/video.mp4

          test -s output/video.mp4

      - name: Upload to YouTube and publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          import re

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open("input/script.txt", "r", encoding="utf-8") as f:
              script = f.read().strip()

          first_line = script.splitlines()[0].strip()

          title = re.sub(r"[<>]", "", first_line)
          title = title[:90].strip()

          if not title:
              title = "今日から人生を少し良くする習慣"

          description = (
              "今日から人生を少し良くする習慣についてのショート動画です。\n"
              "#習慣 #自己改善 #人生"
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "tags": [
                      "習慣",
                      "自己改善",
                      "人生"
                  ],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          response = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          ).execute()

          video_id = response["id"]

          print("YouTube upload successful")
          print("Video ID:", video_id)

          publish_response = youtube.videos().update(
              part="status",
              body={
                  "id": video_id,
                  "status": {
                      "privacyStatus": "public"
                  }
              }
          ).execute()

          print("YouTube publish successful")
          print("Privacy:", publish_response["status"]["privacyStatus"])
          print("URL:", "https://www.youtube.com/watch?v=" + video_id)
          PY

          python upload_youtube.py

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-japanese-video
          path: |
            input/script.txt
            input/audio.wav
            input/subtitle.txt
            output/video.mp4
