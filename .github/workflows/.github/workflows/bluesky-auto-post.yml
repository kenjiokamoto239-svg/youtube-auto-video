name: Bluesky Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: bluesky-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth

      - name: Find latest YouTube Short and post to Bluesky
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import json
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          import requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
              "BLUESKY_HANDLE",
              "BLUESKY_APP_PASSWORD",
          ]

          for key in required:
              if not os.environ.get(key):
                  raise RuntimeError(
                      f"GitHub Secrets が未設定です: {key}"
                  )

          # YouTube認証
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
          )

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          # 自分のチャンネルの動画一覧を取得
          channel_response = youtube.channels().list(
              part="contentDetails",
              mine=True,
          ).execute()

          channels = channel_response.get("items", [])

          if not channels:
              raise RuntimeError(
                  "YouTubeチャンネルを取得できませんでした。"
                  "OAuthの権限を確認してください。"
              )

          uploads_playlist = (
              channels[0]["contentDetails"]
              ["relatedPlaylists"]["uploads"]
          )

          playlist_response = youtube.playlistItems().list(
              part="snippet,contentDetails",
              playlistId=uploads_playlist,
              maxResults=10,
          ).execute()

          videos = []

          for item in playlist_response.get("items", []):
              snippet = item.get("snippet", {})
              details = item.get("contentDetails", {})
              video_id = details.get("videoId")

              if not video_id:
                  continue

              videos.append({
                  "id": video_id,
                  "title": snippet.get(
                      "title", "新しいYouTube動画"
                  ),
                  "published": details.get(
                      "videoPublishedAt",
                      snippet.get("publishedAt", ""),
                  ),
              })

          if not videos:
              raise RuntimeError(
                  "YouTubeの投稿動画が見つかりません。"
              )

          # 公開日時が新しい動画を選ぶ
          videos.sort(
              key=lambda video: video["published"],
              reverse=True,
          )

          latest = videos[0]
          video_id = latest["id"]
          title = latest["title"]

          state_file = Path(
              "data/bluesky_last_video_id.txt"
          )
          state_file.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          previous_id = (
              state_file.read_text(encoding="utf-8").strip()
              if state_file.exists()
              else ""
          )

          if video_id == previous_id:
              print("新しい動画はありません。投稿をスキップします。")
              raise SystemExit(0)

          video_url = f"https://www.youtube.com/shorts/{video_id}"

          # Blueskyへログイン
          session_response = requests.post(
              "https://bsky.social/xrpc/com.atproto.server.createSession",
              json={
                  "identifier": os.environ["BLUESKY_HANDLE"],
                  "password": os.environ["BLUESKY_APP_PASSWORD"],
              },
              timeout=30,
          )
          session_response.raise_for_status()
          session = session_response.json()

          # 投稿文を作成
          post_text = (
              f"新しいYouTube Shortsを公開しました！\n\n"
              f"{title}\n\n"
              f"{video_url}"
          )

          # Blueskyの投稿文字数制限に対応
          if len(post_text) > 290:
              post_text = (
                  f"新しいYouTube Shortsを公開しました！\n\n"
                  f"{title[:180]}\n\n{video_url}"
              )

          post_response = requests.post(
              "https://bsky.social/xrpc/com.atproto.repo.createRecord",
              headers={
                  "Authorization": (
                      "Bearer " + session["accessJwt"]
                  ),
                  "Content-Type": "application/json",
              },
              json={
                  "repo": session["did"],
                  "collection": "app.bsky.feed.post",
                  "record": {
                      "$type": "app.bsky.feed.post",
                      "text": post_text,
                      "createdAt": datetime.now(
                          timezone.utc
                      ).isoformat().replace("+00:00", "Z"),
                  },
              },
              timeout=30,
          )
          post_response.raise_for_status()

          # 投稿成功後に重複防止用の動画IDを保存
          state_file.write_text(
              video_id,
              encoding="utf-8",
          )

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True,
          )
          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              ],
              check=True,
          )
          subprocess.run(
              ["git", "add", str(state_file)],
              check=True,
          )

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"],
              check=False,
          )

          if result.returncode == 1:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Save last Bluesky-posted YouTube video",
                  ],
                  check=True,
              )
              subprocess.run(
                  ["git", "push"],
                  check=True,
              )

          print("Blueskyへの投稿に成功しました。")
          print("動画タイトル:", title)
          print("動画URL:", video_url)
          PY
