name: YouTube Analytics Check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install google-api-python-client google-auth

      - name: Retrieve YouTube Analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import csv
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          # 日本時間で直近7日間を取得
          jst = timezone(timedelta(hours=9))
          today = datetime.now(jst).date()
          end_date = today - timedelta(days=1)
          start_date = end_date - timedelta(days=6)

          output = Path("analytics_output")
          output.mkdir(parents=True, exist_ok=True)

          # 必要な認証情報を確認
          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
          ]

          for key in required:
              if not os.environ.get(key):
                  raise RuntimeError(
                      f"GitHub Secrets が未設定です: {key}"
                  )

          # OAuth認証
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
          )

          service = build(
              "youtubeAnalytics",
              "v2",
              credentials=credentials,
              cache_discovery=False,
          )

          # 日別のチャンネル全体データを取得
          print("取得期間:", start_date, "〜", end_date)
          print("日別データを取得します")

          response = service.reports().query(
              ids="channel==MINE",
              startDate=str(start_date),
              endDate=str(end_date),
              metrics=(
                  "views,estimatedMinutesWatched,"
                  "averageViewDuration,subscribersGained,"
                  "subscribersLost,likes,comments"
              ),
              dimensions="day",
              sort="day",
          ).execute()

          # JSON保存
          json_path = output / "daily_report.json"
          json_path.write_text(
              json.dumps(
                  response,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          # CSV保存
          headers = [
              item["name"]
              for item in response.get("columnHeaders", [])
          ]

          csv_path = output / "daily_report.csv"

          with csv_path.open(
              "w",
              newline="",
              encoding="utf-8-sig",
          ) as f:
              writer = csv.writer(f)

              if headers:
                  writer.writerow(headers)

              writer.writerows(response.get("rows", []))

          # ログに結果を表示
          rows = response.get("rows", [])

          print("取得期間:", start_date, "〜", end_date)
          print("取得できた日数:", len(rows))
          print("CSV保存先:", csv_path)
          print("JSON保存先:", json_path)

          if rows:
              print("日別データ:")
              for row in rows:
                  print(row)
          else:
              print(
                  "指定期間の日別データはありませんでした。"
              )

          print("日別レポートの作成が完了しました")
          PY

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: youtube-analytics-reports
          path: analytics_output/
          if-no-files-found: warn
          retention-days: 30
