name: YouTube Analytics Auto Improvement
on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install google-api-python-client google-auth
      - name: Retrieve analytics and build improvement data
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import csv
          import re
          import subprocess
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          # --------------------------------------------------
          # 基本設定
          # --------------------------------------------------
          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
          ]
          for key in required:
              if not os.environ.get(key):
                  raise RuntimeError(
                      f"GitHub Secrets が未設定です: {key}"
                  )
          jst = timezone(timedelta(hours=9))
          now = datetime.now(jst)
          today = now.date()
          end_date = today - timedelta(days=1)
          start_date = end_date - timedelta(days=6)
          output = Path("analytics_output")
          output.mkdir(parents=True, exist_ok=True)
          Path("data").mkdir(exist_ok=True)
          # --------------------------------------------------
          # 欠損値を0に変換しないための関数
          # --------------------------------------------------
          def parse_optional_int(value):
              if value is None or value == "":
                  return None
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None
          def parse_optional_float(value):
              if value is None or value == "":
                  return None
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None
          def parse_duration_seconds(value):
              """
              ISO 8601形式の動画時間を秒数に変換する。
              例: PT59S -> 59
                  PT1M30S -> 90
                  PT1H2M3S -> 3723
              """
              if not value:
                  return None
              match = re.fullmatch(
                  r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?",
                  value
              )
              if not match:
                  return None
              hours = int(match.group(1) or 0)
              minutes = int(match.group(2) or 0)
              seconds = int(match.group(3) or 0)
              return hours * 3600 + minutes * 60 + seconds
          def safe_write_json(path, data):
              Path(path).write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
          # --------------------------------------------------
          # OAuth認証
          # --------------------------------------------------
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"]
          )
          # --------------------------------------------------
          # YouTube Analytics API：日別チャンネルデータ
          # --------------------------------------------------
          analytics = build(
              "youtubeAnalytics",
              "v2",
              credentials=credentials,
              cache_discovery=False
          )
          daily = analytics.reports().query(
              ids="channel==MINE",
              startDate=str(start_date),
              endDate=str(end_date),
              metrics=(
                  "views,estimatedMinutesWatched,"
                  "averageViewDuration,subscribersGained,"
                  "subscribersLost,likes,comments"
              ),
              dimensions="day",
              sort="day"
          ).execute()
          safe_write_json(
              output / "daily_report.json",
              daily
          )
          headers = [
              item["name"]
              for item in daily.get("columnHeaders", [])
          ]
          with (output / "daily_report.csv").open(
              "w",
              newline="",
              encoding="utf-8-sig"
          ) as f:
              writer = csv.writer(f)
              if headers:
                  writer.writerow(headers)
              writer.writerows(daily.get("rows", []))
          print("日別データ取得期間:", start_date, "〜", end_date)
          print("日別データ取得成功")
          # --------------------------------------------------
          # YouTube Data API：直近50本の動画情報
          # --------------------------------------------------
          videos = []
          video_api_warning = None
          playlist_video_count = None
          fetched_video_count = 0
          try:
              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False
              )
              channel_response = youtube.channels().list(
                  part="contentDetails",
                  mine=True
              ).execute()
              channel_items = channel_response.get("items", [])
              if not channel_items:
                  raise RuntimeError(
                      "認証されたYouTubeチャンネルを取得できませんでした"
                  )
              uploads_id = (
                  channel_items[0]
                  .get("contentDetails", {})
                  .get("relatedPlaylists", {})
                  .get("uploads")
              )
              if not uploads_id:
                  raise RuntimeError(
                      "アップロード動画プレイリストを取得できませんでした"
                  )
              # 最新50件のアップロードを取得する。
              # 50件を超える全動画の取得とは区別して記録する。
              playlist = youtube.playlistItems().list(
                  part="snippet,contentDetails",
                  playlistId=uploads_id,
                  maxResults=50
              ).execute()
              playlist_items = playlist.get("items", [])
              playlist_video_count = len(playlist_items)
              video_ids = [
                  item.get("contentDetails", {}).get("videoId")
                  for item in playlist_items
                  if item.get("contentDetails", {}).get("videoId")
              ]
              for start in range(0, len(video_ids), 50):
                  batch_ids = video_ids[start:start + 50]
                  response = youtube.videos().list(
                      part="snippet,statistics,contentDetails",
                      id=",".join(batch_ids)
                  ).execute()
                  for item in response.get("items", []):
                      snippet = item.get("snippet", {})
                      stats = item.get("statistics", {})
                      details = item.get("contentDetails", {})
                      duration_iso = details.get("duration")
                      video = {
                          "video_id": item.get("id", ""),
                          "title": snippet.get("title", ""),
                          "published_at": snippet.get("publishedAt"),
                          "duration_iso": duration_iso,
                          "duration_seconds": parse_duration_seconds(
                              duration_iso
                          ),
                          "views": parse_optional_int(
                              stats.get("viewCount")
                          ),
                          "likes": parse_optional_int(
                              stats.get("likeCount")
                          ),
                          "comments": parse_optional_int(
                              stats.get("commentCount")
                          ),
                          "url": (
                              "https://www.youtube.com/watch?v="
                              + item.get("id", "")
                          )
                      }
                      videos.append(video)
              fetched_video_count = len(videos)
              # 再生数が取得できた動画を再生数順に並べる。
              # 欠損値は0と見なさず、末尾に置く。
              videos.sort(
                  key=lambda item: (
                      item["views"] is not None,
                      item["views"] if item["views"] is not None else -1
                  ),
                  reverse=True
              )
          except Exception as error:
              video_api_warning = str(error)[:1000]
              print(
                  "動画別データの取得に失敗しました。"
                  "日別データの処理は続行します。"
              )
              print(video_api_warning)
          # 動画情報ファイルを保存
          safe_write_json(
              output / "recent_videos.json",
              videos
          )
          # --------------------------------------------------
          # 日別データを整理
          # --------------------------------------------------
          raw_rows = daily.get("rows", [])
          daily_summary = []
          for row in raw_rows:
              # 列順はAPIレスポンスのcolumnHeadersに対応する。
              # 必要な列が存在しない場合はNoneとして扱う。
              values = {}
              for index, header in enumerate(headers):
                  values[header] = (
                      row[index] if index < len(row) else None
                  )
              daily_summary.append({
                  "day": values.get("day"),
                  "views": parse_optional_int(
                      values.get("views")
                  ),
                  "watch_minutes": parse_optional_float(
                      values.get("estimatedMinutesWatched")
                  ),
                  "average_view_seconds": parse_optional_float(
                      values.get("averageViewDuration")
                  ),
                  "subscribers_gained": parse_optional_int(
                      values.get("subscribersGained")
                  ),
                  "subscribers_lost": parse_optional_int(
                      values.get("subscribersLost")
                  ),
                  "likes": parse_optional_int(
                      values.get("likes")
                  ),
                  "comments": parse_optional_int(
                      values.get("comments")
                  )
              })
          # --------------------------------------------------
          # 直近3日間と、その前の3日間を比較
          #
          # データが欠けている場合は比較しない。
          # APIが返さなかった日を、勝手に再生数0とみなさない。
          # --------------------------------------------------
          daily_by_date = {
              item["day"]: item
              for item in daily_summary
              if item.get("day")
          }
          previous_dates = [
              str(end_date - timedelta(days=5)),
              str(end_date - timedelta(days=4)),
              str(end_date - timedelta(days=3))
          ]
          recent_dates = [
              str(end_date - timedelta(days=2)),
              str(end_date - timedelta(days=1)),
              str(end_date)
          ]
          def get_complete_window(dates):
              result = []
              for date_string in dates:
                  item = daily_by_date.get(date_string)
                  if item is None or item.get("views") is None:
                      return None
                  result.append(item)
              return result
          previous3 = get_complete_window(previous_dates)
          last3 = get_complete_window(recent_dates)
          comparison_available = (
              previous3 is not None and last3 is not None
          )
          if comparison_available:
              last3_views = sum(
                  item["views"] for item in last3
              )
              previous3_views = sum(
                  item["views"] for item in previous3
              )
              if previous3_views == 0:
                  trend = "比較データ不足"
              elif last3_views > previous3_views * 1.1:
                  trend = "直近3日間の再生数が増加"
              elif last3_views < previous3_views * 0.9:
                  trend = "直近3日間の再生数が減少"
              else:
                  trend = "直近3日間の再生数はおおむね横ばい"
          else:
              last3_views = None
              previous3_views = None
              trend = "比較データ不足"
          # --------------------------------------------------
          # 改善用データを作成
          # --------------------------------------------------
          feedback = {
              "updated_at_jst": now.isoformat(),
              "data_sources": {
                  "daily_channel_analytics": "YouTube Analytics API",
                  "video_metadata_and_statistics": "YouTube Data API"
              },
              "period": {
                  "start": str(start_date),
                  "end": str(end_date),
                  "timezone": "Asia/Tokyo"
              },
              "daily_data_count": len(daily_summary),
              "daily_data": daily_summary,
              "comparison": {
                  "comparison_available": comparison_available,
                  "previous_3_days": previous_dates,
                  "recent_3_days": recent_dates,
                  "daily_views_previous_3_days": previous3_views,
                  "daily_views_last_3_days": last3_views,
                  "trend": trend
              },
              # 上位10本は一覧表示用。
              # all_videosには今回取得できた動画すべてを保存する。
              "top_videos_by_lifetime_views": videos[:10],
              "all_videos": videos,
              "video_data_scope": {
                  "method": "uploads_playlist_latest_50",
                  "playlist_items_returned": playlist_video_count,
                  "videos_fetched": fetched_video_count,
                  "note": (
                      "all_videosは今回取得できた動画の全件です。"
                      "チャンネルの全投稿を網羅しているとは限りません。"
                      "再生数・いいね数・コメント数は取得時点の累計値です。"
                  )
              },
              "topic_strategy": (
                  "再生数上位の動画タイトルを参考に、"
                  "異なる切り口のテーマを検証する。"
                  "同じタイトルや台本を再利用しない。"
                  "累計再生数だけで成功を断定せず、"
                  "公開後の経過時間や動画の長さも考慮する。"
              ),
              "data_limitations": [
                  "動画別の再生数・いいね数・コメント数は累計値です。",
                  "公開後の経過時間が異なる動画同士は単純比較できません。",
                  "日別データはチャンネル全体の値で、個別動画の値ではありません。",
                  "APIで値が取得できない場合は0ではなくnullとして扱います。",
                  "日別データに欠損がある場合、3日間比較は実行しません。",
                  "動画情報はアップロード一覧の直近最大50件が対象です。",
                  "再生数だけで投稿時間やジャンルの効果を確定できません。",
                  "Shortsのフィード表示数や視聴継続率などは、"
                  "今回の取得処理では取得していません。"
              ],
              "video_api_warning": video_api_warning
          }
          safe_write_json(
              "data/analytics_feedback.json",
              feedback
          )
          safe_write_json(
              output / "analytics_feedback.json",
              feedback
          )
          # --------------------------------------------------
          # 実行ログ
          # --------------------------------------------------
          print("日別データ件数:", len(daily_summary))
          print("動画データ取得件数:", fetched_video_count)
          print("直近3日間の再生数:", last3_views)
          print("前の3日間の再生数:", previous3_views)
          print("比較可能:", comparison_available)
          print("傾向:", trend)
          if video_api_warning:
              print("動画API警告:", video_api_warning)
          # --------------------------------------------------
          # 改善用データをGitHubに自動保存
          # --------------------------------------------------
          subprocess.run(
              [
                  "git", "config",
                  "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )
          subprocess.run(
              [
                  "git", "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )
          subprocess.run(
              [
                  "git", "add",
                  "data/analytics_feedback.json"
              ],
              check=True
          )
          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )
          if changed.returncode == 1:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Update YouTube analytics feedback"
                  ],
                  check=True
              )
              subprocess.run(
                  ["git", "push"],
                  check=True
              )
              print("改善用データをGitHubに保存しました")
          elif changed.returncode == 0:
              print("改善用データに変更はありません")
          else:
              raise RuntimeError(
                  "Gitの差分確認に失敗しました"
              )
          PY
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: youtube-analytics-reports
          path: analytics_output/
          if-no-files-found: warn
          retention-days: 30
